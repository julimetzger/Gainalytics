id: MNT-001b
status: ready
area: maintenance
priority: medium
title: Maestro-Flow Analyse — Startzeit messen & Import-Baseline prüfen
source:
  - TODOS.md
description: >
  Systematische Analyse der bestehenden Maestro-Flows auf Zuverlässigkeit
  und Performance. Zwei Schwerpunkte:

  1. Startzeit messen:
     - Zeit vom Agent-Start bis zum erfolgreichen Starten eines Maestro-Flows messen.
     - Alle Failures dokumentieren (Timeout, Emulator nicht bereit, App-Crash, etc.).
     - Ergebnis: Tabelle mit Flow-Name, Startdauer, Ergebnis (pass/fail), Fehlergrund.

  2. Import-Baseline-Flow prüfen:
     - Vermutung: Der Import-Baseline-Flow (`base.gains`) funktioniert nicht mehr
       zuverlässig, wenn andere Downloads im Download-Ordner existieren.
     - Der Flow findet `base.gains` nicht mehr, weil die Datei in der Liste
       zu weit unten rutscht.
     - Reproduzieren: Mehrere Dummy-Dateien in den Download-Ordner legen,
       dann Import-Flow ausführen.
     - Fix-Vorschlag erarbeiten (z.B. Scrolling, Suche, oder Ordner bereinigen
       vor dem Flow).

acceptanceCriteria:
  - >
    Dokumentation aller Maestro-Flows mit gemessener Startzeit und
    Erfolgs-/Fehlerquote liegt vor.
  - >
    Alle beobachteten Failure-Typen sind mit Häufigkeit und Fehlergrund dokumentiert.
  - >
    Import-Baseline-Flow wurde mit zusätzlichen Downloads im Ordner getestet
    und das Verhalten dokumentiert.
  - >
    Falls der Import-Flow fehlschlägt: Fix-Vorschlag oder implementierter Fix vorhanden.

constraints:
  - Ergebnisse in docs/ oder als Markdown-Tabelle ablegen.
  - Bestehende Maestro-Flows nicht verändern, nur analysieren (Fixes separat).

nonGoals:
  - Neue Maestro-Flows schreiben.
  - Performance-Optimierung der App selbst.
