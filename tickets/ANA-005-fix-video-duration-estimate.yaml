id: ANA-005-fix-duration
status: ready
area: analyse
priority: medium
title: Derive real video duration instead of hardcoded 6s for progress estimation
source:
  - "https://github.com/julimetzger/Gainalytics/pull/23#discussion"
description: >
  The analysis import uses a hardcoded `estimatedVideoDurationMs = 6000`
  instead of the actual video duration. This makes both the progress ETA
  and the learned `lastAnalysisSecondsPerVideoSecond` rate independent of
  actual clip length. Estimates become systematically wrong for short or
  long videos and the stored rate is polluted after each run.

  Read the actual video duration from the video file metadata (e.g. via
  the native VideoAnalysisModule or react-native-video) and use it for
  the progress calculation and rate learning.
components:
  - app/utils/video-analysis-import.ts
  - android/app/src/main/java/com/powerliftingworkoutplanner/VideoAnalysisModule.java
acceptanceCriteria:
  - >
    The progress estimation uses the actual video duration from file metadata
    instead of a hardcoded value.
  - >
    The learned `lastAnalysisSecondsPerVideoSecond` rate is calculated from
    the real video duration after each completed analysis.
  - >
    The progress indicator shows a realistic estimate for both short (<10s)
    and long (>60s) videos.
  - >
    Automated tests cover the duration-based progress calculation.
evidenceRequired:
  - Passing test log showing duration-based progress calculation.
constraints:
  - Reuse existing native module methods if possible — avoid adding new native dependencies.
  - Fall back to the default 1:1 ratio if video duration cannot be determined.
nonGoals:
  - Adding frame-level progress tracking during analysis.
