id: ANA-004-fix
status: ready
area: analyse
priority: medium
title: Active-Rep Overlay mit theme.colors und Hintergrund-Verlauf
source:
  - "https://github.com/julimetzger/Gainalytics/pull/22#discussion"
  - ANA-004
description: >
  Im VideoAnalysisPlaybackOverlayCard soll der Bar-Verlauf während einer
  aktiven Rep visuell hervorgehoben werden:

  1. Aktive Rep — Während der Wiedergabe einer erkannten Rep wird der
     Bar-Verlauf (Kurve) in `theme.colors.primary` gezeichnet. Die Kurve
     bewegt sich mit der Rep mit und zeigt den aktuellen Abschnitt.

  2. Hintergrund-Verlauf — Der gesamte Bar-Verlauf über alle Reps wird
     als matte graue Linie im Hintergrund geplottet, damit der Kontext
     sichtbar bleibt.

  3. Metriken — Die Anzahl der erkannten Reps und ihre jeweilige Dauer
     werden als Werte in der Zusammenfassung angezeigt.

  4. Keine hardcoded Farben — `#63A002` durch `theme.colors.primary`
     ersetzen. Keine hardcoded Color-Literals (AGENTS.md Styling Rules).

components:
  - app/components/video/VideoAnalysisPlaybackOverlayCard.tsx

acceptanceCriteria:
  - >
    Während einer aktiven Rep wird der Bar-Verlauf als Kurve in
    `theme.colors.primary` gezeichnet, synchron mit der Wiedergabe.
  - >
    Der gesamte Bar-Verlauf aller Reps ist als matte graue Linie im
    Hintergrund sichtbar.
  - >
    Die Anzahl der erkannten Reps und ihre Dauer werden als Metriken
    in der Zusammenfassung angezeigt.
  - >
    Keine hardcoded Farb-Literals — alle Farben nutzen `theme.colors`.
  - >
    Automated tests pass nach der Änderung.

evidenceRequired:
  - >
    Screenshot WÄHREND einer aktiven Rep (Current Rep zeigt eine Nummer),
    wo die primary-farbene Kurve und die graue Hintergrund-Linie sichtbar sind.
  - Passing test log.

constraints:
  - Bestehende theme.colors Tokens nutzen, keine neuen Theme-Einträge.
  - Rep-Detection aus ANA-004 (repSegments) wiederverwenden.

nonGoals:
  - Änderungen an der Rep-Detection-Logik selbst.
  - Änderungen an anderen Charts oder Screens.
