id: ANA-003-fix2
status: ready
area: analyse
priority: medium
title: Speed-Chart Marker-Linie am Velocity-Plot ausrichten
source:
  - tickets/ANA-003-fix-speed-chart-perf.yaml
description: >
  Nach dem ANA-003-fix (withTiming-Architektur) ist der Player responsiv und
  die Zeit stimmt. Allerdings ist die vertikale Marker-Linie (Animated.View
  Overlay) nicht korrekt am Velocity-Diagramm ausgerichtet:

  - Die Linie fängt zu spät auf (nach dem ersten Datenpunkt im Chart)
  - Die Linie hört zu spät auf (nach dem letzten Datenpunkt im Chart)

  Das Problem ist vermutlich ein Offset zwischen der Video-Zeit (0..47s) und
  der Bar-Path-Zeit (ca. 5s..47s). Die withTiming-Animation läuft über die
  volle Video-Dauer, aber der Chart zeigt nur den Bereich in dem Daten
  vorhanden sind (timeRange.minTimeMs..timeRange.maxTimeMs).

  Fix: Die Marker-Animation muss auf den sichtbaren Chart-Bereich gemapped
  werden. Die Linie soll am linken Chart-Rand starten wenn playbackTimeMs ==
  timeRange.minTimeMs und am rechten Rand enden wenn playbackTimeMs ==
  timeRange.maxTimeMs. Außerhalb dieses Bereichs soll die Linie am jeweiligen
  Rand stehen bleiben (clamped).
components:
  - app/components/video/VideoAnalysisPlaybackOverlayCard.tsx
acceptanceCriteria:
  - >
    Die Marker-Linie startet exakt am linken Rand des Chart-Zeichenbereichs
    wenn die Playback-Zeit == timeRange.minTimeMs ist.
  - >
    Die Marker-Linie endet exakt am rechten Rand des Chart-Zeichenbereichs
    wenn die Playback-Zeit == timeRange.maxTimeMs ist.
  - >
    Vor timeRange.minTimeMs steht die Linie am linken Rand (clamped).
    Nach timeRange.maxTimeMs steht die Linie am rechten Rand (clamped).
  - >
    Die Linie bewegt sich flüssig und synchron mit den Datenpunkten im
    Velocity-Chart während der Wiedergabe.
  - >
    Bestehende Tests sind angepasst und grün.
evidenceRequired:
  - Screenshot der Marker-Linie bei Playback-Start (Linie am linken Chart-Rand).
  - Screenshot der Marker-Linie bei Playback-Ende (Linie am rechten Chart-Rand).
  - Deploy auf das echte Device R5CN30HWZFN.
constraints:
  - Keine neuen Dependencies.
  - Kein nativer Rebuild nötig — nur JS-Änderung.
  - Die withTiming-Architektur aus ANA-003-fix beibehalten.
nonGoals:
  - Änderungen am nativen VideoAnalysisPlayerView.java.
  - Änderungen am Chart selbst (nur am Overlay-Marker).
