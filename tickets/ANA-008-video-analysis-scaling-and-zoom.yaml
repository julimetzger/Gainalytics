id: ANA-008
status: ready
area: analyse
priority: medium
title: Video-Analyse Skalierung & Zoom im Velocity-Plot
source:
  - TODOS.md
description: >
  Zwei Verbesserungen am VideoAnalysisDetails-Screen:

  1. Skalierung — Video + Velocity-Plot + Player-Bedienung auf einen Screen:
     - Das Video-Preview ist aktuell zu groß und verdrängt den Velocity-Plot
       und die Player-Bedienung vom sichtbaren Bereich.
     - Das Video kleiner machen, sodass Video, Velocity-Plot und Player-Buttons
       (Play, Seek, Step) zusammen ohne Scrollen auf den Screen passen.
     - Die Proportionen sollen auf gängigen Android-Bildschirmgrößen funktionieren.

  2. Zoom im Velocity-Plot durch Pinch/Swipe:
     - Der Velocity-Plot ("Bar v_y Over Time") soll per Pinch-to-Zoom oder
       Swipe horizontal zoombar sein, analog zu den bestehenden Analyse-Plots
       (z.B. in MetricsOverview oder ExerciseStats).
     - Bestehendes Zoom-Pattern aus den anderen Plots wiederverwenden.
     - Beim Zoomen soll die Marker-Linie weiterhin korrekt positioniert bleiben.

components:
  - app/components/video/VideoAnalysisPlaybackOverlayCard.tsx
  - app/components/video/VideoAnalysisPlayerView.tsx

acceptanceCriteria:
  - >
    Video-Preview, Velocity-Plot und Player-Bedienung (Play, Seek, Step-Buttons)
    sind zusammen auf einem Screen sichtbar ohne zu scrollen.
  - >
    Das Video-Preview ist kleiner als aktuell, aber der Inhalt bleibt erkennbar.
  - >
    Der Velocity-Plot ist per Pinch-to-Zoom oder horizontalem Swipe zoombar.
  - >
    Das Zoom-Verhalten ist konsistent mit den bestehenden Analyse-Plots.
  - >
    Die Marker-Linie bleibt beim Zoomen korrekt am Velocity-Plot ausgerichtet.
  - >
    Layout funktioniert auf gängigen Android-Bildschirmgrößen (5.5"–6.7").

evidenceRequired:
  - Screenshot des gesamten Screens mit Video, Plot und Player-Buttons sichtbar.
  - Screenshot oder Maestro-Flow der den gezoomten Velocity-Plot zeigt.
  - Jest-Tests für Zoom-Interaktion falls neue Logik hinzugefügt wird.

constraints:
  - Bestehendes Zoom-Pattern aus den anderen Analyse-Plots wiederverwenden.
  - Keine neuen Dependencies für Zoom — bestehende Gesture-Handler nutzen.
  - Video-Seitenverhältnis beibehalten (nur kleiner skalieren, nicht croppen).

nonGoals:
  - Vertikaler Zoom im Velocity-Plot.
  - Zoom im Video-Preview selbst.
  - Fullscreen-Modus für das Video.
