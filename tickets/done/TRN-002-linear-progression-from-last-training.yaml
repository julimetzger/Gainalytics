id: TRN-002
status: ready
area: trainings
priority: high
title: Apply linear progression when suggesting from the last planned or done training
source:
  - TODOS.md:8
description: >
  Upgrade the existing suggestion flow so copied workouts can be progressed in a
  deterministic way when they are created from the last planned or the last done
  training. The progression must be explicit, testable, and stable across both
  suggestion entry points.
components:
  - app/components/Training/TrainingsBase.tsx
  - app/redux/Training/dispatch/plan/dispatchSuggestBasedOnPlanned.ts
  - app/redux/Training/dispatch/plan/dispatchSuggestBasedOnTrained.ts
  - app/components/Workout/add/AddWorkoutSet.tsx
  - app/utils/AnalyseUtils.ts
acceptanceCriteria:
  - >
    Both suggestion entry points ("Suggest based on last Training" and "Suggest based
    on last planned Training") can apply the same linear progression profile before
    suggested workouts are created.
  - >
    The progression profile exposes two user-controlled inputs: `rirDelta` as an
    integer and `weightIncreasePercent` as a numeric percentage. Defaults are
    `rirDelta = 1` and `weightIncreasePercent = 0`.
  - >
    For each copied set, the implementation computes the source estimated 1RM from
    the previous weight, reps, and rir, applies `adjustedRir = max(sourceRir -
    rirDelta, 0)`, derives the new suggested weight from the estimated 1RM and the
    adjusted RIR, then applies the configured percent increase and rounds the result
    to a whole kilogram.
  - >
    If any source set for an exercise already has `rir = 0`, progression is skipped
    for that exercise and its copied sets stay unchanged.
  - >
    If no matching source training exists, the current disabled or fallback behavior
    of the suggestion buttons remains unchanged.
  - >
    Automated tests cover planned-source progression, done-source progression, the
    weight calculation formula, and the `rir = 0` skip rule.
evidenceRequired:
  - One screenshot or short review capture of the progression input UI.
  - Updated logic tests for the progression calculation and source-selection behavior.
  - One targeted UI smoke or e2e proof that creates suggested workouts with non-default progression values and shows changed weights.
constraints:
  - Reuse the existing 1RM helper logic from the current codebase instead of introducing a second formula path.
  - Keep the copied exercise order and the number of copied sets unchanged.
nonGoals:
  - Auto-suggestion from the date picker flow when no training is planned.
  - Reworking unrelated unfinished-workout handling.
