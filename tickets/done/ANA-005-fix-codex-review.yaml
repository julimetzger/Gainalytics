id: ANA-005-fix
status: ready
area: analyse
priority: high
title: Fix Codex review findings + Progress-Bar für async video analysis (PR #23)
source:
  - "https://github.com/julimetzger/Gainalytics/pull/23"
description: >
  Fünf Issues aus dem Codex-Review auf PR #23 plus eine neue Anforderung
  für eine realistische Progressbar:

  1. **Notification tap from background (P1):** Der Background-Handler für
  `video_analysis_complete` tut nichts — ein Tap auf die Notification im
  Background/Terminated-State verliert den Deep-Link. Fix: `getInitialNotification()`
  beim App-Start verwenden und den Background-Event-Callback korrekt behandeln.

  2. **Missing notification permission (P1):** Notifications werden ohne
  `notifee.requestPermission()` gepostet. Auf Android 13+ führt das zu
  stiller Nicht-Zustellung. Fix: Permission vor dem Posten anfragen.

  3. **Foreground-Service Reference-Counting (P1):** `runBackgroundAnalysis`
  ruft immer `stopVideoAnalysisForegroundService()` auf, wenn eine Analyse
  fertig wird — auch wenn noch weitere laufen. Das kann den Service für
  laufende Analysen stoppen und zu einem Kill durch Android führen.
  Fix: Stop-Aufruf per Reference-Count oder Job-Scope absichern.

  4. **Permission-Request Guard (P2):** `requestVideoAnalysisNotificationPermission()`
  wird vor dem try-Block geawaited. Wirft es eine Exception (Bridge-/Init-Fehler),
  bricht der gesamte Import ab. Fix: Fehler catchen oder den Aufruf in den
  bestehenden try-Block verschieben, damit Permission-Fehler die Analyse nicht
  blockieren.

  5. **Hardcoded video duration (P2):** `estimatedVideoDurationMs = 6000` statt
  der echten Videolänge. Macht Progress-Schätzungen und den gelernten
  `lastAnalysisSecondsPerVideoSecond`-Wert systematisch falsch.
  Fix: Echte Dauer aus Video-Metadaten lesen.

  6. **Progressbar nicht sichtbar (PR #28 Test):** Die Progressbar ist beim
  Testen nicht sichtbar gewesen. Muss sichtbar den Fortschritt anzeigen.

  7. **Keine Theme-Farben in Progressbar (PR #28 Codex P1):** Hardcoded
  Color-Literals statt `theme.colors` — verletzt Styling Rules (STRICT) aus
  AGENTS.md. Kontrast-Probleme bei verschiedenen Themes.
  Fix: Alle Farben in der Progressbar durch `theme.colors` ersetzen.

  8. **App unresponsiv gegen Ende der Analyse (PR #28 Test):** Gegen Ende
  der Video-Analyse wird die App komplett unresponsiv und muss neugestartet
  werden. Vermutlich blockiert die Analyse den JS-Thread.
  Fix: Sicherstellen dass die Analyse den UI-Thread nicht blockiert.

  9. **Background-Handler Navigation ohne React-Context (PR #28 Codex P1):**
  `EventType.PRESS` in `onBackgroundEvent` ruft `navigateToVideoAnalysis` auf,
  aber Notifee Background-Handler laufen ohne React-Context — Navigation-Container
  ist nicht verfügbar. Tap auf Notification im Background öffnet nicht die
  Analysis-Detail-Seite.

  10. **Gelernter Progress-Rate wird nicht aktualisiert (PR #28 Codex P2):**
  Nach `importVideoAnalysisFromSource` wird das `analyses`-Array vom Import-Start
  verwendet — die neu erstellte Analyse ist dort nicht enthalten. Dadurch läuft
  `setLastSecondsPerVideoSecond` nie und die gelernte Progress-Rate bleibt beim
  Default-Wert hängen.

  11. **Realistische Progressbar (NEU):** Die Loading-Bar soll den tatsächlichen
  Fortschritt der VideoAnalyse über die gesamte Videolänge abbilden. Wenn die
  Bar voll ist, soll das Video fertig analysiert sein (oder fast fertig).
  Initiale Schätzung: 1 Sekunde Analyse pro Sekunde Videolänge (d.h. ein
  45-Sekunden-Video → 45 Sekunden bis die Bar voll ist). Nach der ersten
  Analyse soll `lastAnalysisSecondsPerVideoSecond` aus der vorherigen Analyse
  für die Geschwindigkeitsschätzung verwendet werden.
components:
  - App.tsx
  - app/utils/videoAnalysisNotification.ts
  - app/utils/video-analysis-import.ts
  - app/utils/videoAnalysisProgress.ts
  - app/tabs/Analyse/VideoAnalysisTab.tsx
  - android/app/src/main/java/com/powerliftingworkoutplanner/VideoAnalysisModule.java
acceptanceCriteria:
  - >
    Tapping the completion notification while the app is in the background or
    terminated opens the app and navigates to the finished VideoAnalysisDetail.
  - >
    `notifee.requestPermission()` is called before any notification is posted
    by the video analysis flow. If denied, the analysis still completes normally.
  - >
    Der Foreground-Service wird erst gestoppt, wenn keine Analyse mehr läuft
    (Reference-Counting oder Job-Scope).
  - >
    Ein Fehler in `requestVideoAnalysisNotificationPermission()` blockiert
    nicht den Analyse-Start — die Analyse läuft auch ohne Permission weiter.
  - >
    Die Progress-Schätzung verwendet die echte Videolänge aus den Metadaten
    statt eines hardcoded 6s-Werts. Fallback auf 1:1 Ratio wenn die Dauer
    nicht ermittelt werden kann.
  - >
    Die Progressbar zeigt den Fortschritt relativ zur geschätzten Gesamtdauer:
    Initiale Schätzung 1s Analyse pro 1s Video. Nach der ersten Analyse wird
    `lastAnalysisSecondsPerVideoSecond` für genauere Schätzungen herangezogen.
    Bei einem 45s-Video dauert die Bar beim ersten Mal ~45s bis sie voll ist.
  - >
    Die Progressbar ist sichtbar und zeigt den Fortschritt während der Analyse an.
  - >
    Alle Farben in der Progressbar verwenden `theme.colors` — keine hardcoded
    Color-Literals.
  - >
    Die App bleibt während der gesamten Video-Analyse responsiv — kein Freeze
    oder Neustart nötig.
  - >
    Nach einer abgeschlossenen Analyse wird `lastSecondsPerVideoSecond` mit dem
    aktuellen (frisch gelesenen) State aktualisiert, nicht mit dem veralteten
    Snapshot vom Import-Start.
  - >
    Automated tests cover notification permission, initial notification handling,
    foreground service reference counting, and duration-based progress calculation.
evidenceRequired:
  - Emulator evidence of notification tap navigating to analysis from background.
  - Screen-Recording oder Maestro-Flow der die Progressbar bei einer Video-Analyse zeigt.
  - Passing test log for permission, tap handling, service ref-counting, and progress calculation.
constraints:
  - Use @notifee getInitialNotification() for the cold-start path.
  - Do not request permission at app startup — only when analysis is used.
  - Reuse existing native module methods for video duration if possible.
  - Keine neuen Dependencies für die Progressbar — react-native-reanimated und
    bestehende ProgressBar-Komponenten verwenden.
nonGoals:
  - Adding a custom permission rationale dialog.
  - Frame-level progress tracking during analysis.
  - Exakte sekundengenaue Progressbar — eine gute Schätzung reicht.
