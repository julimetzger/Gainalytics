id: ANA-003-fix
status: ready
area: analyse
priority: medium
title: Speed-Chart Performance — Progress-Marker aus Bridge entkoppeln
source:
  - TODOS.md
  - tickets/ANA-003-video-player-improvements.yaml
description: >
  Der "Bar v_y Over Time" LineChart (react-native-charts-wrapper) wird alle 50ms
  komplett über die JS Bridge neu gerendert, weil der vertikale Progress-Marker
  als 3. Dataset im Chart steckt. Jede Änderung von playbackTimeMs serialisiert
  alle 3 Datasets an MPAndroidChart — das überlastet die Bridge und verursacht
  Ruckeln während der Wiedergabe.

  Fix: Das 3. Dataset (progressVelocityLineValues) aus dem LineChart entfernen.
  Stattdessen einen absolut positionierten Animated.View als Overlay über dem
  Chart rendern. Die Position wird per react-native-reanimated SharedValue auf
  dem UI-Thread gesteuert — keine JS-Bridge-Aufrufe mehr für den Marker.

  Der statische Chart (Geschwindigkeitskurve + Null-Linie) wird nur noch bei
  Änderung von result neu gerendert.

  Zusätzlich: Die "Bar Y Position Over Time" Anzeige (Position-Plot) komplett
  entfernen — das gesamte Chart und den zugehörigen Marker. Die Y-Position-
  Anzeige wird perspektivisch nicht mehr gebraucht und verursacht ebenfalls
  Bridge-Überladung.

  Außerdem: Der Playback-Fortschrittsbalken (Scrubber) muss synchron mit dem
  Video laufen. Bei einem 47-Sekunden-Video muss der Balken nach 47 Sekunden
  am Ende sein — nicht erst nach 1:30 Minuten wie aktuell.
components:
  - app/components/video/VideoAnalysisPlaybackOverlayCard.tsx
screens:
  - orchestrator/AppStruktur/analyse/VideoAnalysisDetail.png
acceptanceCriteria:
  - >
    Der LineChart hat nur noch 2 Datasets (Geschwindigkeitskurve und Null-Linie).
    Das 3. Dataset (Progress-Marker) existiert nicht mehr im Chart.
  - >
    Ein dünner vertikaler Strich (Animated.View) zeigt die aktuelle Wiedergabe-
    position über dem Chart an. Die Position wird per react-native-reanimated
    SharedValue aktualisiert.
  - >
    Während der Video-Wiedergabe gibt es kein spürbares Ruckeln im Chart-Bereich.
    Der Marker bewegt sich flüssig.
  - >
    Tap-to-seek auf dem Speed-Chart funktioniert weiterhin (onSelect + pointerEvents="none").
  - >
    Step-Buttons und Scrubber aktualisieren den Marker korrekt.
  - >
    Die "Bar Y Position Over Time" Anzeige (Position-Plot) ist komplett entfernt —
    kein Chart, kein Marker, keine Daten-Berechnung dafür.
  - >
    Der Playback-Fortschrittsbalken (Scrubber) ist synchron mit der Video-Dauer.
    Bei einem 47s-Video ist der Balken nach 47 Sekunden am Ende. Die angezeigte
    Playback-Zeit stimmt mit der tatsächlichen Video-Position überein.
  - >
    Bestehende Tests sind angepasst und grün.
evidenceRequired:
  - Maestro-Flow oder Screen-Recording das flüssige Marker-Bewegung zeigt.
  - Jest-Testlog zeigt angepasste Tests grün.
constraints:
  - Keine neuen Dependencies — react-native-reanimated v3.7 ist bereits installiert.
  - Kein nativer Rebuild nötig.
  - Chart-Left-Padding (Y-Achsen-Label-Breite) als Konstante, visuell kalibriert.
nonGoals:
  - Kompletter Ersatz von react-native-charts-wrapper durch Skia oder andere Library.
  - Änderungen am nativen VideoAnalysisPlayerView.java.
