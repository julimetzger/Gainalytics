id: PERF-002
title: "Satz speichern: Wohin gehen die ~340 ms? Aufschlüsselung Rendern vs. Datenspeicherung (Release-Build, read-only)"
priority: high
area: performance
description: |
  Messauftrag, KEIN Fix-Auftrag. Am Ende ist das Produktverhalten der App unverändert.

  Ausgangslage: Nach dem Tippen auf "Add" in einem laufenden Training ist die App laut PERF-001
  (docs/perf/device-measurement.md, PR #463) im Release-Build ~340 ms beschäftigt (Median, 12 Sätze),
  und die Dauer wächst mit jedem Satz der Übung (~+8 ms/Satz). Ein schneller zweiter Tap oder
  Feldwechsel direkt nach "Add" wird dadurch spürbar verzögert.

  Frühere Analysen (GH-288/PR #289, GH-297/PR #298, GH-279/PR #281) haben im Dev-Build ~150–195 ms
  Render-Zeit gemessen und festgestellt, dass beim Satz-Adden keine Persist-AKTIONEN feuern. Ob das
  anschließende Schreiben des gespeicherten Datenbestands (das ohne eigene Aktion abläuft) im
  Release-Build Zeit kostet, wurde dabei nicht gemessen. Zwischen den ~340 ms und der gemessenen
  Render-Zeit bleiben grob 150 ms ohne Zuordnung.

  Frage dieses Tickets: Wie verteilen sich die ~340 ms nach "Add" im RELEASE-Build auf
  (a) Rendern/Reconcile, (b) Speichern der Daten (Serialisieren + Schreiben), (c) sonstiges
  (z. B. Timer, Rekord-/1RM-Berechnung, Benachrichtigungen)? Beide Richtungen sind offen —
  das Ergebnis darf auch sein, dass Speichern keine Rolle spielt.

  Für die Messung darf vorübergehend Zeitmess-Code eingebaut werden; er muss entweder hinter einem
  Schalter liegen, der im normalen Release-Build nichts tut, oder vor dem PR wieder entfernt werden.
acceptanceCriteria:
  - "Messung im Release-Build (nicht debuggable, Hermes) auf R5CN30HWZFN mit den echten Nutzerdaten, mindestens 12 Sätze in einem Mess-Training"
  - "Report docs/perf/set-save-breakdown.md: Tabelle je Satz mit Gesamtdauer nach 'Add' und den Anteilen (a) Rendern, (b) Datenspeicherung, (c) sonstiges — Median, min/max; Anteil, der keiner Kategorie zugeordnet werden kann, wird ausgewiesen"
  - "Report sagt, wie die Gesamtdauer mit der Anzahl der Sätze der Übung wächst und welcher Anteil dafür verantwortlich ist"
  - "Report nennt klar: lohnt sich ein Umbau der Datenspeicherung (ja/nein, erwartete Ersparnis in ms) und welcher Fix an der Satzliste/Eingabezeile am meisten bringen würde — mit Begründung aus den Zahlen"
  - "Gegenprobe: dieselbe Messung mit ausgeschalteter Zeitmessung zeigt eine vergleichbare Gesamtdauer wie PERF-001 (~340 ms), damit die Messung selbst das Ergebnis nicht verfälscht"
  - "Rohdaten und Mess-Skripte unter docs/perf/raw/PERF-002/"
  - "Kein Produktverhalten verändert; eingebauter Messcode ist inaktiv oder entfernt"
constraints:
  - |
    NUTZERDATEN SIND ECHT UND UNERSETZLICH. Niemals die App deinstallieren, niemals `pm clear`,
    niemals Daten importieren/überschreiben. Auf dem Gerät ist seit PERF-001 ein RELEASE-Build installiert
    (mit dem Debug-Key signiert, nicht debuggable → `run-as` geht nicht). Vor jeder Installation die Daten
    per In-App-Export (Settings → Export Data) sichern und die Datei ins Run-Verzeichnis kopieren.
    Neue Builds mit demselben Debug-Key signieren und per `adb install -r` darüberlegen. Scheitert die
    Installation wegen der Signatur: STOPPEN und needs_input melden, nicht deinstallieren.
  - "Das Mess-Training und alle eingetragenen Sätze am Ende rückstandslos entfernen (Gewicht deutlich unter dem Rekord, damit kein Rekord geschrieben wird) und per Export-Vergleich vorher/nachher belegen."
  - "Nach der Messung bleibt ein normaler Release-Build ohne aktive Zeitmessung installiert."
  - "Nur echtes Gerät R5CN30HWZFN verwenden, keine Emulatoren."
