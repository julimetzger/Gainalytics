id: ANA-001
status: ready
area: analyse
priority: medium
title: Add a training-length analysis page with a bar chart
source:
  - TODOS.md:16
description: >
  Add a dedicated analysis screen that visualizes completed training duration as a bar
  chart. The page should fit into the existing Analyse routing and filtering model and
  make it easy to compare training length across day, week, and month accumulation.
components:
  - app/routing/AnalyseRouter.tsx
  - app/tabs/Analyse/AnalyseGraphics.tsx
  - app/tabs/Analyse
acceptanceCriteria:
  - >
    The Analyse router exposes a new screen titled "Training Length" that is reachable
    from the Analyse navigation without breaking the existing screens.
  - >
    The screen shows a bar chart of completed training duration calculated from
    `training.end - training.start` and ignores trainings that do not have both
    timestamps.
  - >
    The page supports Day, Week, and Month accumulation and updates the chart when the
    accumulation mode changes.
  - >
    The page uses the existing date-range filtering pattern so the visible data is
    limited to the selected range.
  - >
    When no completed trainings exist in the selected range, the screen shows a clear
    empty state instead of an empty or broken chart.
  - >
    Automated tests cover duration aggregation and at least one navigation or rendering
    path for the new screen.
evidenceRequired:
  - One screenshot of the populated training-length chart.
  - One screenshot of the empty state for the same screen.
  - One targeted UI smoke or e2e proof that opens the screen and changes the accumulation mode.
constraints:
  - Follow the existing Analyse navigation and filtering patterns instead of introducing a separate analytics flow.
  - Use completed trainings only; planned trainings must not affect the chart.
nonGoals:
  - Adding drill-down interactions from bars to individual workouts.
  - Reworking the existing Analyse graphics page beyond what is needed to share reusable chart or filter code.
