id: ANA-006
status: ready
area: analyse
priority: medium
title: Video-Analyse mit Trainingsset verknüpfen — 4 UI-Flows
source:
  - TODOS.md
description: >
  Verknüpfung von Video-Analysen mit konkreten Trainingssets über 4 Wege.
  Alle Flows nutzen ein Modal (react-native-paper Portal+Modal) statt
  Cross-Tab-Navigation, damit der User im aktuellen Kontext bleibt.

  Zentrales UI-Element: Ein "Video-Auswahl-Modal" das den VideoAnalysisTab
  rendert (inkl. Import-Buttons). Es zeigt unverknüpfte Videos und erlaubt
  auch den Import neuer Videos. Ein neu importiertes Video wird sofort bei
  Import verknüpft (noch bevor die Analyse abgeschlossen ist).

  Zweites UI-Element: Ein "Set-Auswahl-Modal" das eine Workout-History als
  ScrollView mit WorkoutViews anzeigt, plus einen Exercise-Filter (bestehender
  DropDown-Picker aus react-native-paper-dropdown). Tap auf ein Set verknüpft.

  Flow 1 — Kamera-Icon am Set (WorkoutSetView, Edit-Modus):
    - Im Edit-Modus erscheint ein Kamera/Video-Icon pro Set-Zeile
    - Tap öffnet das Video-Auswahl-Modal (gefiltert auf gleiche Exercise)
    - Tap auf unverknüpftes Video oder Import eines neuen Videos → verknüpft
    - Icon nur im Edit-Modus sichtbar

  Flow 2 — Link-Button am Video (VideoAnalysisTab):
    - Jedes unverknüpfte Video bekommt einen Link-Button
    - Tap öffnet das Set-Auswahl-Modal (Workout-History + Exercise-Filter)
    - Tap auf ein Set → verknüpft

  Flow 3 — Link Video in AddWorkout:
    - "Link Video"-Button unterhalb der AddWorkoutSets
    - Tap auf den Button → User tippt auf eines der bereits persistierten Sets
    - Video-Auswahl-Modal öffnet sich (gefiltert auf die Exercise des Workouts)
    - Tap auf Video oder Import → verknüpft mit dem ausgewählten Set

  Flow 4 — Neues Video im Modal importieren:
    - In jedem Video-Auswahl-Modal (Flow 1 & 3) kann der User ein neues Video
      importieren, da der VideoAnalysisTab mit Import-Buttons gerendert wird
    - Das importierte Video wird sofort bei Import mit dem Set verknüpft,
      unabhängig vom Analyse-Status (Analyse läuft async weiter)

components:
  - app/components/Workout/show/WorkoutSetView.tsx
  - app/components/Workout/add/AddWorkout.tsx
  - app/tabs/Analyse/VideoAnalysisTab.tsx
  - app/components/video/VideoAnalysisWorkoutLinkCard.tsx
  - app/redux/VideoAnalysis/videoAnalysisReducer.ts

screens:
  - orchestrator/AppStruktur/analyse/VideoAnalysisDetail.png
  - orchestrator/AppStruktur/trainings/TrainingsPlan.png

acceptanceCriteria:
  - >
    Flow 1: Im Edit-Modus von WorkoutSetView erscheint ein Kamera-Icon pro Set.
    Tap öffnet ein Modal mit unverknüpften Videos. Tap auf Video verknüpft es
    mit dem Set (setzt workoutId, exerciseId, setIndex auf der VideoAnalysis).
  - >
    Flow 2: Im VideoAnalysisTab hat jedes unverknüpfte Video einen Link-Button.
    Tap öffnet ein Modal mit Workout-History und Exercise-Filter-Picker.
    Tap auf ein Set verknüpft das Video.
  - >
    Flow 3: In AddWorkout gibt es einen "Link Video"-Button unter den Sets.
    Tap → User wählt ein persistiertes Set → Video-Auswahl-Modal öffnet sich.
    Tap auf Video verknüpft es mit dem gewählten Set.
  - >
    Flow 4: Im Video-Auswahl-Modal kann ein neues Video importiert werden.
    Das Video wird sofort bei Import verknüpft (vor Analyse-Abschluss).
  - >
    Bereits verknüpfte Videos/Sets sind im jeweiligen Modal als verknüpft
    gekennzeichnet und nicht erneut auswählbar.
  - >
    Verknüpfte Sets zeigen ein visuelles Indikator-Icon (z.B. kleines
    Video-Icon) in WorkoutSetView und AddWorkout.

evidenceRequired:
  - >
    Maestro-Flow für Flow 1: Navigation zu Training → Edit-Modus → Kamera-Icon
    tap → Modal sichtbar → Video auswählen → Verknüpfung prüfen.
  - >
    Maestro-Flow für Flow 2: Navigation zu VideoAnalysisTab → Link-Button tap →
    Set-Auswahl-Modal sichtbar → Exercise-Filter nutzen → Set auswählen →
    Verknüpfung prüfen.
  - >
    Maestro-Flow für Flow 3: Navigation zu Training → AddWorkout → Set anlegen →
    "Link Video" tap → Set auswählen → Video-Modal sichtbar → Video auswählen →
    Verknüpfung prüfen.
  - >
    Maestro-Flow für Flow 4: Navigation zu Training → Edit-Modus → Kamera-Icon
    tap → Modal sichtbar → neues Video importieren → Video wird sofort als
    verknüpft angezeigt.
  - Jest-Tests für Modal-Öffnung, Verknüpfungs-Logik und Filter.

constraints:
  - Modals nutzen react-native-paper Portal+Modal (bestehendes Pattern).
  - Exercise-Filter nutzt bestehenden DropDown aus react-native-paper-dropdown.
  - Keine Cross-Tab-Navigation — alles über Modals.
  - Video-Auswahl-Modal rendert VideoAnalysisTab-Inhalte (DRY).
  - Kein neuer Redux-Action-Type nötig — LINK_VIDEO_ANALYSIS_TO_WORKOUT existiert.

nonGoals:
  - Automatisches Matching von Videos zu Sets anhand von Zeitstempeln.
  - Anzeige von Analyse-Ergebnissen (Geschwindigkeit, Rep-Zeiten) am Set.
  - Änderungen am nativen VideoAnalysisPlayerView.
