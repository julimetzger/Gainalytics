id: PERF-001
title: "Performance-Messung am echten Gerät: Start, Satz-Loggen, Scrollen, Speicher (Release-Build)"
priority: high
area: performance
description: |
  Messauftrag, KEIN Fix-Auftrag. Es wird kein App-Code geändert.

  Ziel: belastbare Zahlen, wie sich die App beim Nutzer anfühlt, damit die Befunde eines vorangegangenen
  Code-Audits priorisiert werden können. Gemessen wird ausschließlich ein RELEASE-Build (Hermes, kein
  Dev-Mode, kein Metro) auf dem echten Gerät SM-G986B (Android 13) mit den dort vorhandenen Daten.

  Zu messende Nutzer-Szenarien (jeweils mehrere Durchläufe, Median + Streuung):
  1. Kaltstart bis zur ersten bedienbaren Ansicht, und Warmstart.
  2. Während eines laufenden Trainings: einen Satz eintragen und speichern — wie lange hängt die UI
     danach, gibt es verworfene Frames? Ebenso: Tippen in die Wiederholungs-/Gewichtsfelder.
  3. Wischen zwischen Trainingstagen im Trainingsplan.
  4. Scrollen durch den Exercises-Tab, die Trainings-Historie und den Historien-Kalender (auch Tippen auf Tage).
  5. Öffnen und Bedienen des Analyse-Bereichs (Dashboard, Graph, Metrics) inkl. Zeitraumwechsel.
  6. AI-Chat: Tippen in das Eingabefeld bei vorhandenem Verlauf (KEINE Nachricht absenden).
  7. Speicherverbrauch (PSS) nach Start und nach einer Runde durch alle Tabs.
  8. Wie groß die gespeicherten App-Daten sind (Umfang der Historie), damit die Zahlen einzuordnen sind.

  Aus dem Code-Audit gibt es Vermutungen, die die Messung bestätigen oder widerlegen soll — sie sind
  Hypothesen, keine Vorgaben: Satz speichern löst eine Neuberechnung der ganzen App aus und schreibt
  den kompletten Datenbestand neu; Tippen in die Satzfelder erzeugt unnötige Renders; der Trainingsplan
  rendert mehrere Tage gleichzeitig; die Exercises-Liste ist nicht virtualisiert; der Start wartet auf
  das Einlesen aller gespeicherten Daten. Bitte pro Szenario sagen, ob sich das in den Zahlen zeigt.
acceptanceCriteria:
  - "Release-Build (nicht debuggable, Hermes) ist auf <phone-serial> installiert, belegt per dumpsys package"
  - "Die Nutzerdaten auf dem Gerät sind vorher gesichert und nach der Messung unverändert vorhanden (Anzahl Trainings/Workouts vorher = nachher, Screenshot der Historie vorher/nachher)"
  - "Für jedes der 8 Szenarien liegen Messwerte vor (Median, min/max, Anzahl Durchläufe) samt Messmethode (z. B. am start -W, dumpsys gfxinfo framestats, Perfetto/systrace, dumpsys meminfo)"
  - "Report docs/perf/device-measurement.md mit Tabelle aller Werte, den Top-5 der spürbarsten Probleme und je Hypothese bestätigt/widerlegt/unklar"
  - "Rohdaten (gfxinfo-Ausgaben, Traces, Logs) liegen unter docs/perf/raw/ bzw. im Run-Verzeichnis; Screenshots der gemessenen Screens vorhanden"
  - "Kein App-Code verändert"
constraints:
  - |
    NUTZERDATEN SIND ECHT UND UNERSETZLICH. Niemals die App deinstallieren, niemals `pm clear`,
    niemals Daten importieren/überschreiben, keine Trainings anlegen oder löschen, die nicht
    anschließend rückstandslos wieder entfernt werden. Das installierte Build ist mit dem Debug-Key
    signiert; ein Release-Build mit demselben Debug-Key signiert lässt sich per `adb install -r`
    darüber installieren, ohne Daten zu verlieren (Signing über -Pandroid.injected.signing.* mit
    android/app/debug.keystore, Passwort android, Alias androiddebugkey). Scheitert die Installation
    wegen der Signatur: STOPPEN und needs_input melden, nicht deinstallieren.
  - "Vor der Installation die App-Daten per `run-as` sichern (solange das installierte Build noch debuggable ist) und die Sicherung ins Run-Verzeichnis kopieren."
  - "Für Szenario 2 ein bereits laufendes oder neu gestartetes Training nutzen; alle zu Messzwecken eingetragenen Sätze/Trainings am Ende wieder entfernen und das belegen."
  - "Nach der Messung bleibt der Release-Build installiert (App muss normal nutzbar sein)."
  - "Nur echtes Gerät <phone-serial> verwenden, keine Emulatoren."
