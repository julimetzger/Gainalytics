id: FUN-001
status: ready
area: general
priority: low
title: Easter Egg — Cardio-Warnung bei mehr als 20 Reps
source:
  - TODOS.md
description: >
  Humorvolles Easter Egg: Wenn ein User ein Set mit mehr als 20 Reps einträgt,
  wird eine In-App-Notification (Toast/Snackbar) angezeigt mit dem Text:

  "This app can't be used to track cardio. Please use real weights!
  Next time the app catches you doing cardio, the app will be deinstalled."

  Rein kosmetisch — im Hintergrund funktioniert alles normal. Das Set wird
  ganz regulär gespeichert und verarbeitet. Nur die Notification wird einmalig
  beim Eintragen angezeigt.

components:
  - app/components/Workout/add/AddWorkoutSets.tsx

acceptanceCriteria:
  - >
    Beim Eintragen eines Sets mit mehr als 20 Reps erscheint eine
    In-App-Notification (Toast oder Snackbar) mit dem Easter-Egg-Text.
  - >
    Das Set wird trotzdem ganz normal gespeichert — keine Funktionseinschränkung.
  - >
    Die Notification erscheint nur einmal pro Set-Eingabe, nicht wiederholt.
  - >
    Bei 20 oder weniger Reps erscheint keine Notification.

constraints:
  - Bestehende Toast/Snackbar-Komponente verwenden (kein neues UI-Pattern).
  - Kein Impact auf die normale Set-Logik — rein visueller Gag.

nonGoals:
  - Tatsächliches Blockieren oder Löschen von Sets.
  - Persistierung ob der User schon "gewarnt" wurde.
  - Lokalisierung/Übersetzung des Textes.
