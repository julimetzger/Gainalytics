id: ANA-005
status: ready
area: analyse
priority: high
title: Asynchrone Video-Analyse mit Progress-Anzeige und Notification
source:
  - TODOS.md:36
description: >
  Die Video-Analyse blockiert aktuell die UI komplett. `analyzeSquatVideo()` und
  `prepareSquatVideoSeed()` laufen synchron auf dem Caller-Thread über die React
  Native Bridge, sodass der User die App während der Analyse nicht nutzen kann.

  Die Analyse soll in einen Android Background-Thread (oder Headless-Task)
  verschoben werden, sodass der User die App ganz normal weiter benutzen kann.
  Der Redux-State trackt den Fortschritt über den bestehenden Status-Flow
  (QUEUED → PROCESSING → DONE / FAILED).

  Während der Analyse zeigt ein Loading-Spinner den geschätzten Progress an.
  Die Schätzung basiert auf der Analyse-Dauer pro Sekunde Video aus der letzten
  Analyse. Dazu wird im Redux-State ein neues Feld
  `lastAnalysisSecondsPerVideoSecond` gespeichert, das nach jeder fertigen
  Analyse aus `totalAnalysisMs` und der Video-Dauer aktualisiert wird. Beim
  ersten Lauf wird als Default 1s Analyse pro 1s Video angenommen.

  Wenn die Analyse fertig ist, wird eine Android-Notification angezeigt, die
  den User auf das Ergebnis hinweist. Ein Tap auf die Notification navigiert
  zur fertigen Analyse.
components:
  - android/app/src/main/java/com/powerliftingworkoutplanner/VideoAnalysisModule.java
  - app/utils/video-analysis-import.ts
  - app/utils/videoAnalysisNative.ts
  - app/redux/VideoAnalysis/videoAnalysisReducer.ts
  - app/tabs/Analyse/VideoAnalysisTab.tsx
  - app/tabs/Analyse/VideoAnalysisDetailTab.tsx
screens:
  - orchestrator/AppStruktur/analyse/videoAnalysis.png
  - orchestrator/AppStruktur/analyse/VideoAnalysisDetail.png
acceptanceCriteria:
  - >
    Die Video-Analyse (`analyzeSquatVideo`) läuft in einem Background-Thread
    und blockiert die UI nicht. Der User kann während der Analyse normal in der
    App navigieren.
  - >
    Der Redux-State zeigt den Analyse-Status in Echtzeit an (QUEUED →
    PROCESSING → DONE / FAILED), sodass die UI den aktuellen Zustand
    reflektieren kann.
  - >
    Ein Progress-Indikator zeigt die geschätzte verbleibende Zeit basierend auf
    `lastAnalysisSecondsPerVideoSecond` an. Der Default-Wert beim ersten Lauf
    ist 1s Analyse pro 1s Video.
  - >
    Nach jeder abgeschlossenen Analyse wird `lastAnalysisSecondsPerVideoSecond`
    im Redux-State aus `totalAnalysisMs` und der tatsächlichen Video-Dauer
    aktualisiert und persistiert.
  - >
    Bei Abschluss der Analyse wird eine Android-Notification angezeigt. Ein Tap
    auf die Notification öffnet die App und navigiert zur fertigen Analyse.
  - >
    Wenn die App während der Analyse geschlossen oder in den Hintergrund
    geschickt wird, läuft die Analyse weiter und die Notification erscheint
    trotzdem.
  - >
    Fehler während der Background-Analyse werden sauber gefangen, der Status
    wird auf FAILED gesetzt, und die UI zeigt eine Fehlermeldung statt zu
    crashen.
  - >
    Automated tests decken mindestens die Progress-Schätzung, das State-Update
    nach Abschluss, und den Fehlerfall ab.
evidenceRequired:
  - Screenshot der App während einer laufenden Analyse mit sichtbarem Progress-Indikator, während der User auf einem anderen Tab navigiert.
  - Screenshot der Android-Notification nach abgeschlossener Analyse.
  - Emulator-Beweis dass ein Tap auf die Notification zur fertigen Analyse navigiert.
  - Fokussierter Test-Log der Progress-Schätzung und State-Updates.
constraints:
  - Die bestehende synchrone `prepareSquatVideoSeed()` (Seed-Selection) kann
    synchron bleiben, da sie nur ein einzelnes Frame verarbeitet und schnell ist.
  - Nur `analyzeSquatVideo()` muss in den Background verschoben werden.
  - Der bestehende Redux-Flow (ADD_VIDEO_ANALYSIS, SET_VIDEO_ANALYSIS_STATUS,
    ATTACH_VIDEO_ANALYSIS_RESULT) soll wiederverwendet und erweitert werden,
    nicht ersetzt.
  - Nutze einen Android Foreground Service oder `HeadlessJsTaskService` für die
    Background-Ausführung, damit Android den Prozess nicht killt.
nonGoals:
  - Parallele Analyse mehrerer Videos gleichzeitig.
  - Abbrechen einer laufenden Analyse durch den User.
  - iOS-Support für Background-Analyse.
