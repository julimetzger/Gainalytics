id: ANA-005-fix-perm
status: ready
area: analyse
priority: high
title: Request notification permission before posting analysis results
source:
  - "https://github.com/julimetzger/Gainalytics/pull/23#discussion"
description: >
  Both completion and failure notifications in videoAnalysisNotification.ts
  are displayed without first requesting runtime notification permission.
  On Android 13+ this causes silent non-delivery for users who have never
  granted POST_NOTIFICATIONS. Because callers also swallow notification
  errors, affected users get no completion signal even though the feature
  advertises background completion alerts.

  Call `notifee.requestPermission()` before posting the notification, or
  request permission at the start of the analysis flow so the user is
  prompted before the analysis begins.
components:
  - app/utils/videoAnalysisNotification.ts
  - app/utils/video-analysis-import.ts
acceptanceCriteria:
  - >
    `notifee.requestPermission()` is called before any notification is posted
    by the video analysis flow.
  - >
    If the user denies the permission, the analysis still completes normally
    without crashing — only the notification is skipped.
  - >
    Automated tests cover the permission request path.
evidenceRequired:
  - Passing test log showing permission is requested.
constraints:
  - Do not request permission at app startup — only when the analysis feature is used.
  - Do not block the analysis on permission denial.
nonGoals:
  - Adding a custom permission rationale dialog.
