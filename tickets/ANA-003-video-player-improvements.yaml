id: ANA-003
status: ready
area: analyse
priority: medium
title: Video player improvements — responsiveness, seek-by-click, and step buttons
source:
  - TODOS.md:38
description: >
  The VideoAnalysisDetails player has three independent improvement areas.

  1. Responsiveness: The time display and progress bar lag noticeably behind the
  actual video. The root cause is three stacked throttle layers: the native
  Handler polls every 100 ms, the native event throttle suppresses events closer
  than 120 ms, and the JS side adds another 120 ms UI-bucket check — worst-case
  total latency is ~340 ms. Fix by reducing PROGRESS_INTERVAL_MS and
  PROGRESS_EVENT_INTERVAL_MS to 50 ms in VideoAnalysisPlayerView.java and
  PLAYBACK_UI_UPDATE_INTERVAL_MS to 50 ms in VideoAnalysisPlaybackOverlayCard.tsx.
  As an additional decoupling step, consider driving the native overlay dot and
  time display directly from the ExoPlayer render thread (or a Choreographer
  callback) so they are no longer gated by the RN JS bridge.

  2. Scrubber bug: The progress bar jumps during dragging because the
  pendingSeekTargetMs threshold is 1500 ms — any seek shorter than that lets
  stale native progress events overwrite the scrubber position. Add an
  isScrubbingRef that blocks all native progress events while the user holds the
  scrubber. Also add onResponderRelease / onResponderTerminate handlers that
  clear the flag and reset latestProgressTimeRef so normal playback resumes
  cleanly after release.

  3. Seek-by-click on speed chart: Tapping a point on the "Bar v_y Over Time"
  LineChart should seek the player to the corresponding time. The chart already
  has a time axis; map the tap x-coordinate to a time value and call
  applySeekTimeMs with the result.

  4. Step buttons: Add four buttons below the scrubber to step the playback
  position backwards or forwards by fixed amounts: −0.2 s, −0.05 s, +0.05 s,
  +0.2 s. Each button calls applySeekTimeMs(playbackTimeRef.current ± stepMs).
  These are useful for frame-accurate review of a rep.
components:
  - app/components/video/VideoAnalysisPlaybackOverlayCard.tsx
  - android/app/src/main/java/com/powerliftingworkoutplanner/VideoAnalysisPlayerView.java
screens:
  - orchestrator/AppStruktur/analyse/VideoAnalysisDetail.png
  - orchestrator/AppStruktur/analyse/videoAnalysis.png
acceptanceCriteria:
  - >
    The time display and scrubber position update within 100 ms of actual video
    playback time. Verified by observing the displayed time at video start and
    comparing it to elapsed wall-clock time.
  - >
    Dragging the scrubber does not cause the progress bar to jump back to a
    previous position. The scrubber follows the finger smoothly and settles at
    the release position.
  - >
    Tapping anywhere on the "Bar v_y Over Time" speed chart seeks the player to
    the tapped time. The scrubber and time display update to reflect the new
    position.
  - >
    Four step buttons are visible below the scrubber: −0.2 s, −0.05 s, +0.05 s,
    +0.2 s. Each press moves the playback position by the corresponding amount
    and the time display and scrubber update immediately.
  - >
    Automated tests cover: step buttons advance and rewind playback time by the
    correct amounts, and the scrubber position reflects the updated time.
evidenceRequired:
  - Screenshot of the player controls showing the four step buttons.
  - Maestro or unit test log showing step button behaviour passing.
  - Screen recording or description confirming smooth scrubber drag without jumping.
constraints:
  - Do not change the VideoAnalysisPlayerView public API beyond adding or
    adjusting constants and the seek-while-scrubbing guard.
  - The Codex/Claude worker for Codex runner stays unchanged (--runner codex path).
  - Keep the bar-path overlay dot synchronised with the displayed time after all
    changes.
nonGoals:
  - Playback speed control (covered in a separate ticket).
  - Redesigning the chart library or replacing ExoPlayer.
  - Adding seek-by-click to the Y-position chart (only the speed chart for now).
