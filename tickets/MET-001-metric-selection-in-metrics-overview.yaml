id: MET-001
status: ready
area: analyse
priority: medium
title: Auswahlmöglichkeit der Metriken in MetricsOverview
description: >
  In der MetricsOverview gibt es sowohl für Muscles als auch Exercises drei
  vorbelegte Metrik-Slots (z.B. für Exercises: 1RM, Reps, Max Intensity).

  1. **Metrik-Auswahl per Dropdown:** Bei Press auf eine Metrik-Spaltenüberschrift
  öffnet sich ein Dropdown mit allen verfügbaren Metriken (Volume, 1RM, Sets,
  Reps, Max Intensity, Average Intensity). Bei Klick auf eine Metrik aus dem
  Dropdown wird die Spalte mit der neuen Metrik aktualisiert. Die Auswahl wird
  separat für Muscles und Exercises im State gespeichert und gilt ab sofort
  für alle MetricOverviews (auch im Training-Detail).

  2. **Muscles Overview über Exercise Overview verschieben:** Die Reihenfolge
  der Sections in der MetricsOverview ändern — Muscles kommt vor Exercises.

  Vorhandene Infrastruktur:
  - Metric-Enum in `app/models/Metric.ts` (6 Metriken)
  - `MetricsOverviewForWorkouts` zeigt die Vergleichstabelle mit 3 Spalten
  - `MetricsNode` filtert Workouts und übergibt an Overview

components:
  - app/tabs/Analyse/Metrics.tsx
  - app/components/analyse/MetricsOverviewForWorkouts.tsx
  - app/components/analyse/MetricsNode.tsx
  - app/components/analyse/ExerciseMetricOverview.tsx
  - app/models/Metric.ts

acceptanceCriteria:
  - >
    Bei Press auf eine Metrik-Spaltenüberschrift (Muscles oder Exercises) öffnet
    sich ein Dropdown mit allen verfügbaren Metriken.
  - >
    Bei Auswahl einer Metrik aus dem Dropdown wird die Spalte aktualisiert und
    zeigt die neue Metrik an.
  - >
    Die Auswahl wird separat für Muscles und Exercises im State persistiert und
    beim nächsten Öffnen wiederhergestellt.
  - >
    Die gewählten Metriken gelten auch im Training-Detail-View für den gleichen Slot.
  - >
    Muscles Overview wird über Exercise Overview angezeigt (Reihenfolge getauscht).
  - >
    Maestro-Test deckt den vollständigen Flow ab:
    1. AnalyseTab → MetricsOverview öffnen
    2. Eine Metrik ändern (z.B. von Volume auf 1RM)
    3. Zu einem Training navigieren und den Metrik-Vergleich öffnen
    4. Prüfen dass die gewählte Metrik dort im gleichen Slot ausgewählt ist

evidenceRequired:
  - Maestro-Flow mit Screenshots für alle 4 Schritte des Acceptance-Flows.
  - Passing unit tests für Metrik-Auswahl und Persistierung.

constraints:
  - Dropdown als einfache Liste/Modal, keine neue Dependency.
  - State-Persistierung im bestehenden Redux-Store.

nonGoals:
  - Änderung der Metrik-Berechnungslogik.
  - Mehr als 3 Slots pro Section.
