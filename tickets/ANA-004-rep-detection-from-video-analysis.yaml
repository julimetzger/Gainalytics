id: ANA-004
status: ready
area: analyse
priority: medium
title: Detect reps from velocity zero-crossings + native bar-path overlay
source:
  - TODOS.md:31
description: >
  Die aktuelle Video-Analyse-Pipeline hat `repSegments` und `repMetrics` in
  `BarTrackingResult`, aber die native Analyse schreibt beide Arrays leer.
  Rep-Detection soll über Zero-Crossings der vertikalen Geschwindigkeit erfolgen.

  Der Bar-Path soll als native Canvas-Linie frame-synchron über dem Video
  gerendert werden — NICHT als JS-Overlay. Dafür wird die Zeichnung in den
  nativen VideoAnalysisPlayerView (Kotlin/Canvas) verlegt.

  ## Rep-Detection (Kotlin-seitig)
  Reps aus dem vertikalen Velocity-Signal erkennen. Ein Rep wird segmentiert
  von der Bewegung, mit dem Umkehrpunkt aus der Velocity-Änderung / Zero-Crossing.
  Bestehende `RepSegment` und `RepMetric` Modelle nutzen (startMs, bottomMs,
  endMs, repTimeMs, average concentric speed).

  ## Nativer Bar-Path Overlay (Kotlin Canvas)
  VideoAnalysisPlayerView.java bekommt eine Canvas-Draw-Methode (dispatchDraw
  Override), die den Bar-Path als Linie über das Video zeichnet. Die Zeichnung
  erfolgt im selben Render-Cycle wie das Video-Frame — null Delay.

  - Aktive Rep Trail: Die primary-farbene Linie wird LIVE mit der Bar
    mitgezeichnet — wie eine Spur. Bei Rep-Start ist nur ein Punkt an der
    aktuellen Bar-Position sichtbar. Mit jedem Frame wächst die Linie und
    folgt der Bar-Bewegung. Die Spur bleibt für die Dauer der Rep bestehen.
    Sobald die Rep endet, wird die Spur entfernt (Canvas gecleart) und die
    nächste Rep startet wieder mit einem einzelnen Punkt.
  - Hintergrund: Der gesamte Bar-Path bleibt als matte graue Linie permanent
    sichtbar — unabhängig vom aktiven Rep-Trail.
  - Props: Bar-Path-Punkte (x,y,tMs), Rep-Segmente, aktuelle Rep-Index und
    Primary-Farbe werden als React Native Props an den nativen View übergeben.
    Der native View mappt die Punkte auf die aktuelle Video-Frame-Größe.

  ## JS-seitige Metriken
  Rep-Anzahl und Dauer als Zusammenfassung unterhalb des Players anzeigen.
  Keine hardcoded Farben — alle Farben kommen als Props aus theme.colors.

