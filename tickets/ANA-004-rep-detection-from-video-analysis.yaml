  - orchestrator/AppStruktur/analyse/videoAnalysis.png
acceptanceCriteria:
  - >
    Real video analyses populate `repSegments` and `repMetrics` from the tracked
    bar path / vertical velocity signal when repetitions are detectable; the
    arrays are no longer always empty for native analysis results.
  - >
    Each detected rep records a start time, bottom time, end time, rep time,
    and average concentric speed using the existing `RepSegment` / `RepMetric`
    shape.
  - >
    Der Bar-Path wird als native Canvas-Linie frame-synchron über dem
    Video gerendert (dispatchDraw in VideoAnalysisPlayerView), ohne
    sichtbaren Delay zur Wiedergabe.
  - >
    Während einer aktiven Rep wird die primary-farbene Linie live mit der
    Bar mitgezeichnet (Trail-Effekt): bei Rep-Start nur ein Punkt, dann
    wächst die Linie frame-für-frame mit der Bar-Bewegung. Bei Rep-Ende
    wird der Trail entfernt. Der graue Hintergrund-Path bleibt permanent.
  - >
    Die Bar-Path-Punkte und Farben werden als React Native Props vom
    JS-Layer an den nativen View übergeben.
  - >
    `VideoAnalysisDetail` shows the detected reps in the summary as values for
    rep time and average concentric speed per rep.
  - >
    If no reliable reps are detected, the analysis screen still renders
    normally, shows no rep highlight, and degrades gracefully without a crash.
  - >
    Automated tests cover rep segmentation / metric calculation and at least one
    UI rendering path for the rep summary.
  - >
    Keine hardcoded Farb-Literals — alle Farben nutzen theme.colors Props.
evidenceRequired:
  - Screenshot of the analysis summary showing detected rep times and average speeds.
  - >
    Screenshot WÄHREND einer aktiven Rep, wo die primary-farbene Kurve
    frame-synchron über dem Video liegt und die graue Hintergrund-Linie
    sichtbar ist.
  - Focused automated test log proving rep detection and metric calculation.
constraints:
  - Native Zeichnung in VideoAnalysisPlayerView.java (Canvas/Paint API).
  - Kein JS-Overlay für den beweglichen Bar-Path — nur native Canvas.
  - Reuse the existing `repSegments` and `repMetrics` fields in `BarTrackingResult`;
    do not introduce a parallel rep result model.
  - Derive reps from the tracked motion / velocity signal of the native
    analysis result, not from a fixed-duration placeholder estimate.
  - Keep the existing playback time, scrubber, and speed chart behavior intact.
  - Bestehende theme.colors Tokens nutzen, keine neuen Theme-Einträge.
nonGoals:
  - JS-basierte Animated/Reanimated Overlays für den Bar-Path.
  - Adding estimated 1RM or strength recommendations from detected reps.
  - Replacing the existing chart library or playback implementation.
  - Exporting rep metrics outside the current analysis detail screen.
