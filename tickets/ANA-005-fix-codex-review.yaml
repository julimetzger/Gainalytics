id: ANA-005-fix
status: ready
area: analyse
priority: high
title: Fix Codex review findings for async video analysis (PR #23)
source:
  - "https://github.com/julimetzger/Gainalytics/pull/23"
description: >
  Three issues were identified by Codex review on PR #23:

  1. **Notification tap from background (P1):** The background handler for
  `video_analysis_complete` does nothing, so tapping the notification while the
  app is in the background or terminated loses the deep-link. Use
  `getInitialNotification()` on app startup to handle the cold-start path and
  properly handle the background event callback.

  2. **Missing notification permission (P1):** Both completion and failure
  notifications are posted without calling `notifee.requestPermission()` first.
  On Android 13+ this causes silent non-delivery for users who never granted
  POST_NOTIFICATIONS. Request permission before posting, or at the start of the
  analysis flow.

  3. **Hardcoded video duration (P2):** `estimatedVideoDurationMs = 6000` is
  hardcoded instead of reading the actual video duration from file metadata.
  This makes progress estimates and the learned
  `lastAnalysisSecondsPerVideoSecond` rate systematically wrong. Read the real
  duration from the native module or video metadata.
components:
  - App.tsx
  - app/utils/videoAnalysisNotification.ts
  - app/utils/video-analysis-import.ts
  - android/app/src/main/java/com/powerliftingworkoutplanner/VideoAnalysisModule.java
acceptanceCriteria:
  - >
    Tapping the completion notification while the app is in the background or
    terminated opens the app and navigates to the finished VideoAnalysisDetail.
  - >
    `notifee.requestPermission()` is called before any notification is posted
    by the video analysis flow. If denied, the analysis still completes normally.
  - >
    The progress estimation uses the actual video duration from file metadata
    instead of a hardcoded 6s value. Falls back to 1:1 ratio if duration cannot
    be determined.
  - >
    Automated tests cover notification permission, initial notification handling,
    and duration-based progress calculation.
evidenceRequired:
  - Emulator evidence of notification tap navigating to analysis from background.
  - Passing test log for permission, tap handling, and progress calculation.
constraints:
  - Use @notifee getInitialNotification() for the cold-start path.
  - Do not request permission at app startup — only when analysis is used.
  - Reuse existing native module methods for video duration if possible.
nonGoals:
  - Adding a custom permission rationale dialog.
  - Frame-level progress tracking during analysis.
