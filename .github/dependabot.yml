# Weekly, grouped dependency updates.
#
# patch-package: patches/ contains patches for exact package versions
# (react-native-document-picker, react-native-draggable-flatlist, react-native-modal,
# sharingan-rn-modal-dropdown). `npm ci` runs `patch-package` in postinstall and FAILS when a
# patched package is bumped and the patch no longer applies. Those packages are therefore kept
# out of the groups below so each bump arrives as its own PR. For such a PR: install it locally,
# re-apply the change, run `npx patch-package <name>`, delete the old patch file, and commit the
# new one to the Dependabot branch (or drop the patch if upstream fixed the issue).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    ignore:
      # react-native and its tightly coupled packages are upgraded manually
      # (React Native Upgrade Helper), never by a blind version bump.
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@react-native/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@react-native-community/cli*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      # react must equal the renderer bundled in react-native exactly (RN 0.84.1 ships
      # 19.2.3); any other version, patches included, fails with "Incompatible React
      # versions". Bump it together with react-native.
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-dom
        update-types: [version-update:semver-major, version-update:semver-minor]
      # reanimated/worklets minors follow React Native releases (see their
      # compatibility.json): reanimated 4.7 + worklets 0.13 need RN >= 0.86, 4.3.x + 0.8.x
      # fit RN 0.84. Only patches come automatically; minors with the RN upgrade.
      - dependency-name: react-native-reanimated
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-worklets
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Toolchain majors that the React Native 0.84 stack cannot take yet (upgrade together with RN):
      # - Babel 8: @react-native/babel-preset is Babel 7; @babel/runtime 8 helpers with Babel 7
      #   transforms broke the app at runtime (nightly 2026-10-29 after #658).
      # - ESLint 10: @react-native/eslint-config supports ESLint ^8 || ^9 only; its plugins
      #   (@babel/eslint-parser 7, eslint-plugin-react, eslint-comments) crash on 10 (#632).
      # - TypeScript 7: typescript-eslint 8.x refuses TS 7 (#635).
      - dependency-name: '@babel/*'
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - react-native-document-picker
          - react-native-draggable-flatlist
          - react-native-modal
          - sharingan-rn-modal-dropdown
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - react-native-document-picker
          - react-native-draggable-flatlist
          - react-native-modal
          - sharingan-rn-modal-dropdown

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
