appId: com.powerliftingworkoutplanner
name: agent-emulator helper - save the key typed by tool.sh set-ai-key and check the app saved it
---
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'settings-save-api-key-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-save-api-key-button'
# handleSaveApiKey toasts which branch ran (3 s); this proves the field held exactly what we meant.
- extendedWaitUntil:
    visible: 'API key saved'
    timeout: 5000
