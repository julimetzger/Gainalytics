appId: com.powerliftingworkoutplanner
name: agent-emulator helper - save the emptied field and check the app removed the key
---
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'settings-save-api-key-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-save-api-key-button'
# handleSaveApiKey toasts which branch ran (3 s); this proves the field held exactly what we meant.
- extendedWaitUntil:
    visible: 'API key removed'
    timeout: 5000
