name: Bug report
description: Something in Gainalytics does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security vulnerabilities here; see SECURITY.md.
        Remove personal data (names, body weight, AI chat contents, API keys) from logs and screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Training tab
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings screen or the GitHub release you installed (e.g. 0.182)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 15
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub release
        - Zapstore
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. `adb logcat` output or screenshots help a lot.
      render: text
