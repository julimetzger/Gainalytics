name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN is read-only for every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The existing code base still has known ESLint/tsc errors. Both checks run in full, and
      # scripts/ci/check-baseline.js fails the job as soon as any file gains an error compared
      # to the committed baseline (scripts/ci/*-baseline.json). Fixing errors only ever shrinks
      # the baseline; see the header of check-baseline.js.
      - name: ESLint
        run: |
          npx eslint . -f json -o "$RUNNER_TEMP/eslint.json" || true
          node scripts/ci/check-baseline.js eslint "$RUNNER_TEMP/eslint.json"
      - name: Typecheck (tsc)
        if: ${{ !cancelled() }}
        run: |
          npm run typecheck -- --pretty false > "$RUNNER_TEMP/tsc.txt" || true
          node scripts/ci/check-baseline.js tsc "$RUNNER_TEMP/tsc.txt"

  test:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --silent

  assemble-debug:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      # Same autolinking input the release scripts generate (see android/settings.gradle).
      - run: npx react-native config > android/autolinking.source.json
      # One ABI is enough to prove the native + JS build; release.yml builds all four.
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace
