name: Release

# Builds the signed release APK + AAB and publishes them as a GitHub Release.
#
# Two ways to release version x.y (no version commit needed; the version comes from the tag):
#   1. Push a tag such as `0.183` (`git tag 0.183 && git push origin 0.183`).
#   2. Actions -> Release -> Run workflow on `master` with `version: 0.183`. The `tag` job creates
#      the tag on the selected commit and starts this workflow again on that tag.
# A run on a tag builds with versionName = tag name (versionCode stays as in build.gradle) and
# publishes the release.
#
# Required secrets in the GitHub environment `release` (Settings -> Environments -> release), which
# should only allow version tags (deployment tag rule `[0-9]*`). Only runs on a tag ref use that
# environment, so no branch run, PR or other workflow can read the signing key:
#   ANDROID_RELEASE_KEYSTORE_BASE64  base64 of the existing release keystore (`base64 -w0 <file>`)
#   ANDROID_RELEASE_PASSWORD         keystore (store) password
# Optional:
#   ANDROID_RELEASE_KEY_ALIAS        key alias (default: the alias used locally, see build.gradle)
#   ANDROID_RELEASE_KEY_PASSWORD     key password (default: ANDROID_RELEASE_PASSWORD)
# Optional repository/environment variable:
#   ANDROID_RELEASE_CERT_SHA256      expected SHA-256 digest of the signing certificate
#                                    (`apksigner verify --print-certs`). If set, the job fails when
#                                    the APK is signed with any other key. Zapstore pins that
#                                    certificate, so the key must never change.
#
# Dry run: Run workflow on a branch with an empty `version` builds and signs with a throw-away
# keystore generated inside the job and never creates a release.
#
# Zapstore: after the GitHub Release is published, the `zapstore` job publishes its APK to Zapstore
# with zsp and zapstore.yaml. It needs the secret ZAPSTORE_SIGN_WITH (NIP-46 bunker URL, or the nsec
# of a dedicated publisher key) and, for a bunker, ZAPSTORE_BUNKER_CLIENT_KEY in the environment
# `release`; without ZAPSTORE_SIGN_WITH it is skipped with a notice. To publish an existing release
# again (or for the first time), Run workflow on the tag with `zapstore_only` checked.
# See docs/release.md.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.183 (creates the tag on the selected branch and publishes the release). Empty = dry run with a throw-away keystore.'
        type: string
        default: ''
      zapstore_only:
        description: 'Only publish the existing GitHub Release of the selected tag to Zapstore (Use workflow from -> Tags -> the version; no build). Already published versions are skipped.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag and start release
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && (inputs.version != '' || inputs.zapstore_only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag
      actions: write # start this workflow on the new tag
    steps:
      - name: Create tag ${{ inputs.version }} and dispatch the release run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ZAPSTORE_ONLY: ${{ inputs.zapstore_only }}
        run: |
          set -euo pipefail
          if [ "$ZAPSTORE_ONLY" = "true" ]; then
            echo "::error::zapstore_only publishes an existing release: start the workflow on its tag (Use workflow from -> Tags -> the version)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version must look like 0.183 or 1.2.3 (got '$VERSION')"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are only cut from $DEFAULT_BRANCH (selected: $GITHUB_REF_NAME)"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag $VERSION already exists. To rebuild it, run this workflow on the tag itself (Use workflow from -> Tags -> $VERSION)."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" --silent
          echo "Created tag $VERSION at $GITHUB_SHA"
          # Tags created with GITHUB_TOKEN do not trigger the push event, so start the release run explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
          echo "::notice::Release run for $VERSION started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml"

  build:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A dispatch with a version on a branch only creates the tag (job `tag`); the build runs on the tag.
    # zapstore_only skips the build and only runs the `zapstore` job for the existing release.
    if: (github.ref_type == 'tag' || inputs.version == '') && !inputs.zapstore_only
    # The real signing secrets live in the `release` environment; only runs on a tag ref enter it.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      # Throw-away key for dry runs on a branch; tags always use the real key from the secrets.
      USE_TEST_KEYSTORE: ${{ github.ref_type != 'tag' }}
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release build compiles native code for all four ABIs (reactNativeArchitectures in
      # gradle.properties) and runs lint on the library AARs; that overflows the runner's default
      # free space ("No space left on device" in :react-native-reanimated:bundleReleaseLocalLintAar).
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda /opt/az /opt/microsoft || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Determine mode
        id: mode
        run: |
          set -euo pipefail
          gradle_file=android/app/build.gradle
          repo_version=$(sed -nE 's/^\s*versionName "([^"]+)".*/\1/p' "$gradle_file")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::Tag $version is not a version tag (expected e.g. 0.183)"
              exit 1
            fi
            # The tag is the version: build with it without needing a version commit.
            sed -i -E "s/^(\s*versionName )\"[^\"]+\"/\1\"$version\"/" "$gradle_file"
            grep -qE "^\s*versionName \"$version\"" "$gradle_file"
            if [ "$repo_version" != "$version" ]; then
              echo "::notice::Building $version (build.gradle on this commit says $repo_version)"
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dry run, versionName=$repo_version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          grep -nE '^\s*version(Code|Name) ' "$gradle_file"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Never write a cache from a job that has the signing key on disk.
          cache-read-only: true

      - run: npm ci
      # Same autolinking input the release scripts generate (see android/settings.gradle).
      - run: npx react-native config > android/autolinking.source.json

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          if [ "$USE_TEST_KEYSTORE" = "true" ]; then
            echo "::notice::Dry run: signing with a throw-away keystore generated in this job."
            STORE_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$STORE_PASSWORD"
            KEY_ALIAS=ci-test
            KEY_PASSWORD=$STORE_PASSWORD
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Gainalytics CI test key" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" > /dev/null 2>&1
          else
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
              echo "::error::Secrets ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_PASSWORD are required (see docs/release.md)."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          fi
          chmod 600 "$keystore"
          {
            echo "ANDROID_RELEASE_STORE_FILE=$keystore"
            echo "ANDROID_RELEASE_PASSWORD=$STORE_PASSWORD"
            if [ -n "${KEY_ALIAS:-}" ]; then echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"; fi
            if [ -n "${KEY_PASSWORD:-}" ]; then echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"; fi
          } >> "$GITHUB_ENV"

      - name: assembleRelease + bundleRelease
        working-directory: android
        env:
          ENTRY_FILE: index.tsx
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$RUNNER_TEMP/apk-certs.txt"
          jarsigner -verify "$aab" > /dev/null && echo "AAB signature OK"
          norm() { tr -d ': \r' | tr 'A-F' 'a-f'; }
          # apksigner labels signers differently depending on scheme/version ("Signer #1 ...",
          # "Signer (minSdkVersion=...) ..."), so take every certificate digest it prints.
          apk_digests=$(grep -oiE 'certificate SHA-256 digest: [0-9a-f:]+' "$RUNNER_TEMP/apk-certs.txt" \
            | sed -E 's/.*digest: //' | norm | sort -u || true)
          # The AAB is JAR-signed with the same key; keytool reads that certificate directly.
          aab_digest=$(keytool -printcert -jarfile "$aab" 2>/dev/null \
            | sed -nE 's/^[[:space:]]*SHA256: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | norm || true)
          echo "APK signing certificate SHA-256: ${apk_digests:-<none found>}"
          echo "AAB signing certificate SHA-256: ${aab_digest:-<none found>}"
          if [ -z "$apk_digests" ] || [ -z "$aab_digest" ]; then
            echo "::error::Could not read the signing certificate digest (apksigner output: $(head -c 600 "$RUNNER_TEMP/apk-certs.txt" | tr '\n' ' '))"
            exit 1
          fi
          if [ "$(printf '%s\n' "$apk_digests" | wc -l)" -ne 1 ] || [ "$apk_digests" != "$aab_digest" ]; then
            echo "::error::APK and AAB are not signed with exactly one, identical certificate (APK: $(echo $apk_digests), AAB: $aab_digest)."
            exit 1
          fi
          if [ "$USE_TEST_KEYSTORE" != "true" ] && [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | norm)
            if [ "$apk_digests" != "$expected" ]; then
              echo "::error::Signed with an unexpected certificate ($apk_digests, expected $expected). The release key must never change."
              exit 1
            fi
            echo "Certificate matches ANDROID_RELEASE_CERT_SHA256."
          fi
          (cd "$(dirname "$apk")" && sha256sum app-release.apk) > SHA256SUMS
          (cd "$(dirname "$aab")" && sha256sum app-release.aab) >> SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.USE_TEST_KEYSTORE == 'true' && 'release-test-signed' || 'release' }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS
          retention-days: ${{ env.USE_TEST_KEYSTORE == 'true' && 3 || 14 }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gainalytics $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            SHA256SUMS

  zapstore:
    name: Publish to Zapstore
    needs: publish
    # After the GitHub Release was published, or alone for an existing release (Run workflow on the
    # tag with zapstore_only). Re-running is safe: zsp exits 0 without publishing when this version is
    # already on the relay for the signing key.
    if: >-
      !cancelled() && github.ref_type == 'tag' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.zapstore_only && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing secrets live in the tag-restricted `release` environment, like the APK signing key.
    environment: release
    permissions:
      contents: read
    env:
      # zsp, the official Zapstore publisher CLI (https://github.com/zapstore/zsp). No checksum file is
      # published, so the binary's SHA-256 is pinned here (same as the release asset's GitHub digest).
      ZSP_VERSION: '0.4.17'
      ZSP_SHA256: 3f241da6a5dc7a85fe851d3b42b77790b651bd36c7029382a701262bda832d20
    steps:
      - name: Check Zapstore signer
        id: signer
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_WITH:-}" ]; then
            echo "::notice::Zapstore publishing skipped: secret ZAPSTORE_SIGN_WITH is not set in the environment 'release' (see docs/release.md, section Zapstore)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never print the value; only its kind.
          case "$SIGN_WITH" in
            bunker://*)
              echo "Signer: NIP-46 bunker"
              if [ -z "${CLIENT_KEY:-}" ]; then
                echo "::warning::ZAPSTORE_BUNKER_CLIENT_KEY is not set: zsp uses a new NIP-46 client key on every run, so the bunker has to approve a new connection each time (see docs/release.md)."
              elif ! [[ "$CLIENT_KEY" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::ZAPSTORE_BUNKER_CLIENT_KEY must be 64 lowercase hex characters (openssl rand -hex 32)."
                exit 1
              fi
              ;;
            nsec1*)
              echo "Signer: private key (nsec)"
              ;;
            *)
              if ! [[ "$SIGN_WITH" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "::error::ZAPSTORE_SIGN_WITH must be a bunker:// URL, an nsec1... key or a 64-character hex key."
                exit 1
              fi
              echo "Signer: private key (hex)"
              ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # zapstore.yaml and the icon come from the default branch: the relay verifies the publisher
      # against that file, and older tags may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signer.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install zsp ${{ env.ZSP_VERSION }}
        if: steps.signer.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zsp-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/zsp" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "$ZSP_SHA256  $dir/zsp" | sha256sum -c -
          chmod +x "$dir/zsp"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/zsp" --version | tail -n1

      - name: Prepare config for ${{ github.ref_name }}
        if: steps.signer.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag $version is not a version tag (expected e.g. 0.183)"
            exit 1
          fi
          if grep -qE '^release_filter:' zapstore.yaml; then
            echo "::error::zapstore.yaml must not set release_filter; CI pins the release to the tag."
            exit 1
          fi
          if ! grep -qE '^pubkey:[[:space:]]*["'"'"']?npub1' zapstore.yaml; then
            echo "::warning::zapstore.yaml has no pubkey (npub). The Zapstore relay whitelists a new publisher only via that field (see docs/release.md)."
          fi
          # zsp otherwise takes the newest GitHub Release; pin it to this tag. The copy stays in the
          # repository root so the relative icon path still resolves.
          cp zapstore.yaml .zapstore-release.yaml
          printf "\n# Added by CI: publish exactly this release.\nrelease_filter: '^%s\$'\n" "${version//./\\.}" >> .zapstore-release.yaml
          tail -n2 .zapstore-release.yaml

      - name: Check release asset
        if: steps.signer.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Read-only: finds the release, downloads and parses the APK (arm64-v8a, package, certificate).
        run: zsp publish --check --no-color .zapstore-release.yaml

      - name: Publish to Zapstore
        if: steps.signer.outputs.enabled == 'true'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/zsp-config"
          if [[ "$SIGN_WITH" == bunker://* ]] && [ -n "${CLIENT_KEY:-}" ]; then
            # zsp keeps its NIP-46 client key per bunker in $XDG_CONFIG_HOME/zsp/bunker-keys/<bunker pubkey>.key.
            # Installing the paired key lets the bunker recognize CI as the same, already approved client.
            target="${SIGN_WITH#bunker://}"
            target="${target%%[/?]*}"
            if ! [[ "$target" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::ZAPSTORE_SIGN_WITH is not a valid bunker URL (expected bunker://<64 hex pubkey>?relay=...)."
              exit 1
            fi
            (umask 077 && mkdir -p "$XDG_CONFIG_HOME/zsp/bunker-keys" \
              && printf '%s\n' "$CLIENT_KEY" > "$XDG_CONFIG_HOME/zsp/bunker-keys/$target.key")
          fi
          # --quiet: no prompts. Exits 0 without publishing if this version is already on the relay.
          # --skip-metadata: name, description, icon etc. come from zapstore.yaml.
          zsp publish --quiet --skip-metadata --no-color .zapstore-release.yaml

      - name: Remove zsp client key
        if: always() && steps.signer.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/zsp-config"

      # Non-fatal: warns when the APK signing certificate is not (or no longer) linked to the
      # publisher's Nostr identity. The link (NIP-C1) expires, by default after one year.
      - name: Check certificate link
        if: steps.signer.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          npub=$(sed -nE 's/^pubkey:[[:space:]]*["'"'"']?(npub1[0-9a-z]+).*/\1/p' zapstore.yaml | head -n1)
          if [ -z "$npub" ]; then
            echo "No pubkey in zapstore.yaml, nothing to verify."
            exit 0
          fi
          dir="$RUNNER_TEMP/zsp-verify"
          if ! gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir "$dir" --clobber; then
            echo "::warning::Could not download app-release.apk to verify the certificate link."
            exit 0
          fi
          printf '%s\n' "$npub" | zsp identity --verify "$dir/app-release.apk" --no-color > "$dir/verify.txt" 2>&1
          status=$?
          grep -E 'Cert hash|Expiry|Status|Signature|identity proof' "$dir/verify.txt" || true
          if [ "$status" -ne 0 ] || ! grep -q 'fully verified' "$dir/verify.txt"; then
            echo "::warning::The APK signing certificate is not linked to $npub, or the link expired. Zapstore then shows the app as unverified. Run zsp identity --link-key once more (see docs/release.md)."
          fi
          exit 0
