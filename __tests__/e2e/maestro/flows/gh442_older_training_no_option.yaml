appId: com.powerliftingworkoutplanner
---
# GH-442 — an OLDER planned training does not offer "Clear planned training".
#
# Prerequisite: baseline.gains freshly imported. In plan "Push pull upper lower" the
# micro 69 "Push" training is still PLANNED, but a newer training (micro 70 "Pull")
# was planned and finished after it. The option is only for the most recently
# planned training, so this menu must show the familiar items without it.
- runFlow: gh466_goto_push.yaml
- assertVisible: 'Micro 69'
- assertVisible: ' Push'
- tapOn:
    id: 'subtab-plan'
- waitForAnimationToEnd
- tapOn:
    id: 'header-overflow-button'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit-plan'
    timeout: 10000
- waitForAnimationToEnd
# The plan-view menu of a PLANNED training — unchanged — but without the new option.
- assertVisible: 'Delete this training'
- assertNotVisible:
    id: 'overflow-clear-plan'
- assertNotVisible: 'Clear planned training'
- takeScreenshot: gh442_08_older_planned_training_no_clear_option
