appId: com.powerliftingworkoutplanner
---
# GH-542: editing a FINISHED training must show only ONE date(time) picker
# (the "Training Times" card), not an extra date pill from ExecuteTraining.
# Prerequisite: baseline.gains already imported (00_import_baseline.yaml).
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 30000
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit'
    timeout: 5000
- tapOn:
    id: 'overflow-edit'
- extendedWaitUntil:
    visible: 'Training Times'
    timeout: 30000
- assertVisible: 'Training Times'
# The Training Times button carries the full "start - end" range ...
- assertVisible: 'Sun, 03/08/25, 17:27 - Sun, 03/08/25, 19:22'
# ... and the standalone date pill (text is a full-string regex) is gone.
- assertNotVisible: 'Sun, 03/08/25'
