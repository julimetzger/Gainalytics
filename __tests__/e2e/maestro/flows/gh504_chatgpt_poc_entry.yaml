appId: com.powerliftingworkoutplanner
name: GH-504 ChatGPT PoC entry is hidden, Claude path unchanged
---
# Expects the baseline fixture to be imported (see gh504_suite.yaml).
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"

# Claude API-key path is still the only AI option in normal Settings.
- extendedWaitUntil:
    visible:
      id: "settings-section-ai"
    timeout: 15000
- tapOn:
    text: "AI Configuration"
- scrollUntilVisible:
    element:
      id: "settings-anthropic-api-key-input"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "settings-anthropic-api-key-input"
- assertVisible:
    text: "Save Key"
- assertNotVisible:
    text: ".*ChatGPT.*"
# Collapse again — the expanded prompt editors swallow scroll gestures.
- scrollUntilVisible:
    element:
      text: "AI Configuration"
    direction: UP
    timeout: 15000
- tapOn:
    text: "AI Configuration"
- assertNotVisible:
    id: "settings-anthropic-api-key-input"

# No ChatGPT option anywhere in the normal Settings screen.
- scrollUntilVisible:
    element:
      id: "settings-app-version"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- assertNotVisible:
    text: ".*ChatGPT.*"

# A normal tap on the version does nothing.
- tapOn:
    id: "settings-app-version"
- assertNotVisible:
    id: "chatgpt-poc-screen"
- assertVisible:
    id: "settings-app-version"

# Hidden developer entry: long-press on the version opens the PoC screen.
- longPressOn:
    id: "settings-app-version"
- extendedWaitUntil:
    visible:
      id: "chatgpt-poc-screen"
    timeout: 15000
- assertVisible:
    id: "chatgpt-poc-status"
    text: "Not connected"
- assertVisible:
    text: "Continue with ChatGPT"

# Starting sign-in opens OpenAI's authorize page in the browser and arms the
# loopback listener; back in the app the screen reports the waiting state.
- tapOn:
    text: "Continue with ChatGPT"
- extendedWaitUntil:
    visible:
      text: ".*(auth\\.openai\\.com|Welcome back|Stay signed out|No thanks).*"
    timeout: 30000
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "chatgpt-poc-status"
      text: "Waiting for sign-in in the browser…"
    timeout: 15000
- assertVisible:
    id: "chatgpt-poc-debug"
    text: "listener 127\\.0\\.0\\.1:\\d+ · state=.+"
