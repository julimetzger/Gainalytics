appId: com.powerliftingworkoutplanner
---
# GH-542 (PR #556 review, P1) — edit mode has no date pill any more, so an
# exercise ADDED while editing an older FINISHED training must be recorded on that
# training's date, not on today.
#
# Flow: create "GH542 Added" (id 85: the baseline's highest exercise id is 84) →
# open the FINISHED training behind plan-meta-1 (Sun, 03/08/25, 17:27 - 19:22) →
# Edit training → add the new exercise → "Add Workout" on the exercise before it
# → log one set for the new one → Add Workout → the exercise's History tab must
# list that set under "Sun, 03/08/25".
# Before the fix the workout started at Date.now(), i.e. it showed up under today.
#
# Prerequisite: baseline.gains freshly imported (00_import_baseline.yaml).
- launchApp:
    stopApp: false
# The baseline import leaves the app on the Settings tab.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000

# ---- 1. create the exercise ----
- tapOn:
    point: '37%,92%'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000
- tapOn:
    id: 'exercise-fab-new'
- tapOn:
    id: 'edit-exercise-name'
- inputText: 'GH542 Added'
- tapOn:
    id: 'edit-exercise-save'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000

# ---- 2. edit the older finished training ----
- tapOn:
    point: '12%,92%'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 30000
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit'
    timeout: 5000
- tapOn:
    id: 'overflow-edit'
- extendedWaitUntil:
    visible: 'Training Times'
    timeout: 30000
- assertVisible: 'Sun, 03/08/25, 17:27 - Sun, 03/08/25, 19:22'

# ---- 3. add the new exercise to it ----
- repeat:
    times: 6
    while:
      notVisible:
        id: 'training-add-exercise-box'
    commands:
      - swipe:
          start: '90%,20%'
          end: '10%,20%'
          duration: 300
- tapOn:
    id: 'training-add-exercise-box'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'GH542'
- extendedWaitUntil:
    visible: 'GH542 Added'
    timeout: 20000
- tapOn:
    text: 'GH542 Added'
    below:
      id: 'search-bar'
- waitForAnimationToEnd:
    timeout: 3000
# Re-tap only if the first tap was eaten by the keyboard (see gh486).
- runFlow:
    when:
      visible:
        text: 'GH542 Added'
        below:
          id: 'search-bar'
    commands:
      - tapOn:
          text: 'GH542 Added'
          below:
            id: 'search-bar'
          optional: true
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 5000

# ---- 4. reach the new exercise the way a user does: "Add Workout" on the one before ----
# "Add Workout" moves on to the next exercise and REMOUNTS the edit pane
# (TrainingsPlanNode key), so the new exercise starts without any carried-over date.
# (Picking it in the strip keeps the pane mounted and used to hide the bug: the
# date of the previously shown exercise leaked over.) The exercise before it is
# "Rear delt row neutral grip" (34), which has no logged sets in this training —
# log one so its "Add Workout" is enabled.
- repeat:
    times: 6
    while:
      notVisible:
        id: 'training-exercise-85'
    commands:
      - swipe:
          start: '90%,20%'
          end: '10%,20%'
          duration: 300
- tapOn:
    id: 'training-exercise-34'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'add-workout-set-reps-input'
    index: 0
- inputText: '10'
- tapOn:
    id: 'add-workout-set-weight-input'
    index: 0
- inputText: '20'
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-logged-1'
    timeout: 20000
# Not hideKeyboard: without an open keyboard it presses Back and leaves the screen.
- tapOn:
    id: 'add-workout-set-number'
- tapOn:
    id: 'add-workout-finalize-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-number'
      text: ' Set 1'
    timeout: 20000
- assertNotVisible:
    id: 'add-workout-set-logged-1'

# ---- 5. log one set for the new exercise ----
- tapOn:
    id: 'add-workout-set-reps-input'
    index: 0
- inputText: '7'
- tapOn:
    id: 'add-workout-set-weight-input'
    index: 0
- inputText: '42'
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-logged-1'
    timeout: 20000
- takeScreenshot: gh542_01_set_logged_in_edit_mode
- tapOn:
    id: 'add-workout-set-number'
# Finalizes it; it is the last exercise, so this also leaves the edit mode.
- tapOn:
    id: 'add-workout-finalize-button'
- extendedWaitUntil:
    notVisible: 'Training Times'
    timeout: 20000

# ---- 6. the exercise history lists the set under the training date ----
- pressKey: Back
- runFlow:
    when:
      notVisible:
        id: 'training-home-screen'
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- tapOn:
    point: '37%,92%'
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: 'exercise-searchbar'
- eraseText: 30
- inputText: 'GH542'
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'exercise-row-85'
    timeout: 30000
- tapOn:
    id: 'exercise-row-85'
- extendedWaitUntil:
    visible:
      id: 'exercise-tab-history'
    timeout: 20000
- tapOn:
    id: 'exercise-tab-history'
- extendedWaitUntil:
    visible: '.*03/08/25.*'
    timeout: 20000
# The only workout of this exercise sits under the training's day (en-GB format,
# full-string regex) — a workout started "now" would be listed under today.
- assertVisible: 'Sun, 03/08/25'
- takeScreenshot: gh542_02_history_on_training_date
