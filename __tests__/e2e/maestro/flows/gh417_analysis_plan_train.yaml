appId: com.powerliftingworkoutplanner
---
# GH-417 — the analysis view's Plan | Train toggle.
#
# GH-436 rescoped the Plan position to the single training (the micro-wide plan
# now lives in the Overview), so the planned totals below are the training's,
# not the micro's. gh436_analysis_training_scope.yaml covers the new Overview
# position; this flow keeps guarding the toggle itself and the drawer.
#
# Precondition: baseline fixture imported (plan 5 "Push pull", Meso 1). Micro 1
# training 1 "Push squat" is FINISHED, so the screen opens on the Analysis
# sub-tab with the toggle in its start position, Train.
#
# Fixture values asserted below (all deterministic for this .gains file):
#   Micro 1 · training 1 · Train → 14 logged sets, duration 03:09:04
#   Micro 1 · training 1 · Plan  → 1 planned set
#   Micro 2 · training 1 · Plan  → 14 planned sets
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- assertVisible: 'Micro 1'

# --- AC1: the toggle is visible and starts on Train -------------------------
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- assertVisible:
    id: 'analysis-data-plan'
- assertVisible:
    id: 'analysis-data-train'

# --- AC3 + AC4: Train shows the unchanged actual values and their set total --
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 14 \(done\)'
- assertVisible:
    id: 'trainings-overview-duration-value'
    text: '03:09:04'
- assertNotVisible:
    id: 'training-plan-overview'
- takeScreenshot: gh417_analysis_train

# --- AC2 + AC4: Plan shows this training's planned overview and total --------
- tapOn:
    id: 'analysis-data-plan'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 1 \(planned\)'
# the Train values must be gone
- assertNotVisible:
    id: 'trainings-overview'
- takeScreenshot: gh417_analysis_plan

# --- AC7: switching sub-tabs does not break the choice -----------------------
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible:
      id: 'subtab-analysis'
    timeout: 20000
- assertNotVisible:
    id: 'analysis-data-toggle'
- tapOn:
    id: 'subtab-analysis'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 1 \(planned\)'

# --- AC5: the two drawer entries are gone ------------------------------------
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- assertVisible: 'Trainings:'
- assertVisible: 'Overview'
- assertVisible: 'History'
- assertNotVisible: 'Enable Planning Mode'
- assertNotVisible: 'Show muscle map'
- assertNotVisible: 'Hide muscle map'
- assertNotVisible:
    id: 'muscle-map-toggle'
- takeScreenshot: gh417_drawer_without_switches

# --- AC7: switching micros does not break the choice either ------------------
- tapOn: 'Micro 2'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- assertVisible: 'Micro 2'
# the planned total follows the training in the new micro
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 14 \(planned\)'
- takeScreenshot: gh417_plan_after_micro_change

# --- AC3 + AC8: back to Train, still the actual values, still scrollable ------
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: \d+ \(done\)'
- assertNotVisible: 'THIS MICRO \(PLANNED\)'
- scrollUntilVisible:
    element:
      id: 'analysis-section-metrics'
    direction: DOWN
    timeout: 40000
- assertVisible:
    id: 'analysis-section-metrics'
- takeScreenshot: gh417_analysis_train_after_micro_change
