appId: com.powerliftingworkoutplanner
---
# GH-417 — the analysis view's Plan | Train toggle.
#
# Precondition: baseline fixture imported (plan 5 "Push pull", Meso 1). Micro 1
# training 1 "Push squat" is FINISHED, so the screen opens on the Analysis
# sub-tab with the toggle in its start position, Train.
#
# Fixture values asserted below (all deterministic for this .gains file):
#   Micro 1 · Train  → 14 logged sets, duration 03:09:04
#   Micro 1 · Plan   → 45 planned sets, no previous micro to compare against,
#                      planned Back 12 sets, planned Chest 0.8 sets
#   Micro 2 · Plan   → 58 planned sets, compared against the Micro 1 plan
#                      (Back 10/12, Chest 3.8/0.8)
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- assertVisible: 'Micro 1'

# --- AC1: the toggle is visible and starts on Train -------------------------
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- assertVisible:
    id: 'analysis-data-plan'
- assertVisible:
    id: 'analysis-data-train'

# --- AC3 + AC4: Train shows the unchanged actual values and their set total --
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 14 \(done\)'
- assertVisible:
    id: 'trainings-overview-duration-value'
    text: '03:09:04'
- assertNotVisible:
    id: 'micro-plan-overview'
- takeScreenshot: gh417_analysis_train

# --- AC2 + AC4: Plan shows the micro's planned overview, muscle map, total ---
- tapOn:
    id: 'analysis-data-plan'
- extendedWaitUntil:
    visible:
      id: 'micro-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 45 \(planned\)'
- assertVisible:
    id: 'micro-muscle-map-card'
- assertVisible: 'THIS MICRO \(PLANNED\)'
# micro 1 is the first micro, so there is no earlier plan to compare against
- assertVisible:
    id: 'micro-muscle-map-compare-label'
    text: 'NO PREVIOUS PLAN'
# value assertions on the muscle map rows themselves
- assertVisible:
    id: 'muscle-row-BACK'
- assertVisible: '12'
- assertVisible: '0.8'
# the Train values must be gone
- assertNotVisible:
    id: 'trainings-overview'
- takeScreenshot: gh417_analysis_plan

# --- AC8: the view still scrolls in the Plan position (GH-414 regression) ----
- assertNotVisible: '5810.20'
- scrollUntilVisible:
    element:
      text: '5810.20'
    direction: DOWN
    timeout: 40000
- assertVisible: '5810.20'
- assertNotVisible:
    id: 'analysis-data-toggle'
- takeScreenshot: gh417_plan_scrolled
- scrollUntilVisible:
    element:
      id: 'analysis-data-toggle'
    direction: UP
    timeout: 40000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 45 \(planned\)'

# --- AC7: switching sub-tabs does not break the choice -----------------------
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible:
      id: 'subtab-analysis'
    timeout: 20000
- assertNotVisible:
    id: 'analysis-data-toggle'
- tapOn:
    id: 'subtab-analysis'
- extendedWaitUntil:
    visible:
      id: 'micro-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 45 \(planned\)'

# --- AC5: the two drawer entries are gone ------------------------------------
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- assertVisible: 'Trainings:'
- assertVisible: 'Overview'
- assertVisible: 'History'
- assertNotVisible: 'Enable Planning Mode'
- assertNotVisible: 'Show muscle map'
- assertNotVisible: 'Hide muscle map'
- assertNotVisible:
    id: 'muscle-map-toggle'
- takeScreenshot: gh417_drawer_without_switches

# --- AC7: switching micros does not break the choice either ------------------
- tapOn: 'Micro 2'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'micro-plan-overview'
    timeout: 30000
- assertVisible: 'Micro 2'
# the planned total follows the micro, and the muscle map now has a reference
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 58 \(planned\)'
- assertVisible:
    id: 'micro-muscle-map-compare-label'
    text: 'MICRO 1 PLAN'
- assertVisible: '10/12'
- assertVisible: '3.8/0.8'
- takeScreenshot: gh417_plan_after_micro_change

# --- AC3 + AC8: back to Train, still the actual values, still scrollable ------
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: \d+ \(done\)'
- assertNotVisible: 'THIS MICRO \(PLANNED\)'
- scrollUntilVisible:
    element:
      id: 'analysis-section-metrics'
    direction: DOWN
    timeout: 40000
- assertVisible:
    id: 'analysis-section-metrics'
- takeScreenshot: gh417_analysis_train_after_micro_change
