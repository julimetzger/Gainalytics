appId: com.powerliftingworkoutplanner
---
# F1 Start & Onboarding — T1.2: an existing user with data.
# Purpose: with a filled store (baseline import) a cold start goes straight to the data —
# no onboarding — and also covers the cold start with a large store. The reopened
# onboarding's other two routes lead into the existing flows: "Create an empty plan" opens
# the add-plan dialog (the new plan becomes current), "Import data" opens the Settings
# import, which here re-imports the baseline.
# Data basis: imports baseline.gains (must be in /sdcard/Download) at the start; ends with a
# fresh baseline import again (the plan created in between is gone).
# Merged from: gh497_existing_data_no_onboarding, gh497_empty_plan_and_import
#              (+ gh497_reopen_to_step3 inline).
- runFlow: 00_import_baseline.yaml

# --- 1) Cold relaunch with data: no onboarding --------------------------------
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 30000
# PRECONDITION: the baseline drives the dashboard.
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- assertNotVisible:
    id: 'onboarding-screen'
- assertNotVisible: 'Welcome to Gainalytics'

# --- 2) Reopen › "Create an empty plan" -> add-plan dialog ---------------------
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-show-onboarding-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-show-onboarding-button'
- extendedWaitUntil:
    visible:
      id: 'onboarding-step-welcome'
    timeout: 10000
- tapOn:
    id: 'onboarding-next'
- tapOn:
    id: 'onboarding-next'
- assertVisible:
    id: 'onboarding-step-indicator'
    text: 'Step 3 of 3'
- tapOn:
    id: 'onboarding-choice-empty'
- extendedWaitUntil:
    visible: 'Add New Training Plan'
    timeout: 10000
- assertNotVisible:
    id: 'onboarding-screen'
- assertVisible:
    id: 'plan-source-empty'
    checked: true
- assertVisible:
    id: 'plan-source-template'
    checked: false
- tapOn:
    id: '^plan-name-input$'
- inputText: 'My own plan'
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    notVisible: 'Add New Training Plan'
    timeout: 10000
# The baseline has plans 1, 3, 4, 5 -> the new plan gets id 6 and becomes the current plan.
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 20000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'My own plan'
- assertVisible:
    id: 'next-training-name'
    text: 'No training planned yet'
- scrollUntilVisible:
    element:
      id: '^plan-meta-6$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^plan-name-6$'
    text: 'My own plan'
- assertVisible:
    id: '^plan-meta-6$'
    text: 'Draft · no trainings yet'

# --- 3) Reopen › "Import data" -> Settings import (re-imports the baseline) -----
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-show-onboarding-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-show-onboarding-button'
- extendedWaitUntil:
    visible:
      id: 'onboarding-step-welcome'
    timeout: 10000
- tapOn:
    id: 'onboarding-next'
- tapOn:
    id: 'onboarding-next'
- assertVisible:
    id: 'onboarding-step-indicator'
    text: 'Step 3 of 3'
- tapOn:
    id: 'onboarding-choice-import'
- extendedWaitUntil:
    visible: 'Import full data from backup file\?'
    timeout: 10000
- assertNotVisible:
    id: 'onboarding-screen'
- tapOn:
    id: 'settings-import-confirm-button'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- waitForAnimationToEnd:
    timeout: 8000
# The SAF picker remembers its last folder — steer it to Downloads only when
# needed, via "Show roots" (an edge swipe is the system BACK gesture).
- extendedWaitUntil:
    visible: 'baseline.gains'
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: 'baseline.gains'
    commands:
      - tapOn: 'Show roots'
      - extendedWaitUntil:
          visible: 'Downloads'
          timeout: 15000
      - tapOn: 'Downloads'
      - waitForAnimationToEnd:
          timeout: 8000
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
# GH-589: do NOT wait for the "Import Data" button here. Settings keeps the scroll
# position of the "Show Introduction" tap, so the Data buttons sit just below the fold
# whenever a section above is taller (Health Connect "Connected" card on a fresh
# nightly emulator) — that wait failed on every attempt. The bottom bar is back once
# the picker closed; the imported plan name below proves the import itself.
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
# The home keeps its scroll position (it sat at the plan list) — back to the top.
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 60000
# The import replaced the whole store: "My own plan" (current before) is gone and the
# automatic choice is the baseline's Push pull again; the onboarding stays closed.
# Wait for the value (a large import can still be running when the home shows).
- extendedWaitUntil:
    visible:
      id: 'micro-hero-plan-name'
      text: 'Push pull'
    timeout: 120000
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- assertNotVisible:
    id: 'onboarding-screen'
