appId: com.powerliftingworkoutplanner
---
# GH-496 round trip: the Gainalytics export of the baseline store (gh496_strong_export.yaml,
# saved to Downloads) imported into an EMPTY app. Before this flow: `pm clear` the app
# (+ restore debug_http_host / POST_NOTIFICATIONS) and push fixtures/gh496/gh496_invalid.csv and
# gh496_invalid_weight.csv
# to /sdcard/Download. Expected values come from buildStrongImport on the baseline export:
# 387 workouts → 375 trainings (12 same-day merges) in 123 weeks, 5768 exported sets, of which
# 5767 are imported: the baseline's one failed attempt (105 kg × 0) is skipped. 81 exercises.
- launchApp:
    stopApp: false
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: 'tab-settings'

# Empty history: a hint instead of a file
- scrollUntilVisible:
    element:
      id: 'settings-import-strong-csv-button'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'settings-export-strong-csv-button'
- extendedWaitUntil:
    visible: 'Nothing to export'
    timeout: 10000
- assertVisible: 'There are no logged sets yet\. Finish a training first, then export it as CSV\.'
- assertNotVisible: 'Save to Downloads'
- takeScreenshot: gh496_04_empty_export
- tapOn:
    id: 'strong-csv-notice-ok-button'

# Invalid file (valid first row, broken date in line 3): error, nothing imported
- runFlow:
    file: gh496_pick_file.yaml
    env:
      FILE: gh496_invalid.csv
- extendedWaitUntil:
    visible: 'Import failed'
    timeout: 30000
- assertVisible: 'gh496_invalid\.csv: Line 3: "2024-13-45 18:00:00" is not a valid date\. Nothing was imported\.'
- takeScreenshot: gh496_05_invalid_file
- tapOn:
    id: 'strong-csv-notice-ok-button'

# A strength row with reps but a broken weight: error with the line number, not a 0 kg set
- runFlow:
    file: gh496_pick_file.yaml
    env:
      FILE: gh496_invalid_weight.csv
- extendedWaitUntil:
    visible: 'Import failed'
    timeout: 30000
- assertVisible: 'gh496_invalid_weight\.csv: Line 3: "1OO\.0" is not a valid weight\. Nothing was imported\.'
- takeScreenshot: gh496_05b_invalid_weight
- tapOn:
    id: 'strong-csv-notice-ok-button'
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- assertNotVisible: 'Strong Import'
- tapOn: 'tab-settings'

# The real round trip
- runFlow:
    file: gh496_pick_file.yaml
    env:
      FILE: gainalytics_strong_2026-10-12.csv
- extendedWaitUntil:
    visible: '375 trainings in 123 weeks'
    timeout: 60000
- assertVisible: 'File: gainalytics_strong_2026-10-12\.csv'
- assertVisible: '5767 sets · 81 exercises \(76 new\)'
- assertVisible: 'Skipped 1 failed attempt \(0 reps\), so it does not count as a record'
- assertVisible: 'New plan "Strong Import", trainings named by weekday: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday'
- assertVisible: '12 workouts on the same day as another were combined'
- assertVisible: 'Weights: kg \(from file\)'
- takeScreenshot: gh496_06_import_summary
- tapOn:
    id: 'strong-import-confirm-button'
- extendedWaitUntil:
    visible: 'Plan "Strong Import": 375 trainings, 5767 sets'
    timeout: 60000

# Importing the same file again adds nothing
- runFlow:
    file: gh496_pick_file.yaml
    env:
      FILE: gainalytics_strong_2026-10-12.csv
- extendedWaitUntil:
    visible: 'Nothing new to import: all 387 workouts of this file are already in Gainalytics\.'
    timeout: 60000
- assertNotVisible:
    id: 'strong-import-confirm-button'
- takeScreenshot: gh496_07_no_double_import
- tapOn:
    id: 'strong-import-cancel-button'

# The imported plan on the Training tab
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- takeScreenshot: gh496_08_training_home
