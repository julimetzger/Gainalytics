appId: com.powerliftingworkoutplanner
---
# GH-509 — the plan sidebar's "+" icons under "Mesos:" and "Trainings:" became
# full-width dashed "Add Meso" / "Add Training" buttons in the "Add Set" style.
#
# Precondition: baseline fixture imported (gh509_suite.yaml). Plan 1 "Push pull
# upper lower" has one meso ("Meso 1") and the trainings Pull/Push/Upper/Lower,
# so the new entries are deterministically "Meso 2" and "Training 5".
#
# Env:
#   TAG        screenshot name prefix (before / after / dark / ...)
#   CHECK_NEW  'true' → assert the new buttons and create a meso + a training
#              through them. 'false' → only capture the sidebar (old code run).
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 15000
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: gh509_${TAG}_drawer
- runFlow:
    when:
      true: ${CHECK_NEW == 'true'}
    commands:
      # AC1: labelled buttons instead of the bare plus-circle icons.
      - assertVisible: 'Add Meso'
      - assertVisible: 'Add Training'
      - assertVisible:
          id: 'icon-plus-circle'
      - assertVisible:
          id: 'drawer-add-training-button'
      # AC2: both buttons still create a meso / training. The new rows must not
      # exist before the tap, so these assertions fail if the tap does nothing.
      - assertNotVisible: 'Meso 2'
      - tapOn: 'Add Meso'
      - extendedWaitUntil:
          visible: 'Meso 2'
          timeout: 10000
      - assertNotVisible: 'Training 5'
      - tapOn: 'Add Training'
      - extendedWaitUntil:
          visible: 'Training 5'
          timeout: 10000
      # The buttons moved down with the new rows and are still there.
      - assertVisible: 'Add Meso'
      - assertVisible: 'Add Training'
      - waitForAnimationToEnd
      - takeScreenshot: gh509_${TAG}_after_add
