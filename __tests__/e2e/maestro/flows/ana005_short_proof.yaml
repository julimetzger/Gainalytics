appId: com.powerliftingworkoutplanner
---
# Short flow: start analysis, capture bar screenshots, navigate to Training.
# Does NOT wait for terminal state (avoids 30-min hang).
- launchApp:
    clearState: true

# ── Navigate to Video Analyses ──────────────────────────────────────────────
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Emulator Squat Video"

# ── Start the analysis ───────────────────────────────────────────────────────
- tapOn: "Import Emulator Squat Video"

# Handle storage permission prompt if it appears
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

# ── Wait for analysis card to appear in PROCESSING state ─────────────────────
- extendedWaitUntil:
    visible: "Status: processing"
    timeout: 30000

# Screenshot 1: bar at 0% (durationMs not yet set)
- takeScreenshot: progress_bar_screenshot_1

# ── 6s wait for durationMs to be set and bar to fill ──────────────────────
- runScript:
    file: sleep6s.js

# Screenshot 2: bar at fill level (if still processing)
- runFlow:
    when:
      visible: "Status: processing"
    commands:
      - takeScreenshot: progress_bar_screenshot_2

# ── Prove app stays interactive: switch to Training tab ──────────────────────
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 15000
- takeScreenshot: training_tab_during_analysis
