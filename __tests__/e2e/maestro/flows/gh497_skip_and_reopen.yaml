appId: com.powerliftingworkoutplanner
---
# GH-497: fresh install (empty store) → Skip → onboarding stays gone, also after a
# relaunch → Settings › Help › "Show Introduction" reopens it (here in the light theme)
# → a second template ("Full Body Starter") is created from it.
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'onboarding-step-welcome'
    timeout: 120000
- tapOn:
    id: 'onboarding-skip'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- assertNotVisible:
    id: 'onboarding-screen'
# Skipping creates nothing: no plan, no dashboard.
- assertNotVisible:
    id: 'next-training-card'
- takeScreenshot: gh497_skip_01_after_skip
# Cold relaunch: still no onboarding although the store has no data.
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- assertNotVisible:
    id: 'onboarding-screen'
- takeScreenshot: gh497_skip_02_after_relaunch
# Reopen from the Settings, in the light theme.
- tapOn: 'tab-settings'
- tapOn:
    id: 'settings-theme-mode-light'
- assertVisible:
    id: 'settings-theme-mode-light'
    checked: true
- scrollUntilVisible:
    element:
      id: 'settings-show-onboarding-button'
    direction: DOWN
- takeScreenshot: gh497_light_00_settings_help
- tapOn:
    id: 'settings-show-onboarding-button'
- extendedWaitUntil:
    visible:
      id: 'onboarding-step-welcome'
    timeout: 10000
- assertVisible: 'Step 1 of 3'
- takeScreenshot: gh497_light_01_welcome
- tapOn:
    id: 'onboarding-next'
- assertVisible: 'Step 2 of 3'
- takeScreenshot: gh497_light_02_rir
- tapOn:
    id: 'onboarding-next'
- assertVisible: 'Step 3 of 3'
- takeScreenshot: gh497_light_03_start
- tapOn:
    id: 'onboarding-choice-template'
- tapOn:
    id: 'program-template-full-body-starter'
- assertVisible:
    id: 'program-template-full-body-starter'
    checked: true
- assertVisible:
    id: 'program-template-strength-block'
    checked: false
- takeScreenshot: gh497_light_04_templates
- tapOn:
    id: 'onboarding-create-plan'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
- assertVisible: 'Full Body Starter.*'
- assertVisible: '.*Full Body A'
- takeScreenshot: gh497_light_05_plan_created
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible: '3 sets'
    timeout: 10000
- assertVisible: '5-8'
- takeScreenshot: gh497_light_06_planned_sets
# Home: the new plan drives the dashboard before anything was trained.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Full Body Starter'
- assertVisible:
    id: 'next-training-name'
    text: 'Full Body A'
- assertVisible:
    id: 'next-training-slot'
    text: 'Foundation · M1 · D1 · 4 exercises'
- assertNotVisible:
    id: 'onboarding-screen'
- takeScreenshot: gh497_light_07_home
