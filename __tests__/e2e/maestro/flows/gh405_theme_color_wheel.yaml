appId: com.powerliftingworkoutplanner
name: GH-405 theme colour wheel
---
# Proves, in order:
#  * the three built-in palettes are still one tap away and the applied value changes
#  * the colour wheel dialog opens from Settings
#  * a freely picked colour is applied and reflected immediately
#  * the picked colour survives an app restart
#
# The palette radios are addressed by testID: the "Blue"/"Green"/"Purple" labels
# beside them are decorative Text nodes, not touch targets, so tapping the text
# silently does nothing. Every switch also asserts that the PREVIOUS value is gone,
# otherwise an assertion would pass vacuously when the app already sat on that
# palette before the flow started.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 120000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-custom-theme-color-button"
    timeout: 30000

# --- built-in palettes stay one tap away -------------------------------------
# Start from a known palette so the switches below are real transitions.
- tapOn:
    id: "settings-palette-blue"
- assertVisible:
    text: "Theme colour Blue"
- takeScreenshot: gh405-01-builtin-blue

- tapOn:
    id: "settings-palette-green"
- assertVisible:
    text: "Theme colour Green"
- assertNotVisible:
    text: "Theme colour Blue"
- takeScreenshot: gh405-02-builtin-green

- tapOn:
    id: "settings-palette-purple"
- assertVisible:
    text: "Theme colour Purple"
- assertNotVisible:
    text: "Theme colour Green"
- takeScreenshot: gh405-03-builtin-purple

- tapOn:
    id: "settings-palette-blue"
- assertVisible:
    text: "Theme colour Blue"
- assertNotVisible:
    text: "Theme colour Purple"

# --- the colour wheel dialog --------------------------------------------------
- tapOn:
    id: "settings-custom-theme-color-button"
- extendedWaitUntil:
    visible: "Pick a theme colour"
    timeout: 15000
- assertVisible:
    id: "theme-color-wheel"
- assertVisible:
    id: "theme-color-brightness-slider"
- assertVisible:
    id: "theme-color-scroll"
- takeScreenshot: gh405-04-wheel-dialog

# --- an unparseable hex must not be silently applied ---------------------------
# Typing an incomplete value leaves the wheel on the last VALID colour. Applying
# then would confirm a colour the field no longer shows, so Apply goes disabled.
- tapOn:
    id: "theme-color-hex-input"
- eraseText
- inputText: "#00FF"
- hideKeyboard
- assertVisible:
    id: "theme-color-hex-error"
    text: "Not a valid colour.*"
- assertVisible:
    id: "theme-color-apply-button"
    enabled: false
- takeScreenshot: gh405-04b-invalid-hex-apply-disabled

# The preview did NOT follow the invalid text: it holds the last value that still
# parsed. `inputText` types character by character, and `#00F` IS a valid 3-digit
# shorthand (parseColor expands it), so the wheel legitimately stops on #0000FF
# one keystroke before the field became unparseable. Asserting the concrete
# resulting value proves the fallback; comparing against the colour the dialog
# opened on would not, because that comparison is broken by the shorthand step.
- assertVisible:
    id: "theme-color-preview-hex"
    text: "#0000FF"

# pressing Apply changes nothing: the dialog is still open afterwards
- tapOn:
    id: "theme-color-apply-button"
- assertVisible: "Pick a theme colour"
- assertVisible:
    id: "theme-color-hex-error"
    text: "Not a valid colour.*"

# --- pick a specific colour and verify the resulting value ---------------------
- tapOn:
    id: "theme-color-hex-input"
- eraseText
- inputText: "#E91E63"
- hideKeyboard
- assertVisible:
    id: "theme-color-preview-hex"
    text: "#E91E63"
- takeScreenshot: gh405-05-wheel-picked-E91E63
- tapOn:
    id: "theme-color-apply-button"

# The applied colour is reflected immediately, without a restart.
- assertNotVisible: "Pick a theme colour"
- assertVisible:
    text: "Theme colour #E91E63"
- assertNotVisible:
    text: "Theme colour Blue"
- takeScreenshot: gh405-06-applied-E91E63

# --- the picked colour survives an app restart --------------------------------
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 120000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-custom-theme-color-button"
    timeout: 30000
- assertVisible:
    text: "Theme colour #E91E63"
- takeScreenshot: gh405-07-after-restart-E91E63
