appId: com.powerliftingworkoutplanner
---
# GH-72: Compare Button in VideoAnalysisDetail
# Verifies:
# - Compare button appears on DONE analysis
# - Tapping opens the analysis picker modal
# - Picker shows "Select analysis to compare" title
# - Picker can be cancelled and detail screen is still intact
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 60000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible:
    text: "Import Video"
# If no analyses exist, import one
- runFlow:
    when:
      visible: "No video analyses yet"
    commands:
      - tapOn: "Import Emulator Squat Video"
      - runFlow:
          when:
            visible:
              text: "(?i)^allow$"
          commands:
            - tapOn:
                text: "(?i)^allow$"
      - runFlow:
          when:
            visible: "Allow only while using the app"
          commands:
            - tapOn: "Allow only while using the app"
      - extendedWaitUntil:
          visible: "Analysis #[0-9]+"
          timeout: 30000
- extendedWaitUntil:
    visible: "Open"
    timeout: 10000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: (done|awaiting_seed_selection)"
    timeout: 180000
- runFlow:
    when:
      visible: "Status: awaiting_seed_selection"
    commands:
      - scrollUntilVisible:
          element:
            id: "video-analysis-seed-candidate-1"
          direction: DOWN
      - tapOn:
          id: "video-analysis-seed-candidate-1"
      - tapOn:
          id: "video-analysis-manual-seed-run"
      - scrollUntilVisible:
          element:
            id: "video-analysis-detail-status"
          direction: UP
      - extendedWaitUntil:
          visible: "Status: done"
          timeout: 180000
- assertVisible:
    text: "Status: done"
# Verify Compare button is present (AC1)
- assertVisible:
    id: "video-analysis-compare-button"
# Tap Compare button to open picker (AC2)
- tapOn:
    id: "video-analysis-compare-button"
- extendedWaitUntil:
    visible: "Select analysis to compare"
    timeout: 10000
- assertVisible:
    text: "Select analysis to compare"
# Cancel picker and verify detail screen stays intact (AC8)
- tapOn:
    id: "compare-picker-cancel"
- assertVisible:
    id: "video-analysis-detail-screen"
- assertVisible:
    text: "Status: done"
