appId: com.powerliftingworkoutplanner
---
# TRN-004 Round-4: Verify feedback fixes
# Fix 1 (HIGH): DELETE_MESO invariant — last meso cannot be deleted; deleting a meso keeps micro ownership
# Fix 2 (HIGH): Swipe boundary desync — onUpdateCurrentIndex is clamped to meso (header stays consistent)
# Fix 3 (MEDIUM): Drawer micro numbering — prev/next buttons show local micro numbers (not global)

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Training"
    timeout: 30000

- tapOn: "tab-training"

- assertVisible:
    id: "training-home-screen"

# Navigate into "Push pull" plan which is at global micro 6 — drawer must show LOCAL micro numbers
- tapOn:
    text: "Meso 1"

- extendedWaitUntil:
    visible:
      id: "icon-menu"
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: "header-plan-meso-name"
      text: ".*Meso 1.*"
    timeout: 10000

# ── FIX 3: Drawer shows LOCAL micro numbers ───────────────────────────────────
# Open drawer — plan is at global micro 6 but local micro 1 (single meso starting at 1)
- tapOn:
    id: "icon-menu"

- extendedWaitUntil:
    visible: "Mesos:"
    timeout: 5000

# Segmented button labels must show LOCAL micro numbers ("Micro 1"), NOT global ("Micro 6")
- assertVisible:
    text: "Micro 1"

- assertNotVisible:
    text: "Micro 6"

# ── FIX 1a: Last (only) meso cannot be deleted ───────────────────────────────
# canDeleteMesos=false → delete button must NOT appear after long-press
- longPressOn:
    id: "drawer-meso-name-1"

- assertNotVisible:
    id: "delete-meso-1"

# ── FIX 1b: Add Meso 2 then delete it — Meso 1 remains intact ────────────────
- tapOn:
    id: "icon-plus-circle"

- extendedWaitUntil:
    visible:
      id: "drawer-meso-name-2"
    timeout: 5000

# Navigate to Meso 2 so we're in it
- tapOn:
    id: "drawer-meso-name-2"

- extendedWaitUntil:
    visible:
      id: "icon-menu"
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "header-plan-meso-name"
      text: ".*Meso 2.*"
    timeout: 10000

# Open drawer again and delete Meso 2
- tapOn:
    id: "icon-menu"

- extendedWaitUntil:
    visible:
      id: "drawer-meso-name-2"
    timeout: 5000

- longPressOn:
    id: "drawer-meso-name-2"

- extendedWaitUntil:
    visible:
      id: "delete-meso-2"
    timeout: 3000

- tapOn:
    id: "delete-meso-2"

# Meso 2 deleted — Meso 1 still present in drawer (invariant preserved)
- extendedWaitUntil:
    visible:
      id: "drawer-meso-name-1"
    timeout: 5000

- assertNotVisible:
    id: "drawer-meso-name-2"

# Navigate to Meso 1 — proves micro ownership still works after delete
- tapOn:
    id: "drawer-meso-name-1"

- extendedWaitUntil:
    visible:
      id: "icon-menu"
    timeout: 15000

# ── FIX 2: Header/micro state is consistent after meso changes ───────────────
- extendedWaitUntil:
    visible:
      id: "header-plan-meso-name"
      text: ".*Meso 1.*"
    timeout: 10000

# Local Micro 1 is shown — proves micro counter didn't slip past boundary
- extendedWaitUntil:
    visible:
      text: "Micro 1"
    timeout: 5000
