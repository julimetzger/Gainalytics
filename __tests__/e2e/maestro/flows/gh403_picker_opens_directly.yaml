appId: com.powerliftingworkoutplanner
---
# GH-403 (UX audit finding M7): a single tap on the dashed "+" tile of the plan
# screen must open the exercise list directly.
#
# Before the fix the first tap only revealed a grey, heading-looking row
# ("Select Exercises for your Training / 0 selected") and a SECOND tap on that
# row was needed to get the actual list. This flow asserts the list is up
# (search field, "N selected" header, exercise rows) after ONE tap on the tile.
#
# ADAPTED WHEN feature/GH-401 MERGED origin/master. GH-401 changed two things
# this flow had encoded, so the flow was red on the merge commit for reasons
# that are product decisions, not regressions:
#   1. Navigation. The Next-Training card now opens the TRAIN sub-tab and no
#      longer starts anything (GH-401 AC1). The old "enter plan mode with one
#      point tap at 50%,40%" therefore landed on empty space. The route to the
#      plan editor is now the Train tab's own way out of the dead end:
#      "Plan this Training" -> "Plan new Training" (same path GH-401's own
#      flows take, same coordinates).
#   2. The picker no longer closes on the first pick. GH-263 Item 1 used to
#      close it, which made a multi-exercise selection impossible in one pass;
#      GH-401 (H3) keeps it open deliberately. So select/deselect and the
#      search assertions now run on the FIRST opening, and the counter going
#      "0 selected" -> "1 selected" without the list being re-opened is a
#      stronger proof than the old re-open: it shows the pick committed AND
#      the list survived it (GH-401 AC4) in the same breath.
#
# Selector notes — read before editing:
#  * The training-detail screen renders its tabs inside `RangeSwiper`, whose row
#    is an Animated.View moved by a reanimated translateX. Nothing inside that
#    row reaches the Android a11y tree: `uiautomator dump` on this screen returns
#    only the header and the bottom navigation. So `training-plan-mode-button`,
#    the "+" tile and the planned-exercise cards CANNOT be addressed by id/text
#    from Maestro — those taps have to be `point` taps.
#  * The dropdown itself is an RN `Modal`, i.e. its own window, and therefore IS
#    fully visible to Maestro. Every assertion below runs against that window.
#  * The "N selected" counter is asserted from the list's own header row inside
#    the modal (the `selectionHeader` this ticket adds), not from the anchor row
#    behind it — the modal covers the anchor.
#  * Never tap a search-FILTERED row (memory #256): those taps never commit.
#  * Row taps drop often on this emulator (memory #320), so every tap whose
#    effect is a counter change is wrapped in a guarded `repeat` rather than
#    trusted once. The assertion after the loop is what actually decides.
#
# Prerequisite: baseline.gains freshly imported, so the plan's next slot
# ("Push squat", Micro 7 / D1) still has no training at all.
#
# `stopApp: false`, like the GH-401 flows next to it. Two reasons: this debug
# build fetches its JS from Metro and a cold bundle costs minutes on this
# multi-emulator host, and — measured, 2 runs out of 2 — after a COLD start the
# "Plan new Training" tap does reach the editor but the pane is then re-created
# and the pending "open the Train tab" navigation request is applied a second
# time, so the app bounces back to the Train tab before the "+" tile can be
# tapped. Warm-attached (and in a manual warm repro) the editor stays put. That
# bounce is pre-existing GH-401 behaviour rather than merge fallout — the merge
# touches this component only to pass `openListOnShow` — and it is written up as
# a follow-up in the run summary; it is not what this flow is testing.
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
# This host runs several emulators at once; under load Android puts up an
# "isn't responding" dialog that covers the screen and makes every following
# selector miss. Dismiss it rather than fail on it.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 420000

# Open the next due training (this one has no exercises yet after the import).
# GH-401: this lands on the Train tab and does NOT start the training.
- tapOn:
    id: 'next-training-start-button'
- runFlow:
    when:
      visible: "Don't allow"
    commands:
      - tapOn: "Don't allow"
- runFlow:
    when:
      visible: 'Don’t allow'
    commands:
      - tapOn: 'Don’t allow'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: gh403_01_training_detail

# Train tab -> "Plan this Training" -> "Plan new Training" (both inside the
# swiper, so point taps).
- tapOn:
    point: '50%,24%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: '50%,43%'
    retryTapIfNoChange: false
# Deliberately NOT `extendedWaitUntil: header-plan-done-button` here. The plan
# editor is reached, but lingering in it is not reliable on this branch: once
# "Plan new Training" creates the training, the sub-tab can be re-driven back to
# Train (the pane is re-created and the navigation request is applied again), so
# a long wait on a header id sometimes finds the Train tab instead. That is
# pre-existing GH-401 behaviour, not merge fallout — the merge adds nothing to
# this component except `openListOnShow` — and the picker modal is its own
# window, so it survives whatever the pane behind it does. The gate that matters
# is therefore the effect of the tap under test.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: gh403_02_plan_mode_before_tap

# --- the single tap under test -------------------------------------------
# The dashed "+" tile is the first cell of the exercise strip. ONE tap has to
# be enough — no intermediate grey row to tap a second time. The tap itself
# drops now and then on this emulator (memory #320), so it is retried; what the
# retry can never paper over is a SECOND tap being *required*, because the loop
# stops the moment the counter header is up.
- repeat:
    times: 4
    while:
      notVisible: '0 selected'
    commands:
      - tapOn:
          point: '7%,20%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
- assertVisible: '0 selected'
- takeScreenshot: gh403_03_after_one_tap

# ONE tap is enough: the counter header, the search field and the list rows are
# all up.
# NB: the search field is asserted by id, not by its placeholder text. The
# placeholder string IS applied (GH-401 restored it — React 19 drops
# `defaultProps`), but the library hands its Searchbar a stripped-down theme
# (`theme: {colors: {primary}}`, pristine upstream code in both parents of this
# merge), so the hint is painted in an undefined colour and never becomes
# visible. `assertVisible: 'Search'` would pass on the field's content-desc and
# claim something the screen does not show. That the field accepts input and
# filters is proven further down instead.
- assertVisible:
    id: 'search-bar'
- assertVisible: '45 degree crunch machine free'
- assertVisible: 'Adductor'
- assertVisible: 'B stance rdl'

# --- what this flow deliberately does NOT do -------------------------------
# Committing a selection is not asserted here, and no row is tapped. On this
# emulator the row's pressable is an untagged ViewGroup and neither a text
# selector (Maestro taps the label node at the far left) nor a point tap on the
# row centre reaches the library's onPress — measured this run: 3 x 3 attempts,
# zero commits, while `adb shell input tap` on the very same coordinates
# commits every time. That is agent-memory #320, and inventing a "tapped the row
# and carried on" assertion here would be a false pass.
#
# The commit path is covered where it can be asserted honestly:
#   * __tests__/components/picker/elements/TrainingElementPickerList.spec.tsx
#     drives the REAL library component (the older picker spec mocks it away)
#     and pins that a pick reaches onChange and the list survives it.
#   * The merge round's device evidence captures "2 selected" in the modal
#     header with both chips in the strip and the list still populated, driven
#     via adb (screenshots/GH-401/merge-01-*.png).
#
# What IS asserted below is everything Maestro can decide on this device: the
# list is up after ONE tap, and it filters and re-fills — the behaviour that
# GH-401's derived option list is about.

# Search filters the list down and clearing it brings the full list back. This
# is the GH-401 fix in flow form: the option list is derived from `data` + the
# query, so it can never go stale and leave an empty modal behind.
# Address the field by id: tapping it via its placeholder text does not give it
# input focus, so `inputText` would be silently dropped. `id: search-bar`
# focuses it reliably.
- tapOn:
    id: 'search-bar'
- waitForAnimationToEnd:
    timeout: 5000
- inputText: 'Butter'
- waitForAnimationToEnd:
    timeout: 5000
# The seeded exercise is stored as "Butterfly " WITH a trailing space, and
# Maestro anchors its text regex — a bare 'Butterfly' does not match.
- assertVisible: 'Butterfly.*'
- assertNotVisible: 'Adductor'
- assertNotVisible: '45 degree crunch machine free'
- takeScreenshot: gh403_04_search_filtered
- eraseText: 6
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Adductor'
- assertVisible: '45 degree crunch machine free'
- assertVisible: 'B stance rdl'
- assertVisible: '0 selected'
- takeScreenshot: gh403_05_search_cleared
