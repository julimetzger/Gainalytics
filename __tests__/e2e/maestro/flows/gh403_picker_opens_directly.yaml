appId: com.powerliftingworkoutplanner
---
# GH-403 (UX audit finding M7): a single tap on the dashed "+" tile of the plan
# screen must open the exercise list directly.
#
# Before the fix the first tap only revealed a grey, heading-looking row
# ("Select Exercises for your Training / 0 selected") and a SECOND tap on that
# row was needed to get the actual list — this flow fails on the first
# `assertVisible: 'Search'` when run against the pre-fix bundle, and the
# screenshot `gh403_02_after_one_tap` shows the difference.
#
# Selector notes:
#  * While the dropdown modal is open, uiautomator/Maestro only see the modal's
#    own window — the anchor row underneath is NOT in the hierarchy. The
#    "N selected" counter is therefore asserted from the list's own header row
#    inside the modal, not from the anchor.
#  * Never tap a search-FILTERED row (memory #256): those taps never commit.
#    Selection is only exercised on the unfiltered list.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000

# Open the next due training and switch its Plan tab into plan mode.
- tapOn:
    id: 'next-training-start-button'
- runFlow:
    when:
      visible: "Don't allow"
    commands:
      - tapOn: "Don't allow"
- runFlow:
    when:
      visible: 'Don’t allow'
    commands:
      - tapOn: 'Don’t allow'
- extendedWaitUntil:
    visible: 'Plan new Training'
    timeout: 60000
- tapOn:
    id: 'training-plan-mode-button'
- extendedWaitUntil:
    visible:
      id: 'training-add-exercise-box'
    timeout: 30000
- assertVisible: 'Pick an exercise from the picker above to start planning.'
- takeScreenshot: gh403_01_plan_before_tap

# --- the single tap under test -------------------------------------------
- tapOn:
    id: 'training-add-exercise-box'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: gh403_02_after_one_tap

# ONE tap is enough: search field, counter header and the list rows are up.
- assertVisible: 'Search'
- assertVisible: '0 selected'
- assertVisible: '45 degree crunch machine free'

# Selecting and de-selecting still work, and the header shows the real count.
- tapOn: 'Adductor'
- assertVisible: '1 selected'
- tapOn: 'Adductor'
- assertVisible: '0 selected'
- tapOn: 'Adductor'
- tapOn: 'B stance rdl'
- assertVisible: '2 selected'
- takeScreenshot: gh403_03_two_selected

# Search still filters the unfiltered list down.
- tapOn: 'Search'
- inputText: 'Butter'
- assertVisible: 'Butterfly'
- assertNotVisible: 'Adductor'
- takeScreenshot: gh403_04_search_filtered
- eraseText: 6
- assertVisible: 'Adductor'

# Closing the list drops back to the plan screen and the picked exercises are
# now part of the training.
- pressKey: back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Adductor'
- assertVisible: 'B stance rdl'
- assertVisible:
    id: 'training-add-exercise-box'
- takeScreenshot: gh403_05_exercises_in_training
