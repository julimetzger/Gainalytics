appId: com.powerliftingworkoutplanner
---
# GH-486 (review round 2) — deleting the LAST remaining exercise while the running
# training uses it. With no exercise left at all, every reference must still go:
# the training opens, continues and finishes without a crash.
#
# Fixtures (push both to /sdcard/Download first; generated by
# __tests__/testdata/scripts/make_gh486_fixture.js from baseline.gains):
#   gh486-only-exercise.gains       — consistent store whose only exercise is Squat (id 2)
#   gh486-legacy-no-exercises.gains — exercise slice empty, references to Squat left
#                                     behind (what older versions produced)
#
# Part A: import the single-exercise store, plan "Push squat" (M7 D1) from the last
# training — Squat is its only exercise — start it, log a set, delete Squat.
- runFlow:
    file: gh486_import_fixture.yaml
    env:
      FIXTURE: gh486-only-exercise.gains
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 60000
# Train tab -> "Plan this Training" -> "Suggest based on last Training" -> Train tab -> Start.
- tapOn:
    point: '50%,24%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 4
    while:
      notVisible:
        id: 'header-plan-label'
    commands:
      - tapOn:
          point: '50%,29%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
- tapOn:
    point: '50%,14%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 3
    while:
      notVisible:
        id: 'header-session-timer'
    commands:
      - tapOn:
          point: '50%,21%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 30000
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 1 exercises'

# ---- log one set for Squat ----
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- tapOn:
    id: 'training-exercise-2'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'add-workout-set-reps-input'
    index: 0
- inputText: '5'
- tapOn:
    id: 'add-workout-set-weight-input'
    index: 0
- inputText: '60'
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-logged-1'
    timeout: 20000
- takeScreenshot: gh486_r2_01_only_exercise_set_logged
- pressKey: Back
- runFlow:
    when:
      notVisible:
        id: 'training-home-screen'
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000

# ---- delete Squat, the only exercise: Cancel first, then confirm ----
- tapOn:
    point: '37%,92%'
- extendedWaitUntil:
    visible:
      id: 'exercise-row-2'
    timeout: 30000
- tapOn:
    id: 'exercise-row-2'
- tapOn:
    id: 'exercise-detail-edit-button'
- scrollUntilVisible:
    element:
      id: 'edit-exercise-delete'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'edit-exercise-delete'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-delete-running'
    timeout: 10000
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training. It will be removed from it, together with the 1 set you logged there.'
- takeScreenshot: gh486_r2_02_delete_only_exercise_dialog
- tapOn:
    id: 'edit-exercise-delete-cancel'
- assertNotVisible:
    id: 'edit-exercise-delete-running'
- assertVisible: 'Edit Squat'
- tapOn:
    id: 'edit-exercise-delete'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-delete-confirm'
    timeout: 10000
- tapOn:
    id: 'edit-exercise-delete-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'exercise-row-2'
    timeout: 20000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_r2_03_no_exercise_left

# ---- reopen the running training (now empty), finish it ----
- tapOn:
    point: '12%,92%'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 0 exercises'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- assertNotVisible: 'Render Error'
- assertNotVisible:
    id: 'training-exercise-2'
- takeScreenshot: gh486_r2_04_training_reopened_empty
- tapOn:
    id: 'header-overflow-icon'
- tapOn:
    id: 'overflow-finish'
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, Push squat, Meso 1 · M7 · D1 · today.*'
- takeScreenshot: gh486_r2_05_training_finished
- tapOn:
    point: '62%,92%'
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'

# Part B: legacy store whose only exercise was deleted by an older version. The
# repair runs on the next app start, so import, then cold-start.
- runFlow:
    file: gh486_import_fixture.yaml
    env:
      FIXTURE: gh486-legacy-no-exercises.gains
- stopApp
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- assertNotVisible: 'Render Error'
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'last-training-card-pressable'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_r2_06_legacy_last_training_opens
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- tapOn:
    point: '62%,92%'
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_r2_07_legacy_analyse_tab
