appId: com.powerliftingworkoutplanner
---
# Feature F4 Training execution — T4.1 train_start_log_finish
#
# Purpose: the whole Card -> Train -> Start -> log -> Finish path.
#   - The Next Training card reads "Next Training" and only NAVIGATES; an empty
#     slot offers "Plan this Training" (GH-401 AC1/H2, GH-467).
#   - The Train tab of a PLANNED training carries the one "Start Training"
#     button, which starts the session (GH-401 AC3, GH-396).
#   - The home card then reads "Training running" / "Continue Training" with a
#     running clock (GH-401 AC5).
#   - A set is logged with concrete values (5 reps, RIR typed "0,5", 100 kg) and
#     the logged row is corrected to 125 kg / RIR 1.5 (GH-283, GH-466,
#     02_add_workout_set).
#   - After switching the exercise the input row no longer carries the previous
#     exercise's numbers (GH-428 H4).
#   - "Finish Training" (`train-tab-finish-button`, label `^Finish Training$`)
#     ends the session and lands on the Analysis (GH-401 AC6, GH-437, GH-467);
#     the card is back at "Next Training" and the Last Training card shows the
#     finished "Push squat" (persisted state).
#
# Data basis: baseline import (mutates: plans, starts, logs and finishes a
# training) -> starts with 00_import_baseline.yaml. Current plan "Push pull",
# next slot Meso 1 · M6 · D1 "Push squat" without a training object;
# "Suggest based on last Training" copies the last D1 (training 378): 10
# exercises, first Adductor (32), second Stationary lunges (73).
#
# Merged from: gh401_card_to_train_start (base), gh401_empty_start_and_running_card,
#   gh283_set_list_memo, 02_add_workout_set, gh466_train_fractional_rir,
#   gh428_exercise_switch_clears_input, gh437_finish_button_secondary
#   (old id `train-tab-finish-button` is the current one; its `-text` carries
#   the label), gh467_finish_throwaway_training, gh396_api36_training_run.
#   Dropped: gh401 AC7 process-death check (force-stop + cold Metro bundle costs
#   minutes on the emulator host); gh466 out-of-range RIR 11 on the Train tab
#   (the range message is covered in plan_edit_sets.yaml); gh428 "blind Add
#   after the switch writes nothing" (needs the plain-Text set counter, which
#   Maestro cannot read on a running training); 02/gh283 Exercises-tab logging
#   path (same AddWorkout component, now exercised inside the training).

- runFlow: 00_import_baseline.yaml

# PRECONDITION: baseline imported, the card points at the empty next slot.
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Next Training'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Next Training'
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 0 exercises'
- assertNotVisible:
    id: 'next-training-elapsed'

# ===== the card navigates, it does not start =====
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'train-tab-go-to-plan-button'
    timeout: 60000
- assertVisible: '.*Push squat.*'
- assertVisible:
    id: 'train-tab-no-training-hint'
    text: 'Nothing planned for this day yet\.'
- assertVisible:
    id: 'train-tab-go-to-plan-button-text'
    text: '^Plan this Training$'
- assertNotVisible:
    id: 'header-session-timer'

# Plan it from the previous D1, then back to Train.
- tapOn:
    id: 'train-tab-go-to-plan-button'
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- tapOn:
    id: 'training-suggest-last-training-button'
- extendedWaitUntil:
    visible:
      id: '^training-exercise-73$'
    timeout: 60000
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
# PLANNED, not started: "Planned" label, no session timer.
- assertVisible:
    id: 'header-plan-label'
    text: 'Planned'
- assertNotVisible:
    id: 'header-session-timer'
- assertVisible:
    id: 'train-tab-start-button-text'
    text: '^Start Training$'

# ===== Start Training really starts =====
- tapOn:
    id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- assertNotVisible:
    id: 'header-plan-label'
- copyTextFrom:
    id: 'header-session-timer'
# Clock value (H:MM:SS or MM:SS). No `{n}` quantifiers: a brace inside `${...}`
# would end the interpolation early.
- assertTrue: "${/^(\\d+:)?\\d\\d?:\\d\\d$/.test(maestro.copiedText)}"

# Home card shows the running session.
- back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Continue Training'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 10 exercises'
- copyTextFrom:
    id: 'next-training-elapsed'
- assertTrue: "${/^(\\d+:)?\\d\\d?:\\d\\d$/.test(maestro.copiedText)}"

# Continue Training leads back into the running session.
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-reps-input'
    timeout: 60000
- assertVisible:
    id: 'header-session-timer'
- assertNotVisible:
    id: '^add-workout-set-logged-2$'
# The copied Adductor plan has sets 2 and 3 (no set 1), so the first log is
# announced and stored as set 2 (verified on device).
- assertVisible:
    id: 'add-workout-set-number'
    text: '.*Set 2'

# ===== log a set on Adductor: 5 reps, RIR "0,5", 100 kg =====
# Rows carry their set number; the planned rows exist before anything is
# logged, so the proof of the LOGGED set is `add-workout-set-logged-2` + RIR
# 0.5 (no planned set in the fixture has a fractional RIR).
- tapOn:
    id: '^add-workout-set-reps-input$'
- eraseText: 4
- inputText: '5'
- tapOn:
    id: '^add-workout-set-rir-input$'
- eraseText: 4
- inputText: '0,5'
- tapOn:
    id: '^add-workout-set-weight-input$'
- eraseText: 6
- inputText: '100'
- hideKeyboard
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: '^add-workout-set-logged-2$'
    timeout: 20000
- assertVisible:
    id: '^add-workout-set-reps-input-2$'
    text: '5'
- assertVisible:
    id: '^add-workout-set-rir-input-2$'
    text: '0\.5'
- assertVisible:
    id: '^add-workout-set-weight-input-2$'
    text: '100'

# Correct the logged row: 125 kg, RIR 1.5. The row's confirm icon commits and
# dismisses the keyboard itself (a trailing hideKeyboard would be BACK).
- tapOn:
    id: '^add-workout-set-weight-input-2$'
- eraseText: 6
- inputText: '125'
- tapOn:
    id: '^add-workout-set-rir-input-2$'
- eraseText: 4
- inputText: '1.5'
- tapOn:
    id: '^add-workout-set-confirm-2$'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: '^add-workout-set-logged-2$'
    timeout: 20000
- assertVisible:
    id: '^add-workout-set-weight-input-2$'
    text: '125'
- assertVisible:
    id: '^add-workout-set-rir-input-2$'
    text: '1\.5'
- assertVisible:
    id: '^add-workout-set-reps-input-2$'
    text: '5'

# ===== switching the exercise clears the input row (GH-428 H4) =====
# 63 kg: no exercise in the baseline plans or history uses it, so "63 on
# screen" can only be this flow's typed value.
- tapOn:
    id: '^add-workout-set-reps-input$'
- eraseText: 4
- inputText: '8'
- tapOn:
    id: '^add-workout-set-weight-input$'
- eraseText: 6
- inputText: '63'
- assertVisible:
    id: '^add-workout-set-weight-input$'
    text: '63'
- hideKeyboard
- tapOn:
    id: '^training-exercise-73$'
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: '^add-workout-set-reps-input$'
- assertNotVisible: '63'
# Adductor's logged row (125 kg) went with the exercise switch.
- assertNotVisible:
    id: '^add-workout-set-weight-input-2$'
    text: '125'

# ===== Finish Training (GH-401 AC6 / GH-437) =====
- scrollUntilVisible:
    element:
      id: 'train-tab-finish-button'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'train-tab-finish-button-text'
    text: '^Finish Training$'
- tapOn:
    id: 'train-tab-finish-button'
# Finishing lands on Analysis, whose TrainingsOverview renders for a FINISHED
# (or started) training; the finish control is gone.
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertNotVisible:
    id: 'train-tab-finish-button'

# Persisted state on the home screen.
- back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Next Training'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Next Training'
- assertNotVisible:
    id: 'next-training-elapsed'
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, Push squat, Meso 1 · M6 · D1 · today.*'
