appId: com.powerliftingworkoutplanner
---
# GH-420: the Analyse drawer must close via the menu icon, a tap on the dimmed
# area and a swipe — also after choosing an entry, reopening and switching the
# bottom tab. "Closed" is never inferred from the overlay disappearing alone:
# after every close the flow taps a control of the screen behind that lies
# INSIDE the drawer's area and asserts the view it switches to. While the
# drawer were still open that tap would land on a drawer entry instead.
#
# Before the fix the menu icon sat underneath the drawer's first entry, so the
# "menu icon" close below navigated to Dashboard and the Records assertions
# failed.
- launchApp:
    stopApp: false

# The bug was reported in the dark theme — pin it.
- tapOn:
    id: 'tab-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-theme-mode-dark'
    timeout: 60000
- tapOn:
    id: 'settings-theme-mode-dark'

- tapOn:
    id: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 60000

# ---- Open the drawer and choose "Records" ----
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 10000
- tapOn:
    text: '^Records$'
    below:
      id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible:
      id: 'records-view-heatmap'
    timeout: 20000
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 10000
- tapOn:
    id: 'records-view-heatmap'
- assertVisible:
    id: 'records-heatmap.*'

# ---- Close path 1: menu icon ----
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 10000
- takeScreenshot: gh420_drawer_open_on_records
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 10000
# The tap closed the drawer instead of selecting an entry: still on Records.
- assertVisible: '^Records$'
- assertVisible: 'Records over time'
- assertNotVisible: 'Your Week at a Glance'
# The screen behind reacts: "By muscle" lies inside the drawer's area.
- tapOn:
    id: 'records-view-muscle'
- assertVisible:
    id: 'records-muscle-lanes.*'
- assertNotVisible:
    id: 'records-heatmap.*'
- takeScreenshot: gh420_closed_by_menu_icon_records_usable

# ---- Close path 2: tap on the dimmed area ----
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 10000
- tapOn:
    point: '94%,55%'
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 10000
- tapOn:
    id: 'records-view-heatmap'
- assertVisible:
    id: 'records-heatmap.*'
- assertNotVisible:
    id: 'records-muscle-lanes.*'

# ---- Close path 3: swipe left ----
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 10000
- swipe:
    start: '70%,55%'
    end: '5%,55%'
    duration: 300
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 10000
- tapOn:
    id: 'records-view-muscle'
- assertVisible:
    id: 'records-muscle-lanes.*'

# ---- Bottom tab switch with the drawer open, then each close path again ----
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 10000
- tapOn:
    id: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 20000
- tapOn:
    id: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 10000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 10000
- assertVisible: '^Records$'
- tapOn:
    id: 'records-view-heatmap'
- assertVisible:
    id: 'records-heatmap.*'

# Reopen several times in a row after the tab switch.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 10000
      - tapOn:
          point: '94%,55%'
      - extendedWaitUntil:
          notVisible: 'Close drawer'
          timeout: 10000
      - tapOn:
          id: 'analyse-drawer-toggle'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 10000
      - swipe:
          start: '70%,55%'
          end: '5%,55%'
          duration: 300
      - extendedWaitUntil:
          notVisible: 'Close drawer'
          timeout: 10000
- tapOn:
    id: 'records-view-muscle'
- assertVisible:
    id: 'records-muscle-lanes.*'
- assertVisible: '^Records$'
