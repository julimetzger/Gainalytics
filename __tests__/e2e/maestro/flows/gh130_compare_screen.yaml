appId: com.powerliftingworkoutplanner
---
# GH-130: Open Compare screen with two DONE analyses
# Navigates from any tab to the Compare screen

# Step 1: Navigate to Analyse tab via bottom nav (63%,89%)
- tapOn:
    point: "63%,89%"
- extendedWaitUntil:
    visible:
      text: "(?:Dashboard|Metrics Overview|Video Analyses|Video Analysis Detail)"
    timeout: 15000

# Step 2: Open drawer via hamburger (6%,6%)
- tapOn:
    point: "6%,6%"
- extendedWaitUntil:
    visible: "Video Analyses"
    timeout: 10000

# Step 3: Navigate to Video Analyses
- tapOn: "Video Analyses"
- extendedWaitUntil:
    visible: "Import Video"
    timeout: 10000

# Step 4: Verify two DONE analyses exist
- assertVisible:
    text: "Analysis #[0-9]+"
- assertVisible: "Status: done"

# Step 5: Open the most recent analysis (shown at top)
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Bar Tracking Result"
    timeout: 30000

# Step 6: Assert VideoAnalysisDetail is showing
- assertVisible: "Status: done"
- assertVisible: "Bar Tracking Result"

# Step 7: Tap Compare button
- tapOn:
    id: "video-analysis-compare-button"

# Step 8: Wait for compare picker modal
- extendedWaitUntil:
    visible: "Select analysis to compare"
    timeout: 10000

# Step 9: Select the other analysis
- tapOn:
    text: "Analysis #[0-9]+"

# Step 10: Wait for Compare screen
- extendedWaitUntil:
    visible: "Compare Analyses"
    timeout: 30000

# Step 11: Assert Compare screen rendered without crash
- assertVisible: "Compare Analyses"
