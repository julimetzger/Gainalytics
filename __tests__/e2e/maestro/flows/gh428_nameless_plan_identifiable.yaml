appId: com.powerliftingworkoutplanner
---
# GH-428 (H1), PR #430 review round 3 — a plan stored WITHOUT a name (created before
# the name validation existed) has to carry the same identifiable label everywhere:
# in the plan list, in the header of the active plan, in the opened plan, and it has
# to be findable by searching for exactly that label.
#
# Prerequisite: fixtures/legacy-nameless-plan.gains imported instead of the usual
# baseline — it is the baseline data with plan 3's name emptied, which is what a
# legacy plan looks like in stored data. No migration rewrites it, so the app has to
# cope on every read path:
#   bash ./__tests__/e2e/scripts/run-maestro-from-wsl.sh --mode smoke \
#     --suite __tests__/e2e/maestro/flows/00_import_baseline.yaml \
#     --fixture __tests__/e2e/maestro/fixtures/legacy-nameless-plan.gains --device "$ANDROID_SERIAL"
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 180000

# ---- 1. the list row shows the fallback label instead of an empty title ----
- scrollUntilVisible:
    element:
      id: 'plan-name-3'
    direction: DOWN
    timeout: 120000
- copyTextFrom:
    id: 'plan-name-3'
# assertTrue on a computed ${output.*} is unreliable in the installed CLI
# (agent-memory #191), so every check throws inside evalScript with the value it saw.
- evalScript: |
    output.listName = maestro.copiedText;
    if (output.listName !== 'Unnamed plan') { throw 'plan list shows ' + JSON.stringify(output.listName) + ' instead of "Unnamed plan"'; }
- takeScreenshot: gh428_r3_01_nameless_plan_in_list
# The named plans are untouched — no data was rewritten, only the display fixed.
# Checked on the row itself rather than on the bare text: the plan names also appear
# in the dashboard cards above the list, so a free-text match would not tell the two
# apart — and the point here is what the LIST row shows.
- scrollUntilVisible:
    element:
      id: 'plan-name-5'
    direction: DOWN
    timeout: 60000
- copyTextFrom:
    id: 'plan-name-5'
- evalScript: |
    if (maestro.copiedText !== 'Push pull') { throw 'named plan 5 shows ' + JSON.stringify(maestro.copiedText) + ' instead of "Push pull"'; }

# ---- 2. the header of the ACTIVE plan shows the same label ----
- scrollUntilVisible:
    element:
      id: 'plan-select-3'
    direction: UP
    timeout: 60000
- tapOn:
    id: 'plan-select-3'
# Starring the plan renders the hero card at the TOP of the screen, while the view
# is still scrolled down at the list — so scroll back up to it rather than waiting
# for something that is off-screen.
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 60000
- copyTextFrom:
    id: 'micro-hero-plan-name'
- evalScript: |
    if (maestro.copiedText !== output.listName) { throw 'active plan header shows ' + JSON.stringify(maestro.copiedText) + ' instead of ' + JSON.stringify(output.listName); }
- takeScreenshot: gh428_r3_02_active_plan_header

# ---- 3. searching for the displayed label finds the row ----
- scrollUntilVisible:
    element:
      id: 'plans-search-field'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'plans-search-field'
- inputText: 'Unnamed'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'plan-name-3'
    timeout: 30000
- copyTextFrom:
    id: 'plan-name-3'
- evalScript: |
    if (maestro.copiedText !== output.listName) { throw 'search hit shows ' + JSON.stringify(maestro.copiedText) + ' instead of ' + JSON.stringify(output.listName); }
# The filter really ran: the ROWS of the plans that do not match the query are gone.
# By id, not by text — the same plan names are also rendered in the dashboard cards
# above the list, which the search field does not filter and must not have to.
- assertNotVisible:
    id: 'plan-name-1'
- assertNotVisible:
    id: 'plan-name-4'
- assertNotVisible:
    id: 'plan-name-5'
- takeScreenshot: gh428_r3_03_search_finds_nameless_plan

# ---- 4. the opened plan shows the same label in its header ----
- tapOn:
    id: 'plan-row-3'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 60000
- copyTextFrom:
    id: 'header-plan-meso-name'
# The header appends " > meso" when the plan has mesos, so the plan name is the
# part before it — what must never be empty.
- evalScript: |
    output.headerName = maestro.copiedText.split('\u203a')[0].trim();
    if (output.headerName !== output.listName) { throw 'opened plan header shows ' + JSON.stringify(maestro.copiedText) + ', plan name part ' + JSON.stringify(output.headerName) + ' instead of ' + JSON.stringify(output.listName); }
- takeScreenshot: gh428_r3_04_opened_plan_header

# This flow leaves plan 3 starred as the active plan and the search field filled.
# Re-running 00_import_baseline restores the clean state, which is the documented
# prerequisite for every flow here anyway.
