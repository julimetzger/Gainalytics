appId: com.powerliftingworkoutplanner
---
# Feature F7 Analyse tab - T7.2 Analysis graphs, metric filter, empty states,
# date range picker, Metrics Overview.
#
# Purpose:
#   * GH-458 H3: the chart's empty cases read differently - no selection on an
#     empty period, an exercise never trained (Mmkv), an exercise trained but not
#     in this period (Front squat) - and the one-tap "Jump to <date>" produces charts.
#   * GH-169 (crash regression): an EXERCISE filter with every metric incl.
#     Frequency renders the Frequency chart, no error boundary.
#   * GH-468 (round 4): without an exercise every metric is charted; metrics are
#     filtered in the picker (Volume + Frequency + Week -> only those two charts);
#     tapping a weekly point lists exactly that week's trainings.
#   * ANA-002 / GH-207: the date range picker opens and Save keeps the range.
#   * GH-225: Metrics Overview opens from the drawer with its picker.
#
# Data basis: READ-ONLY on the baseline import (fixtures/baseline.gains, last
#   training Sat 28/02/26; Front squat last trained Fri 27/02/26; Mmkv has no
#   logged set). Run 00_import_baseline.yaml once before. The default chart range
#   (last 3 months) is empty on the baseline from now on.
#
# Coordinates: chart data points (MPAndroidChart) and the picker rows are not
#   addressable otherwise - see the comments at each point tap.
#
# Merged from: gh468_analyse_multi_metric, gh468_r4_point_tap_metric_filter,
#   gh468_r3_metric_filter_muscle_share, gh468_r3_muscle_point_trainings,
#   gh169_frequency_exercise_no_crash, gh97_frequency_metric,
#   gh458_chart_empty_states, analyse_date_range_picker, 11_metrics_overview_slots
#   (round-3 metric chip ids and the "Exercise Graphs" / "Alle Metriken" texts
#   are stale and were not carried over).
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 120000

# ---------------------------------------------------------------- PRECONDITION
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'

# ------------------------------------------------- open Analyse -> "Analysis"
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- runFlow:
    when:
      notVisible: 'Close drawer'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 15000
- tapOn:
    text: '^Analysis$'
    below:
      id: 'analyse-drawer-toggle'
- waitForAnimationToEnd

# ------------------------------------- case 0: nothing selected, empty period
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-empty-range'
    timeout: 60000
- assertVisible: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
# only the default accumulation mode "Day" is selected
- assertVisible: '1 selected'
- assertVisible:
    id: 'analyse-chart-empty-range-description'
    text: 'There are no logged sets between .* to .*\. The last one was on Sat, 28/02/26\.'
- assertVisible:
    id: 'analyse-chart-jump-to-last'
    text: 'Jump to Sat, 28/02/26'
- assertVisible:
    id: 'analyse-chart-stale-range-banner-text'
    text: 'No trainings in this period\. Your last training was on Sat, 28/02/26\.'
- assertNotVisible: 'Please select: Exercise or Muscle\.'
- assertNotVisible:
    id: 'analyse-chart-misconfigured'

# ------------------------------------- case 1: an exercise never trained once
- tapOn: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Mmkv'
- waitForAnimationToEnd
# Coordinates: a text tap on the result row does not select it (verified on the
# emulator: the row stays, no chip) and `tapOn: 'Mmkv'` would hit the search
# field that holds the same text. The only result row sits right under the
# field. Re-tap only if the chip did not appear (the keyboard can eat a tap).
- tapOn:
    point: '30%, 26%'
    retryTapIfNoChange: false
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Mmkv'
    commands:
      - tapOn:
          point: '30%, 26%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Mmkv'
# Close the list: same two-back pattern as in part 2 (GH-636 comment there).
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-never-trained'
    timeout: 30000
- assertVisible:
    id: 'analyse-chart-never-trained-description'
    text: 'There is not a single logged set for Mmkv, so there is nothing to chart — no date range will change that\.'
# Not a range problem -> no range actions.
- assertNotVisible:
    id: 'analyse-chart-empty-range'
# The way out of a dead selection.
- tapOn:
    id: 'analyse-chart-clear-selection'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-empty-range-description'
      text: 'There are no logged sets between .*\. The last one was on Sat, 28/02/26\.'
    timeout: 30000
- assertNotVisible:
    id: 'analyse-chart-never-trained'

# ---------------------- case 2: trained plenty, just not in the default period
- tapOn: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000
- tapOn:
    id: 'search-bar'
- eraseText: 30
# "Front squat" is the only catalogue entry containing that string.
- inputText: 'Front squat'
- waitForAnimationToEnd
# Same position tap as for Mmkv (the only result row under the field).
- tapOn:
    point: '30%, 26%'
    retryTapIfNoChange: false
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Front squat'
    commands:
      - tapOn:
          point: '30%, 26%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Front squat'
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-empty-range'
    timeout: 30000
# The range in the middle is relative to today; name + last date are pinned.
- assertVisible:
    id: 'analyse-chart-empty-range-description'
    text: 'Front squat has no logged sets between .*\. The last one was on Fri, 27/02/26\.'
- assertVisible:
    id: 'analyse-chart-jump-to-last'
    text: 'Jump to Fri, 27/02/26'
- assertNotVisible:
    id: 'analyse-chart-never-trained'

# ---------- one-tap correction + GH-169: exercise filter with Frequency charted
- tapOn:
    id: 'analyse-chart-jump-to-last'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-Volume'
    timeout: 60000
# rangeEndingAt(27/02/26): 3 months back, inclusive.
- assertVisible:
    id: 'date-range-picker-button'
    text: 'Thu, 27/11/25 to Fri, 27/02/26'
- assertNotVisible:
    id: 'analyse-chart-empty-range'
- assertVisible: 'Volume \(sum\)'
# Charts sit below each other; long swipes BELOW the charts' centre scroll the
# page (scrollUntilVisible's short swipes are swallowed by the charts).
- repeat:
    while:
      notVisible: 'Frequency \(training days\)'
    times: 10
    commands:
      - swipe:
          start: '50%, 80%'
          end: '50%, 30%'
          duration: 600
      - waitForAnimationToEnd
- assertVisible:
    id: 'analyse-chart-Frequency'
- assertVisible: 'Frequency \(training days\)'
- assertVisible: 'Average Intensity \(average %\)'
- assertNotVisible:
    id: 'analyse-error-boundary'

# =============================================================================
# Part 2 - no exercise: all metrics, metric filter, point tap (GH-468 round 4).
# A relaunch resets the Analysis screen's local state (selection + range).
# =============================================================================
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 120000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000
# Back on "Analysis" (resumed) or elsewhere: make sure we are on it.
- runFlow:
    when:
      notVisible:
        id: 'analyse-chart-jump-to-last'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
      - runFlow:
          when:
            notVisible: 'Close drawer'
          commands:
            - tapOn:
                id: 'analyse-drawer-toggle'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 15000
      - tapOn:
          text: '^Analysis$'
          below:
            id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-jump-to-last'
      text: 'Jump to Sat, 28/02/26'
    timeout: 60000
# Fresh state: no exercise picked (the Front squat filter of part 1 is gone).
- assertVisible: '1 selected'
- tapOn:
    id: 'analyse-chart-jump-to-last'
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-Volume'
    timeout: 60000
- assertVisible:
    id: 'date-range-picker-button'
    text: 'Fri, 28/11/25 to Sat, 28/02/26'

# (a) no selection, no metric filter -> every metric is charted
- assertVisible: 'Volume \(sum\)'
- assertVisible:
    id: 'analyse-chart-1RM'
- assertNotVisible:
    id: 'analyse-chart-empty-range'
- assertNotVisible:
    id: 'analyse-chart-misconfigured'

# Date range picker: opens as a modal, Save without a change keeps the range.
- tapOn:
    id: 'date-range-picker-button'
- extendedWaitUntil:
    visible: '^Save$'
    timeout: 15000
- assertVisible:
    id: 'date-range-start-input'
- waitForAnimationToEnd
- tapOn: '^Save$'
- extendedWaitUntil:
    notVisible: '^Save$'
    timeout: 15000
- assertVisible:
    id: 'date-range-picker-button'
    text: 'Fri, 28/11/25 to Sat, 28/02/26'

# (b) Volume + Frequency + Week in the picker
- tapOn: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Volume'
- waitForAnimationToEnd
# Same position tap as above: the only result row under the search field.
- tapOn:
    point: '30%, 26%'
    retryTapIfNoChange: false
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Volume'
    commands:
      - tapOn:
          point: '30%, 26%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Volume'
- tapOn:
    id: 'search-bar-clear-icon'
    optional: true
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Frequency'
- waitForAnimationToEnd
- tapOn:
    point: '30%, 26%'
    retryTapIfNoChange: false
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Frequency'
    commands:
      - tapOn:
          point: '30%, 26%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Frequency'
- tapOn:
    id: 'search-bar-clear-icon'
    optional: true
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Week'
- waitForAnimationToEnd
- tapOn:
    point: '30%, 26%'
    retryTapIfNoChange: false
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Week'
    commands:
      - tapOn:
          point: '30%, 26%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
# Week replaces Day (one accumulation mode at a time); both metrics stay.
- assertVisible:
    id: 'chip'
    text: 'Week'
- assertNotVisible:
    id: 'chip'
    text: 'Day'
- assertVisible:
    id: 'chip'
    text: 'Volume'
- tapOn:
    id: 'search-bar-clear-icon'
    optional: true
# GH-636: close the list with at most two backs (keyboard, then list) and wait
# until the list is really gone before deciding on the second one. With only
# waitForAnimationToEnd the second `when: visible search-bar` could still see the
# fading list, and the extra back left Analysis for the Dashboard (no picker ->
# "3 selected" not found).
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 15000
- waitForAnimationToEnd
# still on Analysis (a stray back would have opened the Dashboard)
- assertVisible:
    id: 'analyse-chart-Volume'
- assertVisible: '3 selected'
- assertVisible: 'Volume \(sum\)'
- assertVisible: 'Frequency \(training days\)'
- assertNotVisible:
    id: 'analyse-chart-1RM'
- assertNotVisible:
    id: 'analyse-chart-Sets'
- assertNotVisible:
    id: 'analyse-chart-Reps'

# (c) tap the LAST weekly Volume point (week of 23/02/26). Chart data points
# are drawn by MPAndroidChart and have no accessibility node -> coordinates.
- tapOn:
    point: '89%, 47%'
- waitForAnimationToEnd
# Swipes must start BELOW the charts: a drag across a chart re-selects a point.
- swipe:
    start: '50%, 92%'
    end: '50%, 40%'
    duration: 600
- waitForAnimationToEnd
# newest training of the tapped week first
- assertVisible: 'Sat, 28/02/26'
- repeat:
    while:
      notVisible: 'Mon, 23/02/26'
    times: 8
    commands:
      - swipe:
          start: '50%, 85%'
          end: '50%, 35%'
          duration: 600
      - waitForAnimationToEnd
# trainings of that week only - the week before is not listed
- assertVisible: 'Mon, 23/02/26'
- assertNotVisible: 'Sun, 22/02/26'
- assertNotVisible: 'Sat, 21/02/26'
# the charts are still there after the tap (not recomputed away). GH-636: scroll
# up to the picker anchor itself - "Volume (sum)" can already be on screen while
# the "N selected" row above it is still scrolled off.
- repeat:
    while:
      notVisible: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
    times: 8
    commands:
      - swipe:
          start: '50%, 25%'
          end: '50%, 85%'
          duration: 600
      - waitForAnimationToEnd
- assertVisible: 'Volume \(sum\)'
- assertVisible: 'Frequency \(training days\)'
- assertVisible: '3 selected'

# ------------------------------------- GH-225: Metrics Overview from the drawer
- tapOn:
    id: 'analyse-drawer-toggle'
- runFlow:
    when:
      notVisible: 'Close drawer'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 15000
- tapOn:
    text: '^Metrics Overview$'
    below:
      id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Select Exercises, Metrics, Accumulation Mode'
    timeout: 30000
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 15000
- assertVisible: '^Metrics Overview$'
- assertNotVisible: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
- assertNotVisible:
    id: 'analyse-error-boundary'
