appId: com.powerliftingworkoutplanner
---
# Feature F7 Analyse tab - T7.2 Analysis graphs, filter panel, empty states,
# date range, Metrics Overview.
#
# Purpose:
#   * GH-458 H3: the chart's empty cases read differently - no selection on an
#     empty period, an exercise never trained (Mmkv), an exercise trained but not
#     in this period (Front squat) - and the one-tap "Jump to <date>" produces charts.
#   * GH-169 (crash regression): an EXERCISE filter with every metric incl.
#     Frequency renders the Frequency chart, no error boundary.
#   * GH-468 (round 4): without an exercise every metric is charted; metrics are
#     filtered in the panel (Volume + Frequency + Week -> only those two charts);
#     tapping a weekly point lists exactly that week's trainings.
#   * GH-642: the filter panel replaced the sharingan picker AND the separate
#     DateRangePicker. Collapsed card = period · selection · group by + metrics;
#     arrows and swipes step the period (never past today, a swipe does not
#     expand), a tap expands. Expanded: Group by in one tap, metric chips,
#     3 most-trained exercises in 3 taps, muscle grid + Clear, the search sheet,
#     Custom opens the date dialog (Save keeps the range).
#   * GH-225: Metrics Overview opens from the drawer with its filter panel.
#
# Data basis: READ-ONLY on the baseline import (fixtures/baseline.gains, last
#   training Sat 28/02/26; Front squat last trained Fri 27/02/26; Mmkv has no
#   logged set; most trained: Adductor, Leg extension, Cable lateral raise).
#   Run 00_import_baseline.yaml once before. The default chart range (last 3
#   months) is empty on the baseline from now on.
#
# Coordinates: chart data points (MPAndroidChart) are not addressable
#   otherwise - see the comment at the point tap.
#
# Merged from: gh468_analyse_multi_metric, gh468_r4_point_tap_metric_filter,
#   gh468_r3_metric_filter_muscle_share, gh468_r3_muscle_point_trainings,
#   gh169_frequency_exercise_no_crash, gh97_frequency_metric,
#   gh458_chart_empty_states, analyse_date_range_picker, 11_metrics_overview_slots.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 120000

# ---------------------------------------------------------------- PRECONDITION
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'

# ------------------------------------------------- open Analyse -> "Analysis"
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- runFlow:
    when:
      notVisible: 'Close drawer'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 15000
# No retry: a repeated tap would land on the filter card under the drawer item.
- tapOn:
    text: '^Analysis$'
    below:
      id: 'analyse-drawer-toggle'
    retryTapIfNoChange: false
- waitForAnimationToEnd

# ------------------------------------- case 0: nothing selected, empty period
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-empty-range'
    timeout: 60000
# GH-642: the panel starts collapsed - period, "All exercises", "Day · All metrics".
- assertVisible:
    id: 'filter-selection-summary'
    text: 'All exercises'
- assertVisible:
    id: 'filter-groupby-summary'
    text: 'Day · All metrics'
- assertVisible:
    id: 'filter-range-label'
    text: '\d{1,2} [A-Z][a-z]{2}( \d{4})? – \d{1,2} [A-Z][a-z]{2} \d{4}'
# the default period ends this week -> no step into the future
- assertVisible:
    id: 'filter-range-next'
    enabled: false
- assertNotVisible:
    id: 'filter-panel-collapse'
- assertVisible:
    id: 'analyse-chart-empty-range-description'
    text: 'There are no logged sets between .* to .*\. The last one was on Sat, 28/02/26\.'
- assertVisible:
    id: 'analyse-chart-jump-to-last'
    text: 'Jump to Sat, 28/02/26'
- assertVisible:
    id: 'analyse-chart-stale-range-banner-text'
    text: 'No trainings in this period\. Your last training was on Sat, 28/02/26\.'
- assertNotVisible: 'Please select: Exercise or Muscle\.'
- assertNotVisible:
    id: 'analyse-chart-misconfigured'

# ------------------------------------- case 1: an exercise never trained once
- tapOn:
    id: 'filter-panel-card'
- extendedWaitUntil:
    visible:
      id: 'filter-panel-collapse'
    timeout: 10000
- assertVisible:
    id: 'filter-exercise-section-title'
    text: 'Exercises \(0\)'
- runFlow:
    file: pick_exercise_in_search_sheet.yaml
    env:
      NAME: 'Mmkv'
- assertVisible:
    id: 'filter-exercise-section-title'
    text: 'Exercises \(1\)'
- tapOn:
    id: 'filter-panel-collapse'
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'Mmkv'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-never-trained'
    timeout: 30000
- assertVisible:
    id: 'analyse-chart-never-trained-description'
    text: 'There is not a single logged set for Mmkv, so there is nothing to chart — no date range will change that\.'
# Not a range problem -> no range actions.
- assertNotVisible:
    id: 'analyse-chart-empty-range'
# The way out of a dead selection.
- tapOn:
    id: 'analyse-chart-clear-selection'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-empty-range-description'
      text: 'There are no logged sets between .*\. The last one was on Sat, 28/02/26\.'
    timeout: 30000
- assertNotVisible:
    id: 'analyse-chart-never-trained'
- assertVisible:
    id: 'filter-selection-summary'
    text: 'All exercises'

# ---------------------- case 2: trained plenty, just not in the default period
- tapOn:
    id: 'filter-panel-card'
- extendedWaitUntil:
    visible:
      id: 'filter-panel-collapse'
    timeout: 10000
# "Front squat" is the only catalogue entry with that name.
- runFlow:
    file: pick_exercise_in_search_sheet.yaml
    env:
      NAME: 'Front squat'
- tapOn:
    id: 'filter-panel-collapse'
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'Front squat'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-empty-range'
    timeout: 30000
# The range in the middle is relative to today; name + last date are pinned.
- assertVisible:
    id: 'analyse-chart-empty-range-description'
    text: 'Front squat has no logged sets between .*\. The last one was on Fri, 27/02/26\.'
- assertVisible:
    id: 'analyse-chart-jump-to-last'
    text: 'Jump to Fri, 27/02/26'
- assertNotVisible:
    id: 'analyse-chart-never-trained'

# ---------- one-tap correction + GH-169: exercise filter with Frequency charted
- tapOn:
    id: 'analyse-chart-jump-to-last'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-Volume'
    timeout: 60000
# rangeEndingAt(27/02/26): 3 months back, inclusive.
- assertVisible:
    id: 'filter-range-label'
    text: '27 Nov 2025 – 27 Feb 2026'
- assertNotVisible:
    id: 'analyse-chart-empty-range'
- assertVisible: 'Volume \(sum\)'
# Charts sit below each other; long swipes BELOW the charts' centre scroll the
# page (scrollUntilVisible's short swipes are swallowed by the charts).
- repeat:
    while:
      notVisible: 'Frequency \(training days\)'
    times: 10
    commands:
      - swipe:
          start: '50%, 80%'
          end: '50%, 30%'
          duration: 600
      - waitForAnimationToEnd
- assertVisible:
    id: 'analyse-chart-Frequency'
- assertVisible: 'Frequency \(training days\)'
- assertVisible: 'Average Intensity \(average %\)'
- assertNotVisible:
    id: 'analyse-error-boundary'

# =============================================================================
# Part 2 - no exercise: all metrics, period stepping, metric filter, point tap
# (GH-468 round 4, GH-642). A relaunch resets the Analysis screen's local state.
# =============================================================================
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 120000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000
# Back on "Analysis" (resumed) or elsewhere: make sure we are on it.
- runFlow:
    when:
      notVisible:
        id: 'analyse-chart-jump-to-last'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
      - runFlow:
          when:
            notVisible: 'Close drawer'
          commands:
            - tapOn:
                id: 'analyse-drawer-toggle'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 15000
      - tapOn:
          text: '^Analysis$'
          below:
            id: 'analyse-drawer-toggle'
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-jump-to-last'
      text: 'Jump to Sat, 28/02/26'
    timeout: 60000
# Fresh state: no exercise picked (the Front squat filter of part 1 is gone).
- assertVisible:
    id: 'filter-selection-summary'
    text: 'All exercises'
- tapOn:
    id: 'analyse-chart-jump-to-last'
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-Volume'
    timeout: 60000
- assertVisible:
    id: 'filter-range-label'
    text: '28 Nov 2025 – 28 Feb 2026'

# (a) no selection, no metric filter -> every metric is charted
- assertVisible: 'Volume \(sum\)'
- assertVisible:
    id: 'analyse-chart-1RM'
- assertNotVisible:
    id: 'analyse-chart-empty-range'
- assertNotVisible:
    id: 'analyse-chart-misconfigured'

# GH-642: step the period on the collapsed card. The arrow and a swipe to the
# right go one period back, a swipe to the left forward again; none expands.
# (Each step moves by the range length + 1 s, hence 28 or 29 Aug.)
- assertVisible:
    id: 'filter-range-next'
    enabled: true
- tapOn:
    id: 'filter-range-previous'
- extendedWaitUntil:
    visible:
      id: 'filter-range-label'
      text: '(28|29) Aug 2025 – 28 Nov 2025'
    timeout: 10000
- swipe:
    from:
      id: 'filter-range-label'
    direction: LEFT
    duration: 300
- extendedWaitUntil:
    visible:
      id: 'filter-range-label'
      text: '2[78] Nov 2025 – 28 Feb 2026'
    timeout: 10000
- swipe:
    from:
      id: 'filter-range-label'
    direction: RIGHT
    duration: 300
- extendedWaitUntil:
    visible:
      id: 'filter-range-label'
      text: '(28|29) Aug 2025 – 28 Nov 2025'
    timeout: 10000
- assertNotVisible:
    id: 'filter-panel-collapse'
- tapOn:
    id: 'filter-range-next'
- extendedWaitUntil:
    visible:
      id: 'filter-range-label'
      text: '2[78] Nov 2025 – 28 Feb 2026'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-Volume'
    timeout: 30000

# Custom opens the date dialog; Save without a change keeps the range.
- tapOn:
    id: 'filter-panel-card'
- extendedWaitUntil:
    visible:
      id: 'filter-panel-collapse'
    timeout: 10000
- tapOn:
    id: 'filter-range-preset-custom'
- extendedWaitUntil:
    visible: '^Save$'
    timeout: 15000
- assertVisible:
    id: 'date-range-start-input'
- waitForAnimationToEnd
- tapOn: '^Save$'
- extendedWaitUntil:
    notVisible: '^Save$'
    timeout: 15000
- assertVisible:
    id: 'filter-range-label'
    text: '2[78] Nov 2025 – 28 Feb 2026'

# (b) Volume + Frequency + Week: one tap each in the expanded panel.
- tapOn:
    id: 'filter-metric-Volume'
- tapOn:
    id: 'filter-metric-Frequency'
- tapOn:
    id: 'filter-groupby-Week'
- assertVisible:
    id: 'filter-metric-Volume'
    selected: true
- assertVisible:
    id: 'filter-metric-Frequency'
    selected: true
- assertVisible:
    id: 'filter-metric-Sets'
    selected: false
- tapOn:
    id: 'filter-panel-collapse'
- extendedWaitUntil:
    visible:
      id: 'filter-groupby-summary'
      text: 'Week · Volume, Frequency'
    timeout: 10000
- assertVisible:
    id: 'analyse-chart-Volume'
- assertVisible: 'Volume \(sum\)'
- assertVisible: 'Frequency \(training days\)'
- assertNotVisible:
    id: 'analyse-chart-1RM'
- assertNotVisible:
    id: 'analyse-chart-Sets'
- assertNotVisible:
    id: 'analyse-chart-Reps'

# (c) tap the LAST weekly Volume point (week of 23/02/26). Chart data points
# are drawn by MPAndroidChart and have no accessibility node -> coordinates.
- tapOn:
    point: '89%, 47%'
- waitForAnimationToEnd
# Swipes must start BELOW the charts: a drag across a chart re-selects a point.
- swipe:
    start: '50%, 92%'
    end: '50%, 40%'
    duration: 600
- waitForAnimationToEnd
# newest training of the tapped week first
- assertVisible: 'Sat, 28/02/26'
- repeat:
    while:
      notVisible: 'Mon, 23/02/26'
    times: 8
    commands:
      - swipe:
          start: '50%, 85%'
          end: '50%, 35%'
          duration: 600
      - waitForAnimationToEnd
# trainings of that week only - the week before is not listed
- assertVisible: 'Mon, 23/02/26'
- assertNotVisible: 'Sun, 22/02/26'
- assertNotVisible: 'Sat, 21/02/26'
# the charts are still there after the tap (not recomputed away). GH-636: scroll
# up to the asserted element itself, not to a neighbour.
- repeat:
    while:
      notVisible:
        id: 'filter-groupby-summary'
    times: 8
    commands:
      - swipe:
          start: '50%, 25%'
          end: '50%, 85%'
          duration: 600
      - waitForAnimationToEnd
- assertVisible: 'Volume \(sum\)'
- assertVisible: 'Frequency \(training days\)'
- assertVisible:
    id: 'filter-groupby-summary'
    text: 'Week · Volume, Frequency'

# =============================================================================
# Part 3 - GH-642 selection in taps: 3 most-trained exercises = 3 taps, muscles
# straight from the grid (no search), Clear; Micro group by.
# =============================================================================
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 120000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: 'analyse-chart-jump-to-last'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
      - runFlow:
          when:
            notVisible: 'Close drawer'
          commands:
            - tapOn:
                id: 'analyse-drawer-toggle'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 15000
      - tapOn:
          text: '^Analysis$'
          below:
            id: 'analyse-drawer-toggle'
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-jump-to-last'
    timeout: 60000
- assertVisible:
    id: 'filter-selection-summary'
    text: 'All exercises'
- tapOn:
    id: 'filter-panel-card'
- extendedWaitUntil:
    visible:
      id: 'filter-panel-collapse'
    timeout: 10000
- tapOn:
    id: 'filter-exercise-chip-.*'
    text: 'Adductor'
- tapOn:
    id: 'filter-exercise-chip-.*'
    text: 'Leg extension'
- tapOn:
    id: 'filter-exercise-chip-.*'
    text: 'Cable lateral raise'
- assertVisible:
    id: 'filter-exercise-section-title'
    text: 'Exercises \(3\)'
- assertVisible:
    id: 'filter-exercise-chip-.*'
    text: 'Leg extension'
    selected: true
# muscles: their own section, one tap each, no search
- scrollUntilVisible:
    element:
      id: 'filter-muscle-Quads'
    direction: DOWN
- tapOn:
    id: 'filter-muscle-Quads'
- assertVisible:
    id: 'filter-muscle-section-title'
    text: 'Muscles \(1\)'
- assertVisible:
    id: 'filter-muscle-Quads'
    selected: true
- scrollUntilVisible:
    element:
      id: 'filter-panel-collapse'
    direction: UP
- tapOn:
    id: 'filter-panel-collapse'
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'Adductor, Leg extension, Cable lateral raise · Quads'
    timeout: 10000
# Clear empties the muscle selection only
- tapOn:
    id: 'filter-panel-card'
- scrollUntilVisible:
    element:
      id: 'filter-muscle-clear'
    direction: DOWN
- tapOn:
    id: 'filter-muscle-clear'
- assertVisible:
    id: 'filter-muscle-section-title'
    text: 'Muscles \(0\)'
- assertVisible:
    id: 'filter-exercise-section-title'
    text: 'Exercises \(3\)'
# Group by Micro: one tap, grouped by the micros of a plan
- scrollUntilVisible:
    element:
      id: 'filter-groupby-Micro'
    direction: UP
- tapOn:
    id: 'filter-groupby-Micro'
- scrollUntilVisible:
    element:
      id: 'filter-panel-collapse'
    direction: UP
- tapOn:
    id: 'filter-panel-collapse'
- extendedWaitUntil:
    visible:
      id: 'filter-groupby-summary'
      text: 'Micro \(.+\) · All metrics'
    timeout: 10000
- assertNotVisible:
    id: 'analyse-error-boundary'

# ------------------------------------- GH-225: Metrics Overview from the drawer
- tapOn:
    id: 'analyse-drawer-toggle'
- runFlow:
    when:
      notVisible: 'Close drawer'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 15000
- tapOn:
    text: '^Metrics Overview$'
    below:
      id: 'analyse-drawer-toggle'
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: 'Close drawer'
    timeout: 15000
- assertVisible: '^Metrics Overview$'
# Its own filter panel: exercises and muscles only (no group by / metrics line).
- runFlow:
    when:
      visible:
        id: 'filter-panel-collapse'
    commands:
      - tapOn:
          id: 'filter-panel-collapse'
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'All exercises'
    timeout: 30000
- assertNotVisible:
    id: 'filter-groupby-summary'
- assertNotVisible:
    id: 'analyse-error-boundary'
