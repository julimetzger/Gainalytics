appId: com.powerliftingworkoutplanner
name: AI-447 Chat leaves the loading state with the reported large model
---
# GH-447: with a larger model entered in Settings the chat used to sit in "AI is thinking…"
# forever — no text, no error, no way to cancel. This flow proves that with exactly the
# reported model the chat shows live progress and then leaves the loading state with an answer.
#
# Prerequisites on the device:
#   - the Anthropic API key is stored in Settings
#   - baseline.gains has been imported (00_import_baseline.yaml)
# Cost note: this flow makes ONE real request, with a one-line question and a 2-token answer.
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000

# ── Put the reported model into the Settings field ───────────────────────────
- tapOn:
    id: 'tab-settings'
- extendedWaitUntil:
    visible: 'AI Coach (Anthropic Claude)'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'settings-anthropic-model-input'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'settings-anthropic-model-input'
- eraseText
- inputText: 'claude-opus-5'
- hideKeyboard

# The field stays a free text input with unchanged meaning — prove the reported model is set.
- copyTextFrom:
    id: 'settings-anthropic-model-input'
- assertTrue: ${maestro.copiedText === 'claude-opus-5'}

# ── Send a short question in the AI Chat ─────────────────────────────────────
- tapOn: 'Analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'AI Chat'
    timeout: 10000
- tapOn: 'AI Chat'
- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 20000

- tapOn:
    id: 'chat-input'
- inputText: 'Answer with the single word READY'
- hideKeyboard
- tapOn:
    id: 'chat-send-button'

# While the request runs the app must visibly be working: an elapsed counter and a Stop button.
- assertVisible:
    id: 'chat-stop-button'
- copyTextFrom:
    id: 'chat-loading-elapsed'
- assertTrue: ${maestro.copiedText.indexOf('AI is thinking') === 0}
- takeScreenshot: ai447-chat-loading-with-elapsed

# ── The core assertion: the chat leaves the loading state ────────────────────
- extendedWaitUntil:
    notVisible:
      id: 'chat-loading'
    timeout: 150000
- assertNotVisible:
    id: 'chat-stop-button'

# An answer actually arrived — assert its value, not just that a bubble exists.
- copyTextFrom:
    id: 'chat-bubble-assistant-markdown'
- assertTrue: ${maestro.copiedText.indexOf('READY') >= 0}
- takeScreenshot: ai447-chat-answer-arrived
