appId: com.powerliftingworkoutplanner
---
# GH-518 helper: scroll until the Plans header with its "New Training" button is fully visible.
- scrollUntilVisible:
    element:
      id: 'add-trainings-plan'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 30000
- swipe:
    start: '50%, 60%'
    end: '50%, 45%'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'add-trainings-plan'
    text: 'New Training'
