appId: com.powerliftingworkoutplanner
---
# GH-467: swiping to the previous / next micro keeps the active sub-tab.
# Prerequisite: baseline fixture imported (00_import_baseline.yaml); the plan opens on its last micro (7),
# so the flow swipes to the previous micros first (finished trainings, which default to Analysis).
# Asserts the resulting content (analysis-tab present / absent), not just that a swipe happened.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'next-training-start-button'
    timeout: 60000
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible: 'Micro 7.*'
    timeout: 20000

# ── Plan: previous x2, then next x2 ──────────────────────────────────────────
- tapOn:
    id: 'subtab-plan'
- assertNotVisible:
    id: 'analysis-tab'
- takeScreenshot: ${OUT}/01_plan_micro7
- swipe: {start: '15%, 60%', end: '85%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 6.*'
    timeout: 10000
- assertNotVisible:
    id: 'analysis-tab'
- assertVisible: 'Plan new Training'
- takeScreenshot: ${OUT}/02_plan_after_previous
- swipe: {start: '15%, 60%', end: '85%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 5.*'
    timeout: 10000
- assertNotVisible:
    id: 'analysis-tab'
- swipe: {start: '85%, 60%', end: '15%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 6.*'
    timeout: 10000
- assertNotVisible:
    id: 'analysis-tab'
- assertVisible: 'Plan new Training'
- takeScreenshot: ${OUT}/03_plan_after_next

# ── Analysis chosen after swiping is carried on the next swipes ──────────────
- tapOn:
    id: 'subtab-analysis'
- extendedWaitUntil:
    visible:
      id: 'analysis-tab'
    timeout: 10000
- swipe: {start: '85%, 60%', end: '15%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 7.*'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'analysis-tab'
    timeout: 10000
- takeScreenshot: ${OUT}/04_analysis_after_next
- swipe: {start: '15%, 60%', end: '85%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 6.*'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'analysis-tab'
    timeout: 10000
- takeScreenshot: ${OUT}/05_analysis_after_previous

# ── Train ────────────────────────────────────────────────────────────────────
- tapOn:
    id: 'subtab-train'
- assertNotVisible:
    id: 'analysis-tab'
- swipe: {start: '15%, 60%', end: '85%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 5.*'
    timeout: 10000
- assertNotVisible:
    id: 'analysis-tab'
# micro 5 has a finished training: its logged sets are what the Train tab shows
- assertVisible: 'Bankdrücken'
- takeScreenshot: ${OUT}/06_train_after_previous
- swipe: {start: '85%, 60%', end: '15%, 60%', duration: 400}
- extendedWaitUntil:
    visible: 'Micro 6.*'
    timeout: 10000
- assertNotVisible:
    id: 'analysis-tab'
- assertVisible: 'Nothing planned for this day yet.'
- takeScreenshot: ${OUT}/07_train_after_next
