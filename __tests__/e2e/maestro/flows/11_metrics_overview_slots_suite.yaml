appId: com.powerliftingworkoutplanner
---
# Wrapper suite for the Metrics Overview flow.
# GH-225: pin the starting tab to Training before delegating to the parent
# flow so it does not depend on whichever tab the previous flow left active.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000
- runFlow: 11_metrics_overview_slots.yaml
