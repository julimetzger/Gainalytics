appId: com.powerliftingworkoutplanner
name: GH-478 palette stored before the update
---
# Run after a palette was stored by the PRE-GH-478 app (Green preset, or a
# custom colour from the wheel) — see the GH-478 run notes. Pass the expected
# colour name: `-e EXPECT=Green` or `-e EXPECT=#3F51B5`.
# Proves the stored value selects the Custom segment and is named on it.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "^settings-section-theme$"
    timeout: 30000
- assertVisible:
    id: "^settings-palette-custom$"
    checked: true
- assertVisible:
    id: "^settings-palette-blue$"
    checked: false
- assertVisible:
    id: "^settings-palette-purple$"
    checked: false
- assertVisible:
    id: "^settings-palette-custom$"
    text: "Custom ${EXPECT}"
