appId: com.powerliftingworkoutplanner
---
# Import a second video for Analysis #2
# Assumes: app just launched or is on any tab

# Step 1: Navigate to Analyse tab via bottom nav (63%,89% = Analyse tab)
- tapOn:
    point: "63%,89%"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 15000

# Step 2: Open the Analyse drawer via hamburger (6%,6%)
- tapOn:
    point: "6%,6%"
- extendedWaitUntil:
    visible: "Video Analyses"
    timeout: 10000

# Step 3: Navigate to Video Analyses
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"

# Step 4: Tap Import Video button
- tapOn: "Import Video"

# Handle permission dialog if shown
- runFlow:
    when:
      visible:
        text: "(?i)allow"
    commands:
      - tapOn:
          text: "(?i)allow"

# Wait for media picker to open
- extendedWaitUntil:
    visible: "Videos"
    timeout: 15000

# Ensure Videos tab is active
- tapOn: "Videos"

# Wait for video thumbnails to load
- extendedWaitUntil:
    visible: "Neueste"
    timeout: 10000

# Tap first short video - try 00:40 first, then 00:43, then top-right thumbnail
- runFlow:
    when:
      visible: "00:40"
    commands:
      - tapOn: "00:40"
- runFlow:
    when:
      visible:
        text: "00:43"
    commands:
      - tapOn:
          text: "00:43"

# Wait to return to the app after picking video
- extendedWaitUntil:
    visible: "Analysis #"
    timeout: 30000

# Verify a new analysis entry exists
- assertVisible:
    text: "Analysis #[0-9]+"
