appId: com.powerliftingworkoutplanner
---
# Freshly imported baseline.gains: Next Training card -> "Plan this Training" ->
# "Suggest based on last Training" leaves a PLANNED training with exercises on screen.
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- tapOn: 'Plan this Training'
- tapOn: '^Suggest based on last Training$'
- extendedWaitUntil:
    visible:
      id: 'training-exercise-.*'
    timeout: 15000
