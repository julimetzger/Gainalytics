appId: com.powerliftingworkoutplanner
---
# GH-351: Tap-to-seek regression evidence on the Video Analysis Detail screen.
#
# The GH-351 fix clamps the chart's reported visible x-range to the axis bounds
# so tap-to-seek and the velocity marker stay aligned with the rendered curve.
# Maestro cannot pinch-zoom or fling the chart, so the zoomed/fling scenario is
# verified by screen recordings (see PR evidence). This flow guards the shared
# tap-to-seek → velocity-readout binding on the unzoomed chart:
# tapping the velocity plot must seek the player and update the current-velocity
# readout next to the video to a real numeric value different from before.
#
# Prerequisites (like gh307_marker_window_evidence.yaml):
# - The device has at least one VideoAnalysis with status done and a local video.
# - Do NOT clear app state: the flow verifies against the user's real data.
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
# Navigate Analyse tab → drawer → Video Analyses
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analyses'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analyses'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
- assertVisible:
    text: 'Done'
    index: 0
# Open the newest analysis
- tapOn:
    id: 'video-analysis-row-.*'
    index: 0
- extendedWaitUntil:
    visible:
      text: 'Status: done'
    timeout: 30000
# Scroll so the video and the velocity plot are on screen. Swipe along the
# right screen edge: a centered swipe is consumed by the playback overlay's
# gesture handlers (see gh307 flow).
- swipe:
    start: 97%, 80%
    end: 97%, 35%
    duration: 1500
- extendedWaitUntil:
    visible:
      id: 'video-analysis-playback-speed-chart'
    timeout: 15000
- takeScreenshot: 'gh351_01_detail_before_tap'
# Read the current velocity readout (stats panel next to the video shows the
# velocity at playback position t=0).
- copyTextFrom:
    text: '-?[0-9]+\.[0-9]+ (m/s|px/s)'
- evalScript: |
    output.velocityBefore = maestro.copiedText;
# Tap the velocity plot (element center → seeks to the middle of the timeline).
- tapOn:
    id: 'video-analysis-playback-speed-chart'
- waitForAnimationToEnd:
    timeout: 5000
# GH-351 value assertion: the velocity readout must now show the velocity at
# the tapped timeline position — a parseable number different from the t=0
# readout, proving the tap seeked the player and re-bound the readout.
- copyTextFrom:
    text: '-?[0-9]+\.[0-9]+ (m/s|px/s)'
- evalScript: |
    output.velocityAfter = maestro.copiedText;
    var before = parseFloat(output.velocityBefore);
    var after = parseFloat(output.velocityAfter);
    if (isNaN(after)) {
      throw 'GH-351: velocity readout after chart tap is not numeric: ' + output.velocityAfter;
    }
    if (output.velocityAfter === output.velocityBefore) {
      throw 'GH-351: velocity readout did not change after chart tap (still ' + output.velocityBefore + ') — tap-to-seek did not seek';
    }
- takeScreenshot: 'gh351_02_detail_after_tap'
