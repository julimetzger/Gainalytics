appId: com.powerliftingworkoutplanner
---
# GH-543 helper: open the rest timer overflow menu on a running training.
# The Menu.Item testIDs are not exposed, so the open menu is detected by its
# text ('Skip rest' — case-insensitive, matches the old and new label).
# Never fall back to a point tap here: when the menu is already open the point
# lands on "Skip rest" and stops the timer.
- tapOn:
    id: 'rest-timer-overflow'
- extendedWaitUntil:
    visible: 'Skip rest'
    timeout: 5000
