appId: com.powerliftingworkoutplanner
---
# GH-418 — getting into the full edit mode is obvious: "Edit plan" opens it, a tap
# on a value opens the editor with exactly that field focused, and "Done" is the
# one way out. A long press does nothing any more (owner feedback on PR #520).
# Precondition: baseline imported (Micro 69 "Push" is PLANNED; Adductor =
# exercise 32, set 2 = 12 x 100 kg).
- runFlow: gh466_goto_push.yaml
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-read-exercise-header-32'
    timeout: 15000
# Read view: the "Plan" label, no editing kicker, no Done.
- assertVisible:
    id: 'header-plan-label'
- assertNotVisible:
    id: 'header-plan-editing-kicker'
- assertNotVisible:
    id: 'header-plan-done-button'
- takeScreenshot: gh418_edit_01_read_view

# 1. A long press on a workout no longer opens the editing.
- longPressOn:
    id: 'plan-read-exercise-header-32'
- waitForAnimationToEnd
- assertVisible:
    id: 'header-plan-label'
- assertNotVisible:
    id: 'header-plan-editing-kicker'
- assertVisible:
    id: 'plan-read-exercise-header-32'

# 2. "Edit plan" opens the full edit mode: only the edit chrome, Done to leave.
- tapOn:
    id: 'header-overflow-icon'
- tapOn:
    id: 'overflow-edit-plan'
- extendedWaitUntil:
    visible:
      id: 'header-plan-editing-kicker'
    timeout: 10000
- assertVisible:
    id: 'header-plan-editing-kicker'
    text: 'EDITING PLAN'
- assertVisible:
    id: 'header-plan-done-button'
- assertVisible:
    id: 'plan-edit-exercise-section-32'
- assertNotVisible:
    id: 'header-plan-label'
- takeScreenshot: gh418_edit_02_edit_plan_opened_editing
- tapOn:
    id: 'header-plan-done-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-label'
    timeout: 10000
- assertNotVisible:
    id: 'header-plan-editing-kicker'
- scrollUntilVisible:
    element:
      id: 'plan-read-exercise-header-32'
    direction: UP
    timeout: 20000

# 3. A tap on a value opens the editor with that very field focused and selected.
- tapOn:
    id: 'plan-set-2-weight-cell'
    below:
      id: 'plan-read-exercise-header-32'
- extendedWaitUntil:
    visible:
      id: 'header-plan-editing-kicker'
    timeout: 10000
- assertVisible:
    id: 'plan-set-2-weight-input'
    focused: true
    text: '100'
- takeScreenshot: gh418_edit_03_tapped_value_focused
# The value is selected, so typing replaces it.
- inputText: '105'
- assertVisible:
    id: 'plan-set-2-weight-input'
    focused: true
    text: '105'
- tapOn:
    id: 'header-plan-done-button'
- extendedWaitUntil:
    visible:
      id: 'plan-read-exercise-header-32'
    timeout: 10000
- assertVisible:
    id: 'plan-set-2-weight-cell'
    text: '.*105.*'
    below:
      id: 'plan-read-exercise-header-32'
- takeScreenshot: gh418_edit_04_saved_with_done
