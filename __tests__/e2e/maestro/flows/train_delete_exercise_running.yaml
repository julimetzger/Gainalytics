appId: com.powerliftingworkoutplanner
---
# Feature F4 Training execution — T4.3 train_delete_exercise_running (crash fix GH-486)
#
# Purpose: deleting an exercise that the RUNNING training uses must not crash
# the app; the delete dialog says what goes with it (with counters), Cancel
# changes nothing, and the training stays openable, continuable and finishable.
#
# Data basis: baseline import (mutates: creates/deletes exercises, starts and
# finishes a training) -> starts with 00_import_baseline.yaml. Current plan
# "Push pull", next slot Meso 1 · M6 · D1 "Push squat" planned via
# "Suggest based on last Training" (10 exercises). Highest baseline exercise id
# is 84, so the two exercises created here are 85 ("GH486 With sets") and
# 86 ("GH486 No sets").
#
# Merged from: gh486_delete_exercise_in_running_training (base).
#   Dropped: gh486_delete_only_exercise (the "last remaining exercise" case
#   needs two special fixtures; owner decision: smallest sensible option).
#   Replaced the base flow's coordinate taps: bottom tabs by their
#   accessibility labels, Train-tab buttons by testID.

- runFlow: 00_import_baseline.yaml

# PRECONDITION: baseline imported, next slot "Push squat" still empty.
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 0 exercises'

# ---- plan from the last D1 and start ----
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'train-tab-go-to-plan-button'
    timeout: 60000
- tapOn:
    id: 'train-tab-go-to-plan-button'
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- tapOn:
    id: 'training-suggest-last-training-button'
- extendedWaitUntil:
    notVisible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
- tapOn:
    id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 10 exercises'

# ---- 1. create two exercises ----
- tapOn: 'tab-exercises'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000
- tapOn:
    id: 'exercise-fab-new'
- tapOn:
    id: 'edit-exercise-name'
- inputText: 'GH486 With sets'
- tapOn:
    id: 'edit-exercise-save'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000
- tapOn:
    id: 'exercise-fab-new'
- tapOn:
    id: 'edit-exercise-name'
- inputText: 'GH486 No sets'
- tapOn:
    id: 'edit-exercise-save'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000

# ---- 2. add both to the running training ----
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
# The "+" tile is the LAST cell of the horizontal exercise strip; there is no
# selector-driven horizontal scroll, so the strip is swiped by position (the
# strip's y = 20 %, measured on device in GH-486).
- repeat:
    times: 4
    while:
      notVisible:
        id: 'training-add-exercise-box'
    commands:
      - swipe:
          start: '90%,20%'
          end: '10%,20%'
          duration: 300
- tapOn:
    id: 'training-add-exercise-box'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000
- assertVisible: '10 selected'
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'GH486'
- extendedWaitUntil:
    visible: 'GH486 With sets'
    timeout: 20000
- tapOn:
    text: 'GH486 With sets'
    below:
      id: 'search-bar'
- waitForAnimationToEnd:
    timeout: 3000
# Re-tap only if the first tap was eaten (count unchanged AND the filtered row
# still there); selecting clears the search, so an unguarded re-tap would
# toggle whatever row is now at that spot.
- runFlow:
    when:
      notVisible: '11 selected'
      visible:
        text: 'GH486 With sets'
        below:
          id: 'search-bar'
    commands:
      - tapOn:
          text: 'GH486 With sets'
          below:
            id: 'search-bar'
          optional: true
- extendedWaitUntil:
    visible: '11 selected'
    timeout: 20000
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'GH486 No'
- extendedWaitUntil:
    visible: 'GH486 No sets'
    timeout: 20000
- tapOn:
    text: 'GH486 No sets'
    below:
      id: 'search-bar'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: '12 selected'
      visible:
        text: 'GH486 No sets'
        below:
          id: 'search-bar'
    commands:
      - tapOn:
          text: 'GH486 No sets'
          below:
            id: 'search-bar'
          optional: true
- extendedWaitUntil:
    visible: '12 selected'
    timeout: 20000
# One BACK closes keyboard and picker; the training stays open.
- back
- waitForAnimationToEnd:
    timeout: 5000

# ---- 3. log exactly one set for "GH486 With sets" (id 85) ----
- repeat:
    times: 4
    while:
      notVisible:
        id: '^training-exercise-85$'
    commands:
      - swipe:
          start: '90%,20%'
          end: '10%,20%'
          duration: 300
- tapOn:
    id: '^training-exercise-85$'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: '^add-workout-set-reps-input$'
- inputText: '6'
- tapOn:
    id: '^add-workout-set-weight-input$'
- inputText: '40'
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: '^add-workout-set-logged-1$'
    timeout: 20000
- assertNotVisible:
    id: '^add-workout-set-logged-2$'
- back
- runFlow:
    when:
      notVisible:
        id: 'training-home-screen'
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 12 exercises'

# ---- 4. delete "GH486 No sets" (in the running training, no sets) ----
- tapOn: 'tab-exercises'
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: '^exercise-searchbar$'
- eraseText: 30
- inputText: 'GH486'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: '^exercise-row-86$'
    timeout: 30000
- assertVisible:
    id: '^exercise-row-85$'
- tapOn:
    id: '^exercise-row-86$'
- tapOn:
    id: 'exercise-detail-edit-button'
- scrollUntilVisible:
    element:
      id: 'edit-exercise-delete'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: '^edit-exercise-delete$'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-delete-running'
    timeout: 10000
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training and will be removed from it\. No sets were logged for it there yet\.'
- assertVisible:
    id: 'edit-exercise-delete-history'
    text: 'This will also delete 0 workouts from your history\. This action cannot be undone\.'
- tapOn:
    id: 'edit-exercise-delete-confirm'
- extendedWaitUntil:
    notVisible:
      id: '^exercise-row-86$'
    timeout: 20000

# ---- 5. delete "GH486 With sets": Cancel first, then confirm ----
- tapOn:
    id: '^exercise-row-85$'
- tapOn:
    id: 'exercise-detail-edit-button'
- scrollUntilVisible:
    element:
      id: 'edit-exercise-delete'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: '^edit-exercise-delete$'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-delete-running'
    timeout: 10000
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training\. It will be removed from it, together with the 1 set you logged there\.'
- assertVisible:
    id: 'edit-exercise-delete-history'
    text: 'This will also delete 1 workout \(1 set\) from your history\. This action cannot be undone\.'
- tapOn:
    id: 'edit-exercise-delete-cancel'
- assertNotVisible:
    id: 'edit-exercise-delete-running'
# Cancel changed nothing: same sheet, same counters.
- assertVisible: 'Edit GH486 With sets'
- tapOn:
    id: '^edit-exercise-delete$'
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training\. It will be removed from it, together with the 1 set you logged there\.'
- tapOn:
    id: 'edit-exercise-delete-confirm'
- extendedWaitUntil:
    notVisible:
      id: '^exercise-row-85$'
    timeout: 20000
- assertNotVisible: 'Render Error'

# ---- 6. reopen the running training, continue, finish ----
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 10 exercises'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- assertNotVisible: 'Render Error'
- assertNotVisible:
    id: '^training-exercise-85$'
- assertNotVisible:
    id: '^training-exercise-86$'
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-finish'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'overflow-finish'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertNotVisible: 'Render Error'
- back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, Push squat, Meso 1 · M6 · D1 · today.*'

# ---- 7. other views that reference the exercise still render ----
# The finished training opens on its Analysis.
- tapOn:
    id: 'last-training-card-pressable'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 60000
- assertNotVisible: 'Render Error'
- back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
