appId: com.powerliftingworkoutplanner
---
# Feature F3 Training planning — T3.1 plan_create_meso_template
#
# Purpose:
#   A) An empty planned slot offers "Plan new Training"; it enters the full edit
#      mode directly (EDITING PLAN, burger still there, empty-state hint instead
#      of an auto-opened picker) (GH-240, GH-303).
#   B) "New Training" with an empty name: Save keeps the dialog open and says
#      why (GH-428 H1). Then an EMPTY plan is created (Meso 1 / Micro 1).
#   C) Plan drawer of that plan: the last meso cannot be deleted; "Add Meso"
#      creates "Meso 2", "Add Training" creates "Training 1" (GH-509, TRN-004);
#      a second meso CAN be deleted again and Meso 1 stays (TRN-004 r4).
#   D) "From template" (GH-497): "Strength Block" is created as a draft plan with
#      1RM-based weights; a second plan from the same template keeps a typed
#      name and reuses the same exercise ids (no duplicates).
#
# Data basis: baseline import (mutates: creates three plans) -> starts with
# 00_import_baseline.yaml. Baseline plan ids are 1, 3, 4, 5 (new id = max + 1):
#   empty plan "TRN004 Test Plan" = 6, "Strength Block" = 7, "Strength Block 2" = 8.
#   A new plan becomes the CURRENT plan (GH-518), so part A runs first, while the
#   Next Training card still points at "Push pull" Meso 1 · M6 · D1 "Push squat"
#   (no training object yet).
#   Template exercises: Squat is reused (id 2, 1RM 225 -> 4 x 6 @ RIR 3 =
#   172.5 kg); Bench Press / Leg Curls / Row are created once as 85 / 86 / 87
#   (highest baseline exercise id is 84).
#
# Merged from: trn004_meso_create_verify, gh428_plan_name_required,
#   gh509_sidebar_add_buttons, gh509_drawer_in_plan_edit,
#   gh497_template_later_no_duplicates, trn004_r4_feedback_fixes,
#   gh240_plan_mode_button, test-gh303-plan.
#   Dropped: gh509 LONG_LIST part and the plan-edit-drawer duplicate (same
#   buttons, coordinate sub-tab taps); trn004_r4 header micro-number checks on
#   "Push pull" (covered by the meso/micro header assertions here); GH-428
#   whitespace-only name (same code path as the empty name).

- runFlow: 00_import_baseline.yaml

# PRECONDITION: baseline imported, current plan "Push pull", next slot empty.
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M6 · D1 · 0 exercises'

# ===== A) "Plan new Training" enters full edit directly (GH-240 / GH-303) =====
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 60000
# No training object in this slot yet: the Train tab points at the Plan tab.
- extendedWaitUntil:
    visible:
      id: 'train-tab-go-to-plan-button'
    timeout: 30000
- tapOn:
    id: 'train-tab-go-to-plan-button'
- extendedWaitUntil:
    visible:
      id: 'training-plan-mode-button'
    timeout: 30000
- assertVisible:
    id: 'training-plan-mode-button-text'
    text: 'Plan new Training'
- assertVisible:
    id: 'training-suggest-last-training-button-text'
    text: '^Suggest based on last Training$'
- assertVisible:
    id: 'training-suggest-last-planned-training-button-text'
    text: '^Suggest based on last planned Training$'
- assertNotVisible:
    id: 'header-plan-editing-kicker'
- tapOn:
    id: 'training-plan-mode-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-editing-kicker'
    timeout: 15000
- assertVisible:
    id: 'header-plan-editing-kicker'
    text: 'EDITING PLAN'
# The burger stays usable in full edit, and the picker did NOT auto-open
# (its modal would cover the hint).
- assertVisible:
    id: 'drawer-menu-button'
- assertVisible:
    id: 'plan-edit-empty-hint'
    text: 'Pick an exercise from the picker above to start planning\.'
# Back to the dashboard (BACK first leaves full edit, then the screen).
- repeat:
    times: 3
    while:
      notVisible:
        id: 'training-home-screen'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000

# ===== B) name is required, then create an empty plan (GH-428 / TRN-004) =====
- scrollUntilVisible:
    element:
      id: 'add-trainings-plan'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'add-trainings-plan'
- extendedWaitUntil:
    visible:
      id: '^plan-name-input$'
    timeout: 30000
- tapOn:
    id: 'confirm-trainings-plan'
# The dialog is still open AND explains itself.
- assertVisible:
    id: '^plan-name-input$'
- assertVisible:
    id: 'plan-name-error'
    text: 'Please enter a name for the training plan\.'
- tapOn:
    id: '^plan-name-input$'
- inputText: 'TRN004 Test Plan'
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    notVisible: 'Add New Training Plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: '^plan-name-6$'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: '^plan-name-6$'
    text: 'TRN004 Test Plan'
- assertVisible:
    id: '^plan-meta-6$'
    text: 'Draft · no trainings yet'
# The rejected save created nothing.
- assertNotVisible: 'Unnamed plan'
- assertVisible:
    id: 'meso-card-6-1'
    text: 'Meso 1'
- tapOn:
    id: 'meso-card-6-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- assertVisible:
    id: 'header-plan-meso-name'
    text: 'TRN004 Test Plan › Meso 1'
- assertVisible: 'Micro 1'

# ===== C) plan drawer: last meso, Add Meso, Add Training, delete meso =====
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: 'drawer-meso-name-1'
    text: 'Meso 1'
# The only meso cannot be deleted: a long press offers no delete button.
- longPressOn:
    id: 'drawer-meso-name-1'
- waitForAnimationToEnd
- assertVisible:
    id: 'drawer-meso-name-1'
    text: 'Meso 1'
- assertNotVisible:
    id: 'delete-meso-1'
# Dashed buttons create the next meso / training; the rows must not exist before.
- assertVisible: 'Add Meso'
- assertVisible: 'Add Training'
- assertNotVisible:
    id: 'drawer-meso-name-2'
- tapOn:
    id: 'icon-plus-circle'
- extendedWaitUntil:
    visible:
      id: 'drawer-meso-name-2'
      text: 'Meso 2'
    timeout: 10000
- assertNotVisible: 'Training 1'
- tapOn:
    id: 'drawer-add-training-button'
- extendedWaitUntil:
    visible: 'Training 1'
    timeout: 10000
# With two mesos the second one can be deleted again; Meso 1 stays.
- longPressOn:
    id: 'drawer-meso-name-2'
- extendedWaitUntil:
    visible:
      id: 'delete-meso-2'
    timeout: 5000
- tapOn:
    id: 'delete-meso-2'
- extendedWaitUntil:
    notVisible:
      id: 'drawer-meso-name-2'
    timeout: 10000
- assertVisible:
    id: 'drawer-meso-name-1'
    text: 'Meso 1'
# Close the drawer with its toggle (BACK would pop the screen).
- tapOn:
    id: 'drawer-menu-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'header-plan-meso-name'
    text: 'TRN004 Test Plan › Meso 1'
- repeat:
    times: 3
    while:
      notVisible:
        id: 'training-home-screen'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000

# ===== D) plans from a program template (GH-497) =====
- scrollUntilVisible:
    element:
      id: 'add-trainings-plan'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'add-trainings-plan'
- tapOn:
    id: 'plan-source-template'
- tapOn:
    id: 'program-template-strength-block'
# The template name becomes the default plan name.
- assertVisible:
    id: '^plan-name-input$'
    text: 'Strength Block'
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    notVisible: 'Add New Training Plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'meso-card-7-1'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: '^plan-name-7$'
    text: 'Strength Block'
- assertVisible:
    id: '^plan-meta-7$'
    text: 'Draft · planned, not started'
- tapOn:
    id: 'meso-card-7-1'
- extendedWaitUntil:
    visible:
      id: '^training-exercise-2$'
    timeout: 30000
- assertVisible:
    id: '^training-exercise-85$'
- assertVisible:
    id: '^training-exercise-86$'
- assertVisible:
    id: '^training-exercise-87$'
- runFlow:
    when:
      notVisible: '4 sets'
    commands:
      - tapOn:
          id: 'subtab-plan'
- extendedWaitUntil:
    visible: '4 sets'
    timeout: 15000
# Squat weights suggested from the 1RM: 225 / (1 + 9/30) -> 172.5 kg.
- assertVisible: '172\.5'

# Second plan from the same template, with a typed name.
- tapOn: 'tab-training'
- repeat:
    times: 3
    while:
      notVisible:
        id: 'training-home-screen'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'add-trainings-plan'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'add-trainings-plan'
- tapOn:
    id: '^plan-name-input$'
- inputText: 'Strength Block 2'
- tapOn:
    id: 'plan-source-template'
- tapOn:
    id: 'program-template-strength-block'
# A typed name is kept when a template is picked.
- assertVisible:
    id: '^plan-name-input$'
    text: 'Strength Block 2'
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    notVisible: 'Add New Training Plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'meso-card-8-1'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: '^plan-name-8$'
    text: 'Strength Block 2'
- assertVisible:
    id: '^plan-meta-8$'
    text: 'Draft · planned, not started'
- tapOn:
    id: 'meso-card-8-1'
- extendedWaitUntil:
    visible:
      id: '^training-exercise-2$'
    timeout: 30000
# Same exercise ids as plan 7: nothing was duplicated (a duplicate would be 88+).
- assertVisible:
    id: '^training-exercise-85$'
- assertVisible:
    id: '^training-exercise-86$'
- assertVisible:
    id: '^training-exercise-87$'
- assertNotVisible:
    id: '^training-exercise-88$'
- assertVisible:
    id: 'header-plan-meso-name'
    text: 'Strength Block 2 › .*'
