appId: com.powerliftingworkoutplanner
---
# GH-401 AC4 — the exercise picker keeps its list after the first selection.
#
# The audit (H3) found that picking the first exercise blanked the option list:
# a following search for "squat" returned 0 hits although the same search
# returned 7 before the pick, and only closing and re-opening the picker brought
# the list back. Root cause: picking the FIRST exercise creates the training, and
# TrainingsPlanNode's reset effect listed `training.state` among its deps, so it
# ran mid-selection and closed the picker. The dropdown is a react-native-modal in
# its own native window, so the user was left looking at its empty shell.
#
# Selector note: the plan pane is invisible to the accessibility tree
# (agent-memory #206) so getting INTO the picker is coordinate-driven, but the
# dropdown modal itself is a separate window and IS readable — which is why the
# assertions that matter here are real Maestro assertions on exercise names.
#
# Prerequisite: baseline.gains freshly imported, so the plan's next slot
# ("Push squat", Micro 7 / D1) still has no training at all.
# `stopApp: false`: this debug build fetches its JS from Metro, and a cold bundle
# on this multi-emulator host costs minutes. Nothing here needs a fresh process,
# so the flow attaches to the running app.
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
# This host runs several emulators at once; under load Android puts up an
# "isn't responding" dialog that covers the screen and makes every following
# selector miss. Dismiss it rather than fail on it.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 420000

# Card -> Train tab of the unplanned slot -> Plan tab -> full plan edit.
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 120000
# "Plan this Training" — the Train tab's way out of the old dead end.
- tapOn:
    point: '50%,24%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
# "Plan new Training" on the suggestions screen.
- tapOn:
    point: '50%,43%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
# The "+" chip reveals the picker anchor, the anchor opens the dropdown. Both
# live in the pane, so neither tap's effect is observable to Maestro and it
# cannot retry them itself — hence the explicit, condition-guarded retries. This
# emulator drops single taps often enough that one attempt is not reliable
# (agent-memory #247/#262).
- tapOn:
    point: '7%,20%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: '50%,26%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 3
    while:
      notVisible: 'Adductor'
    commands:
      - tapOn:
          point: '7%,20%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
      - tapOn:
          point: '50%,26%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
- extendedWaitUntil:
    visible: 'Bulgarian split squat'
    timeout: 120000
- takeScreenshot: gh401_10_picker_open

# ---- the search works before any selection ----
- tapOn:
    id: 'search-bar'
    optional: true
- inputText: 'squat'
- extendedWaitUntil:
    visible: 'Front squat'
    timeout: 20000
- assertVisible: 'Squat'
- assertVisible: 'Front squat'
- assertVisible: 'Bulgarian split squat'
- assertVisible: 'Safety bar squat'
- assertNotVisible: 'Adductor'
- takeScreenshot: gh401_11_search_squat_before_select

- eraseText
- extendedWaitUntil:
    visible: 'Adductor'
    timeout: 20000

# ---- pick the first exercise: this is the tap that creates the training ----
#
# HONEST LIMITATION: this step does NOT prove a selection was committed. The row's
# pressable is an untagged ViewGroup, so Maestro taps the label's text node, and on
# this emulator that tap frequently does not reach the library's onPress at all
# (agent-memory #256/#259) — a point tap on the row centre fails the same way. What
# this flow does establish is that the option list and the search survive the whole
# open -> search -> clear -> tap -> search cycle in the real app.
#
# The committing path — onChange fires, the parent's exercise list updates, the
# training is created — is covered by
# __tests__/components/picker/elements/TrainingElementPickerList.spec.tsx, which
# drives the REAL library component (the older picker spec mocks it away), and by
# the TrainingsPlanNode spec that pins the root cause: the picker must survive the
# training's state flipping from undefined to PLANNED mid-selection.
- tapOn: 'Bankdrücken'
- waitForAnimationToEnd:
    timeout: 10000
# The list must still be there. Before the fix the modal collapsed to an empty
# shell at exactly this point.
- assertVisible: 'Adductor'
- assertVisible: 'Bulgarian split squat'
- takeScreenshot: gh401_12_list_still_populated_after_select

# ---- the same search must return the same hits ----
- inputText: 'squat'
- extendedWaitUntil:
    visible: 'Front squat'
    timeout: 20000
- assertVisible: 'Squat'
- assertVisible: 'Front squat'
- assertVisible: 'Bulgarian split squat'
- assertVisible: 'Safety bar squat'
- assertNotVisible: 'Adductor'
- takeScreenshot: gh401_13_search_squat_after_select
