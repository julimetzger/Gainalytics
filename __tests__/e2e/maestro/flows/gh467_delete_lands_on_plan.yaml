appId: com.powerliftingworkoutplanner
---
# GH-467 (round 2): deleting a finished training that is open on its DEFAULT Analysis tab (no sub-tab tapped)
# lands on the Plan tab, where a new training can be planned — not on an empty Analysis screen.
# Prerequisite: gh467_finish_throwaway_training.yaml, so "Last Training" is the throwaway training this flow deletes.
# "Last Training" opens the screen without a sub-tab request, so the tab shown is the FINISHED state default.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'next-training-start-button'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
# only ever delete the training the setup flow created: 0 sets done, finished today
- assertVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, .* · today, Sets, 0, .*'
- tapOn:
    id: 'last-training-card-pressable'
- extendedWaitUntil:
    visible:
      id: 'analysis-tab'
    timeout: 20000
- assertVisible: 'Total Sets: 0 \(done\)'
- takeScreenshot: ${OUT}/11_finished_default_analysis
- tapOn:
    id: 'header-overflow-button'
- tapOn:
    id: 'overflow-discard'
- tapOn:
    id: 'training-delete-confirm'
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 10000
- assertNotVisible:
    id: 'analysis-tab'
- assertVisible: 'Plan new Training'
- takeScreenshot: ${OUT}/12_after_delete_plan_tab
# the dashboard must not keep pointing at the deleted training (plan.lastTraining is left dangling by the delete)
- back
- extendedWaitUntil:
    visible:
      id: 'next-training-start-button'
    timeout: 20000
- assertNotVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, .* · today, .*'
- takeScreenshot: ${OUT}/13_home_after_delete
