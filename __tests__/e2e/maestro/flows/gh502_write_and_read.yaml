appId: com.powerliftingworkoutplanner
name: GH-502 write the last training to Health Connect and read data back
# Runs on the open PoC screen after the permissions were granted (--mode flow, no launchApp).
---
- assertVisible:
    id: "hc-poc-permissions"
    text: "Granted: .*WRITE_EXERCISE.*WRITE_WEIGHT.*"
- tapOn:
    id: "hc-poc-write-training"
- extendedWaitUntil:
    visible:
      text: "Written to Health Connect: 1 session"
    timeout: 15000
- assertNotVisible:
    id: "hc-poc-error"
- scrollUntilVisible:
    element:
      id: "hc-poc-read-sessions"
    direction: DOWN
- tapOn:
    id: "hc-poc-read-sessions"
- extendedWaitUntil:
    visible:
      text: ".*Gainalytics: .* segments · [0-9]+ reps · com.powerliftingworkoutplanner"
    timeout: 15000
- takeScreenshot: gh502_sessions_read_back
- scrollUntilVisible:
    element:
      id: "hc-poc-read-weight"
    direction: UP
# Stand-in weight source (no external source connectable on the Android 13 test device).
- tapOn:
    id: "hc-poc-write-test-weight"
- extendedWaitUntil:
    visible:
      text: "Current body weight: 82\\.5 kg"
    timeout: 15000
# Reading again returns the stored value with its data origin.
- tapOn:
    id: "hc-poc-read-weight"
- extendedWaitUntil:
    visible:
      text: ".* · 82\\.5 kg · com.powerliftingworkoutplanner"
    timeout: 15000
- takeScreenshot: gh502_weight_read
