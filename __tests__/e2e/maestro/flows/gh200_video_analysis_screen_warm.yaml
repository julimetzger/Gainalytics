appId: com.powerliftingworkoutplanner
---
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 60000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analyses'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analyses'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
- assertVisible: 'Filters'
- assertVisible:
    text: '[0-9]+ lifts'
- assertVisible: 'Queued'
- assertVisible: 'Failed'
- assertVisible: 'Done'
- assertVisible: 'No outer plate candidate found at t=0'
- takeScreenshot: 'r1_collapsed_filter_6lifts'
- takeScreenshot: 'r1_failed_analysis'
- takeScreenshot: 'r1_queued_analysis'
- takeScreenshot: 'r1_status_pills'
- tapOn: 'Filters'
- assertVisible: 'RANGE'
- assertVisible: '7d'
- assertVisible: 'EXERCISE'
- assertVisible: 'VL%'
- assertVisible: 'RIR'
- takeScreenshot: 'r1_expanded_filter'
- tapOn: 'Front squat'
- extendedWaitUntil:
    visible: 'Status: done'
    timeout: 30000
