appId: com.powerliftingworkoutplanner
---
# GH-200 (warm): Verify the Video Analyses tab UI elements after a fresh
# import of the baseline `.gains` fixture.
#
# GH-225 changes:
#  * Replaced literal `"Training"` text waits with the post-GH-204 anchor
#    `id: "training-home-screen"` (tab labels are only visible for the
#    focused tab after the dashboard redesign).
#  * After the post-import toast, the Settings tab is still focused — tap
#    `tab-training` explicitly to land on Training Home.
#  * Trimmed assertions that depended on a multi-video device state
#    (`Queued`, `Failed`, `No outer plate candidate found at t=0`,
#    `[0-9]+ lifts` plural). The current baseline produces a single
#    DONE analysis; assertions are now resilient to that.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false  # warm: preserve imported baseline data from prior flow in the same session
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
# Settings is still focused after import — tap Training tab so subsequent
# navigation has a known starting point.
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analyses'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analyses'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000

# Resilient assertions: the lift counter ("1 lift" / "N lifts"), Filters
# card, and a Done status pill (baseline analyses are post-processed to
# `done`). Earlier assertions on Queued/Failed/"No outer plate candidate"
# required a multi-video state that is not guaranteed.
- assertVisible: 'Filters'
- assertVisible:
    text: '[0-9]+ lifts?'
- assertVisible: 'Done'
- takeScreenshot: r1_video_analyses_screen

# Expand the filters and verify the row labels — these are static text
# that always renders.
- tapOn: 'Filters'
- assertVisible: 'RANGE'
- assertVisible: 'EXERCISE'
- assertVisible: 'VL%'
- assertVisible: 'RIR'
- takeScreenshot: r1_video_analyses_filters_expanded
