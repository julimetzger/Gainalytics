appId: com.powerliftingworkoutplanner
---
# GH-526 feedback — the muscle map's Total view tints a value bar that is below
# 60 % of the selected chip's reference (accent colour, testID suffix
# `-value-bar-under`) and splits Sets bars into one segment per set.
# Fixture (baseline, Micro 3 · Push squat): Core done 0.9 of 2.9 planned sets (31 %),
# Chest 4 of 4 (100 %). Micro 3 Total: Core 1.9 vs 6.5 in Micro 2 (29 %).
# Precondition: baseline fixture imported.
- runFlow: gh526_goto_micro2_push.yaml
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Micro 3'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- assertVisible: 'Micro 3'
- assertVisible: ' Push squat'
- tapOn:
    id: 'analysis-data-train'
- tapOn:
    id: 'analysis-compare-this_training_plan'
- scrollUntilVisible:
    element:
      id: 'analysis-muscle-map-metric-sets'
    direction: DOWN
- tapOn:
    id: 'analysis-muscle-map-metric-sets'
- tapOn:
    id: 'analysis-muscle-map-view-total'
- scrollUntilVisible:
    element:
      id: 'analysis-muscle-map-row-Core-readout'
    direction: DOWN
- copyTextFrom:
    id: 'analysis-muscle-map-row-Core-readout'
- assertTrue: "${maestro.copiedText === '0.9/2.9'}"
- assertVisible:
    id: 'analysis-muscle-map-row-Core-value-bar-under'
- assertNotVisible:
    id: 'analysis-muscle-map-row-Chest-value-bar-under'
- assertVisible:
    id: 'analysis-muscle-map-row-Chest-value-bar'
- assertVisible:
    id: 'analysis-muscle-map-row-Chest-set-segments'
# Volume: the tint follows the volume ratio, Sets segments are gone
- tapOn:
    id: 'analysis-muscle-map-metric-volume'
- assertNotVisible:
    id: 'analysis-muscle-map-row-Chest-set-segments'
- scrollUntilVisible:
    element:
      id: 'analysis-muscle-map-row-Core-value-bar-under'
    direction: DOWN
- assertVisible:
    id: 'analysis-muscle-map-row-Core-value-bar-under'
- tapOn:
    id: 'analysis-muscle-map-metric-sets'
# Micro 3 Overview · Total vs Micro 2
- scrollUntilVisible:
    element:
      id: 'drawer-menu-button'
    direction: UP
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Overview'
- extendedWaitUntil:
    visible:
      id: 'overview-view-gesamt'
    timeout: 30000
- tapOn:
    id: 'overview-view-gesamt'
- tapOn:
    id: 'micro-compare-previous'
- assertVisible:
    id: 'micro-comparison-line'
    text: 'Micro 3 \(done\) vs Micro 2 \(done\)'
- scrollUntilVisible:
    element:
      id: 'micro-muscle-map-row-Core-readout'
    direction: DOWN
- copyTextFrom:
    id: 'micro-muscle-map-row-Core-readout'
- assertTrue: "${maestro.copiedText === '1.9/6.5'}"
- assertVisible:
    id: 'micro-muscle-map-row-Core-value-bar-under'
- assertVisible:
    id: 'micro-muscle-map-row-Back-value-bar'
- assertVisible:
    id: 'micro-muscle-map-row-Back-set-segments'
