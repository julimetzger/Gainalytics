appId: com.powerliftingworkoutplanner
name: GH-515 save the Anthropic key typed into the focused settings input
---
# Runs right after gh515_settings_provider.yaml + the runner typing the key with
# `adb shell input text`, so the key never appears in a flow file or Maestro log.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'settings-save-api-key-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-save-api-key-button'
- extendedWaitUntil:
    visible: 'API key saved'
    timeout: 5000
