appId: com.powerliftingworkoutplanner
---
# GH-414 — the Analysis sub-tab of a finished training must scroll again.
#
# Before the fix the swiper row in fillViewport mode was only one viewport wide
# while it holds three side-by-side panes, so the visible pane sat outside its
# parent's box. Android then neither dispatched drags to the pane's ScrollView
# (nothing scrolled) nor exposed the pane to the accessibility tree. Both are
# covered here: every assertion below queries pane content that used to be
# invisible to Maestro, and the scroll steps prove the content actually moves.
#
# Precondition: baseline fixture imported (plan 5 "Push pull", Meso 1). Micro 1
# training 1 "Push squat" is FINISHED, so the screen opens on Analysis and the
# fixture values below are fixed:
#   Duration 03:09:04 (top of the pane)
#   Exercise Overview last row "Stationary lunges" 1RM 73.60 (bottom of the pane)
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- assertVisible: 'Micro 1'

# --- top of the Analysis sub-tab -------------------------------------------
# a FINISHED training opens on Analysis (TrainingsPlanNode.defaultSubTab)
- extendedWaitUntil:
    visible:
      id: 'subtab-analysis'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
# value assertion: the duration card shows the fixture's training duration
- assertVisible:
    id: 'trainings-overview-duration-value'
    text: '03:09:04'
# the last Exercise Overview row is below the fold before scrolling
- assertNotVisible: 'Stationary lunges'
- takeScreenshot: gh414_analysis_top

# --- scrolling reaches the last element ------------------------------------
- scrollUntilVisible:
    element:
      text: 'Stationary lunges'
    direction: DOWN
    timeout: 40000
# value assertions on the row that only exists at the very bottom of the pane
- assertVisible: 'Stationary lunges'
- assertVisible: '73.60'
# and the top of the pane has really left the screen
- assertNotVisible:
    id: 'trainings-overview-duration-value'
- takeScreenshot: gh414_analysis_bottom

# --- and back to the top ----------------------------------------------------
- scrollUntilVisible:
    element:
      id: 'trainings-overview-duration-value'
    direction: UP
    timeout: 40000
- assertVisible:
    id: 'trainings-overview-duration-value'
    text: '03:09:04'
- assertNotVisible: 'Stationary lunges'
- takeScreenshot: gh414_analysis_back_top

# --- still scrollable after leaving the tab and coming back -----------------
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'trainings-overview-duration-value'
    text: '03:09:04'
- scrollUntilVisible:
    element:
      text: 'Stationary lunges'
    direction: DOWN
    timeout: 40000
- assertVisible: '73.60'
- takeScreenshot: gh414_analysis_bottom_after_tab_switch
