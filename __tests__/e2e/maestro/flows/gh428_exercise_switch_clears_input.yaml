appId: com.powerliftingworkoutplanner
---
# GH-428 (H4) — switching the exercise inside a RUNNING training must not leave the
# previous exercise's numbers in the input row, and the one-tap "Add" right after
# the switch must write nothing.
#
# Reproduces the round-2 audit case (#426, finding H4) end to end: log 8 reps x 60 kg,
# switch to an exercise planned with different numbers, then read back what the input
# row ACTUALLY shows.
#
# Selector note: AddWorkoutSet renders the same testIDs for the input row AND for
# every logged/planned set row below it, so every selector here pins `index: 0` —
# the input row is rendered first inside AddWorkout. Without it a Squat set planned
# at "8 reps" would satisfy an assertion meant for the input row.
#
# Prerequisite: baseline.gains imported (00_import_baseline).
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 180000

# ---- reach the Train tab of the plan's current session ----
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 120000

# A freshly imported baseline has no training object in the plan's next slot at all.
# The Train tab then offers "Plan this Training", which switches to the Plan tab and
# its suggestion screen. Build the session from the previous training there — that is
# what gives this flow two exercises planned with DIFFERENT numbers, which is the
# whole point of the H4 case. Both steps are skipped when the slot already holds one.
- runFlow:
    when:
      visible:
        id: 'train-tab-go-to-plan-button'
    commands:
      - tapOn:
          id: 'train-tab-go-to-plan-button'
      - waitForAnimationToEnd:
          timeout: 15000
- runFlow:
    when:
      visible:
        id: 'training-suggest-last-training-button'
    commands:
      - tapOn:
          id: 'training-suggest-last-training-button'
      - extendedWaitUntil:
          visible:
            id: 'training-exercise-2'
          timeout: 120000

# Creating the training flips its state, and the sub-tab is re-derived from that
# state — which opens the Plan tab. Go to Train explicitly rather than assuming.
- tapOn:
    id: 'subtab-train'
- waitForAnimationToEnd:
    timeout: 15000

# Start the session if it is not running yet. A STARTED training renders the session
# timer; a PLANNED one renders the "Plan" label and the Start button instead.
- runFlow:
    when:
      visible:
        id: 'train-tab-start-button'
    commands:
      - tapOn:
          id: 'train-tab-start-button'
      - extendedWaitUntil:
          visible:
            id: 'header-session-timer'
          timeout: 120000
- assertVisible:
    id: 'header-session-timer'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-reps-input'
    timeout: 120000

# ---- log 8 reps x 63 kg on the first exercise (the audit's case) ----
# 63 kg is deliberately a weight no exercise in the baseline plans or has logged, so
# "is 63 on screen?" is an unambiguous question about the input row's actual value.
# (Reps 8 would be ambiguous — Squat is planned at 8 reps.)
- tapOn:
    id: 'add-workout-set-reps-input'
    index: 0
- eraseText
- inputText: '8'
- tapOn:
    id: 'add-workout-set-rir-input'
    index: 0
- eraseText
- inputText: '0'
- tapOn:
    id: 'add-workout-set-weight-input'
    index: 0
- eraseText
- inputText: '63'
# Deliberately no `hideKeyboard` here. On this device it lands as a BACK press that
# the IME does not always swallow, and the two screens of this flow are one BACK
# apart from leaving the app entirely — the run then continues against the launcher,
# where every assertion about the input row fails for the wrong reason. Nothing below
# needs the keyboard closed: the input row and the "Add" button both sit above it,
# and submitting the set dismisses the keyboard from inside the app anyway.

# The VALUE is really in the row — not merely "a weight field exists".
# copyTextFrom is deliberately NOT used on these fields: on a Paper TextInput it
# reads the wrapper, not the value, and silently yields "" (that made an earlier
# version of this flow pass against the unfixed code).
- assertVisible: '63'
- takeScreenshot: gh428_h4_01_typed_8x63
- tapOn:
    id: 'add-workout-set-submit-button'
- waitForAnimationToEnd:
    timeout: 10000

# The counter is the readable proof of how many sets this exercise has logged.
- copyTextFrom:
    id: 'add-workout-set-counter'
- evalScript: |
    var m = /Set\s+(\d+)/.exec(maestro.copiedText);
    if (!m) {
      throw 'set counter is not a "Set N" label: "' + maestro.copiedText + '"';
    }
    output.setsAfterAdd = m[1];

# ---- switch to a DIFFERENT exercise ----
# The chip strip is horizontal; the second chip is a different exercise than the one
# just logged, and the baseline plans it with different numbers.
- tapOn:
    id: 'training-exercise-2'
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'training-exercise-2'
    commands:
      - tapOn:
          point: '68%,17%'
          retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000

# ---- THE assertion: what does the input row actually show now? ----
# The previous exercise's sets are gone from the list with it, so 63 can only still
# be on screen if the input row kept carrying it. This is the H4 bug, exactly.
- assertNotVisible: '63'
# ...and the row itself is still there, i.e. it was cleared rather than unmounted.
- assertVisible:
    id: 'add-workout-set-reps-input'
- takeScreenshot: gh428_h4_02_input_row_cleared

# ---- an "Add" tap straight after the switch must write nothing ----
- copyTextFrom:
    id: 'add-workout-set-counter'
- evalScript: |
    var m = /Set\s+(\d+)/.exec(maestro.copiedText);
    if (!m) {
      throw 'set counter is not a "Set N" label: "' + maestro.copiedText + '"';
    }
    output.setsBeforeBlindAdd = m[1];
- tapOn:
    id: 'add-workout-set-submit-button'
- waitForAnimationToEnd:
    timeout: 10000
- copyTextFrom:
    id: 'add-workout-set-counter'
- evalScript: |
    var m = /Set\s+(\d+)/.exec(maestro.copiedText);
    if (!m) {
      throw 'set counter is not a "Set N" label: "' + maestro.copiedText + '"';
    }
    if (m[1] !== output.setsBeforeBlindAdd) {
      throw 'GH-428 H4 regression: "Add" right after the exercise switch logged a set — counter went ' +
        output.setsBeforeBlindAdd + ' -> ' + m[1];
    }
- takeScreenshot: gh428_h4_03_blind_add_wrote_nothing
