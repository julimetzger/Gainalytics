appId: com.powerliftingworkoutplanner
---
# GH-101: Verify "Suggest based on last Meso" button plans workouts from the previous Meso.
# The flow imports a baseline with at least 2 Mesos, navigates to a training slot in the
# second Meso that has no planned workouts yet, and confirms that tapping the new button
# actually populates the training with workouts derived from the previous Meso.

- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"

- extendedWaitUntil:
    visible:
      text: "Training"
    timeout: 180000

# Phase 1: Import baseline fixture via Settings tab
- tapOn:
    point: "87%,97%"
- extendedWaitUntil:
    visible:
      id: "settings-import-data-button"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- tapOn:
    id: "settings-import-confirm-button"
- scrollUntilVisible:
    element:
      text: "baseline.gains"
    direction: DOWN
    timeout: 30000
- tapOn: "baseline.gains"
- extendedWaitUntil:
    visible: "Import successful!"
    timeout: 60000

# Phase 2: Navigate to Training tab and open first plan
- tapOn:
    point: "12%,97%"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 15000
- tapOn:
    point: "50%,29%"
- extendedWaitUntil:
    visible:
      id: "icon-button"
    timeout: 15000

# Phase 3: Open drawer and jump to Micro 6 (inside the second Meso → previous Meso exists).
# Plan "Push pull" defines Meso 1 over micros 1-4 and Meso 2 starting at micro 5.
# Micro 6 "Push squat" (training 1) has no recorded training yet, so TrainingsBase
# renders with the suggest buttons. The previous Meso's last "Push squat" training
# (micro 4) has doneWorkoutIds, so the new button is enabled.
- tapOn:
    id: "icon-button"
- extendedWaitUntil:
    visible: "Trainings:"
    timeout: 10000
- tapOn: "Micro 2"
- tapOn: "Micro 3"
- tapOn: "Micro 4"
- tapOn: "Micro 5"
- tapOn: "Micro 6"
- tapOn: "Push squat"

# Phase 4: Confirm all three suggestion buttons are present (regression guard)
- extendedWaitUntil:
    visible:
      id: "training-suggest-rir-delta-input"
    timeout: 15000
- assertVisible:
    id: "training-suggest-last-training-button"
- assertVisible:
    id: "training-suggest-last-planned-training-button"
- assertVisible:
    id: "training-suggest-last-meso-button"
- assertVisible:
    text: "Suggest based on last Meso"

- takeScreenshot: gh101-before-tap

# Phase 5: Tap the new button and verify workouts are now planned for this training.
# Before tapping the training slot has no planned workouts, so the muscle metrics
# table below TrainingsBase is empty. After tapping, the workouts from the last
# "Push squat" in Meso 1 (micro 4) are copied here, so muscle rows become visible.
# "Push squat" covers chest/quads/shoulders/triceps, so we assert "Chest" appears.
- tapOn:
    id: "training-suggest-last-meso-button"

- extendedWaitUntil:
    visible:
      text: "Chest"
    timeout: 10000
- assertVisible:
    text: "Chest"

- takeScreenshot: gh101-after-tap
