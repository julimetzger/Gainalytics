appId: com.powerliftingworkoutplanner
---
# GH-484: Analysis drawer clean-up.
# - AI Chat / Chat History have no icon and line up with the other entries.
# - "Video Analyses" is now "Video Analysis" (drawer entry and page header).
# - The Analysis page headers use the same medium title face as the other tabs.
# Run it once per theme: `-e MODE=light` and `-e MODE=dark` (no default on
# purpose, see agent memory #470).
# Prerequisites: baseline data imported (the Dashboard must show real content).
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000

# --- theme --------------------------------------------------------------------
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: '^settings-theme-mode-${MODE}$'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: '^settings-theme-mode-${MODE}$'
- waitForAnimationToEnd:
    timeout: 3000

# --- Dashboard header -----------------------------------------------------------
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'dashboard-scroll'
    timeout: 30000
- assertVisible: 'Dashboard'
- takeScreenshot: 'gh484_${MODE}_dashboard'

# --- drawer, Dashboard active -----------------------------------------------------
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Video Analysis'
    timeout: 10000
- assertNotVisible: 'Video Analyses'
- assertVisible: 'AI Chat'
- assertVisible: 'Chat History'
- takeScreenshot: 'gh484_${MODE}_drawer_dashboard_active'

# --- AI Chat opens the chat and becomes the active entry -----------------------
- tapOn: 'AI Chat'
- extendedWaitUntil:
    visible:
      id: 'chat-no-key-message'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Chat History'
    timeout: 10000
- takeScreenshot: 'gh484_${MODE}_drawer_aichat_active'

# --- Chat History opens the history list ----------------------------------------
- tapOn: 'Chat History'
- extendedWaitUntil:
    visible:
      id: 'chat-history-search'
    timeout: 15000
- assertNotVisible:
    id: 'chat-no-key-message'
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Records'
    timeout: 10000
- takeScreenshot: 'gh484_${MODE}_drawer_chathistory_active'

# --- another Analysis header for comparison -------------------------------------
- tapOn: 'Records'
- extendedWaitUntil:
    visible: 'Records in this range'
    timeout: 15000
- takeScreenshot: 'gh484_${MODE}_records'

# --- Video Analysis page header -------------------------------------------------
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Video Analysis'
    timeout: 10000
- tapOn: 'Video Analysis'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
# The header now reads "Video Analysis"; the old plural is gone everywhere.
- assertVisible: 'Video Analysis'
- assertNotVisible: 'Video Analyses'
- takeScreenshot: 'gh484_${MODE}_video_analysis'

# Leave the drawer open so the runner can compare the entries' left edges.
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Chat History'
    timeout: 10000
