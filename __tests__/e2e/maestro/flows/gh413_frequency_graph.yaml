appId: com.powerliftingworkoutplanner
---
# GH-413: the exercise Graph tab shows a fifth graph, "Frequency", accumulated per week.
#
# Data: __tests__/e2e/maestro/fixtures/baseline.gains (pushed by run-maestro-from-wsl.sh
# and imported by 00_import_baseline.yaml).
#   - "Adductor" (exercise id 32) is the most-trained exercise in that fixture. Its last
#     week with data is the week of Mon 23/02/26, in which it was trained twice — hence
#     the exact caption asserted below. Recomputed from the raw fixture in summary.md.
#   - "Mmkv" (exercise id 28) is the only exercise in the fixture with no workouts.
#
# Selector notes:
#   - react-native-paper's Card.Title does NOT expose its testID to the Android a11y
#     tree, so the five graph cards are addressed by their title text.
#   - the caption is a plain <Text testID="graph-frequency-latest"> and DOES surface as a
#     resource-id, so the actual displayed VALUE can be asserted (id + text).
#   - Maestro matches `text:` as a full REGEX, so the subtitle is asserted as a prefix
#     plus `.*` — the literal parentheses in "(Mon-Sun)" would otherwise be a capture
#     group and never match.
#   - the Graph tab's ScrollView is swiped along the right edge (97%): a centred swipe is
#     swallowed by the LineChart's own gesture handling.
#   - off-screen React Native views are pruned from the a11y tree, so the Frequency card
#     has to be SCROLLED INTO VIEW before anything inside it can be asserted.

- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000

# ─────────────────────────────────────────────────────────────────────────────
# Part 1 — exercise with a long history (Adductor)
# ─────────────────────────────────────────────────────────────────────────────
- tapOn: 'tab-exercises'
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: 'exercise-searchbar'
- inputText: 'Adductor'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'exercise-row-32'
    timeout: 20000
- tapOn:
    id: 'exercise-row-32'
- extendedWaitUntil:
    visible:
      id: 'exercise-detail-tabbar'
    timeout: 30000
- tapOn:
    id: 'exercise-tab-graph'
- extendedWaitUntil:
    visible:
      id: 'exercise-graph-tab'
    timeout: 30000

# All five cards are on screen at once in the default 3M range (Adductor's last
# training is ~6 months old, so every card is in its empty state). This is both the
# "existing four graphs are unchanged and keep their order" check and the "empty range
# renders an empty state instead of crashing" check.
- assertVisible: 'Volume'
- assertVisible: 'Average Intensity'
- assertVisible: 'Max Intensity'
- assertVisible: 'Frequency'
- assertVisible: 'No data in this range.'

# Widen the range so the graphs actually have data.
- tapOn:
    id: 'graph-range-All'
- waitForAnimationToEnd

# Scroll to the bottom of the tab; the Frequency card is the last one.
- swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'graph-frequency-latest'
    timeout: 30000

# The period the graph uses is visible to the user …
- assertVisible: 'Trainings per week.*'
# … and so is the value it draws: Adductor was trained twice in the week of Mon 23/02/26.
- assertVisible:
    id: 'graph-frequency-latest'
    text: 'Week of Mon, 23/02/26: 2 trainings'
- takeScreenshot: /home/jmetzger/projects/PowerliftingWorkoutPlanner/.codex-orchestrator/runs/GH-413/screenshots/maestro_01_frequency_long_history

# ─────────────────────────────────────────────────────────────────────────────
# Part 2 — exercise without any training history (Mmkv)
# ─────────────────────────────────────────────────────────────────────────────
- back
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: 'exercise-searchbar'
- eraseText
- inputText: 'Mmkv'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'exercise-row-28'
    timeout: 20000
- tapOn:
    id: 'exercise-row-28'
- extendedWaitUntil:
    visible:
      id: 'exercise-detail-tabbar'
    timeout: 30000
- tapOn:
    id: 'exercise-tab-graph'
- extendedWaitUntil:
    visible:
      id: 'exercise-graph-tab'
    timeout: 30000
- tapOn:
    id: 'graph-range-All'
- waitForAnimationToEnd
- swipe: {start: '97%, 80%', end: '97%, 40%', duration: 1000}
- swipe: {start: '97%, 80%', end: '97%, 40%', duration: 1000}
- waitForAnimationToEnd

# No history: the Frequency card is rendered with the same empty state as the other
# four — no crash, no blank page — and there is no caption because there is no week.
- assertVisible: 'Frequency'
- assertVisible: 'Trainings per week.*'
- assertVisible: 'No data in this range.'
- assertNotVisible:
    id: 'graph-frequency-latest'
- takeScreenshot: /home/jmetzger/projects/PowerliftingWorkoutPlanner/.codex-orchestrator/runs/GH-413/screenshots/maestro_02_frequency_no_history
