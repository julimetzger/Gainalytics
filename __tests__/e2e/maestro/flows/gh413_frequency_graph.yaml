appId: com.powerliftingworkoutplanner
---
# GH-413: the exercise Graph tab shows a fifth graph, "Frequency", accumulated per week.
#
# Data: __tests__/e2e/maestro/fixtures/baseline.gains (pushed by run-maestro-from-wsl.sh
# and imported by 00_import_baseline.yaml). The fixture's last training is on Sat
# 28/02/26; the device clock is Mon 31/08/26, so every exercise in it has been untrained
# for about half a year. Recomputed from the raw fixture in checks/frequency-from-fixture.log:
#   - "Adductor" (id 32): 144 workouts, last trained in the week of Mon 23/02/26 (2x).
#     "All" plots 138 weeks, of which the last 27 are zero.
#     "1Y" starts on Sun 31/08/25 — in the middle of the week of Mon 25/08/25 — and that
#     week is plotted whole, so the series starts at Mon 25/08/25, not at the range start.
#   - "Mmkv" (id 28) is the only exercise in the fixture with no workouts at all.
#
# Selector notes:
#   - react-native-paper's Card.Title does NOT expose its testID to the Android a11y
#     tree, so the five graph cards are addressed by their title text.
#   - the captions are plain <Text testID="graph-frequency-span|-latest"> and DO surface as
#     a resource-id, so the actual displayed VALUES can be asserted (id + text).
#   - Maestro matches `text:` as a full REGEX, so literal parentheses have to be escaped;
#     an unescaped "(2 trainings)" would be a capture group and match without the braces.
#   - the Graph tab's ScrollView is swiped along the right edge (97%): a centred swipe is
#     swallowed by the LineChart's own gesture handling.
#   - off-screen React Native views are pruned from the a11y tree, so the Frequency card
#     has to be SCROLLED INTO VIEW before anything inside it can be asserted.

- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000

# ─────────────────────────────────────────────────────────────────────────────
# Part 1 — exercise with a long history (Adductor)
# ─────────────────────────────────────────────────────────────────────────────
- tapOn: 'tab-exercises'
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: 'exercise-searchbar'
- inputText: 'Adductor'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'exercise-row-32'
    timeout: 20000
- tapOn:
    id: 'exercise-row-32'
- extendedWaitUntil:
    visible:
      id: 'exercise-detail-tabbar'
    timeout: 30000
- tapOn:
    id: 'exercise-tab-graph'
- extendedWaitUntil:
    visible:
      id: 'exercise-graph-tab'
    timeout: 30000

# All five cards are on screen at once in the default 3M range (the fixture's last
# training is ~6 months old, so every card is in its empty state). This is both the
# "existing four graphs are unchanged and keep their order" check and the "empty range
# renders an empty state instead of crashing" check.
- assertVisible: 'Volume'
- assertVisible: 'Average Intensity'
- assertVisible: 'Max Intensity'
- assertVisible: 'Frequency'
- assertVisible: 'No data in this range.'

# Widen the range so the graph actually has data.
- tapOn:
    id: 'graph-range-All'
- waitForAnimationToEnd

# Scroll to the bottom of the tab; the Frequency card is the last one.
- repeat:
    times: 6
    commands:
      - swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'graph-frequency-latest'
    timeout: 30000

# The period the graph uses is visible to the user …
- assertVisible: 'Trainings per week.*'
# … and so is the span it covers: it runs to the current week (Mon 31/08/26), not to the
# last training. Finding 1 of the review.
- assertVisible:
    id: 'graph-frequency-span'
    text: 'Weeks from Mon, 15/01/24 to Mon, 31/08/26'
# … and so is the value it draws: nothing this week, last trained in the week of Mon
# 23/02/26, which had 2 trainings.
- assertVisible:
    id: 'graph-frequency-latest'
    text: 'Week of Mon, 31/08/26: 0 trainings so far, last trained Mon, 23/02/26 \(2 trainings\)'
- takeScreenshot: /home/jmetzger/projects/PowerliftingWorkoutPlanner/.codex-orchestrator/runs/GH-413/screenshots/maestro_01_frequency_long_history

# ─────────────────────────────────────────────────────────────────────────────
# Part 2 — a range that starts in the middle of a week (finding 2)
# The "1Y" range starts on Sun 31/08/25. The graph starts one week earlier, at Mon
# 25/08/25, and counts that week completely instead of showing it short.
# ─────────────────────────────────────────────────────────────────────────────
# Scrolling back up has to START below the sticky exercise header (1RM / Log-Stats-
# History-Graph, roughly the top 30%): a swipe that starts there is not on the tab's
# ScrollView and scrolls nothing.
- repeat:
    times: 8
    commands:
      - swipe: {start: '97%, 45%', end: '97%, 92%', duration: 1000}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'graph-range-1Y'
    timeout: 30000
- tapOn:
    id: 'graph-range-1Y'
- waitForAnimationToEnd
- repeat:
    times: 6
    commands:
      - swipe: {start: '97%, 80%', end: '97%, 25%', duration: 1000}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'graph-frequency-span'
    timeout: 30000
- assertVisible:
    id: 'graph-frequency-span'
    text: 'Weeks from Mon, 25/08/25 to Mon, 31/08/26'
- assertVisible:
    id: 'graph-frequency-latest'
    text: 'Week of Mon, 31/08/26: 0 trainings so far, last trained Mon, 23/02/26 \(2 trainings\)'
- takeScreenshot: /home/jmetzger/projects/PowerliftingWorkoutPlanner/.codex-orchestrator/runs/GH-413/screenshots/maestro_02_frequency_week_boundary

# ─────────────────────────────────────────────────────────────────────────────
# Part 3 — exercise without any training history (Mmkv)
# ─────────────────────────────────────────────────────────────────────────────
- back
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: 'exercise-searchbar'
- eraseText
- inputText: 'Mmkv'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'exercise-row-28'
    timeout: 20000
- tapOn:
    id: 'exercise-row-28'
- extendedWaitUntil:
    visible:
      id: 'exercise-detail-tabbar'
    timeout: 30000
- tapOn:
    id: 'exercise-tab-graph'
- extendedWaitUntil:
    visible:
      id: 'exercise-graph-tab'
    timeout: 30000
- tapOn:
    id: 'graph-range-All'
- waitForAnimationToEnd
- repeat:
    times: 2
    commands:
      - swipe: {start: '97%, 80%', end: '97%, 40%', duration: 1000}
- waitForAnimationToEnd

# No history: the Frequency card is rendered with the same empty state as the other
# four — no crash, no blank page — and there is no caption because there is no week.
- assertVisible: 'Frequency'
- assertVisible: 'Trainings per week.*'
- assertVisible: 'No data in this range.'
- assertNotVisible:
    id: 'graph-frequency-latest'
- assertNotVisible:
    id: 'graph-frequency-span'
- takeScreenshot: /home/jmetzger/projects/PowerliftingWorkoutPlanner/.codex-orchestrator/runs/GH-413/screenshots/maestro_03_frequency_no_history
