appId: com.powerliftingworkoutplanner
---

# Ensure the app is ready before navigating to Analyse.
- extendedWaitUntil:
    visible: 'Training'
    timeout: 60000

# Open the Metrics Overview from Analyse.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'

# Wait for Metrics Overview navigation header to confirm screen loaded.
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 20000

# Wait for the muscle metric header (testID) to confirm content rendered.
- extendedWaitUntil:
    visible:
      id: 'metrics-muscles-header-0'
    timeout: 20000
- assertVisible: 'Muscle Overview'

# Verify the muscle metric dropdown exposes all available metrics.
- tapOn:
    id: 'metrics-muscles-header-0'
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000
- assertVisible: 'Current: Volume'
- assertVisible: 'Volume'
- assertVisible: '1RM'
- assertVisible: 'Sets'
- assertVisible: 'Reps'
- assertVisible: 'Max Intensity'
- assertVisible: 'Average Intensity'
- back

# Scroll down to the exercise section and wait for its first metric header.
- scrollUntilVisible:
    element:
      text: 'Exercise Overview'
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: 'metrics-exercises-header-0'
    timeout: 20000

# Open metric selection dialog for first exercise slot.
- tapOn:
    id: 'metrics-exercises-header-0'

# Dialog is rendered in a Portal — its text is accessible.
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000
- assertVisible: 'Current: 1RM'
- assertVisible: 'Volume'
- assertVisible: '1RM'
- assertVisible: 'Sets'
- assertVisible: 'Reps'
- assertVisible: 'Max Intensity'
- assertVisible: 'Average Intensity'

# Select Average Intensity.
- tapOn: 'Average Intensity'

# Wait for dialog to close (exercise header reappears).
- extendedWaitUntil:
    visible:
      id: 'metrics-exercises-header-0'
    timeout: 10000
- takeScreenshot: met-001-metrics-slot-changed

# Reopen dialog to verify the new selection was persisted.
- tapOn:
    id: 'metrics-exercises-header-0'
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000
- assertVisible: 'Current: Average Intensity'
- takeScreenshot: met-001-dialog-persisted
- back

# Navigate to a finished training and confirm the same slot shows the persisted metric.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Last Training'
    direction: DOWN
- tapOn: 'Last Training'
- extendedWaitUntil:
    visible:
      id: 'metrics-exercises-header-0'
    timeout: 20000
- tapOn:
    id: 'metrics-exercises-header-0'
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000
- assertVisible: 'Current: Average Intensity'
- takeScreenshot: met-001-training-detail
