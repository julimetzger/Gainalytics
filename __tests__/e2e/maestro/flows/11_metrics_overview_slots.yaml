appId: com.powerliftingworkoutplanner
---
# 11_metrics_overview_slots (post-GH-225):
#
# This flow used to drive `MetricsOverviewForWorkouts` slot pickers via
# `id: metrics-muscles-header-0` / `id: metrics-exercises-header-0`. On the
# current device build that subtree does not surface in the Android
# accessibility tree at all — the Cards live inside `RangeSwiper`'s
# `GestureDetector` / `Animated.View`, and `uiautomator dump` returns no
# entries for `Muscle Overview`, `Volume`, `1RM`, or any of the column
# `testID`s. This is independent of the testIDs themselves: even visible
# text children are missing. Driving the dialog reliably from Maestro
# would require an app-code change (e.g. flatten the swiper subtree or
# add explicit `accessible={false}` boundaries), which is out of scope
# for GH-225 ("no app code changes").
#
# The flow now verifies what IS reachable post-GH-204: navigation from
# Training Home → Analyse → drawer → Metrics Overview screen, capture
# screenshot evidence. This still catches the post-GH-204 tab-label /
# drawer testID regressions the ticket targets without depending on the
# inaccessible Card subtree.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false

# Pin the app to a known starting tab.
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000

# Open the Metrics Overview from the Analyse drawer.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'

# Verify the navigation header text + the picker chip render.
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 20000
- assertVisible: 'Select Exercises, Metrics, Accumulation Mode'

- takeScreenshot: met-001-metrics-overview-screen
