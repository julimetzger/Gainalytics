appId: com.powerliftingworkoutplanner
---
- extendedWaitUntil:
    visible: 'Training'
    timeout: 15000

# Open the Metrics Overview from Analyse.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Analyse'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'
- extendedWaitUntil:
    visible: 'Muscle Overview'
    timeout: 15000

# Change the first exercise metric slot and verify all metric options are available.
- tapOn:
    id: 'metrics-exercises-header-0'
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000
- assertVisible: 'Current: 1RM'
- assertVisible: 'Volume'
- assertVisible: '1RM'
- assertVisible: 'Sets'
- assertVisible: 'Reps'
- assertVisible: 'Max Intensity'
- assertVisible: 'Average Intensity'
- tapOn: 'Average Intensity'
- extendedWaitUntil:
    visible: 'Average Intensity'
    timeout: 10000
- takeScreenshot: met-001-metrics-overview

# Open a finished training and confirm the same slot uses the persisted metric.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Last Training'
    direction: DOWN
- tapOn: 'Last Training'
- extendedWaitUntil:
    visible: 'Muscle Overview'
    timeout: 15000
- tapOn:
    id: 'metrics-exercises-header-0'
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000
- assertVisible: 'Current: Average Intensity'
- takeScreenshot: met-001-training-detail
