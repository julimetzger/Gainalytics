appId: com.powerliftingworkoutplanner
---
# GH-458 H4 + H5 + H7.
#
# H5: the fixture's last training is 28/02/2026 and the app runs months later,
#     so the Dashboard's current week is empty. It used to show `0 / 0.0t / 0min`
#     with no explanation — identical to a brand-new account.
# H4: "Tap a muscle group for details" navigated to Metrics with neither the
#     muscle nor a range, landing on `0 selected` and an empty table.
# H7: the muscle table showed `104.40` Sets and a bare `90937.50` Volume with no
#     units and a large red delta above each value naming no reference period.

- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'

# The emulator raises "System UI isn't responding" under load; while that
# window holds focus Maestro's hierarchy never contains the app, and every
# assertion fails for a reason that has nothing to do with the app.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd

# The emulator raises "System UI isn't responding" under load; while that
# window holds focus Maestro's hierarchy never contains the app, and every
# assertion fails for a reason that has nothing to do with the app.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd

# A cold start after a device reboot needs well over the default timeout
# before the tab bar exists.
# `tab-analyse` resolves as accessibility TEXT on this build, not as a
# resource-id, so the bare-string form is the one that matches.
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 90000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'dashboard-scroll'
    timeout: 30000

# ------------------------------------------------------- H5: the stale range
# The banner must name the ACTUAL last training date from the fixture, not a
# generic "no data" phrase.
- extendedWaitUntil:
    visible:
      id: 'analyse-stale-range-banner-text'
    timeout: 15000
- assertVisible:
    id: 'analyse-stale-range-banner-text'
    text: 'No trainings in this period. Your last training was on Sat, 28/02/26.'
- assertVisible: 'Show that period'

# ------------------------------------------------ H4: before the drill-down
- assertVisible: 'Tap a muscle group for details'
- takeScreenshot: gh458_10_dashboard_before_drilldown

- tapOn:
    id: 'muscle-chip-Back'
- waitForAnimationToEnd

# ------------------------------------------------- H4: after the drill-down
# The tapped muscle must arrive — the audit's failure was "0 selected".
- extendedWaitUntil:
    visible: '1 selected'
    timeout: 20000
- assertVisible: 'Back'
- assertNotVisible: '0 selected'

# The table must be populated: the range handed over holds data, so the
# "no sets in this period" empty state must NOT be the thing on screen.
- assertNotVisible:
    id: 'metrics-empty-state'

# ------------------------------------- H7: units, whole counts, delta period
# The Muscle/Exercise Overview cards sit inside RangeSwiper's GestureDetector
# subtree, which this device build does not expose to the Android accessibility
# tree at all — not even their visible text children. 11_metrics_overview_slots
# documents the same limitation. H7's column units, whole counts, subordinate
# deltas and the named comparison period are therefore proven by the screenshot
# below (the criterion asks for one) plus the unit tests in
# __tests__/utils/metric-format.spec.ts, which assert every formatted value.
- takeScreenshot: gh458_11_metrics_after_drilldown
- scroll
- waitForAnimationToEnd
- takeScreenshot: gh458_12_metrics_table
