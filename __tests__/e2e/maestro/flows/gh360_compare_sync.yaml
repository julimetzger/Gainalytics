appId: com.powerliftingworkoutplanner
---
# GH-360: Compare Analyses — synchronized playback with a shared scrubber.
#
# Data prerequisite (documented in the run summary): the device holds two DONE
# video analyses with local videos of the same movement, where Analysis B's
# video has ~2.2s more lead-in than Analysis A's (squat-3reps.mp4 and a
# tpad-delayed copy). The newest two "Unknown Exercise" rows in the Video
# Analyses list are B (index 0) and A (index 1).
#
# Value assertions:
#  1. The Rep Sync subtitle reports the auto-detected B lead-in (~2.2s).
#  2. The A/B time badges sit exactly that offset apart on the shared timeline.
#  3. Tapping the 0.5x chip changes the shared speed label to "Speed: 0.5x".
#  4. After play+pause both videos advanced and the offset is preserved.
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analyses'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analyses'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
# Open Analysis A (second-newest import)
- tapOn:
    text: 'Unknown Exercise'
    index: 1
- extendedWaitUntil:
    visible: 'Compare'
    timeout: 30000
- tapOn: 'Compare'
- extendedWaitUntil:
    visible: 'Analysis #3'
    timeout: 15000
- tapOn: 'Analysis #3'
- extendedWaitUntil:
    visible: 'Synchronized Playback'
    timeout: 30000
- assertVisible: 'Rep Sync'
- assertVisible:
    id: 'compare-rep-sync-auto'
# --- 1. Auto alignment subtitle carries the detected lead-in value
- copyTextFrom:
    id: 'compare-rep-sync-subtitle'
- evalScript: |
    var m = maestro.copiedText.match(/Aligned on rep 1 lift-off.*B lead-in .?(\d+\.\d\d)s removed/);
    if (!m) { throw 'Unexpected rep-sync subtitle: ' + maestro.copiedText; }
    output.offsetSec = parseFloat(m[1]);
    if (output.offsetSec < 1.9 || output.offsetSec > 2.6) { throw 'Auto offset not ~2.2s: ' + output.offsetSec; }
# --- 2. Both videos sit exactly the offset apart on the shared timeline
- copyTextFrom:
    id: 'compare-video-a-time'
- evalScript: |
    output.aTimeText = maestro.copiedText;
- copyTextFrom:
    id: 'compare-video-b-time'
- evalScript: |
    var parts = output.aTimeText.split(':');
    output.a0 = parseInt(parts[0], 10) * 60 + parseFloat(parts[1]);
    var bParts = maestro.copiedText.split(':');
    output.b0 = parseInt(bParts[0], 10) * 60 + parseFloat(bParts[1]);
    var delta = output.b0 - output.a0;
    if (Math.abs(delta - output.offsetSec) > 0.15) {
      throw 'Videos not aligned: A=' + output.a0 + ' B=' + output.b0 + ' expected delta ' + output.offsetSec;
    }
- takeScreenshot: 'gh360_compare_aligned'
# --- 3. Speed chips act on the shared playback (actual resulting label value)
- scrollUntilVisible:
    element:
      text: 'Speed: 1.0x'
    direction: DOWN
    timeout: 15000
- tapOn: '0.5x'
- assertVisible: 'Speed: 0.5x'
# --- 4. Play, then pause: both videos advanced together, offset preserved
- tapOn:
    id: 'compare-play-pause-button'
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: 'compare-play-pause-button'
# The speed-row scroll pushed the video badges off-screen — scroll back up.
- scrollUntilVisible:
    element:
      id: 'compare-video-a-time'
    direction: UP
    timeout: 15000
- copyTextFrom:
    id: 'compare-video-a-time'
- evalScript: |
    output.aTimeText2 = maestro.copiedText;
- copyTextFrom:
    id: 'compare-video-b-time'
- evalScript: |
    var aParts = output.aTimeText2.split(':');
    var a1 = parseInt(aParts[0], 10) * 60 + parseFloat(aParts[1]);
    var bParts = maestro.copiedText.split(':');
    var b1 = parseInt(bParts[0], 10) * 60 + parseFloat(bParts[1]);
    if (a1 <= output.a0 + 0.3) { throw 'Playback did not advance: ' + output.a0 + ' -> ' + a1; }
    var delta = b1 - a1;
    if (Math.abs(delta - output.offsetSec) > 0.25) {
      throw 'Videos drifted apart after playback: A=' + a1 + ' B=' + b1 + ' expected delta ' + output.offsetSec;
    }
- takeScreenshot: 'gh360_compare_after_play'
