appId: com.powerliftingworkoutplanner
---
# GH-458 H6: Training Length answers one question — "how long do I train?" — and
# the baseline fixture made it unanswerable. Two never-finished sessions in the
# Dec-Feb window count 44 h 27 min (12/01/2026) and 42 h 26 min (19/02/2026).
# They scaled the Y axis past 2500 minutes, squashed every real 60-90 min
# session into a strip along the bottom, and pushed the monthly average from
# 103 min to 231 min. The only way to fix one was a long press on its bar, with
# no affordance at all — a normal tap did nothing.
#
# This flow asserts the ACTUAL resulting text of the outlier notice (count and
# state), not merely that some element exists, and proves the toggle and the
# visible edit button both work.

- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'

# The emulator raises "System UI isn't responding" under load; while that
# window holds focus Maestro's hierarchy never contains the app, and every
# assertion fails for a reason that has nothing to do with the app.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd

# The emulator raises "System UI isn't responding" under load; while that
# window holds focus Maestro's hierarchy never contains the app, and every
# assertion fails for a reason that has nothing to do with the app.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd

# A cold start after a device reboot needs well over the default timeout
# before the tab bar exists.
# `tab-analyse` resolves as accessibility TEXT on this build, not as a
# resource-id, so the bare-string form is the one that matches.
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 90000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000

- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Training Length'
    timeout: 15000
- tapOn: 'Training Length'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'training-length-screen'
    timeout: 20000

# ---------------------------------- H5 again: reach a period that holds data
# The default range is the last 3 months, which is empty for this fixture. The
# banner names the real last training date and corrects the range in one tap —
# this is also how the flow gets to the window that contains the outliers.
- assertVisible:
    id: 'training-length-stale-range-banner-text'
    text: 'No trainings in this period. Your last training was on Sat, 28/02/26.'
- takeScreenshot: gh458_20_training_length_default_empty
- tapOn:
    id: 'training-length-stale-range-banner-action'
- waitForAnimationToEnd

# ------------------------------------------- H6: outliers out of the scaling
# The exact count from the fixture, and the fact that they are HIDDEN.
- extendedWaitUntil:
    visible:
      id: 'training-length-outlier-count'
    timeout: 20000
- assertVisible:
    id: 'training-length-outlier-count'
    text: '2 trainings over 4 h hidden'
- assertVisible: 'Grouped by Day'
- takeScreenshot: gh458_21_training_length_day_outliers_hidden

# The correction route is a labelled button naming the session it fixes,
# not an undiscoverable long press.
- assertVisible: 'Correct 12 Jan 2026 (44 h 27 min)'
- assertVisible: 'Correct 19 Feb 2026 (42 h 26 min)'

# ------------------------------------------ H6: the user can put them back
- tapOn:
    id: 'training-length-outlier-toggle'
- waitForAnimationToEnd
- assertVisible:
    id: 'training-length-outlier-count'
    text: '2 trainings over 4 h included'
- takeScreenshot: gh458_22_training_length_day_outliers_shown
- tapOn:
    id: 'training-length-outlier-toggle'
- waitForAnimationToEnd
- assertVisible:
    id: 'training-length-outlier-count'
    text: '2 trainings over 4 h hidden'

# ---------------------------------------------------- H6: the month view too
- tapOn:
    id: 'training-length-accumulation-month'
- waitForAnimationToEnd
- assertVisible: 'Grouped by Month'
- assertVisible:
    id: 'training-length-outlier-count'
    text: '2 trainings over 4 h hidden'
- takeScreenshot: gh458_23_training_length_month_outliers_hidden

- tapOn:
    id: 'training-length-outlier-toggle'
- waitForAnimationToEnd
- assertVisible:
    id: 'training-length-outlier-count'
    text: '2 trainings over 4 h included'
- takeScreenshot: gh458_24_training_length_month_outliers_shown
- tapOn:
    id: 'training-length-outlier-toggle'
- waitForAnimationToEnd

# ------------------------------- H6: the visible control reaches the editor
- tapOn:
    id: 'training-length-outlier-correct-360'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'training-length-edit-dialog'
    timeout: 15000
- assertVisible:
    id: 'training-length-edit-average-duration'
- takeScreenshot: gh458_25_training_length_edit_dialog
