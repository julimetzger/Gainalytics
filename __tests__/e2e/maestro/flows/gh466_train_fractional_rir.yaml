appId: com.powerliftingworkoutplanner
---
# GH-466 — a fractional RIR can be logged in the Train tab and corrected on an
# already logged set. Precondition: baseline.gains imported (micro 69 "Push",
# first exercise "Adductor", nothing logged yet; see gh443 for set numbering).
# The planned set 1 is 13 reps, so reps '8' on row 1 proves the row is the set
# this flow logged — not the planned prefill (which may carry the plan flow's 1.5).
- runFlow: gh443_goto_running_push.yaml
- assertVisible:
    id: 'add-workout-set-reps-input'
- assertVisible:
    id: 'add-workout-set-reps-input-1'
    text: '13'
- takeScreenshot: gh466_10_train_before

# 1. log a new set with RIR typed with a comma
- tapOn:
    id: 'add-workout-set-reps-input'
- eraseText
- inputText: '8'
- tapOn:
    id: 'add-workout-set-rir-input'
- eraseText
- inputText: '0,5'
- tapOn:
    id: 'add-workout-set-weight-input'
- eraseText
- inputText: '95'
- hideKeyboard
- takeScreenshot: gh466_11_train_typed_0_5
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-reps-input-1'
      text: '8'
    timeout: 20000
# Logged as typed: 0.5, not 0 and not 1.
- assertVisible:
    id: 'add-workout-set-rir-input-1'
    text: '0.5'
- assertVisible:
    id: 'add-workout-set-logged-1'
- takeScreenshot: gh466_12_train_logged_0_5

# 2. correct the logged set to 1.5. The confirm icon dismisses the keyboard
# itself — a trailing hideKeyboard would send BACK and leave the screen.
- tapOn:
    id: 'add-workout-set-rir-input-1'
- eraseText
- inputText: '1.5'
- tapOn:
    id: 'add-workout-set-confirm-1'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-logged-1'
    timeout: 20000
- assertVisible:
    id: 'add-workout-set-rir-input-1'
    text: '1.5'
- assertVisible:
    id: 'add-workout-set-reps-input-1'
    text: '8'
- takeScreenshot: gh466_13_train_edited_1_5

# 3. out of range is still rejected, with a message that allows decimals
- tapOn:
    id: 'add-workout-set-rir-input'
- eraseText
- inputText: '11'
- hideKeyboard
- tapOn:
    id: 'add-workout-set-submit-button'
- takeScreenshot: gh466_14_train_rejected_11
# Not logged: row 2 is still the planned 12-rep set, row 1 keeps its 1.5.
- assertVisible:
    id: 'add-workout-set-reps-input-2'
    text: '12'
- assertVisible:
    id: 'add-workout-set-rir-input-1'
    text: '1.5'
- assertVisible:
    id: 'add-workout-set-rir-input'
    text: '11'
