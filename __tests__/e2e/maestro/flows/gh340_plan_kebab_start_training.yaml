appId: com.powerliftingworkoutplanner
---
# GH-340 — Plan-mode kebab (overflow) menu. Uses baseline.gains training id
# 282 (plan "Push pull upper lower", micro 69, "Push" day) which is PLANNED
# and already has 11 exercises added.
#
# GH-401 changed the contract this flow guards: the kebab used to carry a second
# "Start Training" entry duplicating the dashboard card's label. There is now
# exactly one start control, the Train tab's button, so this flow asserts the
# kebab offers "Edit plan" WITHOUT a duplicate start, and then starts the
# training the way a user now does.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- tapOn:
    id: 'settings-import-confirm-button'
    optional: true
# The system file picker (SAF) may open on "Recent", where the pushed
# baseline.gains is not listed. If it isn't directly visible, open the roots
# drawer and switch to the Downloads root where the fixture was pushed. Guarded
# so it is skipped when the picker already shows the file.
- runFlow:
    when:
      notVisible: 'baseline.gains'
    commands:
      - tapOn:
          point: '7%,6%'
      - tapOn:
          text: 'Downloads'
          optional: true
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 20000
- tapOn:
    text: 'baseline.gains'
- extendedWaitUntil:
    visible: 'Import successful!'
    timeout: 60000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
# Open plan 1 (Push pull upper lower) via its plan card. It lands on the plan's
# last training (283) = micro 70, "Push" day (day 2), which is FINISHED.
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 15000
# Open the micro drawer. Step back one micro via the "Micro 69" segmented
# button (its label is the previous micro; the header still reads "Micro 70",
# so the exact "Micro 69" text uniquely targets the button). Then pick the
# "Push" day, which selects training 282 (PLANNED, 11 planned exercises) and
# closes the drawer. Landing on a PLANNED training auto-selects the Plan
# sub-tab, so the kebab must offer "Edit plan".
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      text: 'Micro 69'
    timeout: 10000
- tapOn:
    text: 'Micro 69'
- tapOn:
    text: 'Push'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 15000
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit-plan'
    timeout: 5000
- assertVisible:
    id: 'overflow-edit-plan'
# GH-401 AC2: no duplicate start control in the menu any more.
- assertNotVisible:
    id: 'overflow-start'
- assertNotVisible: 'Start Training'
- takeScreenshot: gh340_plan_kebab_no_duplicate_start
# Close the kebab and start the training from the Train tab, which is where the
# one real start control now lives. The training pane is not exposed to the
# accessibility tree (agent-memory #206), so the sub-tab strip and the Start
# button are driven by position; the proof is the session timer in the header,
# which only exists while the training is STARTED and IS readable.
- tapOn:
    id: 'overflow-scrim'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: '50%,14%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: gh340_train_tab_start_training_visible
- tapOn:
    point: '50%,21%'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 30000
- assertVisible:
    id: 'header-session-timer'
- takeScreenshot: gh340_start_training_tapped
