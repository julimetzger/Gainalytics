appId: com.powerliftingworkoutplanner
---
# GH-340 — Plan-mode kebab (overflow) menu should offer "Start Training" as
# soon as the training has planned exercises. Uses baseline.gains training id
# 282 (plan "Push pull upper lower", micro 69, "Push" day) which is PLANNED
# and already has 11 exercises added.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- tapOn:
    id: 'settings-import-confirm-button'
    optional: true
# The system file picker (SAF) may open on "Recent", where the pushed
# baseline.gains is not listed. If it isn't directly visible, open the roots
# drawer and switch to the Downloads root where the fixture was pushed. Guarded
# so it is skipped when the picker already shows the file.
- runFlow:
    when:
      notVisible: 'baseline.gains'
    commands:
      - tapOn:
          point: '7%,6%'
      - tapOn:
          text: 'Downloads'
          optional: true
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 20000
- tapOn:
    text: 'baseline.gains'
- extendedWaitUntil:
    visible: 'Import successful!'
    timeout: 60000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
# Open plan 1 (Push pull upper lower) via its plan card. It lands on the plan's
# last training (283) = micro 70, "Push" day (day 2), which is FINISHED.
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 15000
# Open the micro drawer. Step back one micro via the "Micro 69" segmented
# button (its label is the previous micro; the header still reads "Micro 70",
# so the exact "Micro 69" text uniquely targets the button). Then pick the
# "Push" day, which selects training 282 (PLANNED, 11 planned exercises) and
# closes the drawer. Landing on a PLANNED training auto-selects the Plan
# sub-tab, so the kebab must offer both "Edit plan" and "Start Training".
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      text: 'Micro 69'
    timeout: 10000
- tapOn:
    text: 'Micro 69'
- tapOn:
    text: 'Push'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 15000
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit-plan'
    timeout: 5000
- assertVisible:
    id: 'overflow-edit-plan'
- assertVisible:
    id: 'overflow-start'
- assertVisible: 'Start Training'
- takeScreenshot: gh340_plan_kebab_start_training_visible
- tapOn:
    id: 'overflow-start'
- extendedWaitUntil:
    visible: 'Training started!'
    timeout: 10000
- takeScreenshot: gh340_start_training_tapped
