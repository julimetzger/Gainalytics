appId: com.powerliftingworkoutplanner
---
# GH-458 H3 (third empty state): a brand-new account's Dashboard was
# pixel-identical to that of a returning user with 2.3 years of history — the
# same `0 / 0.0t / 0min` and grey chips, with no onboarding, no explanation and
# no way in (audit screenshots 26 vs 31).
#
# This flow deliberately starts from a wiped store, so run
# `00_import_baseline.yaml` afterwards to leave the device usable.

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 90000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'

- extendedWaitUntil:
    visible:
      id: 'dashboard-empty-store'
    timeout: 30000
- assertVisible:
    id: 'dashboard-empty-store-description'
    text: 'Nothing has been logged on this device, so there is nothing to analyse yet. Import an existing history or log your first training.'
# Both ways in are offered, and the weekly KPI card — the thing that used to be
# indistinguishable from a full account — is not rendered at all.
- assertVisible: 'Import data in Settings'
- assertVisible: 'Go to Training'
- assertNotVisible:
    id: 'weekly-summary-card'
- takeScreenshot: gh458_40_dashboard_empty_store
