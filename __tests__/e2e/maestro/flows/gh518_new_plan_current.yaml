appId: com.powerliftingworkoutplanner
---
# GH-518 (F3) with the baseline fixture freshly imported (run 00_import_baseline.yaml first):
# a new plan becomes the current plan right away, the star switches it back and forth, and
# every switch is confirmed. Before GH-518 the home kept offering the old plan's empty
# "Push squat" until the unlabelled star was found.
- runFlow: gh518_home_top.yaml
# The automatic choice for the fixture (no stored current plan): Push pull, next "Push squat".
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- takeScreenshot: gh518_b1_before_new_plan

- tapOn:
    id: 'add-trainings-plan'
- extendedWaitUntil:
    visible: 'Add New Training Plan'
    timeout: 10000
- tapOn:
    id: 'plan-name-input'
- inputText: 'Kraftblock'
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    visible: 'Kraftblock is now your current plan'
    timeout: 10000
- takeScreenshot: gh518_b2_new_plan_snackbar
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 20000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Kraftblock'
- assertVisible:
    id: 'next-training-name'
    text: 'No training planned yet'
- assertNotVisible: 'Push squat'

# The star carries its meaning in its label, and switching is confirmed.
# Let the snackbar go first — it sits right above the FAB strip and can cover a star.
- extendedWaitUntil:
    notVisible: 'Kraftblock is now your current plan'
    timeout: 15000
- scrollUntilVisible:
    element: 'Current plan: Kraftblock'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: 'Set Push pull as current plan'
    direction: DOWN
    timeout: 20000
- tapOn: 'Set Push pull as current plan'
- extendedWaitUntil:
    visible: 'Push pull is now your current plan'
    timeout: 10000
# The bigger Push pull dashboard pushes the plan list down — scroll back to the cards.
- scrollUntilVisible:
    element: 'Current plan: Push pull'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Set Kraftblock as current plan'
- takeScreenshot: gh518_b3_star_switch_snackbar
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 20000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'

# Back to the new plan, which stays current for the hand-over.
- extendedWaitUntil:
    notVisible: 'Push pull is now your current plan'
    timeout: 15000
- scrollUntilVisible:
    element: 'Set Kraftblock as current plan'
    direction: DOWN
    timeout: 20000
- tapOn: 'Set Kraftblock as current plan'
- extendedWaitUntil:
    visible: 'Kraftblock is now your current plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 20000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Kraftblock'
