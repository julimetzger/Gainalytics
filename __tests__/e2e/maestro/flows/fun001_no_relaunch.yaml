appId: com.powerliftingworkoutplanner
---
# FUN-001: Run against the already-running app (no launchApp to avoid Metro reconnect issue)
# Step 1: Import baseline via Settings
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- tapOn:
    id: "settings-import-confirm-button"
- tapOn: "baseline.gains"
# Wait briefly for import to complete (toast may disappear quickly)
- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Navigate to Bankdrücken and trigger the Easter egg
- tapOn: "tab-exercises"
- tapOn:
    text: ".*Bankdrücken.*"
- tapOn:
    id: "add-workout-set-reps-input"
- eraseText
- inputText: "21"
- tapOn:
    id: "add-workout-set-rir-input"
- eraseText
- inputText: "0"
- tapOn:
    id: "add-workout-set-weight-input"
- eraseText
- inputText: "50"
- hideKeyboard
- tapOn:
    id: "add-workout-set-submit-button"
# Assert Easter egg toast
- assertVisible:
    text: "Cardio detected!"
- assertVisible:
    text: ".*This app can't be used to track cardio.*"
# Assert set was saved normally
- assertVisible:
    id: "add-workout-finalize-button"
