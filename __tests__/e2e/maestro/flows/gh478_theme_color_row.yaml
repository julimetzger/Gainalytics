appId: com.powerliftingworkoutplanner
name: GH-478 Theme and Custom Color rows
---
# Proves, against the hydrated baseline store (palette blue, mode dark):
#  * the Appearance card has exactly two labelled rows, "Theme" and
#    "Custom Color", made of Paper SegmentedButtons, with no caption text and
#    no "Color Palette"/"Theme Color" row left
#  * Blue -> Purple -> Custom: each tap moves the checked segment; Custom
#    opens "Pick a theme colour" and the confirmed colour is applied and named
#    on the Custom segment
#  * a long press on a Theme segment shows Paper's Tooltip and does not switch
#  * Light mode works the same way
#  * mode and colour survive an app restart, and the picked colour stays on the
#    Custom segment after switching back to a built-in palette
# Every switch also asserts the PREVIOUS segment is no longer checked, so no
# assertion can pass because the app already sat on that value.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "^settings-section-theme$"
    timeout: 30000

# --- structure ----------------------------------------------------------------
- assertVisible:
    id: "^settings-section-theme-title$"
    text: "Appearance"
- assertVisible:
    id: "^settings-theme-mode-row-label$"
    text: "Theme"
- assertVisible:
    id: "^settings-theme-palette-row-label$"
    text: "Custom Color"
- assertNotVisible: "Color Palette"
- assertNotVisible: "Theme Color"
- assertNotVisible: "Active:.*"
- assertNotVisible: "Pick any color"
- assertNotVisible:
    id: "^settings-palette-green$"

# --- start state: Dark + Blue (the fixture) ----------------------------------
- tapOn:
    id: "^settings-theme-mode-dark$"
- assertVisible:
    id: "^settings-theme-mode-dark$"
    checked: true
- tapOn:
    id: "^settings-palette-blue$"
- assertVisible:
    id: "^settings-palette-blue$"
    checked: true
- assertVisible:
    id: "^settings-palette-custom$"
    checked: false
- takeScreenshot: gh478-01-dark-blue

# --- Blue -> Purple ------------------------------------------------------------
- tapOn:
    id: "^settings-palette-purple$"
- assertVisible:
    id: "^settings-palette-purple$"
    checked: true
- assertVisible:
    id: "^settings-palette-blue$"
    checked: false
- takeScreenshot: gh478-02-dark-purple

# --- Purple -> Custom: the colour wheel ---------------------------------------
- tapOn:
    id: "^settings-palette-custom$"
- extendedWaitUntil:
    visible: "Pick a theme colour"
    timeout: 15000
- tapOn:
    id: "theme-color-hex-input"
- eraseText
- inputText: "#E91E63"
- hideKeyboard
- assertVisible:
    id: "theme-color-preview-hex"
    text: "#E91E63"
- takeScreenshot: gh478-03-picker-open
- tapOn:
    id: "theme-color-apply-button"
- assertNotVisible: "Pick a theme colour"
- assertVisible:
    id: "^settings-palette-custom$"
    checked: true
- assertVisible:
    id: "^settings-palette-purple$"
    checked: false
# The Custom segment names the applied colour (accessibility label).
- assertVisible:
    id: "^settings-palette-custom$"
    text: "Custom #E91E63"
- takeScreenshot: gh478-04-custom-applied

# --- long press on a Theme segment: Paper Tooltip, no switch -----------------
- longPressOn:
    id: "^settings-theme-mode-light$"
- assertVisible: "Light: always light"
- assertVisible:
    id: "^settings-theme-mode-dark$"
    checked: true
- assertVisible:
    id: "^settings-theme-mode-light$"
    checked: false

# --- Light mode ----------------------------------------------------------------
- tapOn:
    id: "^settings-theme-mode-light$"
- assertVisible:
    id: "^settings-theme-mode-light$"
    checked: true
- assertVisible:
    id: "^settings-theme-mode-dark$"
    checked: false
- assertVisible:
    id: "^settings-palette-custom$"
    text: "Custom #E91E63"
- takeScreenshot: gh478-05-light-custom

# --- restart: the selection survives -------------------------------------------
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "^settings-section-theme$"
    timeout: 30000
- assertVisible:
    id: "^settings-theme-mode-light$"
    checked: true
- assertVisible:
    id: "^settings-palette-custom$"
    checked: true
- assertVisible:
    id: "^settings-palette-custom$"
    text: "Custom #E91E63"
- takeScreenshot: gh478-06-after-restart

# --- back to Purple: the picked colour stays on the Custom segment -----------
- tapOn:
    id: "^settings-palette-purple$"
- assertVisible:
    id: "^settings-palette-purple$"
    checked: true
- assertVisible:
    id: "^settings-palette-custom$"
    checked: false
- assertVisible:
    id: "^settings-palette-custom$"
    text: "Custom #E91E63"
- takeScreenshot: gh478-07-light-purple-custom-remembered
