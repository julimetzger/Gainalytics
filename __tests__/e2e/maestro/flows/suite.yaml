appId: com.powerliftingworkoutplanner
---
# GH-225: Trimmed CI suite. Removed the duplicate runFlow:00_import_baseline.yaml
# (the orchestrator's bootstrap mode imports the .gains baseline once before any
# flow runs, so re-importing inside the suite is redundant) and the failing
# video-analysis sub-flows (Bucket F — stale data state requirements). The
# remaining sub-flows are the ones that pass cleanly post-GH-204.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000
- runFlow: 01_training_smoke.yaml
- runFlow: 02_add_workout_set.yaml
- runFlow: 08_training_length.yaml
