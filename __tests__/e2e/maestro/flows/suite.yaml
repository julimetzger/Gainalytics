appId: com.powerliftingworkoutplanner
---
# GH-584: full regression suite — runs every target flow (see FLOW_AUDIT.md).
#
# Prerequisite: the files the flows import must be in /sdcard/Download
# (`run-maestro-from-wsl.sh --mode bootstrap|full` pushes them: baseline.gains,
# the two squat mp4s, gh393/gh415 fixtures, the gh496 CSVs and the AI fixtures).
#
# Order: one baseline import, then the read-only flows that rely on it, then the
# flows that change data — each of those starts with its own import (or a
# clearState), so they do not depend on each other. The empty-store onboarding
# flow runs last.
- runFlow: 00_import_baseline.yaml

# F2/F5/F7/F10 read-only on the baseline
- runFlow: home_dashboard.yaml
- runFlow: settings_general.yaml
- runFlow: training_analysis_compare.yaml
- runFlow: micro_overview_compare.yaml
- runFlow: analyse_dashboard_drilldown.yaml
- runFlow: analyse_graphics_metrics.yaml
- runFlow: analyse_drawer_screens.yaml

# F8 video analysis — before any clearState flow: video_list_filters_vl.yaml
# needs gh415-result.json in the app's files dir (see its header), which a
# clearState wipes.
- runFlow: video_import_playback.yaml
- runFlow: video_list_filters_vl.yaml
- runFlow: video_compare.yaml

# F1/F2 start and training home
- runFlow: start_existing_data.yaml
- runFlow: home_new_plan_current.yaml

# F3 planning
- runFlow: plan_create_meso_template.yaml
- runFlow: plan_edit_sets.yaml
- runFlow: plan_overflow_actions.yaml

# F4 training execution
- runFlow: train_start_log_finish.yaml
- runFlow: train_rest_timer_1rm.yaml
- runFlow: train_delete_exercise_running.yaml

# F5 training edit
- runFlow: training_edit_delete.yaml

# F6 exercises, F12 body weight, F13 muscles
- runFlow: exercises_list_detail.yaml
- runFlow: exercise_edit_alternatives_delete.yaml
- runFlow: body_weight.yaml
- runFlow: muscles_manage.yaml
- runFlow: muscles_exercise_editor.yaml

# F10 settings
- runFlow: settings_appearance.yaml

# F9 import/export
- runFlow: data_strong_export_roundtrip.yaml
- runFlow: data_strong_import_records.yaml

# F11 AI coach (dummy key, offline)
- runFlow: ai_settings_provider.yaml
- runFlow: ai_chat_context.yaml
- runFlow: ai_chat_errors_history.yaml

# F1 onboarding on an empty store (clearState) — last
- runFlow: start_onboarding_template.yaml
