appId: com.powerliftingworkoutplanner
---
# GH-588: smoke flow of the PR check (.github/workflows/maestro-smoke.yml), the agent
# workflow's smoke_only mode (.github/agent-emulator/smoke.sh) and `npm run e2e:android:smoke`.
# Checks concrete baseline values, not just that the app starts (owner decision 2026-10-25).
#
# Prerequisite: fixtures/baseline.gains is in /sdcard/Download as baseline.gains
# (`tool.sh push-baseline`, or the bootstrap of run-maestro-from-wsl.sh). This flow imports it
# ITSELF, so callers must not import it first (that would only cost a second import).
# It REPLACES the app's data on the device and leaves one finished "Push squat" training.
#
# Order (see FLOW_AUDIT.md for each flow):
#   1. 00_import_baseline.yaml          import; also dismisses the onboarding of a fresh install
#   2. home_dashboard.yaml              read-only: Push pull · Meso 1 · M6 · 7,497 kg · Next Training
#   3. analyse_dashboard_drilldown.yaml read-only: Analyse dashboard, radar, muscle drill-down,
#                                       period swipe. ANALYSE_RESUME resumes the app instead
#                                       of the standalone cold start (Analyse is still fresh here).
#   4. train_start_log_finish.yaml      changes data (plans, starts, logs and finishes a training),
#                                       so it runs last. Standalone it imports the baseline
#                                       first; BASELINE_IMPORTED skips that second import here
#                                       (2 and 3 do not change the store).
- runFlow: 00_import_baseline.yaml
- runFlow: home_dashboard.yaml
- runFlow:
    file: analyse_dashboard_drilldown.yaml
    env:
      ANALYSE_RESUME: 'true'
- runFlow:
    file: train_start_log_finish.yaml
    env:
      BASELINE_IMPORTED: 'true'
