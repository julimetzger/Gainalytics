appId: com.powerliftingworkoutplanner
---
# GH-225: Self-contained smoke flow.
# Replaces the prior runFlow chain (00_import_baseline + 99_smoke) that depended
# on a stale `assertVisible: "Training"` literal text. After GH-204 the bottom
# tab labels are only visible when focused, so the literal "Training" check
# fails when a prior flow left the app on a different tab. The post-GH-204
# idiomatic anchor is `tapOn: "tab-training"` + `id: "training-home-screen"`.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- assertVisible:
    id: "settings-import-data-button"
