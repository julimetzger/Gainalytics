appId: com.powerliftingworkoutplanner
---

# Import baseline data with clearState: false to avoid slow cold start.
# The app must already be running (or will warm-start quickly).
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Training'
    timeout: 180000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 300000
