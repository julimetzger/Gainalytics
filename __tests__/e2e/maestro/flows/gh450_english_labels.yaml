appId: com.powerliftingworkoutplanner
---
# GH-450 — the UI must stay entirely English. This flow proves the two label
# fixes that a static text scan cannot: the Micro-Overview's "Total" toggle
# (previously the German "Gesamt") and the Analyse tab's "Analysis" label
# (previously the German "Analyse"), both value-asserted, not just visibility.
#
# Precondition: baseline fixture imported (plan 5 "Push pull", Meso 1).
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000

# --- Analyse tab bar label: must read "Analysis", never "Analyse" ----------
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- assertVisible: 'Analysis'
- assertNotVisible: 'Analyse'
- takeScreenshot: gh450_analyse_tab_english_label

# --- Micro-Overview toggle: must read "Total", never "Gesamt" --------------
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Overview'
- extendedWaitUntil:
    visible: 'Total'
    timeout: 20000
- assertVisible: 'Total'
- assertNotVisible: 'Gesamt'
- assertVisible: 'Exercise'
- assertVisible: 'Muscle'
- takeScreenshot: gh450_micro_overview_english_toggle
- tapOn: 'Total'
- extendedWaitUntil:
    visible: 'Total'
    timeout: 15000
- takeScreenshot: gh450_micro_overview_total_tab
