appId: com.powerliftingworkoutplanner
---
# GH-533 scenario "complete_new_week": import the matching fixture (pushed with
# --fixture <run_dir>/fixtures/gh533_complete_new_week.gains), then assert the dashboard.
- runFlow: 00_import_baseline.yaml
- runFlow:
    file: gh533_current_micro.yaml
    env:
      TAG: complete_new_week
      MICRO: 'Meso 1 · M7'
      DONE: '0/4'
      NEXT_STATUS: 'Next Training'
      NEXT_SLOT: 'Meso 1 · M7 · D1 · .*'
