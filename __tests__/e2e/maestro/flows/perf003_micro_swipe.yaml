appId: com.powerliftingworkoutplanner
---
# PERF-003: swiping between micros. READ-ONLY on purpose — this flow runs on a device with real
# user data: no clearState, no import, no edits; it only navigates and swipes.
#
# Path: Training home -> "Next Training" (Micro 7) -> swipe back to Micro 4 -> Micro 3 -> Micro 4,
# once per sub-tab (Analysis / Train / Plan). After every swipe the header names the new micro AND the
# content of the arrived pane is asserted by VALUE: Analysis "Total Sets: 15/16 (done)", Train card date
# "16/02/26" / "02/02/26", Plan leg-curl weight "95 kg" / "90 kg" (values of the real data on the device;
# Micro 4 and Micro 3 of "Push squat" differ in all three).
# Which sub-tab a pane is on right after a swipe depends on that pane's history, so the flow taps the
# sub-tab explicitly after arriving (and screenshots BOTH the as-arrived state and the tapped state).
# Screenshots go to the working directory with the prefix ${SHOT_PREFIX}.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: 'Current micro'
    timeout: 30000
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible: 'Micro 7'
    timeout: 15000
- repeat:
    times: 3
    commands:
      - swipe:
          start: 10%, 50%
          end: 90%, 50%
          duration: 300
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 4'
    timeout: 5000
- assertVisible: '.*Push squat.*'
- takeScreenshot: ${SHOT_PREFIX}-00-micro4-start

# ---------- analysis sub-tab ----------
- tapOn:
    id: 'subtab-analysis'
- assertVisible: 'Total Sets: 15 (done)'
- takeScreenshot: ${SHOT_PREFIX}-10-analysis-micro4
- swipe:
    start: 10%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 3'
    timeout: 5000
- assertVisible: '.*Push squat.*'
- takeScreenshot: ${SHOT_PREFIX}-11-analysis-micro3-as-arrived
- tapOn:
    id: 'subtab-analysis'
- assertVisible: 'Total Sets: 16 (done)'
- assertNotVisible: 'Total Sets: 15 (done)'
- takeScreenshot: ${SHOT_PREFIX}-12-analysis-micro3
- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 4'
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-13-analysis-back-micro4-as-arrived
- tapOn:
    id: 'subtab-analysis'
- assertVisible: 'Total Sets: 15 (done)'
- assertNotVisible: 'Total Sets: 16 (done)'
- takeScreenshot: ${SHOT_PREFIX}-14-analysis-back-micro4

# ---------- train sub-tab ----------
- tapOn:
    id: 'subtab-train'
- assertVisible: '.*16/02/26'
- takeScreenshot: ${SHOT_PREFIX}-20-train-micro4
- swipe:
    start: 10%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 3'
    timeout: 5000
- assertVisible: '.*Push squat.*'
- takeScreenshot: ${SHOT_PREFIX}-21-train-micro3-as-arrived
- tapOn:
    id: 'subtab-train'
- assertVisible: '.*02/02/26'
- assertNotVisible: '.*16/02/26'
- takeScreenshot: ${SHOT_PREFIX}-22-train-micro3
- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 4'
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-23-train-back-micro4-as-arrived
- tapOn:
    id: 'subtab-train'
- assertVisible: '.*16/02/26'
- assertNotVisible: '.*02/02/26'
- takeScreenshot: ${SHOT_PREFIX}-24-train-back-micro4

# ---------- plan sub-tab ----------
- tapOn:
    id: 'subtab-plan'
- assertVisible: '95, kg'
- takeScreenshot: ${SHOT_PREFIX}-30-plan-micro4
- swipe:
    start: 10%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 3'
    timeout: 5000
- assertVisible: '.*Push squat.*'
- takeScreenshot: ${SHOT_PREFIX}-31-plan-micro3-as-arrived
- tapOn:
    id: 'subtab-plan'
- assertVisible: '90, kg'
- assertNotVisible: '95, kg'
- takeScreenshot: ${SHOT_PREFIX}-32-plan-micro3
- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Micro 4'
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-33-plan-back-micro4-as-arrived
- tapOn:
    id: 'subtab-plan'
- assertVisible: '95, kg'
- assertNotVisible: '90, kg'
- takeScreenshot: ${SHOT_PREFIX}-34-plan-back-micro4
