appId: com.powerliftingworkoutplanner
---
# GH-207 evidence: navigate to VideoAnalysis tab, trigger import, capture progress bar
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
# Navigate to Analyse tab
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
# Open analyse drawer
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analysis'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analysis'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
# Screenshot: show current list with t=0 thumbnails (DONE and FAILED analyses)
- takeScreenshot: 'gh207_r3_video_list_with_thumbnails'
# Tap Import Video to start a new import
- tapOn: 'Import Video'
# The file picker opens — select squat-3reps.mp4 from Downloads
- extendedWaitUntil:
    visible: 'squat-3reps.mp4'
    timeout: 15000
- tapOn: 'squat-3reps.mp4'
# Wait briefly then screenshot the progress bar in action
- extendedWaitUntil:
    visible:
      id: 'video-analysis-progress-bar'
    timeout: 30000
- takeScreenshot: 'gh207_r3_progress_bar_active'
# Wait a bit for the progress to tick
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'gh207_r3_progress_bar_ticking'
