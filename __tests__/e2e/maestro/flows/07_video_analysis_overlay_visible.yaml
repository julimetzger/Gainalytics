appId: com.powerliftingworkoutplanner
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- extendedWaitUntil:
    visible: "Analysis #[0-9]+"
    timeout: 30000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Playback Overlay"
    direction: DOWN
- assertVisible:
    id: "video-analysis-playback-overlay"
- extendedWaitUntil:
    visible: "Play"
    timeout: 10000
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Current Rep: [1-9][0-9]*"
    timeout: 50000
- assertVisible:
    id: "video-analysis-playback-active-rep-path"
