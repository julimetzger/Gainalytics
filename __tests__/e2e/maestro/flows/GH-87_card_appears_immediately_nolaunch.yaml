appId: com.powerliftingworkoutplanner
---
# GH-87 variant: skip clearState/launchApp and reuse the already-loaded app.
# Used by worker when Maestro's clearState launch step is flaky with the
# orchestrator's driver-host-port setup — the behaviour under test is the
# import flow, not a cold launch.
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
- tapOn: "Import Emulator Squat Video"
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
# CRITICAL ASSERTION: Card must appear within 2 seconds of the Import tap.
# Before GH-87, this took 15-20 seconds because addVideoAnalysis() was
# preceded by awaits on getVideoDuration() + copyImportedVideoToLocalStorage().
- extendedWaitUntil:
    visible: "Analysis #1"
    timeout: 2000
- assertVisible:
    id: "video-analysis-card-1"
- assertVisible: "Import Emulator Squat Video"
- extendedWaitUntil:
    visible: "Status: (queued|copying|preflight|processing|awaiting_seed_selection|done|failed)"
    timeout: 3000
# Verify the live in-progress status text — the fix makes status visible while work is underway.
- assertVisible:
    text: "Status: (copying|preflight|processing|awaiting_seed_selection|done)"
