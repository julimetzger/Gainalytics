appId: com.powerliftingworkoutplanner
name: GH-391 store a dummy Anthropic key so the AI Chat screen renders
---
# The AI Chat tab renders a "add your key in Settings" placeholder until a key
# exists. GH-391 is about the CONTEXT the chat assembles, not about a model
# answer, so a dummy key is all this evidence run needs — no request is ever
# sent, and the key never leaves the device.
- launchApp:
    clearState: false
- runFlow: dismiss_system_anr.yaml
- tapOn:
    text: 'Dismiss'
    optional: true
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-settings'
# The key input lives inside the collapsed "AI Configuration" accordion — it is
# not in the hierarchy at all until the accordion is expanded.
- scrollUntilVisible:
    element:
      id: 'settings-ai-config-accordion'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-ai-config-accordion'
- scrollUntilVisible:
    element:
      id: 'settings-anthropic-api-key-input'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'settings-anthropic-api-key-input'
# A key saved by an earlier run stays in the field, and the tap puts the cursor
# mid-text: typing would insert the new key INTO the old one (GH-544: the echo
# key became "sk-ant-e2e-sk-ant-e2e-echo-answerecho-answer"). Erase it first,
# tap + erase three times like ai_chat_errors_history.yaml; centred, the field
# stays above the keyboard, and it keeps focus, so the re-taps are optional.
- eraseText: 200
- repeat:
    times: 2
    commands:
      - tapOn:
          id: 'settings-anthropic-api-key-input'
          optional: true
      - eraseText: 200
# GH-544: env API_KEY overrides the key — plan_overflow_actions passes the
# "echo" key (AI_PLAN_ECHO_API_KEY): "Plan with AI" then takes the typed text
# as the model's answer and sends nothing. No header env default: it would
# override the caller's value.
- inputText: "${typeof API_KEY === 'undefined' ? 'sk-ant-dummy-not-a-real-key' : API_KEY}"
- hideKeyboard
# With the keyboard gone the buttons below the input can still sit off-screen.
- scrollUntilVisible:
    element:
      id: 'settings-save-api-key-button'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-save-api-key-button'
- waitForAnimationToEnd
