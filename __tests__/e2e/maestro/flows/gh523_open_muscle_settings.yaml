appId: com.powerliftingworkoutplanner
---
# GH-523 helper: Settings › Muscles › "Manage muscles" expanded.
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'tab-settings'
    timeout: 90000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-muscles-accordion'
    direction: DOWN
# The list may already be open from an earlier run (the input is then below the fold).
- runFlow:
    when:
      notVisible:
        id: 'settings-muscle-row-Back'
    commands:
      - tapOn:
          id: 'settings-muscles-accordion'
- waitForAnimationToEnd
