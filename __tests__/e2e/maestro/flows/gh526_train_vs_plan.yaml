appId: com.powerliftingworkoutplanner
---
# GH-526 — Train position, chip "vs Plan": done vs the plan of THIS training.
# Starts on Micro 2 · Push squat, Analysis, Train (gh526_goto_micro2_push.yaml).
# Fixture: 17 sets done, 14 planned; muscle map Chest 4 done / 3 planned.
- tapOn:
    id: 'analysis-compare-this_training_plan'
- assertVisible:
    id: 'analysis-comparison-line'
    text: 'Done vs plan of this training'
- copyTextFrom:
    id: 'trainings-overview-sets-value'
- assertTrue: "${maestro.copiedText === '17'}"
- assertVisible:
    id: 'trainings-overview-sets-reference'
    text: ' / 14'
- assertVisible:
    id: 'trainings-overview-sets-delta'
    text: '\+3 \(\+21%\)'
# no planned duration exists — the Duration card only appears for "vs last"
- assertNotVisible:
    id: 'trainings-overview-duration'
- scrollUntilVisible:
    element:
      id: 'analysis-muscle-map-row-Chest-readout'
    direction: DOWN
- tapOn:
    id: 'analysis-muscle-map-view-total'
- tapOn:
    id: 'analysis-muscle-map-metric-sets'
- copyTextFrom:
    id: 'analysis-muscle-map-row-Chest-readout'
- assertTrue: "${maestro.copiedText === '4/3'}"
- copyTextFrom:
    id: 'analysis-muscle-map-row-Core-readout'
- assertTrue: "${maestro.copiedText === '2.9/0.6'}"
