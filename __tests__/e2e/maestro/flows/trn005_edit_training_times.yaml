appId: com.powerliftingworkoutplanner
---
- launchApp
- tapOn:
    text: "Don't Show Again"
    optional: true
- tapOn:
    text: 'OK'
    optional: true
- extendedWaitUntil:
    visible: 'Training'
    timeout: 30000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- tapOn:
    id: 'settings-import-confirm-button'
    optional: true
- tapOn: 'baseline.gains'
- assertVisible: 'Import successful!'
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
# Navigate to plan 1 (Push pull upper lower) which lands on micro 70.
# Training slot 70,1 (ID 281) is FINISHED — enter edit mode via overflow menu.
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 30000
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit'
    timeout: 5000
- tapOn:
    id: 'overflow-edit'
# NOTE: edit-training-open-times-modal lives inside TrainingsPlanNode's main
# ScrollView which does not expose content to the accessibility tree (uiautomator /
# Maestro). This assertion will time out. Tracking this as a separate infra issue.
- extendedWaitUntil:
    visible:
      id: 'edit-training-open-times-modal'
    timeout: 30000
# --- Cancel path: verify modal opens and has expected fields ---
- tapOn:
    id: 'edit-training-open-times-modal'
- extendedWaitUntil:
    visible: 'Edit Training Times'
    timeout: 8000
- assertVisible: 'Start'
- assertVisible: 'End'
- tapOn: 'Cancel'
- extendedWaitUntil:
    visible:
      id: 'edit-training-open-times-modal'
    timeout: 8000
# --- Save path: change times and confirm save works ---
- tapOn:
    id: 'edit-training-open-times-modal'
- extendedWaitUntil:
    visible: 'Edit Training Times'
    timeout: 8000
- tapOn:
    id: 'edit-training-times-start'
- eraseText
- inputText: '01/01/2025 08:00'
- tapOn:
    id: 'edit-training-times-end'
- eraseText
- inputText: '01/01/2025 10:00'
- assertVisible:
    id: 'edit-training-times-duration'
- tapOn:
    id: 'edit-training-times-save'
- extendedWaitUntil:
    visible:
      id: 'edit-training-open-times-modal'
    timeout: 8000
# --- TrainingLengthTab: longpress opens overlay ---
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 30000
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Analyse'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Training Length'
    direction: DOWN
- tapOn: 'Training Length'
- extendedWaitUntil:
    visible: 'Grouped by Day'
    timeout: 30000
- assertVisible:
    id: 'training-length-chart'
- longPressOn:
    id: 'training-length-chart'
- extendedWaitUntil:
    visible: 'Edit Training Times'
    timeout: 8000
- assertVisible: 'Live average duration:'
- tapOn: 'Cancel'
- extendedWaitUntil:
    visible:
      id: 'training-length-selected-bucket'
    timeout: 8000
