appId: com.powerliftingworkoutplanner
---
# GH-468 round 4: the Analyse tab still looks like round 3 (every metric in the
# primary colour, metric filter only in the picker) and tapping a data point
# still lists its trainings — now without the charts being recomputed.
#
# Needs the baseline fixture. Does NOT launch the app: on a loaded emulator the
# Analysis screen takes >20 s to open, so the prerequisite state is reached via
# adb (see summary.md): Analysis tab -> drawer -> "Analysis", nothing picked
# but the default "Day" accumulation, default range (last 3 months, empty).

- extendedWaitUntil:
    visible:
      id: 'analyse-chart-jump-to-last'
    timeout: 90000
- tapOn:
    id: 'analyse-chart-jump-to-last'
- extendedWaitUntil:
    visible:
      id: 'analyse-chart-Volume'
    timeout: 60000

# ------------------------------- (a) no selection, no filter -> every metric
- assertVisible: '1 selected'
- assertVisible: 'Volume \(sum\)'
- assertVisible:
    id: 'analyse-chart-1RM'
- assertNotVisible:
    id: 'analyse-metric-chips'
- takeScreenshot: gh468_r4_a_all_metrics

# ------------------- (b) Volume + Frequency + Week in the existing picker
# Every pick re-taps once if its chip did not flip — the open keyboard often
# eats the first row tap (agent-memory #443/#454).
- tapOn: 'Select Exercises, Muscles, Metrics, Accumulation Mode'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000

- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Volume'
- waitForAnimationToEnd
- tapOn:
    text: 'Volume'
    below:
      id: 'search-bar'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Volume'
    commands:
      - tapOn:
          text: 'Volume'
          below:
            id: 'search-bar'
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Volume'

- tapOn:
    id: 'search-bar-clear-icon'
    optional: true
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Frequency'
- waitForAnimationToEnd
- tapOn:
    text: 'Frequency'
    below:
      id: 'search-bar'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Frequency'
    commands:
      - tapOn:
          text: 'Frequency'
          below:
            id: 'search-bar'
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Frequency'

- tapOn:
    id: 'search-bar-clear-icon'
    optional: true
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'Week'
- waitForAnimationToEnd
- tapOn:
    text: 'Week'
    below:
      id: 'search-bar'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'chip'
        text: 'Week'
    commands:
      - tapOn:
          text: 'Week'
          below:
            id: 'search-bar'
      - waitForAnimationToEnd
- assertVisible:
    id: 'chip'
    text: 'Week'
- assertNotVisible:
    id: 'chip'
    text: 'Day'
- tapOn:
    id: 'search-bar-clear-icon'
    optional: true

- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- waitForAnimationToEnd
- assertVisible: '3 selected'
- assertVisible: 'Volume \(sum\)'
- assertVisible: 'Frequency \(training days\)'
- assertNotVisible:
    id: 'analyse-chart-1RM'
- assertNotVisible:
    id: 'analyse-chart-Sets'
- takeScreenshot: gh468_r4_b_volume_frequency_week

# ---------------- (c) tap the last weekly Volume point (week of 23/02/26)
- tapOn:
    point: '89%, 47%'
- waitForAnimationToEnd
- takeScreenshot: gh468_r4_c_point_marker
# Swipes must start BELOW the charts: a drag across a chart highlights (and
# selects) whatever point is under the finger.
- swipe:
    start: '50%, 92%'
    end: '50%, 40%'
    duration: 600
- waitForAnimationToEnd
# newest training of the tapped week first
- assertVisible: 'Sat, 28/02/26'
- repeat:
    while:
      notVisible: 'Mon, 23/02/26'
    times: 8
    commands:
      - swipe:
          start: '50%, 85%'
          end: '50%, 35%'
          duration: 600
      - waitForAnimationToEnd
# trainings of that week only — the week before is not listed
- assertVisible: 'Mon, 23/02/26'
- assertNotVisible: 'Sun, 22/02/26'
- assertNotVisible: 'Sat, 21/02/26'
- takeScreenshot: gh468_r4_c_point_trainings
# the charts are still there after the tap
- repeat:
    while:
      notVisible: 'Volume \(sum\)'
    times: 8
    commands:
      - swipe:
          start: '50%, 25%'
          end: '50%, 85%'
          duration: 600
      - waitForAnimationToEnd
- assertVisible: 'Volume \(sum\)'
- assertVisible: 'Frequency \(training days\)'
