appId: com.powerliftingworkoutplanner
---
# GH-487: Exercises tab -> Squat -> edit sheet -> open the alternatives picker.
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-exercises'
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 30000
- tapOn:
    id: 'exercise-searchbar'
- eraseText: 30
- inputText: 'Squat'
- hideKeyboard
- tapOn:
    id: 'exercise-row-2'
- extendedWaitUntil:
    visible:
      id: 'exercise-detail-edit-button'
    timeout: 30000
- tapOn:
    id: 'exercise-detail-edit-button'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-sheet'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'exercise-alternatives-open-button'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'exercise-alternatives-open-button'
