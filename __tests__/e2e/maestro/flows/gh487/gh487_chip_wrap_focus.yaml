appId: com.powerliftingworkoutplanner
---
# GH-487 round 2, part 1: open the picker on Squat (already has the chips Front squat +
# T bar row free from gh487_alternatives_search.yaml), focus the search and filter.
# The runner script then reads the search field's bounds via uiautomator.
- runFlow: open_squat_edit.yaml
- extendedWaitUntil:
    visible:
      id: 'exercise-alternatives-search'
    timeout: 10000
- tapOn:
    id: 'exercise-alternatives-search'
- eraseText: 30
- inputText: 'cable'
- assertVisible:
    id: 'exercise-alternative-row-56'   # Cable row close pronated
- assertNotVisible:
    id: 'exercise-alternative-row-83'   # Front squat filtered out
- waitForAnimationToEnd
