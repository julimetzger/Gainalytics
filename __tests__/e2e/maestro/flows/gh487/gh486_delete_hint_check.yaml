appId: com.powerliftingworkoutplanner
---
# GH-487 round 2: after merging master, the GH-486 delete hint still appears in the same
# edit sheet. Opens the dialog for Squat and CANCELS — nothing is deleted.
- runFlow: open_squat_edit.yaml
- tapOn:
    id: 'exercise-alternatives-open-button'   # close the picker again ("Done")
- scrollUntilVisible:
    element:
      id: 'edit-exercise-delete'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'edit-exercise-delete'
- extendedWaitUntil:
    visible: 'Delete Squat\?'
    timeout: 10000
- assertVisible:
    id: 'edit-exercise-delete-history'
    text: 'This will also delete \d+ workouts \(\d+ sets\) from your history\. This action cannot be undone\.'
