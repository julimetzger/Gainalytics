appId: com.powerliftingworkoutplanner
---

# Launch app and wait for it to load.
# clearState: false avoids the 60s+ cold-bundle load on emulator; app data is preserved.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Training'
    timeout: 90000

# Navigate to Analyse > Metrics Overview.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'

# Wait for MetricsOverview navigation header to confirm screen loaded.
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 20000

# Take a screenshot to show the loaded Metrics Overview screen.
- takeScreenshot: gh97-metrics-overview-loaded

# Tap on the first muscle metric column header using screen coordinates.
# DataTable.Title testIDs are not in the Android accessibility tree, so we use
# point-based tapping. "Volume" (first muscle metric column) is at ~56% x, 29% y.
- tapOn:
    point: "56%, 29%"
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000

# KEY ASSERTION: Frequency must be present in the dropdown.
# maxHeight 520 shows all 7 metrics; Frequency is the last item.
# Swipe up in the dialog to ensure Frequency is in view, then assert.
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 500
- assertVisible:
    text: 'Frequency'
- takeScreenshot: gh97-frequency-in-muscle-dropdown

# Select Frequency. Dialog modal scrim ensures this targets the dialog list item,
# not any table column header that might show "Frequency" text.
- tapOn:
    text: 'Frequency'

# Wait for dialog to close — the nav header "Metrics Overview" remains visible.
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000

# Re-open the muscle dropdown to verify "Current: Frequency" persists.
- tapOn:
    point: "56%, 29%"
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000
- assertVisible:
    text: 'Current: Frequency'
- takeScreenshot: gh97-frequency-persists-muscle

# Dismiss by tapping Volume to restore default state.
- tapOn:
    text: 'Volume'
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000

# Scroll to Exercise Overview section.
# Use "Exercise" (DataTable column header, plain string) as scroll anchor
# since Card.Title with React element child is not in accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Exercise'
    direction: DOWN
    timeout: 15000

# Tap first exercise metric column header using screen coordinates.
# After scrolling, the exercise header is at approximately 56% x, 67% y.
- tapOn:
    point: "56%, 67%"
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000

# KEY ASSERTION: Frequency must be present in exercise dropdown too.
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 500
- assertVisible:
    text: 'Frequency'
- takeScreenshot: gh97-frequency-in-exercise-dropdown

# Select Frequency in exercise dropdown too.
- tapOn:
    text: 'Frequency'
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000
- takeScreenshot: gh97-frequency-selected-exercise
