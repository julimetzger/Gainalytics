appId: com.powerliftingworkoutplanner
---

# Launch app and wait for it to load.
# clearState: false avoids the 60s+ cold-bundle load on emulator; app data is preserved.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Training'
    timeout: 90000

# ───────────────────────────────────────────────────────
# Part 1: Metrics Overview – verify FREQUENCY option exists
# ───────────────────────────────────────────────────────

# Navigate to Analyse tab, then open the drawer to navigate to Metrics Overview.
# Wait for analyse-drawer-toggle (only visible on Analyse screens) to confirm the
# tab switch happened before tapping the hamburger.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 15000

# Screenshot: Metrics Overview loaded
- takeScreenshot: gh97-metrics-overview-loaded

# Tap the first muscle metric column header to open MetricSelectionDialog.
# The DataTable is inside RangeSwiper's Animated.View; the element is not in the
# Android accessibility tree via uiautomator, but can be reached via coordinate tap.
# On 1080×2400: y ≈ 29 % (≈ 696 px) is below the date-range button (≈ 575 px) and
# within the Muscle Overview header row; x ≈ 47 % targets the first metric column.
- tapOn:
    point: "47%,29%"
- runFlow:
    when:
      visible: 'Select muscle metric'
    commands:
      # Take screenshot first to capture the dialog state
      - takeScreenshot: gh97-frequency-in-muscle-dropdown
      # Scroll down within the dialog to ensure Frequency (last item) is in view.
      # Dialog.ScrollArea maxHeight: 520 — on 720×1600 the 7th item may be off-screen.
      - scroll
      # KEY ASSERTION: Frequency must be present in the dropdown
      - assertVisible:
          text: 'Frequency'
      # Dismiss by pressing back (don't change metric — keeps flow state clean)
      - pressKey: back

# ───────────────────────────────────────────────────────
# Part 2: Exercise filter on Metrics Overview
# ───────────────────────────────────────────────────────

# Select an exercise from the TrainingElementPicker (outside RangeSwiper, fully accessible).
- tapOn: 'Select Exercises, Metrics, Accumulation Mode'
- extendedWaitUntil:
    visible: 'Bankdrücken'
    timeout: 15000
- tapOn: 'Bankdrücken'
# Dismiss the dropdown by tapping the backdrop (top-left area above the modal).
# pressKey: back is unreliable here — if the modal auto-closed it would trigger
# navigation back instead of just dismissing the overlay.
- tapOn:
    point: "5%,5%"
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- takeScreenshot: gh97-metrics-overview-exercise-filter

# ───────────────────────────────────────────────────────
# Part 3: User scenario – Frequency + Exercise + Day granularity
# Navigate to Exercise Graphs where AccumulationMode.SINGLE_DAY ("Day") is available.
# ───────────────────────────────────────────────────────

# Open the Analyse drawer via the hamburger icon to navigate to Exercise Graphs.
# analyse-drawer-toggle is already visible (we're still on Metrics Overview).
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Exercise Graphs'
    timeout: 10000
- tapOn: 'Exercise Graphs'
- extendedWaitUntil:
    visible: 'Exercise Graphs'
    timeout: 15000
- takeScreenshot: gh97-exercise-graphs-loaded

# Select an exercise; default AccumulationMode is SINGLE_DAY ("Day") – no change needed.
- tapOn: 'Select Exercise and Accumulation Mode'
- extendedWaitUntil:
    visible: 'Bankdrücken'
    timeout: 15000
- tapOn: 'Bankdrücken'
# Dismiss dropdown by tapping backdrop (same reason as Part 2).
- tapOn:
    point: "5%,5%"
- extendedWaitUntil:
    visible: 'Exercise Graphs'
    timeout: 15000

# The screen now shows metric charts: Frequency + Exercise filter + Day granularity.
# Assert Volume is visible first (it's the first chart — always on screen).
- assertVisible:
    text: 'Volume'
# Scroll down to find Frequency: it's the 7th chart card and starts off-screen on 720×1600.
- scrollUntilVisible:
    element:
      text: 'Frequency'
    direction: DOWN
    timeout: 15000
# KEY ASSERTION: Frequency chart card renders without crashing.
# Card.Title uses the Metric enum string value 'Frequency' — not uppercased.
- assertVisible:
    text: 'Frequency'
- takeScreenshot: gh97-frequency-exercise-day
