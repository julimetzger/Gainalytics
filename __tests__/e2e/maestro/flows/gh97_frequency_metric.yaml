appId: com.powerliftingworkoutplanner
---

# Launch app and wait for it to load.
# clearState: false avoids the 60s+ cold-bundle load on emulator; app data is preserved.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Training'
    timeout: 90000

# Navigate to Analyse > Metrics Overview.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'

# Wait for MetricsOverview navigation header to confirm screen loaded.
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 20000

# Scroll to top so the muscle table header is fully visible.
- scroll:
    direction: UP
    duration: 500

# Take a screenshot to show the loaded Metrics Overview screen.
- takeScreenshot: gh97-metrics-overview-loaded

# Tap the "Volume" text inside the first muscle metric column header.
# DataTable.Title testIDs are not exposed in the Android accessibility tree.
# Text-based tap reaches the inner <Text> node and bubbles up to DataTable.Title's onPress.
- tapOn:
    text: "Volume"
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000

# KEY ASSERTION: Frequency must be present in the dropdown.
# List.Item uses plain-string title so Maestro can find it by text.
- assertVisible:
    text: 'Frequency'
- takeScreenshot: gh97-frequency-in-muscle-dropdown

# Select Frequency. tapOn exact text avoids ambiguity with "Current: Volume".
- tapOn:
    text: 'Frequency'

# Wait for dialog to close — the nav header "Metrics Overview" remains visible.
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000

# Re-open the muscle dropdown to verify "Current: Frequency" persists.
# Column header now shows "Frequency", so we tap that text.
- tapOn:
    text: "Frequency"
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000
- assertVisible:
    text: 'Current: Frequency'
- takeScreenshot: gh97-frequency-persists-muscle

# Dismiss by tapping Volume to restore default state.
- tapOn:
    text: 'Volume'
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000

# Scroll to Exercise Overview section.
# Use "Exercise" (DataTable column header plain string) as scroll anchor.
- scrollUntilVisible:
    element:
      text: 'Exercise'
    direction: DOWN
    timeout: 15000

# Tap "1RM" text inside the first exercise metric column header (default slot 0 = 1RM).
- tapOn:
    text: "1RM"
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000

# KEY ASSERTION: Frequency must be present in exercise dropdown too.
- assertVisible:
    text: 'Frequency'
- takeScreenshot: gh97-frequency-in-exercise-dropdown

# Select Frequency in exercise dropdown too.
- tapOn:
    text: 'Frequency'
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000
- takeScreenshot: gh97-frequency-selected-exercise
