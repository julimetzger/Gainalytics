appId: com.powerliftingworkoutplanner
---

# Launch app and wait for it to load.
# clearState: false avoids the 60s+ cold-bundle load on emulator; app data is preserved.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Training'
    timeout: 90000

# Navigate to Analyse > Metrics Overview.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 15000
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- tapOn: 'Metrics Overview'

# Wait for MetricsOverview navigation header to confirm screen loaded.
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 20000

# Take a screenshot to show the loaded Metrics Overview screen.
- takeScreenshot: gh97-metrics-overview-loaded

# Tap on the first muscle metric column header using screen coordinates.
# DataTable.Title testIDs are not in the Android accessibility tree, so we use
# point-based tapping. "Volume" (first muscle metric column) is at approximately
# 56% x, 29% y on the 1080x2400 emulator screen.
- tapOn:
    point: "56%, 29%"
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000

# KEY ASSERTION: Frequency must be present in the dropdown.
# With maxHeight 520, all 7 metrics fit without scrolling.
- assertVisible:
    id: 'metric-selector-option-frequency'
- takeScreenshot: gh97-frequency-in-muscle-dropdown

# Select Frequency using its testID — avoids tapping the table column header
# which also shows "Frequency" text when it was previously selected.
- tapOn:
    id: 'metric-selector-option-frequency'

# Wait for dialog to close (Muscle Overview text becomes visible again).
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000

# Re-open the muscle dropdown to verify "Current: Frequency" persists.
- tapOn:
    point: "56%, 29%"
- extendedWaitUntil:
    visible: 'Select muscle metric'
    timeout: 10000
- assertVisible:
    text: 'Current: Frequency'
- takeScreenshot: gh97-frequency-persists-muscle

# Dismiss by selecting Volume to restore default state.
- tapOn:
    id: 'metric-selector-option-volume'
- extendedWaitUntil:
    visible:
      text: 'Metrics Overview'
    timeout: 10000

# Scroll to Exercise Overview section.
- scrollUntilVisible:
    element:
      text: 'Exercise Overview'
    direction: DOWN
    timeout: 15000

# Tap first exercise metric column header.
# ExerciseMetricOverview header is below Exercise Overview card title.
# "1RM" is the first exercise metric at approximately 55% x, 67% y after scrolling.
- tapOn:
    point: "55%, 67%"
- extendedWaitUntil:
    visible: 'Select exercise metric'
    timeout: 10000

# KEY ASSERTION: Frequency must be present in exercise dropdown too.
- assertVisible:
    id: 'metric-selector-option-frequency'
- takeScreenshot: gh97-frequency-in-exercise-dropdown

# Select Frequency in exercise dropdown too, using testID to avoid ambiguity.
- tapOn:
    id: 'metric-selector-option-frequency'
- extendedWaitUntil:
    visible: 'Metrics Overview'
    timeout: 10000
- takeScreenshot: gh97-frequency-selected-exercise
