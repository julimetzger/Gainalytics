appId: com.powerliftingworkoutplanner
---
# GH-342: value labels on the Current-micro comparison bars (Volume/Sets/Time).
#
# The bar labels are drawn on the native MPAndroidChart canvas, so they are NOT
# addressable in the accessibility tree. This flow therefore asserts the ACTUAL
# metric values via the card headline (testID micro-hero-value), which is computed
# by the same getValue()/format path that feeds the bar labels, and captures a
# screenshot of the labeled bars for each metric as visual evidence.
#
# Baseline fixture values for the current micro (M7 of "Push pull"):
#   Volume: 0 kg (delta -7497 vs M6) | Sets: 0 (delta -15 vs M6) | Time: 0m (delta -106 vs M6)
# M7 has no finished trainings in the fixture, so the current-micro bar exercises the
# 0-value label case, while M1-M6 carry non-zero computed values.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

# Import baseline so the dashboard has data (no empty-store evidence).
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- tapOn:
    id: "settings-import-confirm-button"
    optional: true
- tapOn: "baseline.gains"
- extendedWaitUntil:
    visible: ".*Import successful.*"
    timeout: 60000

- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "micro-hero-card"
    timeout: 30000
- assertVisible: "Push pull"

# Volume (default metric): current micro M7 volume is 0 kg, M6 delta is -7497
- tapOn: "Volume"
- assertVisible: "0 kg"
- assertVisible: "-7497 vs M6"
- takeScreenshot: gh342_volume_bar_values

# Sets: current micro has 0 sets, delta -15 vs M6 (15 -> 0)
- tapOn: "Sets"
- assertVisible: "-15 vs M6"
- takeScreenshot: gh342_sets_bar_values

# Time: current micro has 0 minutes -> headline "0m", delta -106 vs M6
- tapOn: "Time"
- assertVisible: "0m"
- assertVisible: "-106 vs M6"
- takeScreenshot: gh342_time_bar_values
