appId: com.powerliftingworkoutplanner
---
# GH-204 r2: capture five evidence screenshots of the redesigned Training Home dashboard.
#
# Pre-conditions: baseline.gains imported (gh195 flow runs first, or standalone import).
#
# This flow asserts the new test IDs introduced in r2:
#   - micro-hero-card / micro-hero-completion (CompletionRing)
#   - day-strip (DayStrip)
#   - next-training-card (NextTrainingCard visible)
#   - plans-search-field (visible search above plans list)
# NOTE: next-training-target-1 and "vs M{n}" delta captions are omitted because
# the baseline fixture has no plannedWorkouts for upcoming slots; those nodes are
# conditionally rendered only when planned sets exist.
# GH-215 (RC1): standalone Maestro flows require explicit launchApp;
# adb reverse tcp:8081 is set by run-maestro-from-wsl.sh so Metro is reachable.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

# Import baseline so the dashboard has active plans and micro-hero data.
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- tapOn:
    id: "settings-import-confirm-button"
    optional: true
- tapOn: "baseline.gains"
- extendedWaitUntil:
    visible: ".*Import successful.*"
    timeout: 60000

- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 30000

# r2_a — Hero card with completion ring and day strip
- extendedWaitUntil:
    visible:
      id: "micro-hero-card"
    timeout: 30000
- assertVisible:
    id: "micro-hero-completion"
- assertVisible:
    id: "day-strip"
- assertVisible: "Current micro"
- takeScreenshot: r2_a_hero_with_ring_and_daystrip

# r2_b — NextTrainingCard (card presence + "Next Training" label)
- assertVisible:
    id: "next-training-card"
- assertVisible: "Next Training"
- takeScreenshot: r2_b_next_training_card

# r2_c — Plans-list with status dot and visible search field
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- assertVisible:
    id: "plans-search-field"
- assertVisible: "Plans"
- takeScreenshot: r2_c_plans_list_with_status_dot

# r2_e — Full dashboard captured by scrolling back to top
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- takeScreenshot: r2_e_full_dashboard_top
