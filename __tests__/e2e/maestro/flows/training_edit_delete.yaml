appId: com.powerliftingworkoutplanner
---
# Feature F5 Training analysis & edit — T5.3 training_edit_delete
#
# Purpose:
#   A) A FINISHED training in edit mode ("Edit training"):
#      - shows exactly ONE date/time control, the "Training Times" card with the
#        full range (no extra date pill, GH-542),
#      - its times dialog shows the duration and saves a new end time (TRN-005),
#      - keeps the "Add Workout" button (GH-323),
#      - opens the exercise records modal from the 1RM card trophy (GH-329).
#   B) Deleting a FINISHED training that was opened on its default Analysis tab
#      lands on the Plan tab (plan/suggest entry point), not on an empty
#      Analysis screen, and the dashboard no longer shows it (GH-467).
#
# Data basis: baseline import (mutates: saves training times, starts/finishes
# and deletes a training) -> starts with 00_import_baseline.yaml.
#   A) plan-meta-1 = plan "Push pull upper lower"; it opens the FINISHED
#      training 281 (Sun 03/08/25 17:27:03 - 19:22:35, first exercise Deadlift).
#      Duration 115.5 min -> "1 h 56 min"; end 19:57 -> 149.9 min -> "2 h 30 min".
#      Deadlift 1RM records in the fixture: 240, 240, 246, 252, 252.83 -> top row
#      "252.8 kg".
#   B) Next Training of the current plan "Push pull" = "Push squat",
#      Meso 1 · M7 · D1, still empty on the baseline -> planned via
#      "Suggest based on last Training", started, finished with 0 sets, deleted.
#
# Merged from: gh467_delete_lands_on_plan, gh467_finish_throwaway_training,
#   gh323_edit_mode_done_button, gh329_exercise_records_modal,
#   trn005_edit_training_times, gh542_no_duplicate_date_picker.
#   (gh542_added_exercise_on_training_date stays out: it needs a new exercise,
#   the sharingan picker and coordinate tab taps — too heavy/flaky for this flow.)

- runFlow: 00_import_baseline.yaml

# PRECONDITION: baseline imported, Training home with the current plan.
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'

# ===== A) edit mode of a FINISHED training =====
- scrollUntilVisible:
    element:
      id: '^plan-meta-1$'
    direction: DOWN
- assertVisible:
    id: '^plan-name-1$'
    text: 'Push pull upper lower'
- tapOn:
    id: '^plan-meta-1$'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 30000
- tapOn:
    id: 'header-overflow-icon'
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'overflow-edit'
    timeout: 8000
- tapOn:
    id: 'overflow-edit'
- extendedWaitUntil:
    notVisible:
      id: 'overflow-edit'
    timeout: 8000
- extendedWaitUntil:
    visible: 'Training Times'
    timeout: 30000

# GH-542: the Training Times card carries the full range ...
- assertVisible:
    id: 'edit-training-open-times-modal'
    text: 'Sun, 03/08/25, 17:27 - Sun, 03/08/25, 19:22'
# ... and the standalone date pill (full-string regex) is gone.
- assertNotVisible: 'Sun, 03/08/25'

# TRN-005: times dialog shows the duration and saves a new end time.
- tapOn:
    id: 'edit-training-open-times-modal'
- extendedWaitUntil:
    visible: 'Edit Training Times'
    timeout: 8000
- assertVisible:
    id: 'edit-training-times-duration'
    text: 'Duration: 1 h 56 min'
# The datetime field is a plain TextInput (accepts "HH:mm" or "DD/MM/YYYY HH:mm").
# A centre tap puts the cursor after the 16-char value; erase it fully.
- tapOn:
    id: '^edit-training-times-end$'
- eraseText: 20
- inputText: '19:57'
- extendedWaitUntil:
    visible:
      id: 'edit-training-times-duration'
      text: 'Duration: 2 h 30 min'
    timeout: 8000
- tapOn:
    id: 'edit-training-times-save'
- extendedWaitUntil:
    notVisible: 'Edit Training Times'
    timeout: 8000
- assertVisible:
    id: 'edit-training-open-times-modal'
    text: 'Sun, 03/08/25, 17:27 - Sun, 03/08/25, 19:57'
- assertNotVisible:
    id: 'edit-training-open-times-modal'
    text: '.*19:22'

# GH-323: the finalize button stays available in edit mode of a FINISHED training.
- scrollUntilVisible:
    element:
      id: 'add-workout-finalize-button'
    direction: DOWN
- assertVisible:
    id: 'add-workout-finalize-button'
    text: '^Add Workout$'

# GH-329: trophy on the 1RM card opens the records of the chosen exercise
# (edit mode pre-selects the first exercise, Deadlift).
- scrollUntilVisible:
    element:
      id: 'trophy-icon-button'
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'trophy-icon-button'
- extendedWaitUntil:
    visible: 'Records: Deadlift'
    timeout: 8000
- assertVisible:
    id: 'one-rm-record-value-0'
    text: '252\.8 kg'
- tapOn:
    id: 'exercise-records-close'
- extendedWaitUntil:
    notVisible: 'Records: Deadlift'
    timeout: 8000

# Back to the Training home.
- pressKey: Back
- repeat:
    times: 3
    while:
      notVisible:
        id: 'training-home-screen'
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000

# ===== B) finish a throwaway training, then delete it =====
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'train-tab-go-to-plan-button'
    timeout: 20000
- assertVisible:
    id: 'train-tab-no-training-hint'
    text: 'Nothing planned for this day yet\.'
- tapOn:
    id: 'train-tab-go-to-plan-button'
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 20000
- tapOn:
    id: 'training-suggest-last-training-button'
- extendedWaitUntil:
    visible:
      id: 'subtab-train'
    timeout: 20000
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 20000
- tapOn:
    id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'train-tab-finish-button'
    timeout: 20000
- tapOn:
    id: 'train-tab-finish-button'
# Finishing pre-selects Analysis: 0 sets done.
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'trainings-overview-sets-value'
    text: '0'

# Leave and re-open via "Last Training" (no sub-tab requested -> FINISHED default).
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 60000
# Guard: only ever delete the training this flow just finished.
- assertVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, Push squat, Meso 1 · M7 · D1 · today.*'
- tapOn:
    id: 'last-training-card-pressable'
- extendedWaitUntil:
    visible:
      id: 'analysis-tab'
    timeout: 30000
- assertVisible:
    id: 'trainings-overview-sets-value'
    text: '0'

- tapOn:
    id: 'header-overflow-icon'
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'overflow-discard'
    timeout: 8000
- tapOn:
    id: 'overflow-discard'
- extendedWaitUntil:
    visible: 'Delete Training'
    timeout: 8000
- tapOn:
    id: 'training-delete-confirm'

# GH-467: lands on the Plan tab with the plan/suggest entry point.
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 10000
- assertVisible: 'Plan new Training'
- assertNotVisible:
    id: 'analysis-tab'

# The dashboard no longer shows the deleted training.
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
- assertNotVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, .* · today.*'
