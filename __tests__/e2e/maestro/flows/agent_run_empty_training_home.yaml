appId: com.powerliftingworkoutplanner
---
# AGENT-RUN (GH-545 pipeline test): empty store, Training home empty state.
- launchApp
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
# Empty state: plans section with search field and "New Training", but no next-training card.
- assertVisible: 'Plans'
- assertVisible: 'New Training'
- assertVisible: 'Search plans'
- assertNotVisible:
    id: 'next-training-name'
