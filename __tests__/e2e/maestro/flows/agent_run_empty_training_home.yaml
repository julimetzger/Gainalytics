appId: com.powerliftingworkoutplanner
---
# AGENT-RUN (GH-545 pipeline test): empty store -> dismiss onboarding -> Training home.
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000
# Empty store: no plan yet, so only the plans header, the "New Training" entry and the search are shown.
- assertVisible:
    text: "Plans"
- assertVisible:
    text: "New Training"
- assertVisible:
    text: "Search plans"
- assertNotVisible:
    id: "next-training-card"
