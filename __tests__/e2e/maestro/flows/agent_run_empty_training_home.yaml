appId: com.powerliftingworkoutplanner
---
# AGENT-RUN (GH-545 throwaway test of the emulator agent): empty-store Training home.
# No clearState: the CI emulator store is already empty.
- launchApp:
    clearState: false
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
# Empty-state values: no plans yet, so the plans list is empty and no next-training card shows.
- assertVisible: 'Plans'
- assertVisible: 'New Training'
- assertVisible: 'Search plans'
- assertNotVisible:
    id: 'next-training-name'
