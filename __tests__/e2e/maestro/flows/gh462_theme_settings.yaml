appId: com.powerliftingworkoutplanner
name: GH-462 Theme settings sections
---
# Proves, against the hydrated baseline store:
#  * Settings are grouped into titled sections, theme first
#  * the Theme mode pill switches mode and states the mode in effect
#  * the Theme Color presets are one tap away, each segment shows its own
#    preview, and the applied preset is read back from the caption
#  * the Custom Color row still names the applied colour
# Every switch also asserts the PREVIOUS value is gone, so no assertion can
# pass merely because the app already sat on that value.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "^settings-section-theme$"
    timeout: 30000

# --- sections ---------------------------------------------------------------
- assertVisible:
    id: "^settings-section-theme-title$"
    text: "Theme"
- assertVisible:
    id: "^settings-section-theme-color-title$"
    text: "Theme Color"
- assertVisible:
    id: "^settings-section-custom-color-title$"
    text: "Custom Color"
- assertNotVisible: "Color Palette"

# --- Theme mode: Dark -------------------------------------------------------
- tapOn:
    id: "^settings-theme-mode-dark$"
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Dark"
- assertVisible:
    id: "^settings-theme-mode-dark$"
    selected: true

# --- Theme Color presets ----------------------------------------------------
- tapOn:
    id: "^settings-palette-blue$"
- assertVisible:
    id: "^settings-theme-palette-active$"
    text: "Active: Blue"
- assertVisible:
    id: "^settings-palette-blue$"
    selected: true
- takeScreenshot: gh462-01-dark-blue

- tapOn:
    id: "^settings-palette-green$"
- assertVisible:
    id: "^settings-theme-palette-active$"
    text: "Active: Green"
- assertNotVisible:
    id: "^settings-theme-palette-active$"
    text: "Active: Blue"
- assertVisible:
    id: "^settings-palette-green$"
    selected: true
- assertVisible:
    id: "^settings-palette-blue$"
    selected: false
- assertVisible:
    id: "^settings-custom-theme-color-button-text$"
    text: "Green"
- takeScreenshot: gh462-02-dark-green

- tapOn:
    id: "^settings-palette-purple$"
- assertVisible:
    id: "^settings-theme-palette-active$"
    text: "Active: Purple"
- assertNotVisible:
    id: "^settings-theme-palette-active$"
    text: "Active: Green"
- assertVisible:
    id: "^settings-palette-purple$"
    selected: true

# --- Theme mode: Light ------------------------------------------------------
- tapOn:
    id: "^settings-theme-mode-light$"
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Light"
- assertNotVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Dark"
- assertVisible:
    id: "^settings-theme-mode-light$"
    selected: true
- assertVisible:
    id: "^settings-theme-mode-dark$"
    selected: false
- takeScreenshot: gh462-03-light-purple

- tapOn:
    id: "^settings-palette-blue$"
- assertVisible:
    id: "^settings-theme-palette-active$"
    text: "Active: Blue"

# --- Theme mode: System (device is light) -----------------------------------
- tapOn:
    id: "^settings-theme-mode-system$"
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Light, following system"
- assertVisible:
    id: "^settings-theme-mode-system$"
    selected: true
- takeScreenshot: gh462-04-system-blue

# --- The remaining settings are grouped below -------------------------------
- scrollUntilVisible:
    element:
      id: "^settings-section-data-title$"
    direction: DOWN
- assertVisible:
    id: "^settings-section-data-title$"
    text: "Data"
- assertVisible:
    id: "^settings-section-ai-title$"
    text: "AI Coach"
- takeScreenshot: gh462-05-lower-sections
