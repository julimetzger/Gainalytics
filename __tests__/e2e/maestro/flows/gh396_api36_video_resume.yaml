appId: com.powerliftingworkoutplanner
---
# GH-396 — targetSdk 35 -> 36 (Android 16), part 2 of the video-analysis regression.
#
# Runs after the user has been sent to the launcher mid-analysis and the analysis has
# finished in the background (gh396_api36_video_import.yaml +
# gh396-verify-on-device.sh --mode fgs-background). Brings the app back to the
# foreground and asserts that the backgrounded analysis actually produced a result.
#
# `stopApp: false` is ESSENTIAL. Maestro's launchApp force-stops the app by default, and
# killing the process is exactly what destroys an in-flight analysis: on the next start
# App.tsx dispatches RECOVER_STALE_VIDEO_ANALYSES, which rewrites every still-running
# analysis to FAILED ("App was closed while import or analysis was running"). A flow that
# restarts the app therefore CAUSES the failure it is meant to rule out. Resuming the
# existing task is also what a user tapping the launcher icon actually does — and it
# brings the app back exactly where it was left, on the Video Analysis list.
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 120000

# The analysis started before the app was backgrounded must be finished: the progress
# bar is the "still running" indicator, so it has to be gone...
- extendedWaitUntil:
    notVisible:
      id: 'video-analysis-progress-bar'
    timeout: 300000
- assertNotVisible:
    id: 'video-analysis-progress-bar'
# ...and the resulting value has to be there: a completed analysis in the list.
- assertVisible: 'Done'
# The decisive assertion. If backgrounding had aborted the analysis, the entry would
# read "Failed — App was closed while import or analysis was running" (written by
# RECOVER_STALE_VIDEO_ANALYSES). Run this against a freshly imported baseline, whose
# fixture ships exactly one analysis and no failed ones, so any "Failed" on screen is
# necessarily the analysis this run just started.
- assertNotVisible: 'Failed'
- assertNotVisible: 'App was closed while import or analysis was running'
- takeScreenshot: 'gh396_08_analysis_done_after_background'
