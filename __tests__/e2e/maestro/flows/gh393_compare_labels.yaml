appId: com.powerliftingworkoutplanner
---
# GH-393: the compare picker and the analysis detail header identify an analysis
# by the set it was filmed on (exercise, set number, load, RIR) instead of by its
# running "Analysis #NN" number.
#
# Data prerequisite — run this flow through the repo runner with the GH-393
# fixture, which pushes it to the device as /sdcard/Download/baseline.gains:
#   bash __tests__/e2e/scripts/run-maestro-from-wsl.sh --mode smoke \
#     --device <serial> \
#     --suite __tests__/e2e/maestro/flows/gh393_compare_labels.yaml \
#     --fixture __tests__/e2e/maestro/fixtures/gh393-compare-labels.gains
# Do NOT rely on a custom file name in /sdcard/Download: the Downloads picker
# renders as a grid, ellipsises long names, and its listing does not reliably
# pick up freshly pushed files. baseline.gains is the one entry every import
# flow in this repo already selects successfully.
# The fixture holds three DONE squat analyses:
#   * #2 linked to workout 5565 set 1 (175 kg × 5 @ RIR 2)  <- screen under test
#   * #3 linked to workout 5565 set 2 (155 kg × 9 @ RIR 2)  <- compare target WITH a set
#   * #1 with no workout/set link                           <- compare target WITHOUT a set
#
# Value assertions:
#  1. The detail header reads the set identity, not "Analysis #2".
#  2. Every compare row carries the set identity; the fallback row stays meaningful.
#  3. No "Analysis #NN" text is left on either screen.
#  4. Date/time and the "N reps | VL x%" metrics line survive.
#  5. Tapping a row starts the comparison with exactly that analysis (load column B).
- launchApp
- runFlow: gh394_dismiss_anr.yaml
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
# --- Import the GH-393 fixture -------------------------------------------------
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
# Anchor the confirm button: a bare 'Import' also matches the "Import Data"
# button behind the dialog, and tapping that one only hits the scrim, so the
# file picker never opens.
- tapOn:
    text: '^Import$'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- extendedWaitUntil:
    visible: 'Downloads'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: 'baseline.gains'
- extendedWaitUntil:
    visible: 'Export Data'
    timeout: 120000
# --- Open the analysis that was filmed on set 1 --------------------------------
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
# The drawer can already be up from a previous run's navigation state; toggling
# it unconditionally would close it again.
- runFlow:
    when:
      notVisible: 'Metrics Overview'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analysis'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analysis'
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
# The Analyse drawer stays up over the list for several seconds after this
# navigation, and while it is up the rows are not in the view hierarchy AT ALL —
# a tap on a row then fails with "element not found". Do NOT press back to
# dismiss the drawer: with the list already mounted, back pops the whole screen
# instead of closing the drawer. Waiting for the row itself is what makes this
# deterministic — the drawer clears on its own within a few seconds.
- extendedWaitUntil:
    visible:
      id: 'video-analysis-row-2'
    timeout: 60000
- tapOn:
    id: 'video-analysis-row-2'
- extendedWaitUntil:
    visible: 'Compare'
    timeout: 30000
# --- 1. The detail header identifies the set, not the running number
- assertVisible:
    text: 'Squat · Set 1 · 175 kg @ 2 RIR'
- assertNotVisible:
    text: 'Analysis #[0-9]+'
- takeScreenshot: 'gh393_01_detail_header'
# --- 2./3./4. The compare picker rows carry the set identity
- tapOn: 'Compare'
- extendedWaitUntil:
    visible: 'Select analysis to compare'
    timeout: 15000
# Assert the row title through id + text together: that pins the exact value to
# the exact row. (An `assertTrue` on an evalScript output does not resolve in
# this Maestro version — it retries until the driver dies.)
- assertVisible:
    id: 'compare-picker-item-title-3'
    text: 'Squat · Set 2 · 155 kg @ 2 RIR'
# The fallback row: analysis #1 hangs on no set at all and must still read
# sensibly — no empty title, no undefined, no NaN, no leftover running number.
- assertVisible:
    id: 'compare-picker-item-title-1'
    text: 'Squat · No linked set'
- copyTextFrom:
    id: 'compare-picker-item-title-1'
- evalScript: |
    var title = maestro.copiedText;
    if (/undefined|NaN|Analysis #/.test(title) || title.trim().length === 0) {
      throw 'Fallback compare row title is not meaningful: ' + title;
    }
- assertNotVisible:
    text: 'Analysis #[0-9]+'
# Date/time line and the existing metrics line are untouched
- assertVisible:
    text: '.*2026.*'
- assertVisible:
    text: '2 reps \| VL 32%'
- takeScreenshot: 'gh393_02_compare_picker'
# --- 5. Selecting a row compares exactly that analysis
- tapOn:
    id: 'compare-picker-item-3'
- extendedWaitUntil:
    visible:
      id: 'video-analysis-compare-screen'
    timeout: 60000
# The fixture carries no per-analysis result files, so the sync playback / chart
# cards stay collapsed — the KPI header always renders and is what identifies
# the pair. Column A is the analysis we opened (set 1, 175 kg × 5), column B is
# the row we tapped (set 2, 155 kg × 9), which proves the selection landed on
# that exact analysis and not on a neighbouring one.
- assertVisible:
    id: 'compare-header-load-a'
    text: '175 kg × 5'
- assertVisible:
    id: 'compare-header-load-b'
    text: '155 kg × 9'
- takeScreenshot: 'gh393_03_compare_screen'
# --- 6. The header fallback for an analysis without a linked set --------------
# Analysis #1 hangs on no workout/set at all. Its detail header must still name
# the movement instead of going empty or rendering undefined/NaN.
- back
- back
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'video-analysis-row-1'
    timeout: 60000
- tapOn:
    id: 'video-analysis-row-1'
- extendedWaitUntil:
    visible: 'Compare'
    timeout: 30000
- assertVisible:
    text: 'Squat · No linked set'
- assertNotVisible:
    text: 'Analysis #[0-9]+'
- takeScreenshot: 'gh393_04_detail_header_no_set'
