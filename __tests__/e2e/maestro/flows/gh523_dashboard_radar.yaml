appId: com.powerliftingworkoutplanner
---
# GH-523: the Dashboard radar draws one axis per overview muscle.
# After gh523_manage_muscles.yaml: Calves added (last axis), Biceps hidden, Core removed.
# The baseline fixture is months old, so every value of this and last week is 0.
- runFlow: gh532_open_dashboard.yaml
- assertVisible:
    id: 'muscle-radar-svg'
    text: 'Radar chart of sets per muscle group, this week vs last week\. Back 0 \(last week 0\), Chest 0 \(last week 0\), Glutes 0 \(last week 0\), Hamstrings 0 \(last week 0\), Quads 0 \(last week 0\), Shoulders 0 \(last week 0\), Triceps 0 \(last week 0\), Calves 0 \(last week 0\)'
- assertVisible:
    id: 'muscle-chip-Calves'
- assertNotVisible:
    id: 'muscle-chip-Biceps'
- assertNotVisible:
    id: 'muscle-chip-Core'
- takeScreenshot: gh523_dashboard_after
