appId: com.powerliftingworkoutplanner
---
# GH-496: after gh496_strong_real_file.yaml — the newest imported training (real Strong file:
# "Upper body B", 2026-08-21, 17 sets) opens from the Training home, and the Analyse tab
# works on the imported history. launchApp restarts the app, which also closes the plan drawer.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- assertVisible: 'Strong Import 2'
- takeScreenshot: gh496_13_training_home
# The home only scrolls along the right edge (the hero chart eats centred drags).
- swipe:
    start: '83%, 80%'
    end: '83%, 30%'
    duration: 500
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 30000
- assertVisible: 'Upper body B'
- tapOn:
    id: 'last-training-card-pressable'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: gh496_14_imported_training
- tapOn: 'tab-analyse'
# The dashboard knows the imported history: its newest training is the real Strong file's 2026-08-20.
- extendedWaitUntil:
    visible: 'No trainings in this period\. Your last training was on Thu, 20/08/26\.'
    timeout: 120000
- takeScreenshot: gh496_15_analyse_dashboard
- tapOn: 'Show that period'
# Metrics Overview for 20/05/26–20/08/26. Its tables are not in the accessibility tree (only
# the header is), so the per-exercise values are checked on the screenshot, not asserted here.
- extendedWaitUntil:
    visible: 'Select Exercises, Metrics, Accumulation Mode'
    timeout: 120000
- swipe:
    start: '92%, 85%'
    end: '92%, 40%'
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: gh496_16_analyse_metrics
