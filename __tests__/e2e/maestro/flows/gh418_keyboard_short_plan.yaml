appId: com.powerliftingworkoutplanner
---
# GH-418 — part 1 of the keyboard check on a SHORT plan, one that fits the screen
# without the keyboard and therefore cannot scroll at all (audit GH-498 F1, first
# case). Fixture: __tests__/testdata/scripts/make_gh418_short_plan_fixture.js —
# Micro 69 "Push" reduced to its first two exercises; push it to
# /sdcard/Download/gh418_short_plan.gains first.
# Part 2 is __tests__/e2e/scripts/check-gh418-focused-field-above-keyboard.sh.
- runFlow:
    file: gh486_import_fixture.yaml
    env:
      FIXTURE: gh418_short_plan.gains
- runFlow: gh418_open_plan_edit.yaml
# Exactly the two kept exercises: Adductor (32) and Single leg b stance legpress (66).
- assertVisible:
    id: 'plan-edit-exercise-section-32'
- assertVisible:
    id: 'plan-edit-exercise-section-66'
- assertNotVisible:
    id: 'plan-edit-exercise-section-25'
- assertVisible:
    id: 'plan-set-2-reps-input'
    text: '13'
    below:
      id: 'plan-exercise-drag-handle-66'
