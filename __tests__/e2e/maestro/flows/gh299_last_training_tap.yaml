appId: com.powerliftingworkoutplanner
---
- launchApp
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Last Training"
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Last Training"
- extendedWaitUntil:
    visible:
      id: "header-plan-meso-name"
    timeout: 15000
- assertVisible:
    id: "header-plan-meso-name"
- assertVisible:
    id: "header-date"
