appId: com.powerliftingworkoutplanner
name: GH-404 Theme mode selector
---
# Precondition: the device's own display setting is LIGHT
# (`adb shell cmd uimode night no`). The System assertions below name the
# scheme that is actually in effect, so they have to know what the device asks
# for. Every other step is independent of it.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "^settings-theme-mode-row$"
    timeout: 30000

# The theme row and the colour palette row are two distinct settings now.
- assertVisible: "Theme"
- assertVisible: "Color Palette"
- assertNotVisible: "Enable Dark Mode"

# --- Light -----------------------------------------------------------------
# One tap, no restart: the caption is rendered from the same resolved value
# that drives PaperProvider, so it states the mode actually in effect — not
# merely that a button exists.
- tapOn:
    id: "^settings-theme-mode-light$"
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Light"
- assertVisible:
    id: "^settings-theme-mode-light$"
    selected: true
- assertVisible:
    id: "^settings-theme-mode-dark$"
    selected: false

# --- Dark ------------------------------------------------------------------
- tapOn:
    id: "^settings-theme-mode-dark$"
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Dark"
- assertVisible:
    id: "^settings-theme-mode-dark$"
    selected: true

# The colour palette still switches while a mode is set, and the applied
# palette is read back from the button's own label.
- tapOn:
    id: "^settings-palette-green$"
- assertVisible:
    id: "^settings-custom-theme-color-button-text$"
    text: "Green"
- tapOn:
    id: "^settings-palette-blue$"
- assertVisible:
    id: "^settings-custom-theme-color-button-text$"
    text: "Blue"

# --- Long press explains each icon -----------------------------------------
- longPressOn:
    id: "^settings-theme-mode-system$"
- assertVisible: "System: follows your device display setting and switches with it."
- longPressOn:
    id: "^settings-theme-mode-light$"
- assertVisible: "Light: always use the light colours, whatever the device is set to."
- longPressOn:
    id: "^settings-theme-mode-dark$"
- assertVisible: "Dark: always use the dark colours, whatever the device is set to."
- tapOn: "Got it"
- assertNotVisible: "Dark: always use the dark colours, whatever the device is set to."

# --- System ----------------------------------------------------------------
# The device is in light mode, so "System" must resolve to Light — this is the
# assertion that proves the app follows the device rather than a stored flag.
- tapOn:
    id: "^settings-theme-mode-system$"
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Light, following system"
- assertVisible:
    id: "^settings-theme-mode-system$"
    selected: true

# --- The choice survives a restart -----------------------------------------
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "^settings-theme-mode-row$"
    timeout: 30000
- assertVisible:
    id: "^settings-theme-mode-system$"
    selected: true
- assertVisible:
    id: "^settings-theme-active-mode$"
    text: "Active: Light, following system"
