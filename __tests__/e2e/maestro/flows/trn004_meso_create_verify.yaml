appId: com.powerliftingworkoutplanner
---
# TRN-004: Verify Mesozyklen feature by creating a new plan and checking Meso UI

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

- tapOn: "tab-training"

- assertVisible:
    id: "training-home-screen"

# Add a new training plan via the FAB (+)
- tapOn:
    id: "add-trainings-plan"

# Wait for dialog to appear
- extendedWaitUntil:
    visible: "Add new Training Plan"
    timeout: 5000

# Tap the plan name input to focus it, then type
- tapOn:
    id: "plan-name-input"
- inputText: "TRN004 Test Plan"

# Dismiss keyboard then tap the dialog Done button (not the keyboard key)
- pressKey: back
- tapOn:
    id: "confirm-trainings-plan"

# Wait for the dialog to close and the plan card to appear
- extendedWaitUntil:
    notVisible: "Add new Training Plan"
    timeout: 10000

- extendedWaitUntil:
    visible: "TRN004 Test Plan"
    timeout: 30000

# AC5: Verify Meso 1 chip is visible on the plan card
- assertVisible:
    text: "Meso 1"

# AC7: Tap the Meso 1 chip - should navigate to TrainingPlan in that Meso
- tapOn:
    text: "Meso 1"

# Wait for navigation to TrainingsPlanTab (header shows plan + meso name)
# Uses icon-menu as the anchor - only visible inside TrainingsPlanTab
- extendedWaitUntil:
    visible:
      id: "drawer-menu-button"
    timeout: 30000

# AC8: Header shows Meso name after plan name ("TRN004 Test Plan › Meso 1")
# Use regex to match the combined header text containing "Meso 1"
- assertVisible:
    text: ".*Meso 1"

# AC9: Micro numbering shows Micro 1 (local, not global)
# Header renders "Micro 1" as separate Text element
- assertVisible:
    text: "Micro 1"

# AC1: Open drawer and verify Mesos section
- tapOn:
    id: "drawer-menu-button"

# Verify Mesos: header is visible in the drawer
- assertVisible:
    text: "Mesos:"

# Verify "Meso 1" entry in the drawer list
- assertVisible:
    text: "Meso 1"

# AC2: Tap + to add a new meso (name auto-assigned "Meso 2")
- tapOn:
    id: "icon-plus-circle"

# Wait for Meso 2 to appear
- extendedWaitUntil:
    visible: "Meso 2"
    timeout: 5000

- assertVisible:
    text: "Meso 2"

# Close drawer by pressing back
- pressKey: Back
