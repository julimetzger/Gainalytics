appId: com.powerliftingworkoutplanner
---
# GH-428 (H1) — "Save" with an empty name must not create a plan; the dialog stays
# open and says why. Reproduces the round-2 audit case (#426, finding H1), where the
# dialog closed without a word and left an untitled row in the plan list.
#
# Prerequisite: baseline.gains imported (00_import_baseline).
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 180000

- scrollUntilVisible:
    element:
      id: 'add-trainings-plan'
    direction: DOWN
    timeout: 120000

# ---- Save with an empty name ----
- tapOn:
    id: 'add-trainings-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-name-input'
    timeout: 30000
# Nothing is wrong yet, so no message is shown.
- assertNotVisible: 'Please enter a name for the training plan.'
- tapOn:
    id: 'confirm-trainings-plan'

# The dialog is still open AND explains itself — the audit's version closed silently.
- assertVisible:
    id: 'plan-name-input'
- assertVisible: 'Please enter a name for the training plan.'
- takeScreenshot: gh428_h1_01_empty_name_rejected

# Whitespace is not a name either.
- tapOn:
    id: 'plan-name-input'
- inputText: '   '
- tapOn:
    id: 'confirm-trainings-plan'
- assertVisible:
    id: 'plan-name-input'
- assertVisible: 'Please enter a name for the training plan.'

# ---- typing clears the message, and saving then really creates THAT plan ----
- tapOn:
    id: 'plan-name-input'
- eraseText
- inputText: 'GH428 named plan'
- assertNotVisible: 'Please enter a name for the training plan.'
- tapOn:
    id: 'confirm-trainings-plan'
# Closing the dialog puts the screen back at the top of the dashboard, so the plan
# list — and the row just created — is below again.
- scrollUntilVisible:
    element:
      text: 'GH428 named plan'
    direction: DOWN
    timeout: 60000
# The row shows the name that was typed — the actual resulting value, not just a row.
- assertVisible: 'GH428 named plan'
# No plan was created by the two rejected saves, so the fallback label for a
# nameless plan must be nowhere on the list.
- assertNotVisible: 'Unnamed plan'
- takeScreenshot: gh428_h1_02_named_plan_created

# This flow deliberately leaves "GH428 named plan" behind: the plan's kebab testID is
# keyed by its generated id, which the flow cannot know, so there is no reliable way
# to delete it again. Re-running 00_import_baseline restores the clean state, which is
# the documented prerequisite for every flow here anyway.
