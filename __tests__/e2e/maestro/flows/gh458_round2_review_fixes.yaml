appId: com.powerliftingworkoutplanner
---
# GH-458 round 2 — PR #459 review comment #1 (also touches #2's drill-down and
# #3's delta colour along the way) plus issue #461.
#
# Review #1: the Metrics Overview empty state used to gate on maps built from
# the SELECTED period AND the comparison period combined, so a selected period
# with zero sets still rendered a full table of zeros whenever the comparison
# period had data. This flow reproduces the bug's exact shape on real fixture
# data: drill into a muscle whose recent history sits in Nov'25–Feb'26 (the
# fixture's last logged period), then move ONE period forward with the same
# swipe gesture a user would use — into Mar'26–Jun'26, which has zero sets for
# that muscle while the period just left (now the COMPARISON period) does not.
#
# NOTE on what this flow can and cannot assert: MetricsNode (DateRangePicker +
# MetricsOverviewForWorkouts incl. its emptyState) renders INSIDE RangeSwiper's
# per-pane GestureDetector subtree, which — per 11_metrics_overview_slots.yaml
# and the FLOW_AUDIT notes — is entirely invisible to UIAutomator on this
# build, not even as plain text (confirmed again here: neither the date-range
# button nor "Muscle Overview" nor any table cell appears in a ui dump taken
# on this exact screen). Only `metrics-active-filter` was deliberately moved
# OUT of that subtree (H4/H7) and stays assertable. The empty-vs-populated
# difference this flow is about is therefore proven by screenshot here, plus
# `__tests__/components/analyse/MetricsOverviewForWorkouts.spec.tsx`, which
# asserts the exact gate condition (no a11y limitation applies to a unit test).

- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'

# The emulator raises "System UI isn't responding" under load; while that
# window holds focus Maestro's hierarchy never contains the app, and every
# assertion fails for a reason that has nothing to do with the app.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 240000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'dashboard-scroll'
    timeout: 30000

# --------------------------------------------------------- drill into Biceps
- tapOn:
    id: 'muscle-chip-Biceps'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: '1 selected'
    timeout: 20000
- assertVisible: 'Biceps'

# The drill-down range holds data: the real table renders, not the empty
# state. Not assertable by id/text (see NOTE above) — screenshot is the
# evidence, the unit test is the assertion.
- takeScreenshot: gh458_r2_01_biceps_populated_period

# ---------------------------- review #1: swipe one period forward (empty)
# Same gesture RangeSwiper listens for elsewhere in the app (GH-204 dashboard,
# GH-277 history) — a leftward drag moves to the NEXT period.
- swipe:
    start: 90%, 45%
    end: 15%, 45%
- waitForAnimationToEnd
- waitForAnimationToEnd

# The muscle selection survives the swipe — only the range changed. This IS
# assertable (H4/H7 moved it out of the inaccessible subtree).
- assertVisible: '1 selected'
- assertVisible: 'Biceps'

# THE FIX: this period has zero Biceps sets of its own. Before the fix, the
# comparison period (Nov'25-Feb'26, which does have sets) kept the maps
# non-empty and a full table of zeros/negative deltas rendered instead of
# this empty state. Screenshot is the evidence (see NOTE above).
- takeScreenshot: gh458_r2_02_biceps_empty_period_not_zero_table

# ------------------------------------------------- issue #461: no selection
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Analyse'
    timeout: 15000
- tapOn: 'Analyse'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'analyse-chart-no-selection'
    timeout: 20000
# This replaces the small red "Please select: Exercise or Muscle." line — it
# must read as a normal starting state, offering a direct suggestion.
- assertNotVisible: 'Please select: Exercise or Muscle.'
- assertVisible:
    id: 'analyse-chart-no-selection-description'
    text: '.*start with Hyperextension.*'
- assertVisible:
    id: 'analyse-chart-select-suggested'
- takeScreenshot: gh458_r2_03_no_selection_not_an_error

- tapOn:
    id: 'analyse-chart-select-suggested'
- waitForAnimationToEnd
# The one-tap suggestion actually applied the exercise — proven by landing on
# a state that names it (Hyperextension, in the screenshot below), not just
# by the empty state disappearing.
- assertNotVisible:
    id: 'analyse-chart-no-selection'
- takeScreenshot: gh458_r2_04_suggested_exercise_applied
