appId: com.powerliftingworkoutplanner
---
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

# Import baseline so Upper lower Dips has exactly one existing set (Set 1:
# Reps=10, RIR=0, Weight=135), giving reproducible 1RM and rest-timer layout.
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- tapOn:
    id: "settings-import-confirm-button"
    optional: true
- tapOn: "baseline.gains"
- extendedWaitUntil:
    visible: ".*Import successful.*"
    timeout: 60000

# Navigate to Training tab and open the "Upper lower" plan. All its trainings
# are FINISHED; training 1 at the navigation micro exists, so header-plan-meso-name
# is visible immediately after navigation.
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Upper lower"
    direction: DOWN
- tapOn:
    text: "Upper lower"
- extendedWaitUntil:
    visible:
      id: "header-plan-meso-name"
    timeout: 30000

# Training is FINISHED — default tab is Analysis.  Enter Edit mode via the
# 3-dot overflow in the React Navigation header (accessible outside RangeSwiper).
# "Edit training" taps overflow-edit which is inside a Paper Menu Portal
# and is therefore accessible to Maestro.
- tapOn:
    id: "header-overflow-icon"
- extendedWaitUntil:
    visible:
      id: "overflow-edit"
    timeout: 5000
- tapOn:
    id: "overflow-edit"

# handleEditTraining() calls setActiveSubTab('train') — wait for the Train tab
# to load (header still shows the plan name; no crash = Dismiss absent).
- waitForAnimationToEnd
- assertNotVisible: "Dismiss"

# Screenshot 1: 1RM card idle (1 existing set from baseline; new-set input row
# visible). All plan body content is inside RangeSwiper/GestureHandlerRootView
# and not in the Android accessibility tree → coordinate-based taps.
# Device override = 720×1600. Input row (Set N) centres at y≈46%.
- takeScreenshot: r5_1rm_idle

# Log a fresh set: Reps=8, RIR=2, Weight=95 — Epley → ~127 kg.
# x%: Reps≈11%, RIR≈33%, Weight≈54%, Add≈88%.
- tapOn:
    point: "11%, 46%"
- eraseText
- inputText: "8"
- tapOn:
    point: "33%, 46%"
- eraseText
- inputText: "2"
- tapOn:
    point: "54%, 46%"
- eraseText
- inputText: "95"
- hideKeyboard
- tapOn:
    point: "88%, 46%"

# Rest timer auto-starts on set submit. Wait for the screen to settle.
- waitForAnimationToEnd
- assertNotVisible: "Dismiss"

# Screenshot 2: rest timer counting after the set was logged.
- takeScreenshot: r5_1rm_with_session_and_rest_counting

# Open the rest-timer 3-dot overflow. The icon is inside RangeSwiper so tap
# by coordinate. With 2 existing sets the rest timer row centres at y≈77%;
# the overflow icon sits at the right edge: (88%, 77%).
- tapOn:
    point: "88%, 77%"

# The Paper Menu that opens IS in a Portal → accessible to Maestro.
- assertVisible: "Skip rest"
- assertVisible: "Edit target…"
- assertVisible: "Adjust default for this exercise"
- takeScreenshot: r5_overflow_menu

# Drop the target to 5 s so we can capture the overrun visual quickly.
# "Edit target…" opens RestTargetEditDialog which is inside a Portal.
- tapOn: "Edit target…"
- assertVisible:
    id: "rest-target-edit-dialog"
- tapOn:
    id: "rest-target-minutes"
- eraseText
- inputText: "0"
- tapOn:
    id: "rest-target-seconds"
- eraseText
- inputText: "5"
- tapOn:
    id: "rest-target-save"

# After saving a 5 s target the timer is immediately in overrun (elapsed > 5 s).
- waitForAnimationToEnd
- assertNotVisible: "Dismiss"

# Screenshot 3: rest timer in overrun state.
- takeScreenshot: r5_rest_overrun

# Reset the timer via coordinate tap. Reset button centre: (75%, 77%).
- tapOn:
    point: "75%, 77%"
- waitForAnimationToEnd
- assertNotVisible: "Dismiss"

# Screenshot 4: timer reset to the 5 s target.
- takeScreenshot: r5_after_reset
