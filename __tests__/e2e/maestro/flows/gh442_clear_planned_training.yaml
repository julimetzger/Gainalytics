appId: com.powerliftingworkoutplanner
---
# GH-442 — "Clear planned training" in the ⋮ menu of the Plan view.
#
# Prerequisite: baseline.gains freshly imported (gh443_import_baseline.yaml). In the
# fixture the active plan "Push pull" has its next slot M7/D1 "Push squat" unplanned,
# and its newest training (M6/D4) is FINISHED. Planning D1 here therefore creates
# the plan's most recently planned training — the only one the option is for.
#
# Proof points (each asserts a value, not just that something exists):
#   - the menu of that PLANNED training offers "Clear planned training" next to the
#     unchanged "Edit plan" / "Delete this Training";
#   - the confirmation dialog appears, and Cancel leaves the planned exercises in
#     place (the suggestion entry point stays hidden, the card keeps its count);
#   - Confirm empties the training but keeps it: the Train tab offers "Add Exercises"
#     (a training without exercises) and NOT "Plan this Training" (no training at
#     all, which is what "Delete this Training" would leave behind);
#   - the state survives an app restart and can be planned again right away;
#   - a STARTED training does not offer the option.
- launchApp:
    clearState: false
    stopApp: false
- tapOn:
    text: 'Dismiss'
    optional: true
- tapOn:
    text: 'Wait'
    optional: true
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 300000
- repeat:
    times: 6
    while:
      notVisible:
        id: 'training-home-screen'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000

# ═══ Part 1 — plan the next training (M7/D1) ════════════════════════════════════
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 0 exercises'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 120000
- assertVisible: '.*Push squat.*'
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- tapOn:
    id: 'training-suggest-last-training-button'
- extendedWaitUntil:
    notVisible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: gh442_01_planned_training

# ═══ Part 2 — menu offers the option; Cancel changes nothing ════════════════════
- tapOn:
    id: 'header-overflow-button'
- extendedWaitUntil:
    visible:
      id: 'overflow-clear-plan'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: 'Clear planned training'
- assertVisible:
    id: 'overflow-edit-plan'
- assertVisible: 'Delete this Training'
- takeScreenshot: gh442_02_menu_with_clear_option
- tapOn:
    id: 'overflow-clear-plan'
- extendedWaitUntil:
    visible:
      id: 'training-clear-plan-confirm'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: 'This removes all planned exercises and sets from this training. The training itself stays, so you can plan it again from scratch.'
- assertVisible:
    id: 'training-clear-plan-cancel'
- takeScreenshot: gh442_03_confirm_dialog
- tapOn:
    id: 'training-clear-plan-cancel'
- extendedWaitUntil:
    notVisible:
      id: 'training-clear-plan-confirm'
    timeout: 10000
# Still planned: the "plan from scratch" entry point did not come back.
- assertNotVisible:
    id: 'training-suggest-last-training-button'
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
- assertNotVisible:
    id: 'train-tab-add-exercises-button'

# ═══ Part 3 — confirm clears the training but keeps it ═════════════════════════
- tapOn:
    id: 'subtab-plan'
- waitForAnimationToEnd
- tapOn:
    id: 'header-overflow-button'
- extendedWaitUntil:
    visible:
      id: 'overflow-clear-plan'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'overflow-clear-plan'
- extendedWaitUntil:
    visible:
      id: 'training-clear-plan-confirm'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'training-clear-plan-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'training-clear-plan-confirm'
    timeout: 10000
# Plan tab is back at the planning entry point — ready to be planned again.
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- assertVisible:
    id: 'header-plan-label'
    text: 'Plan'
- takeScreenshot: gh442_04_cleared_plan_tab
# The training still exists (empty) — a deleted one would offer "Plan this Training".
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-add-exercises-button'
    timeout: 30000
- assertNotVisible:
    id: 'train-tab-go-to-plan-button'
- assertNotVisible:
    id: 'train-tab-start-button'
- takeScreenshot: gh442_05_cleared_training_still_exists

# ═══ Part 4 — survives an app restart ══════════════════════════════════════════
# Give redux-persist time to flush before the process is killed.
- extendedWaitUntil:
    visible: 'gh442-never-rendered'
    timeout: 4000
    optional: true
- stopApp
- launchApp:
    clearState: false
    stopApp: false
- tapOn:
    text: 'Dismiss'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 300000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
# The plan cursor is unchanged (still M7/D1) and the slot is empty again.
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 0 exercises'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 120000
- assertVisible: '.*Push squat.*'
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-add-exercises-button'
    timeout: 30000
- assertNotVisible:
    id: 'train-tab-go-to-plan-button'
- takeScreenshot: gh442_06_after_restart_still_cleared

# ═══ Part 5 — plan again right away, start it: no option for a started training ═
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- tapOn:
    id: 'training-suggest-last-training-button'
- extendedWaitUntil:
    notVisible:
      id: 'training-suggest-last-training-button'
    timeout: 30000
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
- tapOn:
    id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- tapOn:
    id: 'subtab-plan'
- waitForAnimationToEnd
- tapOn:
    id: 'header-overflow-button'
- extendedWaitUntil:
    visible:
      id: 'overflow-discard'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: 'overflow-finish'
- assertNotVisible:
    id: 'overflow-clear-plan'
- assertNotVisible: 'Clear planned training'
- takeScreenshot: gh442_07_started_training_no_clear_option
