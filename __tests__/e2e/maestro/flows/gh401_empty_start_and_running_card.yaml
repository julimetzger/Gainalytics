appId: com.powerliftingworkoutplanner
---
# GH-401 review round 3 — the two findings the code review added after the merge:
#
#   R1  A planned training WITHOUT exercises could be started. The Train tab showed
#       the hint "Add exercises in the Plan tab first." next to a fully active
#       "Start Training" button; pressing it produced a running session with nothing
#       to log, which could then be finished. That empty session counted as the
#       plan's last training and pushed the dashboard progress forward for a workout
#       that never happened.
#       Chosen fix: in that state there is no start control at all. The primary
#       button becomes "Add Exercises" and opens the Plan tab in plan mode.
#
#   R2  Starting out of plan order — day 2 while day 1 is still open — left the
#       dashboard card on day 1 ("Next Training"), and its button led there too, so
#       the session that was actually running could not be reached from the card.
#       Fix: a STARTED session owns the card wherever it sits in the plan.
#
# Selector note (same constraint as gh401_card_to_train_start.yaml, agent-memory
# #206): the training pane — sub-tab strip, Start/Add-Exercises/Finish buttons,
# exercise list — is NOT exposed to the Android accessibility tree. Its controls
# can only be driven by position, and nothing inside it can be asserted. What IS
# readable: the header (`header-plan-meso-name`, `header-plan-label`,
# `header-session-timer`, `header-plan-editing-kicker`, the "Micro N <name>" line),
# the drawer button, the exercise picker modal (its own window), and the home card.
# Every assertion below therefore reads a concrete value off one of those.
#
# That constraint is what makes this flow's central check possible in the first
# place: R1 is asserted BEHAVIOURALLY. The flow taps the exact position the Start
# button used to occupy on an empty training and then proves, from the header, that
# no session started and that the user was taken into plan mode instead. Before the
# fix that same tap produced `header-session-timer`.
#
# Prerequisite: baseline.gains freshly imported (run 00_import_baseline.yaml first).
# The plan's next slot ("Push squat", M7/D1) must still be unplanned, and D2
# ("Pull dl") must be unplanned too — that is exactly the state the fixture ships.
#
# `stopApp: false`: debug build served by Metro; a cold bundle costs minutes on this
# multi-emulator host and can trip an ANR.
#
# The repeated `when: visible: 'Dismiss'` guards are not boilerplate: when the Metro
# connection drops, RN paints a "Fast Refresh disconnected" banner ACROSS the header —
# the one region this flow can read — and every header assertion then fails while the
# app itself is in exactly the right state. Dismissing it before each read is what
# keeps a network hiccup from being reported as a product failure.
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
# "Training" (bottom tab label / dashboard title) is the first text that exists once
# the bundle has rendered — waiting for it separates "still loading" from "loaded on
# some other screen". The runner force-stops the app, so a first attempt lands on the
# dashboard; a RETRY (the runner re-runs a failed flow once) resumes whatever screen
# the previous attempt left behind, and would otherwise burn the full 7-minute
# timeout waiting for a dashboard it is one Back press away from.
- extendedWaitUntil:
    visible: 'Training'
    timeout: 420000
- repeat:
    times: 4
    while:
      notVisible:
        id: 'training-home-screen'
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000

# ═══ Part 1 — a training without exercises cannot be started ═══════════════════

- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
# The fixture's next slot: nothing planned yet, so no session can be running.
- assertVisible:
    id: 'next-training-status-label'
    text: 'Next Training'
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 0 exercises'

- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 240000
# The header's training name node reads " Push squat" (it is rendered right after
# the "Micro N" node, with a leading space). Maestro matches a bare string against
# the WHOLE text, so the surrounding `.*` are required, not cosmetic.
- assertVisible: '.*Push squat.*'

# --- build the state the review found: a PLANNED training with zero exercises ---
# The card lands on the Train tab. Go to the Plan tab and from its suggestion screen
# into full edit mode via "Plan new Training".
# The sub-tab strip sits at y=14%, but its three tabs split the width: Plan is at
# x=17%, Train at 50%, Analysis at 83%. Tapping the strip's centre lands on Train,
# which is why this loop used to spin without ever reaching plan mode.
# Both taps live in one guarded loop: this emulator drops single taps under load
# (agent-memory #183/#247) and the pane is invisible, so a missed FIRST tap would
# leave every following one hitting nothing. Re-tapping the Plan sub-tab is
# idempotent, which is what makes retrying the pair safe.
- repeat:
    times: 6
    while:
      notVisible:
        id: 'header-plan-editing-kicker'
    commands:
      - tapOn:
          point: '17%,14%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000
      - tapOn:
          point: '50%,43%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 20000
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- assertVisible:
    id: 'header-plan-editing-kicker'
    text: 'EDITING PLAN'
# The "+" tile opens the picker. The picker is a separate native window and IS
# readable, so the two taps below can be asserted on their real effect: the
# "N selected" counter.
- tapOn:
    point: '7%,19%'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '0 selected'
    timeout: 60000
# Picking the first exercise is what CREATES the training object.
# The row's pressable is an untagged ViewGroup, so a tap on it commits only about
# one time in ten (agent-memory #320) — retry until the counter actually moves.
# The guard is the assertion: the loop cannot "pass" without a committed pick.
# Two things make the retry safe. The tap only fires while a row is actually there,
# so the loop cannot die on "Element not found" when the modal closes under it. And
# each iteration WAITS for the counter instead of just letting the animation settle:
# the counter needs a moment after a committed pick, and re-tapping in that window
# un-picks what was just picked — which read as "the tap never committed" and burned
# the whole loop toggling the same row.
- repeat:
    times: 8
    while:
      notVisible: '1 selected'
    commands:
      - runFlow:
          when:
            visible: 'Adductor'
          commands:
            - tapOn:
                text: 'Adductor'
                optional: true
      - extendedWaitUntil:
          visible: '1 selected'
          timeout: 10000
          optional: true
- assertVisible: '1 selected'
# Un-picking it again leaves the training behind with an empty exercise list — the
# state the review reported (the reducer keeps the training and just empties its
# exercise list, agent-memory #335).
# The loop guard reads the picker's OWN counter, not the header: while the modal is
# up it is its own native window and everything behind it drops out of the hierarchy,
# so a guard on `header-plan-label` never becomes true, spins through all 8 taps and
# leaves the selection on an arbitrary parity. `1 selected` disappearing is the exact
# signal that the last exercise is gone — the picker closes with it.
# The tap is `optional` because of the race that closing creates: the loop condition
# is evaluated while the counter is still up, and by the time the tap runs the modal
# can already be animating away — a mandatory tap then fails with "Element not found:
# Adductor" on a flow that has in fact just done exactly what it was supposed to.
- repeat:
    times: 8
    while:
      visible: '1 selected'
    commands:
      - runFlow:
          when:
            visible: 'Adductor'
          commands:
            - tapOn:
                text: 'Adductor'
                optional: true
      - extendedWaitUntil:
          notVisible: '1 selected'
          timeout: 10000
          optional: true
# Safety net for the timing where the modal lingers: the "+" tile that opened the
# picker sits above it and stays tappable, and toggling it closes the picker. Only
# once the modal is really gone does the header become readable again, and its "Plan"
# label is the proof that an empty PLANNED training now exists here.
- repeat:
    times: 4
    while:
      visible: '0 selected'
    commands:
      - tapOn:
          point: '7%,19%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'header-plan-label'
    timeout: 60000
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- assertVisible:
    id: 'header-plan-label'
    text: 'Plan'
- assertNotVisible:
    id: 'header-session-timer'

# --- the check itself ---
# Train sub-tab of that empty PLANNED training.
- tapOn:
    point: '50%,14%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- assertVisible:
    id: 'header-plan-label'
    text: 'Plan'
- assertNotVisible:
    id: 'header-session-timer'
- takeScreenshot: gh401r3_01_empty_training_train_tab
# 50%,21% is where the Start button sat — and still sits for a training that HAS
# exercises (gh401_card_to_train_start.yaml starts its session from this very
# point). On an empty training that position now carries "Add Exercises".
# The tap is retried because this emulator drops single taps under load, and the pane
# gives no feedback that could be waited on; the retry is safe precisely because of
# what is being proven — the position no longer starts anything. If it ever did, the
# `header-session-timer` assertion below fails no matter how often it was tapped.
- repeat:
    times: 5
    while:
      notVisible:
        id: 'header-plan-editing-kicker'
    commands:
      - tapOn:
          point: '50%,21%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000
# Nothing was started: no session timer, and the training is still PLANNED. Before
# the fix this tap produced `header-session-timer` and an empty running session.
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- assertNotVisible:
    id: 'header-session-timer'
- assertVisible:
    id: 'header-plan-editing-kicker'
    text: 'EDITING PLAN'
- takeScreenshot: gh401r3_02_add_exercises_opens_plan_mode

# ═══ Part 2 — the card follows the session that is actually running ════════════

# Leave plan edit mode; D1 stays PLANNED-with-no-exercises, i.e. an OPEN earlier
# slot. That is the precondition for the out-of-order case.
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 15000

# Drawer -> "Pull dl" (D2). The drawer IS in the accessibility tree — "Enable
# Planning Mode" is one of its buttons and serves as the open/closed signal — but its
# training rows carry no id, hence the point tap.
# Selecting a training sometimes closes the drawer and sometimes leaves it up, so
# neither "drawer gone" nor "drawer still there" can be used as the signal that the
# row tap landed: the row is tapped twice (re-selecting the same training is a no-op)
# and the drawer is then closed explicitly with the same button that opened it. Do NOT
# close it with Back — Back pops the whole screen back to the dashboard.
# Only with the drawer closed does `.*Pull dl.*` mean the HEADER: while it is open its
# own row list carries that text and the assertion would pass on the wrong screen.
- repeat:
    times: 4
    while:
      notVisible: 'Enable Planning Mode'
    commands:
      - tapOn:
          id: 'drawer-menu-button'
      - waitForAnimationToEnd:
          timeout: 15000
- tapOn:
    point: '18%,40%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 20000
- runFlow:
    when:
      visible: 'Enable Planning Mode'
    commands:
      - tapOn:
          point: '18%,40%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 20000
- repeat:
    times: 4
    while:
      visible: 'Enable Planning Mode'
    commands:
      - tapOn:
          id: 'drawer-menu-button'
      - waitForAnimationToEnd:
          timeout: 15000
- assertVisible: '.*Pull dl.*'

# Plan D2 from the previous micro's session, then start it.
# Both taps sit in one loop because nothing inside the pane can be read between them:
# 50%,24% is "Plan this Training" on the Train tab, 50%,29% is "Suggest based on last
# Training" on the Plan tab that follows. If the first tap is dropped the second hits
# empty space and the next iteration repeats the pair; if the pane is ALREADY on the
# Plan tab, 24% lands in the "RIR delta" field, which only pops the keyboard — and the
# keyboard covers the bottom half, while the suggestion sits at 29%, so the next tap
# lands anyway. Do NOT "clean up" with `hideKeyboard` here: on Android it is a plain
# Back press, so on the iterations where no keyboard is up it pops the screen and,
# after a few rounds, drops the app to the launcher (agent-memory #315).
- repeat:
    times: 5
    while:
      notVisible:
        id: 'header-plan-label'
    commands:
      - tapOn:
          point: '50%,24%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000
      - tapOn:
          point: '50%,29%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 20000
- assertVisible:
    id: 'header-plan-label'
    text: 'Plan'
# Creating the training re-derives the sub-tab to Plan; go back to Train (50% of the
# strip is the Train tab; Plan sits at 17%) and start the session from the same 21%
# position that carried "Add Exercises" on the empty training. Dropped taps are
# retried; the session timer appearing is the only signal either tap produced.
- repeat:
    times: 5
    while:
      notVisible:
        id: 'header-session-timer'
    commands:
      - tapOn:
          point: '50%,14%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000
      - tapOn:
          point: '50%,21%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 120000
- assertNotVisible:
    id: 'header-plan-label'
- takeScreenshot: gh401r3_03_day2_started_out_of_order

# --- the check itself ---
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
# D1 is still open and earlier in the plan, so plan order alone would put "Push
# squat / D1" here — that is precisely what the review reported. The card must name
# the RUNNING session instead.
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
# The fixture's D2 is literally named "Pull dl " — with a trailing space, as the
# drawer row's text node shows too. Maestro matches a selector's text against the
# WHOLE node text, so the bare name never matches; the `.*` is the trailing space.
- assertVisible:
    id: 'next-training-name'
    text: 'Pull dl.*'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D2 · 9 exercises'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Continue Training'
- copyTextFrom:
    id: 'next-training-elapsed'
- evalScript: |
    if (!/^(?:\d+:)?\d{1,2}:\d{2}$/.test(maestro.copiedText)) {
      throw 'card shows no running clock for the started session: ' + maestro.copiedText;
    }
- takeScreenshot: gh401r3_04_card_follows_running_session

# The button must lead to the running session, not to the earlier open slot.
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 120000
- assertVisible: '.*Pull dl.*'
- assertNotVisible: '.*Push squat.*'
- takeScreenshot: gh401r3_05_continue_opens_running_session
