appId: com.powerliftingworkoutplanner
---
# GH-526 — Micro 2 Overview, Total tab: chips vs Micro 1 (default) / vs Plan, the
# line names both sides, the new muscle map follows the chip, and the header
# shows the micro's date span right of the title.
# Fixture: 7h 28min (sum of seconds, floored); 61 sets done vs 58 in Micro 1 / 58 planned; 4 / 4 trainings;
# Chest done 6.8 vs 5.8 (Micro 1 done) and vs 5.8 (Micro 2 plan); Core 6.5 vs 4.2.
- scrollUntilVisible:
    element:
      id: 'drawer-menu-button'
    direction: UP
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Overview'
- extendedWaitUntil:
    visible:
      id: 'overview-view-gesamt'
    timeout: 30000
- tapOn:
    id: 'overview-view-gesamt'
- extendedWaitUntil:
    visible:
      id: 'micro-total-overview'
    timeout: 30000
- assertVisible:
    id: 'header-date-range'
    text: '25/01 – 31/01/2026'
- tapOn:
    id: 'micro-compare-previous'
- assertVisible:
    id: 'micro-comparison-line'
    text: 'Micro 2 \(done\) vs Micro 1 \(done\)'
- assertVisible:
    id: 'micro-total-sets-delta'
    text: '\+3 \(\+5%\)'
- assertVisible:
    id: 'micro-total-duration-value'
    text: '7h 28min'
- scrollUntilVisible:
    element:
      id: 'micro-muscle-map-row-Core-readout'
    direction: DOWN
- tapOn:
    id: 'micro-muscle-map-view-total'
- copyTextFrom:
    id: 'micro-muscle-map-row-Core-readout'
- assertTrue: "${maestro.copiedText === '6.5/4.2'}"
- scrollUntilVisible:
    element:
      id: 'micro-compare-plan'
    direction: UP
- tapOn:
    id: 'micro-compare-plan'
- assertVisible:
    id: 'micro-comparison-line'
    text: 'Micro 2 done vs Micro 2 plan'
- assertVisible:
    id: 'micro-total-trainings-value'
    text: '4'
- assertVisible:
    id: 'micro-total-trainings-reference'
    text: ' / 4'
- assertNotVisible:
    id: 'micro-total-duration'
- scrollUntilVisible:
    element:
      id: 'micro-muscle-map-row-Core-readout'
    direction: DOWN
- copyTextFrom:
    id: 'micro-muscle-map-row-Core-readout'
- assertTrue: "${maestro.copiedText === '6.5/4.2'}"
- copyTextFrom:
    id: 'micro-muscle-map-row-Biceps-readout'
- assertTrue: "${maestro.copiedText === '10.4/11'}"
- tapOn:
    id: 'micro-muscle-map-view-diff'
- copyTextFrom:
    id: 'micro-muscle-map-row-Biceps-readout'
- assertTrue: "${maestro.copiedText === '−0.6'}"
