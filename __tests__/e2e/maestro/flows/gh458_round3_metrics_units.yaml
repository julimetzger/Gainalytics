appId: com.powerliftingworkoutplanner
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 90000
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 30000
# GH-458 round 3: the Dashboard's Quads chip opens the Metrics Overview with the
# muscle preselected, WITHOUT the removed "Showing: ..." line. The tables sit in
# RangeSwiper's inaccessible subtree (#438), so their short headers and weighted
# decimals are proven by screenshot + unit tests (metric-format.spec.ts).
- tapOn:
    id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 15000
- tapOn: 'Dashboard'
- extendedWaitUntil:
    visible:
      id: 'muscle-chip-Quads'
    timeout: 30000
- takeScreenshot: gh458_r3_20_dashboard_global_stale_banner
- tapOn:
    id: 'muscle-chip-Quads'
# GH-532: the radar label only selects the muscle; Details drills down.
- tapOn:
    id: 'muscle-radar-details-button'
- extendedWaitUntil:
    visible: '1 selected'
    timeout: 60000
- assertVisible: 'Quads'
- assertNotVisible: 'Showing.*'
- waitForAnimationToEnd
- takeScreenshot: gh458_r3_21_metrics_muscles_weighted_decimals
- scroll
- takeScreenshot: gh458_r3_22_metrics_exercises_whole_counts
# One period forward: the muscle's own last training decides the stale banner.
- scrollUntilVisible:
    element: '1 selected'
    direction: UP
- swipe:
    start: 90%, 45%
    end: 15%, 45%
- waitForAnimationToEnd
- assertVisible: '1 selected'
- assertNotVisible: 'Showing.*'
- takeScreenshot: gh458_r3_30_muscle_filtered_stale_banner
