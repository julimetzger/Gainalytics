appId: com.powerliftingworkoutplanner
---
# GH-497: fresh install (empty store, see scripts/fresh_install.sh in the run dir) →
# every onboarding screen → "Start with a template" → plan is created → its first
# training starts directly and a set is logged.
# env TAG: screenshot prefix (theme), e.g. dark
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'onboarding-step-welcome'
    timeout: 120000
- assertVisible: 'Step 1 of 3'
- assertVisible: 'Welcome to Gainalytics'
- assertVisible:
    id: 'onboarding-level-meso'
- assertVisible:
    id: 'onboarding-level-training'
- takeScreenshot: gh497_${TAG}_01_welcome
- tapOn:
    id: 'onboarding-next'
- assertVisible: 'Step 2 of 3'
- assertVisible: 'RIR = Reps in Reserve'
- assertVisible:
    id: 'onboarding-rir-example'
    text: '5 reps @ 2 RIR → you stop with two good reps left'
- takeScreenshot: gh497_${TAG}_02_rir
- tapOn:
    id: 'onboarding-next'
- assertVisible: 'Step 3 of 3'
- assertVisible: 'How do you want to start\?'
- assertVisible:
    id: 'onboarding-choice-empty'
- assertVisible:
    id: 'onboarding-choice-import'
- takeScreenshot: gh497_${TAG}_03_start
- tapOn:
    id: 'onboarding-choice-template'
- assertVisible:
    id: 'onboarding-step-template'
# Three templates, each with its real structure; the first one is preselected.
- assertVisible:
    id: 'program-template-structure-strength-block'
    text: '2 mesos · 8 micros · 3 trainings per micro'
- assertVisible:
    id: 'program-template-structure-hypertrophy-block'
    text: '1 meso · 5 micros · 4 trainings per micro'
- assertVisible:
    id: 'program-template-structure-full-body-starter'
    text: '1 meso · 4 micros · 3 trainings per micro'
- assertVisible:
    id: 'program-template-strength-block'
    checked: true
- takeScreenshot: gh497_${TAG}_04_templates
- tapOn:
    id: 'onboarding-create-plan'
# The new plan opens on its first training, ready to start — no further planning.
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
- assertNotVisible:
    id: 'onboarding-screen'
- assertVisible: 'Strength Block.*'
- assertVisible: '.*Squat & Bench'
- takeScreenshot: gh497_${TAG}_05_plan_created
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible: '4 sets'
    timeout: 10000
- assertVisible: '10-12'
- takeScreenshot: gh497_${TAG}_06_planned_sets
- tapOn:
    id: 'subtab-train'
- tapOn:
    id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-weight-input-1'
    timeout: 20000
# Log set 1 of the planned Squat sets with a real weight.
- tapOn:
    id: 'add-workout-set-weight-input-1'
- eraseText: 5
- inputText: '60'
- tapOn:
    id: 'add-workout-set-confirm-1'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-logged-1'
    timeout: 10000
- takeScreenshot: gh497_${TAG}_07_first_set_logged
# Back on the home screen (tapping the focused tab pops the stack; no hideKeyboard — with
# no soft keyboard up it acts as BACK): the template plan drives the dashboard and shows
# the running training with the logged 60 kg × 6.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Strength Block'
- assertVisible:
    id: 'micro-hero-value'
    text: '360 kg'
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-name'
    text: 'Squat & Bench'
- takeScreenshot: gh497_${TAG}_08_home_training_running
