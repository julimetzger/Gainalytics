appId: com.powerliftingworkoutplanner
---
# GH-418 drag & drop, part 1: open Micro 69 "Push" (baseline) in the full plan
# editor and pin the start order. Part 2 is the device drag
# (__tests__/e2e/scripts/drag-gh418-plan-item.sh), part 3 gh418_drag_persists.yaml.
- runFlow: gh418_open_plan_edit.yaml
# Adductor (32) is the first exercise: set 1 = 13 reps, set 2 = 12 reps.
- assertVisible:
    id: 'plan-set-1-reps-input'
    text: '13'
    below:
      id: 'plan-exercise-drag-handle-32'
- assertVisible:
    id: 'plan-set-2-reps-input'
    text: '12'
    below:
      id: 'plan-exercise-drag-handle-32'
