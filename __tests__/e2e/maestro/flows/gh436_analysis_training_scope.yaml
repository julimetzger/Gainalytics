appId: com.powerliftingworkoutplanner
---
# GH-436 — the analysis of ONE training shows only that training's numbers; the
# micro-wide planned overview lives in the Overview's new Plan position.
#
# Precondition: baseline fixture imported (plan 5 "Push pull", Meso 1). Micro 1
# training 1 "Push squat" is FINISHED, so the screen opens on the Analysis
# sub-tab with the Plan | Train toggle in its start position, Train.
#
# Fixture values asserted below (all deterministic for this .gains file):
#   Micro 1 · training 1 → 14 logged sets, 1 planned set
#   Micro 1 (whole)      → 45 planned sets, 58 logged sets, planned Back 12 vs done Back 14
#   Micro 2 · training 1 → 17 logged sets, 14 planned sets, planned Quads 4 vs micro plan Quads 9.6
#   Micro 2 (whole)      → 58 planned sets, 61 logged sets, planned Back 10 vs done Back 14
#
# The core proof: the training's planned total (1, later 14) is a DIFFERENT
# number than the micro's planned total (45, later 58), and the micro number is
# not on the analysis screen at all.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- assertVisible: 'Micro 1'

# --- Train position: the logged sets of THIS training --------------------------
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 14 \(done\)'
- assertNotVisible: 'THIS MICRO \(PLANNED\)'
- takeScreenshot: gh436_analysis_train_micro1

# --- Plan position: the planned sets of THIS training, not the micro's 45 -------
- tapOn:
    id: 'analysis-data-plan'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 1 \(planned\)'
- copyTextFrom:
    id: 'analysis-total-sets'
- assertTrue: "${maestro.copiedText === 'Total Sets: 1 (planned)'}"
- assertTrue: "${maestro.copiedText !== 'Total Sets: 45 (planned)'}"
- assertNotVisible: 'Total Sets: 45 \(planned\)'
- assertNotVisible: 'THIS MICRO \(PLANNED\)'
- assertNotVisible:
    id: 'micro-plan-overview'
- assertNotVisible:
    id: 'micro-muscle-map-card'
- assertNotVisible:
    id: 'trainings-overview'
- assertNotVisible: 'Analysis available after the training is finished'
- takeScreenshot: gh436_analysis_plan_micro1

# --- Micro 2: same rule, a training with a real planned muscle map -------------
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Micro 2'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- assertVisible: 'Micro 2'
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 14 \(planned\)'
- assertNotVisible: 'Total Sets: 58 \(planned\)'
# the muscle map section is collapsible and its state is persisted — open it if needed
- runFlow:
    when:
      notVisible:
        id: 'muscle-involvement-card'
    commands:
      - tapOn:
          id: 'analysis-section-muscleMap-header'
      - extendedWaitUntil:
          visible:
            id: 'muscle-involvement-card'
          timeout: 10000
# the header names the subject (this training, planned) and the reference (the micro's plan)
- assertVisible: 'THIS TRAINING \(PLANNED\)'
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'Current micro plan'
# planned Quads of THIS training (4) against the planned Quads of the whole micro (9.6)
- assertVisible:
    id: 'muscle-row-QUADS'
- assertVisible: '4/9.6'
- takeScreenshot: gh436_analysis_plan_micro2

# --- the other compare options stay selectable and the choice survives a view switch
- tapOn:
    id: 'muscle-map-compare-chip'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-option-none'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip-option-none'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-option-none'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'None'
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 17 \(done\)'
- tapOn:
    id: 'analysis-data-plan'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'None'
# restore the default so the user's device ends in the shipped state
- tapOn:
    id: 'muscle-map-compare-chip'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-option-current_total_plan'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip-option-current_total_plan'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-option-current_total_plan'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'Current micro plan'

# --- the analysis still scrolls in the Plan position (GH-414 / GH-382 regression)
- scrollUntilVisible:
    element:
      text: 'Muscle Overview'
    direction: DOWN
    timeout: 40000
- assertVisible: 'Muscle Overview'
- takeScreenshot: gh436_analysis_plan_scrolled
- scrollUntilVisible:
    element:
      id: 'analysis-data-toggle'
    direction: UP
    timeout: 40000

# --- Overview: the micro-wide plan lives in the new fourth position "Plan" -------
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Overview'
- extendedWaitUntil:
    visible:
      id: 'overview-view-plan'
    timeout: 30000
- assertVisible:
    id: 'overview-view-gesamt'
- assertVisible:
    id: 'overview-view-exercise'
- assertVisible:
    id: 'overview-view-muscle'
- tapOn:
    id: 'overview-view-plan'
- extendedWaitUntil:
    visible:
      id: 'micro-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 58 \(planned\)'
- assertVisible:
    id: 'analysis-total-sets-done'
    text: 'Total Sets: 61 \(done\)'
- assertVisible: 'THIS MICRO \(PLANNED\)'
- assertVisible:
    id: 'micro-muscle-map-compare-label'
    text: 'THIS MICRO \(DONE\)'
- assertNotVisible: 'THIS TRAINING \(PLANNED\)'
# planned Back of the whole micro (10) against the Back actually trained in it (14)
- assertVisible:
    id: 'muscle-row-BACK'
- assertVisible: '10/14'
- takeScreenshot: gh436_overview_plan_micro2

# --- the Overview still scrolls in the Plan position ---------------------------
- scrollUntilVisible:
    element:
      text: 'Muscle Overview'
    direction: DOWN
    timeout: 40000
- assertVisible: 'Muscle Overview'
- takeScreenshot: gh436_overview_plan_scrolled
- scrollUntilVisible:
    element:
      id: 'overview-view-plan'
    direction: UP
    timeout: 40000

# --- the Overview position is remembered across a micro change ------------------
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Micro 1'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'micro-plan-overview'
    timeout: 30000
- assertVisible: 'Micro 1'
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 45 \(planned\)'
- assertVisible:
    id: 'analysis-total-sets-done'
    text: 'Total Sets: 58 \(done\)'
- assertVisible: '12/14'
- takeScreenshot: gh436_overview_plan_micro1
