appId: com.powerliftingworkoutplanner
---
# Shared by gh394_rest_timer_caption: from the training-home screen, open plan
# "Push pull upper lower" micro 69 "Push" (baseline training 282 — PLANNED with
# 11 planned exercises) and land on its "Train" sub-tab with the training running.
#
# Selector notes (all learned the hard way on this screen):
#  * The header is TWO text nodes, "Micro 69" and " Push" (leading space) — a
#    combined selector like "Micro 69 Push" never matches anything.
#  * `tapOn: text: "Push"` also matches the header breadcrumb
#    "Push pull upper lower › Meso 1" and merely re-opens the drawer, so the
#    drawer's training rows are tapped by position.
#  * While the drawer is open the LEFT pager button is labelled with the previous
#    micro, so "Micro 68" visible <=> the current micro is 69. That is the only
#    unambiguous progress check ("Micro 69" is also the pager label on micro 70).
#  * The Last-Training card does not help: it points at the last FINISHED
#    training (micro 70 "Push"), never at the running one.
#  * scrollUntilVisible cannot drive the training-home list (NestableScrollContainer,
#    memory #206) -> swipe by coordinates. The plan list is the last section, so
#    over-swiping is harmless.
- repeat:
    times: 6
    commands:
      - swipe:
          start: '50%, 80%'
          end: '50%, 25%'
- extendedWaitUntil:
    visible:
      id: 'plan-meta-1'
    timeout: 30000
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 60000

# Page back to micro 69. The "< Micro N-1" pager sits at 22%,83% in the drawer.
- tapOn:
    id: 'drawer-menu-button'
- waitForAnimationToEnd:
    timeout: 6000
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible: 'Micro 68'
          commands:
            - runFlow:
                when:
                  notVisible: 'Enable Planning Mode'
                commands:
                  - tapOn:
                      id: 'drawer-menu-button'
                  - waitForAnimationToEnd:
                      timeout: 6000
            - tapOn:
                point: '22%,83%'
                retryTapIfNoChange: false
            - waitForAnimationToEnd:
                timeout: 8000
- assertVisible: 'Micro 68'

# Pick the "Push" day. Drawer training rows Pull/Push/Upper/Lower sit at
# 35/41/46/51 % height; selecting one also closes the drawer.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: ' Push'
          commands:
            - runFlow:
                when:
                  notVisible: 'Enable Planning Mode'
                commands:
                  - tapOn:
                      id: 'drawer-menu-button'
                  - waitForAnimationToEnd:
                      timeout: 6000
            - tapOn:
                point: '10%,41%'
                retryTapIfNoChange: false
            - waitForAnimationToEnd:
                timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 60000
# Value assertions on queryable UI: this really is micro 69's "Push" day.
- assertVisible: 'Micro 69'
- assertVisible: ' Push'
- assertVisible: '.*Push pull upper lower.*'

# Switch to the "Train" sub-tab (inside the pane -> position tap).
# GH-401: the sub-tab carries the only "Start Training" control; it is absent
# once the training is already running, so both branches are still covered.
- tapOn:
    point: '50%,14%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: 'Start Training'
    commands:
      - tapOn: 'Start Training'
      - extendedWaitUntil:
          visible: 'Training started!'
          timeout: 30000
- tapOn:
    point: '50%,14%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
