appId: com.powerliftingworkoutplanner
---
# ANA-002: Verify DateRangePicker single-day tap → Save uses today as end date.
#
# Navigation: Analyse tab → Dashboard "Records" quick-access button.
# The drawer is avoided because the DrawerNavigator renders VideoAnalysisDetailTab
# without route.params, causing a crash (GH-207 regression: route.params?.analysisId
# guard missing). The Dashboard's "Records" chip navigates directly without
# mounting the full drawer screen list.
#
# Tapping calendar days by text ("15") hits the Text node but does not propagate
# to CalendarList's onDayPress in UIAutomator. Use coordinate-based tapping instead.
# Coordinates are percentage-based and scale across device sizes:
#   - Calendar row 3 centre at ≈ y=24%
#   - Column 0 (first weekday column) centre at ≈ x=7%
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

# Navigate to the Analyse tab. First visit may trigger a VideoAnalysisDetailTab
# crash from stale navigation state (leftover from a previous session); dismiss it.
- tapOn: "tab-analyse"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'

# Wait for Dashboard to confirm Analyse tab loaded.
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000

# Use Dashboard's "Records" quick-access button to navigate to Records screen.
- tapOn: "Records"
- waitForAnimationToEnd

# Wait until the DateRangePicker button is rendered.
# testID="date-range-picker-button" is the Button (onPress target).
- extendedWaitUntil:
    visible:
      id: "date-range-picker-button"
    timeout: 10000

# Open the DateRangePicker modal
- tapOn:
    id: "date-range-picker-button"
    index: 0
- assertVisible: "Save"
- waitForAnimationToEnd

# Tap a calendar day by coordinates (row 3, column 0).
# Using coordinates ensures the touch reaches CalendarList's onDayPress handler
# rather than stopping at the Text node.
- tapOn:
    point: "7%, 24%"

- takeScreenshot: after_day_tap

# Press Save — with only a start date selected, today is used as end date
- tapOn: "Save"

# Verify the modal is dismissed
- assertNotVisible: "Save"
- takeScreenshot: after_save

# The range button is still visible with an updated label
- assertVisible:
    id: "date-range-picker-button"
