appId: com.powerliftingworkoutplanner
---
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000

# Navigate to Exercises tab and capture the redesigned list
- tapOn: 'tab-exercises'
- extendedWaitUntil:
    visible: 'Exercises'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'exercise-searchbar'
    timeout: 20000
- assertVisible:
    id: 'exercise-searchbar'
- assertVisible:
    id: 'muscle-group-chip-All'
- assertVisible:
    id: 'muscle-group-chip-Legs'
- takeScreenshot: 01_exercise_tab_carousel_filters

# Open detail view by tapping a focus exercise (or first list row).
# Tap any visible focus card; if none visible, tap first list row.
- runFlow:
    when:
      visible:
        id: 'focus-carousel'
    commands:
      - tapOn:
          id: 'focus-carousel'
          index: 0
- runFlow:
    when:
      notVisible: 'Log'
    commands:
      - tapOn:
          id: 'exercise-list'
          index: 0

- extendedWaitUntil:
    visible:
      id: 'exercise-detail-tabbar'
    timeout: 30000
- assertVisible:
    id: 'exercise-tab-log'
- assertVisible:
    id: 'exercise-tab-stats'
- assertVisible:
    id: 'exercise-tab-history'
- assertVisible:
    id: 'exercise-tab-graph'
- assertVisible:
    id: 'exercise-detail-edit-button'
- assertVisible:
    id: 'exercise-detail-focus-toggle'
- takeScreenshot: 02_detail_log_tab_with_pencil

# Switch to Stats tab and capture rep estimates
- tapOn:
    id: 'exercise-tab-stats'
- extendedWaitUntil:
    visible: 'Rep estimates'
    timeout: 20000
- assertVisible: 'Rep estimates'
- assertVisible: '1RM records'
- takeScreenshot: 03_detail_stats_tab

# Open the fullscreen new-exercise sheet via the FAB and pick muscles at non-equal %
- tapOn:
    id: 'exercise-detail-edit-button'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-sheet'
    timeout: 20000
- assertVisible:
    id: 'edit-exercise-name'
- assertVisible:
    id: 'edit-exercise-focus-switch'
- assertVisible:
    id: 'muscle-searchbar'
- tapOn:
    id: 'chip-Chest-100'
- tapOn:
    id: 'chip-Triceps-75'
- assertVisible: 'Chest 100 · Triceps 75 · 2 selected'
- takeScreenshot: 04_edit_sheet_muscle_picker_non_equal
