appId: com.powerliftingworkoutplanner
---
# GH-152: Navigate to VideoAnalysisTab, assert at least one analysis is visible,
# then verify that the RIR filter chip reduces the list and deselecting restores it.
# Prerequisites: at least one video analysis exists (run video_analysis_reps_velocity.yaml first,
# or use any existing Analysis that has null rirEstimate — any analysis with no VL computation
# will be hidden by the RIR=0 chip).
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
# Navigate to Analyse tab → Video Analyses
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analyses'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analyses'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000
# Assert at least one analysis exists before testing the filter
- assertVisible:
    text: "Analysis #[0-9]+"
- takeScreenshot: "video_analysis_filter_before"
# Tap RIR chip "0" — analyses with null rirEstimate are hidden by any RIR preset filter
- tapOn:
    id: 'video-analysis-rir-chip-0'
# Assert that the filter hides all analyses without a matching RIR estimate
- extendedWaitUntil:
    visible:
      id: "video-analysis-empty-card"
    timeout: 10000
- assertVisible:
    text: "No analyses match the active filters."
- takeScreenshot: "video_analysis_filter_active"
# Deselect the chip — list must be fully restored
- tapOn:
    id: 'video-analysis-rir-chip-0'
- extendedWaitUntil:
    visible:
      text: "Analysis #[0-9]+"
    timeout: 10000
- assertVisible:
    text: "Analysis #[0-9]+"
- takeScreenshot: "video_analysis_filter_reset"
