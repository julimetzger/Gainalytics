appId: com.powerliftingworkoutplanner
---
# GH-526 — Micro 2 Overview, Plan tab: one fixed comparison, Plan M2 vs Plan M1,
# no compare chips. Fixture: 58 planned sets vs 45; Quads 9.6 vs 5.6.
- scrollUntilVisible:
    element:
      id: 'overview-view-plan'
    direction: UP
- tapOn:
    id: 'overview-view-plan'
- extendedWaitUntil:
    visible:
      id: 'micro-plan-overview'
    timeout: 30000
- assertVisible:
    id: 'micro-plan-comparison-line'
    text: 'Plan M2 vs Plan M1'
- assertNotVisible:
    id: 'micro-compare-previous'
- assertNotVisible:
    id: 'micro-compare-plan'
- assertVisible:
    id: 'micro-plan-sets-delta'
    text: '\+13 \(\+29%\)'
- scrollUntilVisible:
    element:
      id: 'micro-plan-muscle-map-row-Quads-readout'
    direction: DOWN
- tapOn:
    id: 'micro-plan-muscle-map-view-total'
- copyTextFrom:
    id: 'micro-plan-muscle-map-row-Quads-readout'
- assertTrue: "${maestro.copiedText === '9.6/5.6'}"
