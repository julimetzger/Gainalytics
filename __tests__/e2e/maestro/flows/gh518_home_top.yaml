appId: com.powerliftingworkoutplanner
---
# GH-518 helper: Training home, scrolled to the very top (FAB extended).
# `stopApp: false`: the debug build is served by Metro; keep the running app and its state.
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 300000
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
# Back to the very top (an empty app has no dashboard to scroll to).
- repeat:
    times: 3
    commands:
      - swipe:
          start: '50%, 30%'
          end: '50%, 85%'
- waitForAnimationToEnd:
    timeout: 5000
