appId: com.powerliftingworkoutplanner
---
# GH-322 feedback: unplanned logged Deadlift visible in plan-sort (default) view.
# Architecture: SegmentedButtons and sort toggle inside GestureHandlerRootView/GestureDetector
# are inaccessible to Maestro. The sort toggle was moved to the navigation header
# (outside GestureDetector) as testID="header-exercise-sort-toggle". When showDone
# transitions to true the overview auto-selects the Exercise tab.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 60000
# Scroll past hero card to the Plans section header
- scrollUntilVisible:
    element:
      text: 'Plans'
    direction: DOWN
    timeout: 15000
# Tap Push pull from the plan list
- tapOn: 'Push pull'
# header-plan-meso-name confirms plan view loaded (in React Navigation header, outside swiper)
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 15000
# Open plan drawer
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 12000
- tapOn: 'Overview'
# Wait for drawer close + React commit of showDone=true + microViewMode='exercise'.
# header-exercise-sort-toggle appears ONLY when showDone && microViewMode==='exercise',
# so waiting for it confirms both conditions are met before we screenshot.
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'header-exercise-sort-toggle'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
# SCREENSHOT 1: Exercise view, plan-sort (default) — Deadlift (unplanned) at bottom
- takeScreenshot: 'gh322_plan_sort_unplanned'
# Tap the sort toggle in the navigation header (accessible, outside GestureHandlerRootView)
- tapOn:
    id: 'header-exercise-sort-toggle'
- waitForAnimationToEnd:
    timeout: 2000
# SCREENSHOT 2: Exercise view, date-sort
- takeScreenshot: 'gh322_date_sort'
# Toggle back to plan-sort
- tapOn:
    id: 'header-exercise-sort-toggle'
- waitForAnimationToEnd:
    timeout: 2000
# SCREENSHOT 3: Exercise view, plan-sort restored
- takeScreenshot: 'gh322_plan_sort_restored'
