appId: com.powerliftingworkoutplanner
---
# GH-486 helper: full import of ${FIXTURE} from /sdcard/Download (push it first).
# Same steps as 00_import_baseline.yaml, but for a named fixture.
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- scrollUntilVisible:
    element:
      text: '${FIXTURE}'
    direction: DOWN
    timeout: 30000
- tapOn: '${FIXTURE}'
- extendedWaitUntil:
    visible: 'Import Data'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible: 'Push pull'
    timeout: 120000
