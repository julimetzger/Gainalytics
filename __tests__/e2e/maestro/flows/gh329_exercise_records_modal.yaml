appId: com.powerliftingworkoutplanner
---
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

# Navigate to training home, then into a finished training via edit mode
# (same navigation pattern as gh195_rest_timer_and_1rm.yaml)
- tapOn: "tab-training"
- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 30000
- tapOn:
    id: 'header-overflow-icon'
- extendedWaitUntil:
    visible:
      id: 'overflow-edit'
    timeout: 5000
- tapOn:
    id: 'overflow-edit'
# Navigation complete — training execution screen is now open.
# NOTE: The screen has a live timer so Maestro cannot assert elements here
# (timer keeps hierarchy unsettled → DEADLINE_EXCEEDED on viewHierarchy calls).
# Evidence screenshots and trophy-tap are done via adb in the worker script.
