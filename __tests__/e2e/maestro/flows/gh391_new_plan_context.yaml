appId: com.powerliftingworkoutplanner
name: GH-391 a newly created, never trained plan reaches the chat
---
# Prerequisite state (see summary.md): __tests__/testdata/gh391_newplan_fixture.gains
# imported via 00_import_baseline.yaml, plus a dummy API key from
# gh391_set_dummy_api_key.yaml. That store is the reported situation:
#   - plan 5 "Push pull" is FULLY trained, and its last session is the most
#     recent one in the whole store (yesterday) — it used to win
#   - plan 6 "New block 2026" was just created and never touched: micro 1 holds
#     "Squat day" (with GH-63 rep/RIR ranges) and "Bench day", micro 2 one more
# Before the fix the chat showed "Plan: 0 sessions" here and the picker offered
# no planned training at all.
#
# NO `launchApp` and no navigation on purpose (see gh391_chat_planning_context.yaml).
# Open Analyse -> drawer -> AI Chat before running it:
#   adb -s $S shell 'am start -n com.powerliftingworkoutplanner/.MainActivity; \
#     sleep 35; input tap 674 2175; sleep 10; input tap 68 222; sleep 8; \
#     input tap 300 1539; sleep 12'
- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 60000

# ── 1. The new plan's sessions are attached, counted, and named ───────────
- assertVisible:
    id: 'chat-planned-toggle'
- assertVisible: 'Plan: 3 sessions'
- takeScreenshot: gh391-09-newplan-chip

# which plan the chat knows is readable, not just how many sessions
- tapOn:
    id: 'chat-filter-toggle'
- extendedWaitUntil:
    visible:
      id: 'chat-planned-info'
    timeout: 15000
- copyTextFrom:
    id: 'chat-planned-info'
- assertTrue: "${maestro.copiedText.indexOf('New block 2026') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('Plan attached: 3 planned sessions') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('current micro 1 and next micro 2') >= 0}"
- takeScreenshot: gh391-10-newplan-info

# ── 2. The context really carries them, ranges included ───────────────────
- tapOn:
    id: 'chat-context-inspect'
- extendedWaitUntil:
    visible:
      id: 'chat-context-preview-planned'
    timeout: 15000
- copyTextFrom:
    id: 'chat-context-preview-planned'
- assertTrue: "${maestro.copiedText.indexOf('New block 2026') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('Squat day') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('Bench day') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('Prep') >= 0}"
# a planned RANGE, not its lower bound
- assertTrue: "${maestro.copiedText.indexOf('5-8') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('3-5') >= 0}"
# the fully trained plan that used to win contributes nothing
- assertTrue: "${maestro.copiedText.indexOf('Push squat') < 0}"
- takeScreenshot: gh391-11-newplan-context

# ── 3. Its sessions can be picked as the subject ──────────────────────────
- tapOn:
    id: 'chat-context-preview-close'
- waitForAnimationToEnd
- tapOn:
    id: 'chat-subject-chip'
- extendedWaitUntil:
    visible:
      id: 'chat-training-picker'
    timeout: 15000
# 382/383 are micro 1 of the new plan, 384 its next micro
- assertVisible:
    id: 'chat-training-option-383'
- assertVisible:
    id: 'chat-training-option-384'
- tapOn:
    id: 'chat-training-option-382'
- waitForAnimationToEnd
- assertVisible: 'Micro 1 · Squat day'
- takeScreenshot: gh391-12-newplan-subject
- tapOn:
    id: 'chat-context-inspect'
- extendedWaitUntil:
    visible:
      id: 'chat-context-preview-selected'
    timeout: 15000
- copyTextFrom:
    id: 'chat-context-preview-selected'
- assertTrue: "${maestro.copiedText.indexOf('Squat day') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('New block 2026') >= 0}"
- assertTrue: "${maestro.copiedText.indexOf('planned') >= 0}"
# never trained, so there is nothing performed to compare against
- assertTrue: "${maestro.copiedText.indexOf('performed') < 0}"
- takeScreenshot: gh391-13-newplan-selected-context
- tapOn:
    id: 'chat-context-preview-close'
- waitForAnimationToEnd
# leave the subject cleared for the flows that come after this one
- tapOn:
    id: 'chat-subject-chip'
- extendedWaitUntil:
    visible:
      id: 'chat-training-picker'
    timeout: 15000
- tapOn:
    id: 'chat-training-option-none'
- waitForAnimationToEnd
- assertVisible: 'Training: none'
