appId: com.powerliftingworkoutplanner
---
# ANA-003-fix2 round-7: Prove marker at t=0:00 is at LEFT EDGE (x=LEFT_PADDING).
# New formula: x = LEFT_PADDING + (t / videoDuration) * drawableWidth
# Chart axisMinimum=0, axisMaximum=videoDuration → same domain as scrubber.
# At t=0: progress=0, x=LEFT_PADDING=48px (chart left data edge), marker visible at chart start.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Android App Compatibility"
    commands:
      - tapOn:
          text: "Don't Show Again"
- runFlow:
    when:
      visible: "Unable to load script"
    commands:
      - tapOn:
          text: "RELOAD"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 15000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- scrollUntilVisible:
    element:
      text: "Open"
    direction: DOWN
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 180000
# Scroll to Playback Overlay section with controls
- scrollUntilVisible:
    element:
      id: "video-analysis-playback-toggle"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 500
# Verify chart and Play button are in view at t=0:00
- assertVisible: "Bar v_y Over Time"
- assertVisible:
    id: "video-analysis-playback-toggle"
# ── Screenshot at t=0:00 — marker at left edge of chart (x=LEFT_PADDING), scrubber at far left ──
- takeScreenshot: "marker_r7_t0_left_edge"
