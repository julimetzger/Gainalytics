appId: com.powerliftingworkoutplanner
# GH-546: body weight card in Analyse. Starts from an app whose store was hydrated with the
# baseline fixture (00_import_baseline.yaml) and has NO body weight entries yet (synthetic values only).
# Dates are relative to today (14 and 7 days ago, today), so the flow does not expire with the
# default "last 3 months" range. Dates must read like the rest of the app ("Mon, 05/10/26"),
# weights like logged set weights ("82.5 kg", "81 kg"); "," is accepted as input but shown as ".".
---
# calN = accessibility label of the calendar day, appN = getDateStringFromDate(dayN)
- evalScript: "${var D = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; var M = ['January','February','March','April','May','June','July','August','September','October','November','December']; var d1 = new Date(Date.now() - 14 * 864e5); var d2 = new Date(Date.now() - 7 * 864e5); var d3 = new Date(); output.cal1 = D[d1.getDay()] + ' ' + d1.getDate() + ' ' + M[d1.getMonth()] + ' ' + d1.getFullYear(); output.cal2 = D[d2.getDay()] + ' ' + d2.getDate() + ' ' + M[d2.getMonth()] + ' ' + d2.getFullYear(); output.app1 = D[d1.getDay()].slice(0, 3) + ', ' + ('0' + d1.getDate()).slice(-2) + '/' + ('0' + (d1.getMonth() + 1)).slice(-2) + '/' + String(d1.getFullYear()).slice(-2); output.app2 = D[d2.getDay()].slice(0, 3) + ', ' + ('0' + d2.getDate()).slice(-2) + '/' + ('0' + (d2.getMonth() + 1)).slice(-2) + '/' + String(d2.getFullYear()).slice(-2); output.app3 = D[d3.getDay()].slice(0, 3) + ', ' + ('0' + d3.getDate()).slice(-2) + '/' + ('0' + (d3.getMonth() + 1)).slice(-2) + '/' + String(d3.getFullYear()).slice(-2)}"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- tapOn:
    id: "analyse-drawer-toggle"
- tapOn: "Body Weight"
- extendedWaitUntil:
    visible:
      id: "body-weight-screen"
    timeout: 15000
# Empty state with a direct entry point
- assertVisible: "No body weight yet"
- tapOn:
    id: "body-weight-empty-add"
- assertVisible: "Add weight"
# The date is prefilled with today, in the app's date format
- assertVisible:
    id: "body-weight-date-button-text"
    text: "${output.app3}"
# Validation: an implausible value is rejected and the dialog stays open
- tapOn:
    id: "body-weight-weight-input"
- inputText: "5"
- tapOn:
    id: "body-weight-save"
- assertVisible: "Weight must be between 20 and 500 kg"
# First entry, 14 days ago, typed with a comma
- tapOn:
    id: "body-weight-weight-input"
- eraseText: 6
- inputText: "82,5"
- assertVisible:
    id: "body-weight-weight-input"
    text: "82.5"
- tapOn:
    id: "body-weight-note-input"
- inputText: "synthetic"
- hideKeyboard
- tapOn:
    id: "body-weight-date-button"
- scrollUntilVisible:
    element:
      text: ".*${output.cal1}.*"
    direction: UP
- tapOn:
    text: ".*${output.cal1}.*"
- tapOn:
    text: "Save"
    rightOf:
      text: "MM/DD/YYYY"
- assertVisible:
    id: "body-weight-date-button-text"
    text: "${output.app1}"
- tapOn:
    id: "body-weight-save"
- extendedWaitUntil:
    visible:
      id: "body-weight-current"
    timeout: 10000
- assertVisible:
    id: "body-weight-current"
    text: "82.5 kg"
- assertVisible:
    id: "body-weight-entry-text-1"
    text: "${output.app1}  ·  82.5 kg"
# Second entry, 7 days ago, a whole number: shown without trailing zero
- tapOn:
    id: "body-weight-add"
- tapOn:
    id: "body-weight-weight-input"
- inputText: "81"
- hideKeyboard
- tapOn:
    id: "body-weight-date-button"
- scrollUntilVisible:
    element:
      text: ".*${output.cal2}.*"
    direction: UP
- tapOn:
    text: ".*${output.cal2}.*"
- tapOn:
    text: "Save"
    rightOf:
      text: "MM/DD/YYYY"
- assertVisible:
    id: "body-weight-date-button-text"
    text: "${output.app2}"
- tapOn:
    id: "body-weight-save"
# Third entry, today (prefilled), with a comma
- tapOn:
    id: "body-weight-add"
- tapOn:
    id: "body-weight-weight-input"
- inputText: "80,6"
- hideKeyboard
- tapOn:
    id: "body-weight-save"
# KPIs: current weight and change over the period (80.6 - 82.5)
- assertVisible:
    id: "body-weight-current"
    text: "80.6 kg"
- assertVisible:
    id: "body-weight-change"
    text: "-1.9 kg"
- assertVisible:
    id: "body-weight-chart"
- scrollUntilVisible:
    element:
      id: "body-weight-entry-text-1"
    direction: DOWN
- assertVisible:
    id: "body-weight-entry-text-3"
    text: "${output.app3}  ·  80.6 kg"
- assertVisible:
    id: "body-weight-entry-text-2"
    text: "${output.app2}  ·  81 kg"
- assertVisible:
    id: "body-weight-entry-text-1"
    text: "${output.app1}  ·  82.5 kg"
- takeScreenshot: gh546_chart
# Edit the newest entry (id 3)
- tapOn:
    id: "body-weight-edit-3"
- assertVisible: "Edit weight"
- assertVisible:
    id: "body-weight-date-button-text"
    text: "${output.app3}"
- assertVisible:
    id: "body-weight-weight-input"
    text: "80.6"
- tapOn:
    id: "body-weight-weight-input"
- eraseText: 6
- inputText: "80,8"
- hideKeyboard
- tapOn:
    id: "body-weight-save"
- assertVisible:
    id: "body-weight-entry-text-3"
    text: "${output.app3}  ·  80.8 kg"
- scrollUntilVisible:
    element:
      id: "body-weight-current"
    direction: UP
- assertVisible:
    id: "body-weight-current"
    text: "80.8 kg"
- assertVisible:
    id: "body-weight-change"
    text: "-1.7 kg"
# Delete it again
- scrollUntilVisible:
    element:
      id: "body-weight-edit-3"
    direction: DOWN
- tapOn:
    id: "body-weight-edit-3"
- tapOn:
    id: "body-weight-delete"
- tapOn:
    id: "body-weight-delete-confirm"
- scrollUntilVisible:
    element:
      id: "body-weight-current"
    direction: UP
- assertVisible:
    id: "body-weight-current"
    text: "81 kg"
- assertVisible:
    id: "body-weight-change"
    text: "-1.5 kg"
