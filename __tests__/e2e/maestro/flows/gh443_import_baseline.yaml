appId: com.powerliftingworkoutplanner
---
# GH-443 import of baseline.gains.
#
# Same steps as 00_import_baseline.yaml, plus one fix it lacks: the SAF picker
# REMEMBERS the folder it was last used in. On an emulator that other tickets
# have driven through video imports it reopens in "Videos › El" — a folder full
# of mp4s where `scrollUntilVisible: 'baseline.gains'` can never succeed, and the
# flow then fails with a flat "No visible element found: baseline.gains" that
# looks like a missing fixture rather than a wrong folder.
#
# The block below opens the picker's roots drawer (swipe from the left edge) and
# picks "Downloads" — but only when the file is not already on screen, so on a
# picker that opens in the right place nothing changes. 00_import_baseline.yaml
# is deliberately left alone: every other ticket's suite depends on it and this
# run cannot verify those.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
# The bottom nav exposes 'tab-training' as an accessibility label, and it is the
# earliest proof the JS side has rendered (a cold start behind Metro takes
# minutes here).
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 300000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- waitForAnimationToEnd:
    timeout: 8000

# Steer the picker to Downloads if the fixture is not already listed.
- runFlow:
    when:
      notVisible: 'baseline.gains'
    commands:
      - swipe:
          start: '2%, 50%'
          end: '80%, 50%'
      - extendedWaitUntil:
          visible: 'Downloads'
          timeout: 15000
      - tapOn: 'Downloads'
      - waitForAnimationToEnd:
          timeout: 8000

- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
# The import leaves the app on the Settings tab, and the bottom bar only renders
# a label for the ACTIVE tab — so waiting for the text "Training" never resolves.
- extendedWaitUntil:
    visible: 'Import Data'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible: 'Push pull'
    timeout: 120000
