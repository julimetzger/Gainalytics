appId: com.powerliftingworkoutplanner
---
# GH-526 — Train position, chip "vs Micro": the training as a SHARE of the
# micro's plan. Fixture: 17 sets of a 58-set micro plan → 29 %; Chest 4 of 5.8 → 69 %.
- scrollUntilVisible:
    element:
      id: 'analysis-compare-current_total_plan'
    direction: UP
- tapOn:
    id: 'analysis-compare-current_total_plan'
- assertVisible:
    id: 'analysis-comparison-line'
    text: 'Done vs plan of all trainings in Micro 2'
- assertVisible:
    id: 'trainings-overview-sets-delta'
    text: '29% of Micro 2 plan'
- assertNotVisible:
    id: 'trainings-overview-duration'
- assertVisible: 'Share'
- tapOn:
    id: 'analysis-muscle-map-view-diff'
- scrollUntilVisible:
    element:
      id: 'analysis-muscle-map-row-Chest-readout'
    direction: DOWN
- copyTextFrom:
    id: 'analysis-muscle-map-row-Chest-readout'
- assertTrue: "${maestro.copiedText === '69%'}"
