# Helper: open plan 1 "Push pull upper lower", micro 69 'Push' (the baseline's
# PLANNED Push day) with the drawer closed.
# env MODE (no default — a sub-flow's env default overrides the caller's value):
#   planned (or unset) — stop on the training, no sub-tab chosen
#   running            — Train sub-tab, session started, set input row open
#   edit               — Plan sub-tab, kebab › "Edit plan" (EDITING PLAN header)
# Precondition: baseline imported (00_import_baseline.yaml).
appId: com.powerliftingworkoutplanner
---
# Adapted from gh443_goto_running_push.yaml: open the plan "Push pull upper lower",
# page the micro drawer to micro 69 "Push" (the baseline fixture's planned Push
# day) and stop there — no sub-tab is chosen and no session is started.
#
# Selector note (GH-443): contrary to agent-memory #206/#291, Maestro's own
# driver DOES see the training pane on this build — `subtab-train`,
# `train-tab-start-button` and every AddWorkout/RestTimerCard testID resolve.
# `uiautomator dump` still returns nothing on this screen, so the two are not
# interchangeable; drive and assert with Maestro, not with dumps.
#
# The drawer is driven by TEXT, not by coordinates: Maestro's accessibility taps
# into it land, position taps into the pane behind it do not. Maestro anchors
# `text:` regexes, so `text: 'Push'` matches the drawer row only — never the
# breadcrumb "Push pull upper lower › Meso 1".
- launchApp:
    clearState: false
    stopApp: false
- tapOn:
    text: 'Dismiss'
    optional: true
# Several emulators share this host; under load Android puts an
# "isn't responding" dialog over everything. Only system ANRs are dismissed;
# the app's own ANR must fail the flow (GH-589).
- runFlow: dismiss_system_anr.yaml

# Wait for the app to be UP before the walk-back loop below. A cold start costs
# minutes here (Metro bundle + a large store), and while it loads neither
# `training-home-screen` nor 'Trainings:' is visible — so the loop would take its
# `back` branch eight times and walk the app off to the launcher, after which
# every later selector fails for a reason that has nothing to do with the app.
# The bottom nav is the earliest anchor that proves the JS side is rendering; it
# exposes 'tab-training' as an ACCESSIBILITY LABEL, not as a resource-id, so
# `id: 'tab-training'` never matches and the bare selector is required.
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 300000

# `launchApp: {stopApp: false}` attaches to the app WHERE IT IS — after a
# previous run that is the training-detail screen, possibly with the drawer
# open. Walk back to the Training tab root instead of paying for a cold restart
# (a cold bundle costs minutes on this multi-emulator host).
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'training-home-screen'
          commands:
            # The drawer covers the screen and swallows BACK. Its hamburger is a
            # toggle (TrainingsPlanTab: `setOpen(prev => !prev)`), so the same
            # button closes it.
            - runFlow:
                when:
                  visible: 'Trainings:'
                commands:
                  - tapOn:
                      id: 'drawer-menu-button'
                  - waitForAnimationToEnd:
                      timeout: 5000
            - runFlow:
                when:
                  notVisible: 'Trainings:'
                commands:
                  - back
                  - waitForAnimationToEnd:
                      timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 180000

# The training-home list is a NestableScrollContainer, which scrollUntilVisible
# cannot drive (memory #206) — swipe by coordinates. How many swipes it takes
# depends on how tall the dashboard above the plan list renders (it grows once a
# plan is active), so swipe UNTIL the row is there rather than a fixed count.
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'plan-row-1'
          commands:
            - swipe:
                start: '50%, 80%'
                end: '50%, 25%'
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'plan-row-1'
    timeout: 60000
- tapOn:
    id: 'plan-row-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 120000

# Page the drawer back to micro 69. While the drawer is open the LEFT pager
# button is labelled with the PREVIOUS micro, so "Micro 68" visible <=> we are on
# 69 — the header string "Micro 69" is ambiguous with the pager label of micro 70
# (gh394_goto_micro69_push.yaml documents the same trap). After the baseline
# import the plan opens on micro 70, so the left pager reads "Micro 69" and one
# tap is enough; the loop only exists to absorb a swallowed tap.
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Trainings:'
    timeout: 30000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible: 'Micro 68'
          commands:
            - runFlow:
                when:
                  notVisible: 'Trainings:'
                commands:
                  - tapOn:
                      id: 'drawer-menu-button'
                  - extendedWaitUntil:
                      visible: 'Trainings:'
                      timeout: 30000
            - tapOn:
                text: 'Micro 69'
                optional: true
            - waitForAnimationToEnd:
                timeout: 8000
- assertVisible: 'Micro 68'

# Pick the "Push" day; selecting a training row also closes the drawer.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: ' Push'
          commands:
            - runFlow:
                when:
                  notVisible: 'Trainings:'
                commands:
                  - tapOn:
                      id: 'drawer-menu-button'
                  - extendedWaitUntil:
                      visible: 'Trainings:'
                      timeout: 30000
            - tapOn:
                text: 'Push'
                optional: true
            - waitForAnimationToEnd:
                timeout: 8000
# The header renders the micro and the training as two nodes, the second with a
# leading space.
- assertVisible: 'Micro 69'
- assertVisible: ' Push'
- runFlow:
    when:
      visible: 'Trainings:'
    commands:
      - tapOn:
          id: 'drawer-menu-button'
      - waitForAnimationToEnd:
          timeout: 5000

# MODE=running: Train sub-tab, start the session unless it is already running.
- runFlow:
    when:
      true: ${MODE == 'running'}
    commands:
      - tapOn:
          id: 'subtab-train'
      - waitForAnimationToEnd:
          timeout: 8000
      - runFlow:
          when:
            visible:
              id: 'train-tab-start-button'
          commands:
            - tapOn:
                id: 'train-tab-start-button'
            - extendedWaitUntil:
                visible:
                  id: 'header-session-timer'
                timeout: 120000
      - extendedWaitUntil:
          visible:
            id: 'add-workout-set-reps-input'
          timeout: 120000

# MODE=edit: the kebab only offers "Edit plan" on the Plan sub-tab.
- runFlow:
    when:
      true: ${MODE == 'edit'}
    commands:
      - tapOn:
          id: 'subtab-plan'
      - waitForAnimationToEnd
      - tapOn:
          id: 'header-overflow-icon'
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'overflow-edit-plan'
          timeout: 10000
      - tapOn:
          id: 'overflow-edit-plan'
      - extendedWaitUntil:
          visible:
            id: 'header-plan-editing-kicker'
          timeout: 10000
