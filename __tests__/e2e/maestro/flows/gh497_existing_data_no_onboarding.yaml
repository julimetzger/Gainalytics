appId: com.powerliftingworkoutplanner
---
# GH-497: an existing user updates. The store was filled by the previous app version
# (baseline.gains imported there, no onboarding flag at all); the new version must
# start straight into the data — no onboarding — while the feature itself is present
# (Settings › Help › "Show Introduction").
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- extendedWaitUntil:
    visible: 'Push pull'
    timeout: 60000
- assertNotVisible:
    id: 'onboarding-screen'
- assertNotVisible: 'Welcome to Gainalytics'
- takeScreenshot: gh497_update_02_new_version_no_onboarding
# Proof that the new JS runs: the reopen entry exists.
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-show-onboarding-button'
    direction: DOWN
- assertNotVisible:
    id: 'onboarding-screen'
- takeScreenshot: gh497_update_03_settings_help_present
