appId: com.powerliftingworkoutplanner
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
- tapOn: "Import Emulator Squat Video"
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
- extendedWaitUntil:
    visible: "Analysis #[0-9]+"
    timeout: 30000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: (done|needs_manual_seed)"
    timeout: 180000
- runFlow:
    when:
      visible: "Status: needs_manual_seed"
    commands:
      - scrollUntilVisible:
          element:
            id: "video-analysis-manual-seed-preview"
          direction: DOWN
      - tapOn:
          id: "video-analysis-manual-seed-preview"
          point: "78%,44%"
      - assertVisible:
          id: "video-analysis-manual-seed-marker"
      - tapOn:
          id: "video-analysis-manual-seed-run"
      - scrollUntilVisible:
          element:
            id: "video-analysis-detail-status"
          direction: UP
      - extendedWaitUntil:
          visible: "Status: done"
          timeout: 180000
- scrollUntilVisible:
    element:
      id: "video-analysis-detail-status"
    direction: UP
- assertVisible: "Status: done"
- scrollUntilVisible:
    element:
      id: "video-analysis-overlay-preview"
    direction: DOWN
- assertVisible: "__FORCE_SCREENSHOT__"
