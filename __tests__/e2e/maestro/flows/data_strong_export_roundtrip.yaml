appId: com.powerliftingworkoutplanner
---
# Feature F9 Import/Export - T9.1 Strong CSV export and round trip.
#
# Purpose (GH-496):
#   1. Settings -> "Export as CSV (Strong format)" on the baseline store writes
#      5768 logged sets from 387 workouts (share sheet -> "Save to Downloads").
#   2. On an EMPTY store the export says "Nothing to export" instead of a file.
#   3. Invalid CSVs are rejected AS A WHOLE with file name + line number:
#      a broken date (gh496_invalid.csv) and a broken weight
#      (gh496_invalid_weight.csv, must not become a 0 kg set).
#   4. The exported file imported into the empty store: 387 workouts -> 375
#      trainings (12 same-day merges) in 123 weeks, 5767 sets (the baseline's
#      failed 105 kg x 0 attempt is skipped), 81 exercises; the Analyse tab then
#      knows the baseline's last training again. A second import adds nothing.
#
# Data basis: MUTATES the store - starts with 00_import_baseline.yaml, then
#   clears the app (launchApp clearState) for the empty-store part.
#   Push to /sdcard/Download BEFORE the run:
#     - __tests__/e2e/maestro/fixtures/baseline.gains
#     - __tests__/e2e/maestro/fixtures/gh496/gh496_invalid.csv
#     - __tests__/e2e/maestro/fixtures/gh496/gh496_invalid_weight.csv
#   The export itself lands in Downloads as gainalytics_strong_<date>.csv; the
#   flow picks it by the regex 'gainalytics_strong_.*\.csv'. Delete exports of
#   earlier runs first if the stored baseline could differ (all exports of the
#   same baseline are identical, so an older one gives the same values).
#
# Merged from: gh496_strong_import_roundtrip, gh496_strong_export
- runFlow: 00_import_baseline.yaml

# ---------------------------------------------------------------- PRECONDITION
# (00_import_baseline.yaml ends on the Training home with "Push pull".)
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'

# ------------------------------------------------- 1. export of the baseline
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-strong-csv-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'settings-export-strong-csv-button'
    text: 'Export as CSV \(Strong format\)'
- assertVisible:
    id: 'settings-import-strong-csv-button'
    text: 'Import from Strong CSV'
# The .gains backup buttons stay next to them.
- assertVisible:
    id: 'settings-import-data-button'
- assertVisible:
    id: 'settings-export-data-button'
- assertNotVisible:
    id: 'settings-strong-export-result'
- tapOn:
    id: 'settings-export-strong-csv-button'
# Android share sheet with the file and the app's "Save to Downloads" action
- extendedWaitUntil:
    visible: 'Save to Downloads'
    timeout: 30000
- assertVisible: '.*gainalytics_strong_.*\.csv.*'
- tapOn: 'Save to Downloads'
- extendedWaitUntil:
    visible:
      id: 'settings-strong-export-result'
    timeout: 30000
- assertVisible:
    id: 'settings-strong-export-result'
    text: 'Exported 5768 sets from 387 workouts'

# ------------------------------------------- 2. empty store: nothing to export
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-strong-csv-button'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'settings-export-strong-csv-button'
- extendedWaitUntil:
    visible:
      id: 'strong-csv-notice-title'
      text: 'Nothing to export'
    timeout: 15000
- assertVisible:
    id: 'strong-csv-notice-text'
    text: 'There are no logged sets yet\. Finish a training first, then export it as CSV\.'
- assertNotVisible: 'Save to Downloads'
- tapOn:
    id: 'strong-csv-notice-ok-button'
- extendedWaitUntil:
    notVisible:
      id: 'strong-csv-notice-dialog'
    timeout: 10000

# --------------------------------------------- 3. invalid files are rejected
# Broken date in line 3 (line 2 is valid): nothing is imported.
- runFlow:
    file: pick_file.yaml
    env:
      FILE: gh496_invalid.csv
- extendedWaitUntil:
    visible:
      id: 'strong-csv-notice-title'
      text: 'Import failed'
    timeout: 30000
- assertVisible:
    id: 'strong-csv-notice-text'
    text: 'gh496_invalid\.csv: Line 3: "2024-13-45 18:00:00" is not a valid date\. Nothing was imported\.'
- tapOn:
    id: 'strong-csv-notice-ok-button'
- extendedWaitUntil:
    notVisible:
      id: 'strong-csv-notice-dialog'
    timeout: 10000
# Reps with a broken weight: line number, not a silent 0 kg set.
- runFlow:
    file: pick_file.yaml
    env:
      FILE: gh496_invalid_weight.csv
- extendedWaitUntil:
    visible:
      id: 'strong-csv-notice-title'
      text: 'Import failed'
    timeout: 30000
- assertVisible:
    id: 'strong-csv-notice-text'
    text: 'gh496_invalid_weight\.csv: Line 3: "1OO\.0" is not a valid weight\. Nothing was imported\.'
- tapOn:
    id: 'strong-csv-notice-ok-button'
- extendedWaitUntil:
    notVisible:
      id: 'strong-csv-notice-dialog'
    timeout: 10000
# Nothing was imported: still no plan "Strong Import" on the Training tab.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- assertNotVisible: 'Strong Import'
- tapOn: 'tab-settings'

# ---------------------------------- 4. round trip: import the exported file
- runFlow:
    file: pick_file.yaml
    env:
      FILE: 'gainalytics_strong_.*\.csv'
- extendedWaitUntil:
    visible:
      id: 'strong-import-summary-trainings'
      text: '375 trainings in 123 weeks'
    timeout: 60000
- assertVisible:
    id: 'strong-import-summary-file'
    text: 'File: gainalytics_strong_.*\.csv'
- assertVisible:
    id: 'strong-import-summary-sets'
    text: '5767 sets · 81 exercises \(76 new\)'
- assertVisible:
    id: 'strong-import-summary-failed'
    text: 'Skipped 1 failed attempt \(0 reps\), so it does not count as a record'
- assertVisible:
    id: 'strong-import-summary-plan'
    text: 'New plan "Strong Import", trainings named by weekday: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday'
- assertVisible:
    id: 'strong-import-summary-merged'
    text: '12 workouts on the same day as another were combined'
- assertVisible:
    id: 'strong-import-summary-unit'
    text: 'Weights: kg \(from file\)'
- tapOn:
    id: 'strong-import-confirm-button'
- extendedWaitUntil:
    notVisible:
      id: 'strong-import-summary-dialog'
    timeout: 60000

# Importing the same file again adds nothing.
- runFlow:
    file: pick_file.yaml
    env:
      FILE: 'gainalytics_strong_.*\.csv'
- extendedWaitUntil:
    visible:
      id: 'strong-import-summary-nothing-new'
      text: 'Nothing new to import: all 387 workouts of this file are already in Gainalytics\.'
    timeout: 60000
- assertNotVisible:
    id: 'strong-import-confirm-button'
- tapOn:
    id: 'strong-import-cancel-button'
- extendedWaitUntil:
    notVisible:
      id: 'strong-import-summary-dialog'
    timeout: 10000

# The imported history is real data: the Analyse Dashboard of the formerly
# empty store names the baseline's last training day again.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible:
      id: 'analyse-stale-range-banner-text'
      text: 'No trainings in this period\. Your last training was on Sat, 28/02/26\.'
    timeout: 120000
- assertNotVisible:
    id: 'dashboard-empty-store'
