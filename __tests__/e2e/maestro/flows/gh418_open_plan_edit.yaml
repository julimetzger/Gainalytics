appId: com.powerliftingworkoutplanner
---
# GH-418 helper: open Micro 69 "Push" of plan 1 (PLANNED, training 282) in the
# full plan editor ("EDITING PLAN"). Precondition: baseline imported.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 15000
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 10000
# With a long training list the pager sits below the fold.
- scrollUntilVisible:
    element:
      text: 'Micro 69'
    direction: DOWN
    timeout: 15000
- tapOn:
    text: 'Micro 69'
- tapOn:
    text: 'Push'
- extendedWaitUntil:
    visible:
      id: 'header-overflow-icon'
    timeout: 15000
# The training opens on the Train sub-tab; the kebab only offers "Edit plan"
# on the Plan sub-tab (strip at y=11% on this device, Plan at x=17%).
# The pane is invisible to Maestro and the landing sub-tab varies, so retry the
# pair; a menu without "Edit plan" is dismissed by a tap on its scrim.
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible:
        id: 'overflow-edit-plan'
    commands:
      - tapOn:
          point: '17%,11%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: 'header-overflow-icon'
      - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible:
              id: 'overflow-edit-plan'
          commands:
            - tapOn:
                point: '50%,60%'
                retryTapIfNoChange: false
            - waitForAnimationToEnd
- tapOn:
    id: 'overflow-edit-plan'
- extendedWaitUntil:
    visible:
      id: 'header-plan-editing-kicker'
    timeout: 10000
