appId: com.powerliftingworkoutplanner
---
# TRN-004 (post-GH-225): Verify Training Home renders correctly after import.
#
# The original flow asserted `text: "Meso 1"` against a baseline import that
# does NOT contain mesos: every plan in `__tests__/testdata/1772318214222.gains`
# has `mesos: []`, so meso chips never render. The "Meso 1" assertion was a
# stale assumption from the early TRN-004 spec — the full meso create + verify
# flow is covered by `trn004_meso_create_verify.yaml` (which uses
# `clearState: true` and creates a meso from scratch).
#
# This flow now validates what the baseline actually proves:
#   1. After import, Training Home renders with the post-GH-204 testID
#   2. A known plan name from the baseline ("Push pull") is visible
#   3. The add-plan FAB exists (proves the dashboard finished rendering)
- launchApp:
    appId: com.powerliftingworkoutplanner
    clearState: false

- tapOn: "tab-training"

- extendedWaitUntil:
    visible:
      id: "training-home-screen"
    timeout: 60000

# Verify the imported baseline has at least one named plan visible.
- scrollUntilVisible:
    element:
      text: "Push pull"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Push pull"

# Confirm the "New Training" button to add a new plan is present (proves dashboard rendered fully).
# GH-518: "New Training" sits in the Plans header and scrolls with the list.
- scrollUntilVisible:
    element:
      id: "add-trainings-plan"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "add-trainings-plan"
