appId: com.powerliftingworkoutplanner
---
# GH-87: Verify video import card appears immediately and status transitions are visible.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 60000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
- assertVisible: "Import Emulator Squat Video"
# Tap import — this starts the import flow
- tapOn: "Import Emulator Squat Video"
# Handle permission dialogs if they appear
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
# CRITICAL: card must appear within 2 seconds of tapping import.
# The fix moved addVideoAnalysis() to be the first operation, so the card
# should be visible almost immediately after the tap.
- extendedWaitUntil:
    visible: "Analysis #1"
    timeout: 2000
# Verify that status shows an in-progress state (queued/copying/preflight)
# immediately after card appears — not stuck on empty list.
- assertVisible:
    id: "video-analysis-card-1"
# Verify import button is still visible (overlay already closed)
- assertVisible: "Import Emulator Squat Video"
# Wait for analysis to reach a terminal state or awaiting_seed_selection.
# The video will go through COPYING → PREFLIGHT → PROCESSING → DONE/AWAITING.
- extendedWaitUntil:
    visible: "Status: (done|awaiting_seed_selection|failed)"
    timeout: 300000
# Check final status is not unexpectedly left hanging in an import state
- assertNotVisible: "Status: queued"
- assertNotVisible: "Status: copying"
- assertNotVisible: "Status: preflight"
