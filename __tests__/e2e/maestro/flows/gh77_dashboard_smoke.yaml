appId: com.powerliftingworkoutplanner
---
# Navigate to Analyse tab and verify Dashboard is the initial screen
- launchApp
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000
- assertVisible:
    id: "dashboard-scroll"
- assertVisible:
    id: "weekly-summary-card"
- assertVisible: "Your Week at a Glance"
- assertVisible:
    id: "muscle-heatmap-card"
- assertVisible: "Muscle Groups"
# GH-367 scope guard: the in-training collapsible analysis sections must NOT appear on
# the global dashboard — its content stays exactly as it was before GH-367.
- assertNotVisible:
    id: "analysis-section-muscleMap"
- assertNotVisible:
    id: "analysis-section-metrics"
- assertNotVisible: "Metriken"
# NOTE: the old Quick Access row (nav-metrics/nav-history/nav-records) was removed from
# the dashboard by master's "Dashboard cleanup" commit (b95bc8c4), so this flow no
# longer asserts or taps nav-records.
- takeScreenshot: gh77_dashboard_unchanged
