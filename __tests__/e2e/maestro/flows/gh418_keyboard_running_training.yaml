appId: com.powerliftingworkoutplanner
---
# GH-418 — part 1 of the keyboard check in a RUNNING training, on the store of
# gh418_keyboard_short_plan.yaml (Micro 69 "Push" with two exercises): start the
# training and log sets until the set rows reach below the keyboard's top edge.
# Part 2 is __tests__/e2e/scripts/check-gh418-focused-field-above-keyboard.sh
# with --maestro-hierarchy (uiautomator cannot dump a running training).
- runFlow: gh466_goto_push.yaml
- runFlow:
    when:
      visible:
        id: 'header-plan-done-button'
    commands:
      - tapOn:
          id: 'header-plan-done-button'
- tapOn:
    id: 'subtab-train'
- waitForAnimationToEnd
# Start it unless an earlier run already did.
- runFlow:
    when:
      visible:
        id: 'train-tab-start-button'
    commands:
      - tapOn:
          id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'train-tab-finish-button'
    timeout: 15000
# The first exercise (Adductor) is prefilled with its planned sets: 13 and 12 reps.
- assertVisible:
    id: 'add-workout-set-reps-input-1'
    text: '13'
- assertVisible:
    id: 'add-workout-set-reps-input-2'
    text: '12'
# Log six sets (8 x 60): the first two fill the planned rows, the rest add rows,
# until the set rows reach below the keyboard's top edge — with only the planned
# rows everything fits above it.
# The header timer and, after the first set, the rest countdown tick every
# second, so the screen never "settles" — cap Maestro's settle wait per tap.
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'add-workout-set-reps-input'
          waitToSettleTimeoutMs: 500
      - inputText: '8'
      - tapOn:
          id: 'add-workout-set-weight-input'
          waitToSettleTimeoutMs: 500
      - inputText: '60'
      - tapOn:
          id: 'add-workout-set-submit-button'
          waitToSettleTimeoutMs: 500
# No hideKeyboard here: without an open keyboard it is a BACK and leaves the
# training. The check script closes the keyboard itself.
# Six logged rows now, all 8 reps.
- assertVisible:
    id: 'add-workout-set-reps-input-6'
    text: '8'
