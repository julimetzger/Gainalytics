appId: com.powerliftingworkoutplanner
---
# GH-221 smoke: verify weekday strip and segmented buttons are visible on TrainingHome.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- assertVisible:
    id: 'micro-hero-card'
- assertVisible:
    id: 'day-strip'
- assertVisible: 'Volume'
- assertVisible: 'Sets'
- assertVisible: 'Time'
- takeScreenshot: gh221_smoke_result
