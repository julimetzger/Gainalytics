appId: com.powerliftingworkoutplanner
---
# GH-518 helper: scroll the Training home to the end of the plan list (last plan card).
# LAST is the label of the last plan's star.
- scrollUntilVisible:
    element: '${LAST}'
    direction: DOWN
    timeout: 30000
- swipe:
    start: '50%, 70%'
    end: '50%, 20%'
- swipe:
    start: '50%, 70%'
    end: '50%, 20%'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '${LAST}'
