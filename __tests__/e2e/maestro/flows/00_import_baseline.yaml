appId: com.powerliftingworkoutplanner
---
- launchApp
- assertVisible: "Training"
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- tapOn:
    id: "settings-import-confirm-button"
- tapOn: "baseline.gains"
- assertVisible: "Import successful!"
