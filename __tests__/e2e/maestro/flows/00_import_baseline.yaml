appId: com.powerliftingworkoutplanner
---
- launchApp
# Dismiss React Native dev error overlay if it appears on startup after force-stop
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
# The import leaves the app on the Settings tab, and the bottom bar only renders a
# label for the ACTIVE tab — so waiting for the text "Training" here never resolves.
# Go back to the Training tab first, then wait for real imported content.
- extendedWaitUntil:
    visible: 'Import Data'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible: 'Push pull'
    timeout: 120000
