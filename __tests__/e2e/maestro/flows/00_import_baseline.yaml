appId: com.powerliftingworkoutplanner
---
- launchApp
# GH-589: a system ANR dialog on a loaded emulator (never the app's own).
- runFlow: dismiss_system_anr.yaml
# Dismiss React Native dev error overlay if it appears on startup after force-stop
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
# GH-497: an empty store (fresh install / clearState) opens the onboarding over the tabs.
- runFlow: gh497_dismiss_onboarding.yaml
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- extendedWaitUntil:
    visible: 'Import full data from backup file?'
    timeout: 10000
- tapOn: 'Import'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
# The SAF picker REMEMBERS its last folder (after a video import it reopens in a
# video folder where 'baseline.gains' never appears). Give the picker time to
# list the file; only if it is still missing, steer it to Downloads via its
# "Show roots" menu (an edge swipe would be the system BACK gesture).
- extendedWaitUntil:
    visible: 'baseline.gains'
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: 'baseline.gains'
    commands:
      - tapOn: 'Show roots'
      - extendedWaitUntil:
          visible: 'Downloads'
          timeout: 15000
      - tapOn: 'Downloads'
      - waitForAnimationToEnd:
          timeout: 8000
- scrollUntilVisible:
    element:
      text: 'baseline.gains'
    direction: DOWN
    timeout: 30000
- tapOn: 'baseline.gains'
# The import leaves the app on the Settings tab, and the bottom bar only renders a
# label for the ACTIVE tab — so waiting for the text "Training" here never resolves.
# Go back to the Training tab first, then wait for real imported content.
- extendedWaitUntil:
    visible: 'Import Data'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible: 'Push pull'
    timeout: 120000
# Value check: the imported current plan is the one on the dashboard.
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'
