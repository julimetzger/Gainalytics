appId: com.powerliftingworkoutplanner
---
# ANA-003-fix2 round-6: Prove marker at t=0:00 is NOT at data start.
# New formula: x = LEFT_PADDING + fraction * drawableWidth, clamped to [0, chartWidth].
# At t=0 with minTimeMs~5s: x ≈ 11px (in Y-axis area), NOT 48px (data start).
# Run WITHOUT --format junit to avoid TestSuiteInteractor gRPC disconnect issue.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Android App Compatibility"
    commands:
      - tapOn:
          text: "Don't Show Again"
- runFlow:
    when:
      visible: "Unable to load script"
    commands:
      - tapOn:
          text: "RELOAD"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 15000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- scrollUntilVisible:
    element:
      text: "Open"
    direction: DOWN
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 180000
# Scroll to Playback Overlay section
- scrollUntilVisible:
    element:
      text: "Playback Overlay"
    direction: DOWN
- swipe:
    start: "50%, 50%"
    end: "50%, 5%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 300
- swipe:
    start: "50%, 50%"
    end: "50%, 5%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 300
# Verify controls are in view
- assertVisible: "Bar v_y Over Time"
- assertVisible:
    text: "Playback: 00:00 / [0-9]{2}:[0-9]{2}"
- assertVisible: "Play"
# ── Screenshot A: t=0:00 — marker is in Y-axis area (left of data start), NOT at data start ──
# With new formula: x = 48 + (0 - minTimeMs)/durationMs * drawableWidth < 48 (left of data)
- takeScreenshot: "marker_r6_A_baseline_t0"
# ── Play briefly, then pause to capture marker moving into the data area ──
- tapOn: "Play"
- waitForAnimationToEnd:
    timeout: 7000
- tapOn: "Pause"
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: "video-analysis-speed-marker"
- takeScreenshot: "marker_r6_B_playing_early"
# ── Continue play to get marker further right ──
- tapOn: "Play"
- waitForAnimationToEnd:
    timeout: 20000
- tapOn: "Pause"
- waitForAnimationToEnd:
    timeout: 500
- takeScreenshot: "marker_r6_C_playing_mid"
