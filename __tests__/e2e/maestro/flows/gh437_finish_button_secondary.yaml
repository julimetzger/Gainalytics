appId: com.powerliftingworkoutplanner
---
# GH-437 — the "Finish Training" button carries the theme's SECONDARY colour.
#
# Colour is not readable from the accessibility tree, so this flow proves what
# Maestro CAN see: the button exists on the Train tab of a STARTED training,
# its label is unchanged, and tapping it still ends the session. The colour
# itself is verified per palette by checks/pixel_check.py against the screencaps
# in screenshots/, and by the jest specs.
#
# Navigation deliberately goes through the training home's next/continue card
# (`next-training-start-button`) rather than the plan drawer. The drawer route
# used by gh340_plan_kebab_start_training.yaml reopens itself on this emulator
# and occludes the sub-tab strip — that flow fails the same way on unmodified
# master, so it is not a usable path here (agent-memory).
#
# Prerequisite: baseline.gains imported — run through gh437_suite.yaml.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'plan-meta-1'
    direction: DOWN
- tapOn:
    id: 'plan-meta-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 15000
# The plan lands on micro 70 "Push" (FINISHED); step back to micro 69 "Push"
# (PLANNED, 11 exercises). Maestro's `text:` is a REGEX and matches substrings,
# so a bare "Push" also hits the header title "Push pull upper lower" and the
# drawer never gets the tap — anchor both selectors.
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      text: 'Micro 69'
    timeout: 10000
- tapOn:
    text: '^Micro 69$'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: '^Push$'
- waitForAnimationToEnd:
    timeout: 8000
# Picking the day calls setOpen(false), but the drawer sometimes lingers over
# the sub-tab strip. A swipe through the empty strip below the micro buttons
# clears it; an edge swipe would be eaten by the system back gesture and the
# hardware Back key pops the whole screen back to the training home.
- swipe:
    start: '74%,79%'
    end: '5%,79%'
- extendedWaitUntil:
    visible:
      id: 'subtab-train'
    timeout: 30000
- tapOn:
    id: 'subtab-train'
- extendedWaitUntil:
    visible:
      id: 'train-tab-start-button'
    timeout: 30000
- tapOn:
    id: 'train-tab-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 30000
# AC5: label and position unchanged. A literal id+text selector, not a bare
# visibility check — this fails if the recolour ever changed the wording.
# evalScript/assertTrue are avoided on purpose: on this Maestro build they are
# no-ops (agent-memory #371, #381).
- extendedWaitUntil:
    visible:
      id: 'train-tab-finish-button'
    timeout: 20000
- assertVisible:
    id: 'train-tab-finish-button'
    text: '^Finish Training$'
- takeScreenshot: gh437_finish_button_started
# AC5: the recolour must not touch behaviour. Tapping still ends the session —
# the app lands on the Analysis sub-tab, whose TrainingsOverview only renders
# for a FINISHED training, and the finish control is gone.
#
# Note: `header-session-timer` is NOT a valid "still running" probe — the header
# reuses that testID to show a finished training's total duration, so it stays
# visible after the tap.
- tapOn:
    id: 'train-tab-finish-button'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertNotVisible:
    id: 'train-tab-finish-button'
- assertVisible:
    id: 'trainings-overview-sets-value'
- takeScreenshot: gh437_after_finish_analysis
