appId: com.powerliftingworkoutplanner
---
# GH-206: VideoAnalysis tab search bar — exercise name and RIR filtering
# Prerequisites: baseline.gains with 3 analyses (Squat unlinked, Bankdrücken RIR=1, Squat RIR=1)
# imported before this flow runs.
- launchApp
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
# Navigate to Analyse tab → Video Analysis
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Dashboard'
    timeout: 30000
- tapOn:
    id: 'analyse-drawer-toggle'
- scrollUntilVisible:
    element:
      text: 'Video Analysis'
    direction: DOWN
    timeout: 15000
- tapOn: 'Video Analysis'
- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 30000

# (i) Full list visible — search bar present
- assertVisible: 'video-analysis-search-bar'
- assertVisible:
    text: '3 lifts'
- takeScreenshot: 'gh206_01_full_list'

# (ii) Typing 'Bank' filters to Bankdrücken analyses only
- tapOn: 'video-analysis-search-bar'
- inputText: 'Bank'
- extendedWaitUntil:
    visible: 'Bankdrücken'
    timeout: 10000
- assertVisible: 'Bankdrücken'
- assertVisible:
    text: '1 lift'
- takeScreenshot: 'gh206_02_filter_bank'

# (iii) Typing '1' filters to RIR-1 analyses (2 analyses linked to workouts with RIR=1)
- eraseText: 50
- inputText: '1'
- extendedWaitUntil:
    visible: 'Bankdrücken'
    timeout: 10000
- assertVisible:
    text: '2 lifts'
- takeScreenshot: 'gh206_03_filter_rir1'

# (iv) Combined 'Bank 1' — AND semantics: Bankdrücken AND RIR=1
- eraseText: 50
- inputText: 'Bank 1'
- extendedWaitUntil:
    visible: 'Bankdrücken'
    timeout: 10000
- assertVisible: 'Bankdrücken'
- assertVisible:
    text: '1 lift'
- takeScreenshot: 'gh206_04_filter_combined'

# (v) Clear search — full list restored
- tapOn: 'video-analysis-search-bar'
- eraseText: 50
- extendedWaitUntil:
    visible:
      text: '3 lifts'
    timeout: 10000
- assertVisible:
    text: '3 lifts'
- takeScreenshot: 'gh206_05_search_cleared'
