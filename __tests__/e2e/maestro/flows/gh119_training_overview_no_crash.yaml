appId: com.powerliftingworkoutplanner
---
# GH-119: TrainingsOverview must render without crashing when opening a
# FINISHED training. Before the fix, calculateMetricComparisons threw
# "workoutsCount is required for Metric.FREQUENCY" from inside the React
# render of TrainingsOverview and crashed the app. This flow imports the
# baseline fixture (which contains multiple FINISHED trainings), opens the
# most recent one, and verifies that the Duration / Volume / Sets overview
# cards are actually visible — i.e. the component rendered to completion.

- launchApp:
    clearState: false
# Dismiss a stale RN red box from a previous worker session, if any.
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000

# Import the baseline data so at least one FINISHED training exists.
- tapOn: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import-data-button'
    direction: DOWN
- tapOn:
    id: 'settings-import-data-button'
- tapOn:
    id: 'settings-import-confirm-button'
    optional: true
- tapOn: 'baseline.gains'
- extendedWaitUntil:
    visible: ".*Import successful.*"
    timeout: 60000

# Go to the training tab and open a plan that has all FINISHED trainings.
# "Push pull upper lower" has training 1 at its navigation micro in FINISHED
# state, so TrainingsPlanNode defaults to the Analysis sub-tab and renders
# TrainingsOverview without any extra navigation.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Push pull upper lower"
    direction: DOWN
- tapOn:
    text: "Push pull upper lower"

# Wait for the plan header to confirm the training screen loaded.
# The plan detail body (TrainingModeTabs + TrainingsOverview) is inside a
# RangeSwiper/GestureHandlerRootView which the Android accessibility API does
# not traverse — so we assert via the React Navigation header elements, which
# live outside that container.
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 30000
- assertVisible:
    id: 'header-plan-meso-name'

# Give React 3 s to finish rendering TrainingsOverview (and throw if it will).
- waitForAnimationToEnd

# If calculateMetricComparisons threw "workoutsCount is required for
# Metric.FREQUENCY", a RN dev red-box appears with a "Dismiss" button.
# Asserting it is NOT visible proves the crash did not fire.
- assertNotVisible: "Dismiss"

- takeScreenshot: gh119-training-overview-finished-no-crash

# Now verify the Analyse tab — the other crash site from release 0.160.
# DashboardTab calls calculateMetricComparisons per-exercise without a
# workoutsCount and used to crash the same way.
- tapOn: 'tab-analyse'
- extendedWaitUntil:
    visible: 'Analysis'
    timeout: 30000
- takeScreenshot: gh119-analyse-tab-no-crash
