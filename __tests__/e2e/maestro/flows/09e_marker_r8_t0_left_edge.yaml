appId: com.powerliftingworkoutplanner
---
# ANA-003-fix2 round-8: Verify marker at t=0:00 aligns with Y-axis line.
# viewPortOffsets.left=64 forces chart drawing area to start at x=64dp.
# SPEED_CHART_LEFT_PADDING=64 places the marker at x=64dp when t=0.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Android App Compatibility"
    commands:
      - tapOn:
          text: "Don't Show Again"
- runFlow:
    when:
      visible: "Unable to load script"
    commands:
      - tapOn:
          text: "RELOAD"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 15000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- scrollUntilVisible:
    element:
      text: "Open"
    direction: DOWN
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 180000
- scrollUntilVisible:
    element:
      id: "video-analysis-playback-toggle"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 500
- assertVisible: "Bar v_y Over Time"
- assertVisible:
    id: "video-analysis-playback-toggle"
- assertVisible:
    text: "Playback: 00:00 / 00:05"
- takeScreenshot: "marker_r8_t0_left_edge"
