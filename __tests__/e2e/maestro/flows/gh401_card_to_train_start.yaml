appId: com.powerliftingworkoutplanner
---
# GH-401 — the Next-Training card says what it does, and the Train tab is the one
# place a training is started AND finished.
#
# Covers acceptance criteria 1, 2, 3, 5, 6 and 7 of the ticket:
#   AC1  the card's button reads "Next Training" and opens the Train tab; it does
#        NOT start the training
#   AC2  "Start Training" no longer appears on the card/home flow (the one
#        remaining occurrence lives on the Train tab, which is not readable here —
#        the "exactly one" count is asserted in TrainingsPlanNode.spec.tsx)
#   AC3  the Train tab of a not-yet-started training has a primary "Start Training"
#        button that really starts it
#   AC5  a running session reads as running on the home screen
#   AC6  Card -> Train -> Start -> Continue -> FINISH needs no kebab menu
#   AC7  the running session survives a real process death losslessly
#
# Selector note: the training pane (sub-tab strip, Start/Finish buttons) is NOT
# exposed to the Android accessibility tree on this screen — see agent-memory
# #206. Everything inside it therefore has to be driven by position, with
# `retryTapIfNoChange: false` so Maestro does not silently double-tap a control
# whose effect it cannot observe (agent-memory #261). Every assertion below is
# made on something that IS readable — the card's testIDs and the header's
# state-dependent labels — and asserts a concrete value, never bare visibility.
#
# How the three training states are told apart from the readable header
# (TrainingsPlanHeader.tsx): PLANNED renders `header-plan-label` "Plan" and no
# timer; STARTED renders `header-session-timer` with a value that TICKS;
# FINISHED renders `header-session-timer` with a value that is FROZEN. A missed
# Finish tap therefore fails the flow instead of passing it.
#
# Prerequisite: baseline.gains imported, and the plan's next slot not yet started.
#
# `stopApp: false` on purpose. This is a debug build served by Metro, and on this
# multi-emulator host a cold JS bundle costs several minutes — long enough for
# system_server to ANR. The one force-stop this flow really needs is the AC7
# process-death check below, so the opening launch attaches to the app instead of
# paying that cost a second time.
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
# This host runs several emulators at once; under load Android puts up an
# "isn't responding" dialog that covers the screen and makes every following
# selector miss. Dismiss it rather than fail on it.
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 420000

# ---- AC1 / AC2: the card names its destination, not an action it does not do ----
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Next Training'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Next Training'
# The audit's headline finding: the most prominent button in the app said
# "Start Training" and started nothing.
- assertNotVisible: 'Start Training'
- assertNotVisible:
    id: 'next-training-elapsed'
- takeScreenshot: gh401_01_card_says_next_training

- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 120000
# Preparation, not an assertion. AC3 is about "the Train tab of a not-yet-STARTED
# training", so this flow needs a PLANNED training to start. A freshly imported
# baseline.gains has no training object in the plan's next slot at all (its last
# populated slot, micro 6 / D4, is FINISHED), and the Train tab then correctly
# shows this ticket's other H2 fix — "Nothing planned for this day yet." plus
# "Plan this Training" — instead of a Start button. So: if the header carries no
# "Plan" label, plan the slot first via the suggestion path. When the slot is
# already PLANNED the whole block is skipped.
- runFlow:
    when:
      notVisible:
        id: 'header-plan-label'
    commands:
      # Train tab -> "Plan this Training" -> the Plan tab's suggestion screen.
      - tapOn:
          point: '50%,24%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000
      # "Suggest based on last Training" creates the PLANNED training from the
      # previous one. The pane is invisible to Maestro so it cannot retry the tap
      # itself, and this emulator drops single taps (agent-memory #247/#262) —
      # hence an explicit retry guarded on the header label the tap produces.
      - repeat:
          times: 4
          while:
            notVisible:
              id: 'header-plan-label'
          commands:
            - tapOn:
                point: '50%,29%'
                retryTapIfNoChange: false
            - waitForAnimationToEnd:
                timeout: 20000
      # Creating the training flips its state, and a state change re-derives the
      # sub-tab from the new state — PLANNED opens the Plan tab. Go back to Train.
      - tapOn:
          point: '50%,14%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 15000

# Tapping the card must NOT have started anything. The header's "Plan" label is
# rendered only for a PLANNED training, and the session timer only while it is
# STARTED, so this pair is the durable proof that the card navigated and nothing
# else.
- assertVisible:
    id: 'header-plan-label'
    text: 'Plan'
- assertNotVisible:
    id: 'header-session-timer'
- takeScreenshot: gh401_02_train_tab_not_started

# ---- AC3: the Train tab's button is the control that really starts ----
# The card lands on the Train tab, so the Start button is already on screen.
- tapOn:
    point: '50%,21%'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 120000
# PLANNED -> STARTED: the "Plan" label is replaced by the running session timer.
- assertNotVisible:
    id: 'header-plan-label'
- copyTextFrom:
    id: 'header-session-timer'
- evalScript: |
    if (!/^\d{2}:\d{2}(:\d{2})?$/.test(maestro.copiedText)) {
      throw 'session timer is not a clock value after Start: ' + maestro.copiedText;
    }
- takeScreenshot: gh401_03_started_from_train_tab

# ---- AC5: the home screen shows the session as running ----
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Continue Training'
# The elapsed time must be shown and must actually be a clock value. Remember it
# so the process-death check below can prove the session kept its start time.
- copyTextFrom:
    id: 'next-training-elapsed'
- evalScript: |
    var m = /^(?:(\d+):)?(\d{1,2}):(\d{2})$/.exec(maestro.copiedText);
    if (!m) {
      throw 'elapsed time is not a MM:SS / H:MM:SS value: ' + maestro.copiedText;
    }
    output.elapsedBefore = (parseInt(m[1] || '0', 10) * 3600) + (parseInt(m[2], 10) * 60) + parseInt(m[3], 10);
- takeScreenshot: gh401_04_home_says_continue_training

# ---- AC7: a REAL process death must not cost the session ----
# `stopApp: true` force-stops the app before relaunching, so the JS runtime and
# every in-memory timer are genuinely gone; only persisted state can survive.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 420000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Continue Training'
# The elapsed value must have kept counting from the ORIGINAL start time. A
# session that restarted its clock (or lost it) would read lower, not higher.
- copyTextFrom:
    id: 'next-training-elapsed'
- evalScript: |
    var m = /^(?:(\d+):)?(\d{1,2}):(\d{2})$/.exec(maestro.copiedText);
    if (!m) {
      throw 'elapsed time lost after process death: ' + maestro.copiedText;
    }
    var after = (parseInt(m[1] || '0', 10) * 3600) + (parseInt(m[2], 10) * 60) + parseInt(m[3], 10);
    if (after < output.elapsedBefore) {
      throw 'session clock was reset by the process death: ' + after + 's < ' + output.elapsedBefore + 's';
    }
- takeScreenshot: gh401_05_home_running_after_process_death

# ---- AC6: continue and finish, without ever opening the kebab menu ----
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 120000
- takeScreenshot: gh401_06_resumed_session

# The Finish control sits below the set list on the Train tab of a STARTED
# training. It is the new control this ticket added; before GH-401 finishing was
# only reachable through the ⋮ overflow menu, which the audit found nobody
# discovers. 64% is where it lands for the training the preparation above builds
# — which is why that preparation, and the fresh baseline it starts from, are
# part of this flow's contract rather than an optional convenience.
- tapOn:
    point: '50%,64%'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 20000
# Named for what it actually captures: the Train tab right after the Finish tap.
# Finishing re-derives the sub-tab and lands on Analysis, but the pane is not in
# the accessibility tree, so there is nothing to wait on and the shot can catch
# the frame before that re-render. Treat it as context, not as proof.
- takeScreenshot: gh401_07_train_tab_after_finish_tap

# Do NOT try to tell STARTED from FINISHED here. Both render `header-session-timer`,
# and reading it twice looking for a frozen value is not a sound discriminator:
# consecutive reads can come from the same cached hierarchy and compare equal
# while the session is still very much running. That false pass is exactly how a
# missed Finish tap sneaks through. The durable proof is one screen away and is
# unambiguous — go and get it.
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 120000
# The home card is driven by persisted state: a still-running session reads
# "Training running" / "Continue Training" and carries an elapsed row. All three
# assertions below therefore fail loudly if the Finish tap missed its target.
- assertVisible:
    id: 'next-training-status-label'
    text: 'Next Training'
- assertVisible:
    id: 'next-training-start-button-text'
    text: 'Next Training'
- assertNotVisible:
    id: 'next-training-elapsed'
- takeScreenshot: gh401_08_home_after_finish
