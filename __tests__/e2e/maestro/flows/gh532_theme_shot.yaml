appId: com.powerliftingworkoutplanner
---
# GH-532: radar + selection strip under the current theme (env TAG names the
# screenshots). Needs the store of `gh532_this_week.gains`.
- runFlow: gh532_open_dashboard.yaml
- assertVisible: 'Back, 9 sets'
- scrollUntilVisible:
    element:
      id: 'muscle-chip-Glutes'
    direction: DOWN
- tapOn:
    id: 'muscle-chip-Back'
- assertVisible:
    id: 'muscle-chip-Back'
    selected: true
- takeScreenshot: gh532_theme_${TAG}_radar
- scrollUntilVisible:
    element:
      id: 'muscle-radar-tile-push-pull'
    direction: DOWN
- assertVisible:
    id: 'muscle-radar-selection-detail'
    text: '9 sets · 5\.7t · -2 sets vs last week'
- takeScreenshot: gh532_theme_${TAG}_strip
# Leave the label unselected for the next run.
- scrollUntilVisible:
    element:
      id: 'muscle-chip-Back'
    direction: UP
- tapOn:
    id: 'muscle-chip-Back'
