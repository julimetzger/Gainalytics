appId: com.powerliftingworkoutplanner
---
# GH-486 — deleting an exercise that the RUNNING training uses must not crash the
# app, and the training must stay openable, continuable and finishable.
#
# Flow: create two exercises → add both to the running training → log one set for
# the first one only → delete them in the Exercise tab (dialog says what goes with
# them; Cancel changes nothing) → reopen the training → finish it → open the
# finished training's Analysis and the Analyse tab.
#
# Self-contained: imports the baseline (a full import replaces the store, so the
# flow can be re-run), plans "Push squat" (Meso 1 · M7 · D1) from the last
# training — 10 exercises — and starts it. Exercise ids are deterministic on that
# fixture: its highest id is 84, so the two exercises created here are 85 and 86.
#
# The training pane is not in the accessibility tree (agent-memory #206/#412);
# only its touchables/TextInputs resolve, so the training is checked through the
# home card (`next-training-slot` carries the exercise count) and the header.
- runFlow: 00_import_baseline.yaml
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-name'
    text: 'Push squat'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 60000
# Train tab -> "Plan this Training" -> "Suggest based on last Training" -> Train tab -> Start.
- tapOn:
    point: '50%,24%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 4
    while:
      notVisible:
        id: 'header-plan-label'
    commands:
      - tapOn:
          point: '50%,29%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
- tapOn:
    point: '50%,14%'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 3
    while:
      notVisible:
        id: 'header-session-timer'
    commands:
      - tapOn:
          point: '50%,21%'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 30000
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-status-label'
    text: 'Training running'
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 10 exercises'

# ---- 1. create two exercises ----
- tapOn:
    point: '37%,92%'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000
- tapOn:
    id: 'exercise-fab-new'
- tapOn:
    id: 'edit-exercise-name'
- inputText: 'GH486 With sets'
- tapOn:
    id: 'edit-exercise-save'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000
- tapOn:
    id: 'exercise-fab-new'
- tapOn:
    id: 'edit-exercise-name'
- inputText: 'GH486 No sets'
- tapOn:
    id: 'edit-exercise-save'
- extendedWaitUntil:
    visible:
      id: 'exercise-fab-new'
    timeout: 30000

# ---- 2. add both to the running training ----
- tapOn:
    point: '12%,92%'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-start-button'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- repeat:
    times: 4
    while:
      notVisible:
        id: 'training-add-exercise-box'
    commands:
      - swipe:
          start: '90%,20%'
          end: '10%,20%'
          duration: 300
- tapOn:
    id: 'training-add-exercise-box'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 30000
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'GH486'
- extendedWaitUntil:
    visible: 'GH486 With sets'
    timeout: 20000
- tapOn:
    text: 'GH486 With sets'
    below:
      id: 'search-bar'
- waitForAnimationToEnd:
    timeout: 3000
# Re-tap only if the first tap was eaten by the keyboard (agent-memory #443): the
# count is unchanged AND the filtered row is still there. Selecting clears the
# search, so an unguarded re-tap would toggle whatever row is now at that spot.
- runFlow:
    when:
      notVisible: '11 selected'
      visible:
        text: 'GH486 With sets'
        below:
          id: 'search-bar'
    commands:
      - tapOn:
          text: 'GH486 With sets'
          below:
            id: 'search-bar'
          optional: true
- extendedWaitUntil:
    visible: '11 selected'
    timeout: 20000
- tapOn:
    id: 'search-bar'
- eraseText: 30
- inputText: 'GH486 No'
- extendedWaitUntil:
    visible: 'GH486 No sets'
    timeout: 20000
- tapOn:
    text: 'GH486 No sets'
    below:
      id: 'search-bar'
- waitForAnimationToEnd:
    timeout: 3000
# Re-tap only if the first tap was eaten by the keyboard (agent-memory #443): the
# count is unchanged AND the filtered row is still there. Selecting clears the
# search, so an unguarded re-tap would toggle whatever row is now at that spot.
- runFlow:
    when:
      notVisible: '12 selected'
      visible:
        text: 'GH486 No sets'
        below:
          id: 'search-bar'
    commands:
      - tapOn:
          text: 'GH486 No sets'
          below:
            id: 'search-bar'
          optional: true
- extendedWaitUntil:
    visible: '12 selected'
    timeout: 20000
- takeScreenshot: gh486_01_both_added_to_running_training
# One BACK closes keyboard and picker; the training stays open.
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 5000

# ---- 3. log exactly one set for "GH486 With sets" (id 85) ----
- repeat:
    times: 4
    while:
      notVisible:
        id: 'training-exercise-85'
    commands:
      - swipe:
          start: '90%,20%'
          end: '10%,20%'
          duration: 300
- tapOn:
    id: 'training-exercise-85'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'add-workout-set-reps-input'
    index: 0
- inputText: '6'
- tapOn:
    id: 'add-workout-set-weight-input'
    index: 0
- inputText: '40'
- tapOn:
    id: 'add-workout-set-submit-button'
- extendedWaitUntil:
    visible:
      id: 'add-workout-set-logged-1'
    timeout: 20000
- assertNotVisible:
    id: 'add-workout-set-logged-2'
- takeScreenshot: gh486_02_one_set_logged
- pressKey: Back
- runFlow:
    when:
      notVisible:
        id: 'training-home-screen'
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 12 exercises'

# ---- 4. delete "GH486 No sets" (no sets logged in the running training) ----
- tapOn:
    point: '37%,92%'
- tapOn:
    id: 'exercise-searchbar'
- eraseText: 30
- inputText: 'GH486'
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'exercise-row-86'
    timeout: 30000
- assertVisible:
    id: 'exercise-row-85'
- tapOn:
    id: 'exercise-row-86'
- tapOn:
    id: 'exercise-detail-edit-button'
- scrollUntilVisible:
    element:
      id: 'edit-exercise-delete'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'edit-exercise-delete'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-delete-running'
    timeout: 10000
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training and will be removed from it. No sets were logged for it there yet.'
- assertVisible:
    id: 'edit-exercise-delete-history'
    text: 'This will also delete 0 workouts from your history. This action cannot be undone.'
- takeScreenshot: gh486_03_dialog_no_sets
- tapOn:
    id: 'edit-exercise-delete-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'exercise-row-86'
    timeout: 20000

# ---- 5. delete "GH486 With sets": Cancel first, then confirm ----
- tapOn:
    id: 'exercise-row-85'
- tapOn:
    id: 'exercise-detail-edit-button'
- scrollUntilVisible:
    element:
      id: 'edit-exercise-delete'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'edit-exercise-delete'
- extendedWaitUntil:
    visible:
      id: 'edit-exercise-delete-running'
    timeout: 10000
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training. It will be removed from it, together with the 1 set you logged there.'
- assertVisible:
    id: 'edit-exercise-delete-history'
    text: 'This will also delete 1 workout \(1 set\) from your history. This action cannot be undone.'
- takeScreenshot: gh486_04_dialog_with_sets
- tapOn:
    id: 'edit-exercise-delete-cancel'
- assertNotVisible:
    id: 'edit-exercise-delete-running'
# Cancel changed nothing: the sheet is still open on the same exercise, and the
# dialog still reports the same logged set.
# (A Paper TextInput's value is not readable by Maestro — agent-memory #385 —
# so the sheet title is the proof.)
- assertVisible: 'Edit GH486 With sets'
- tapOn:
    id: 'edit-exercise-delete'
- assertVisible:
    id: 'edit-exercise-delete-running'
    text: 'It is part of your running training. It will be removed from it, together with the 1 set you logged there.'
- tapOn:
    id: 'edit-exercise-delete-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'exercise-row-85'
    timeout: 20000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_05_exercises_deleted_no_crash

# ---- 6. reopen the running training, continue, finish ----
- tapOn:
    point: '12%,92%'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'next-training-slot'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'next-training-slot'
    text: 'Meso 1 · M7 · D1 · 10 exercises'
- tapOn:
    id: 'next-training-start-button'
- extendedWaitUntil:
    visible:
      id: 'header-session-timer'
    timeout: 60000
- assertNotVisible: 'Render Error'
- assertNotVisible:
    id: 'training-exercise-85'
- tapOn:
    id: 'training-exercise-78'
    optional: true
- takeScreenshot: gh486_06_training_reopened
- tapOn:
    id: 'header-overflow-icon'
- tapOn:
    id: 'overflow-finish'
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_07_training_finished
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'last-training-card-pressable'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'last-training-card-pressable'
    text: 'Last Training, Push squat, Meso 1 · M7 · D1 · today.*'

# ---- 7. other views that reference the exercise ----
# The finished training's default tab is Analysis.
- tapOn:
    id: 'last-training-card-pressable'
- extendedWaitUntil:
    visible:
      id: 'header-plan-meso-name'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_08_finished_training_analysis
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 30000
- tapOn:
    point: '62%,92%'
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: 'Render Error'
- takeScreenshot: gh486_09_analyse_tab
