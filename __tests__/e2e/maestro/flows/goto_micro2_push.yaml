appId: com.powerliftingworkoutplanner
---
# GH-526 — open the analysis of Micro 2 · "Push squat" of the baseline plan
# "Push pull" (plan 5, Meso 1). Micro 2's Push squat is FINISHED, so the
# training opens on its Analysis sub-tab; Micro 1 holds its last matching
# training, which is what "vs last Push squat" compares against.
# Precondition: baseline fixture imported (00_import_baseline.yaml).
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- assertVisible: 'Micro 1'
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Micro 2'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- assertVisible: 'Micro 2'
- assertVisible: ' Push squat'
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
