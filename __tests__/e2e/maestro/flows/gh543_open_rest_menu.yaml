appId: com.powerliftingworkoutplanner
---
# GH-543 helper: reach a running rest timer and open its overflow menu.
# Precondition: baseline.gains imported (00_import_baseline.yaml).
# From the training home it opens the Next Training of the active plan
# ("Push pull" M6 "Push squat"), plans it from the last training if it is empty,
# starts it and logs one set so the rest timer starts. If the app is already on
# that running training (a previous run logged the set), it only opens the menu.
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible:
        id: 'add-workout-set-reps-input'
    commands:
      - tapOn: 'tab-training'
      - extendedWaitUntil:
          visible:
            id: 'training-home-screen'
          timeout: 30000
      - tapOn:
          id: 'next-training-start-button'
      - extendedWaitUntil:
          visible:
            id: 'drawer-menu-button'
          timeout: 30000
      - runFlow:
          when:
            visible: 'Plan this Training'
          commands:
            - tapOn: 'Plan this Training'
            - tapOn: '^Suggest based on last Training$'
            - tapOn:
                id: 'subtab-train'
      - runFlow:
          when:
            visible:
              id: 'train-tab-start-button'
          commands:
            - tapOn:
                id: 'train-tab-start-button'
      - extendedWaitUntil:
          visible:
            id: 'add-workout-set-reps-input'
          timeout: 15000
      - tapOn:
          id: 'add-workout-set-reps-input'
      - eraseText
      - inputText: '8'
      - tapOn:
          id: 'add-workout-set-weight-input'
      - eraseText
      - inputText: '95'
      - hideKeyboard
      # No hideKeyboard after submit: with the keyboard already closed it acts
      # as BACK and leaves the training screen.
      - tapOn:
          id: 'add-workout-set-submit-button'
      - waitForAnimationToEnd
- runFlow: gh543_tap_rest_overflow.yaml
- extendedWaitUntil:
    visible: 'Skip rest'
    timeout: 5000
