appId: com.powerliftingworkoutplanner
---
# GH-526 feedback — a training slot without its own name is labelled by its
# one-based position: the first training of "Push pull" reads "Training 1"
# (was "Training 2") in the chip and the comparison line.
# Run with the fixture whose plan "Push pull" has no name for position 1:
#   bash __tests__/e2e/scripts/run-maestro-from-wsl.sh --mode smoke --device <serial> \
#     --suite __tests__/e2e/maestro/flows/gh526_unnamed_training_suite.yaml \
#     --fixture __tests__/e2e/maestro/fixtures/gh526-unnamed-training.gains
- runFlow: 00_import_baseline.yaml
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Micro 2'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- assertVisible: ' Training 1'
- tapOn:
    id: 'analysis-data-train'
- assertVisible: 'vs last Training 1'
- assertNotVisible: 'vs last Training 2'
- tapOn:
    id: 'analysis-compare-last_training_done'
- assertVisible:
    id: 'analysis-comparison-line'
    text: 'Done vs Micro 1 · Training 1 \(done\) · Sun 18/01/2026'
