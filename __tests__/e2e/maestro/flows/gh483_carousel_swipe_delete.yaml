appId: com.powerliftingworkoutplanner
---
# GH-483: remove an exercise from the training carousel by pulling its tile down.
#
# Runs on a device with REAL user data (R5CN30HWZFN): every removal in here is undone
# again, the one exercise added for the "no logged sets" case is removed again, and the
# worker restores the store byte-for-byte from a backup afterwards.
#
# Data prerequisite (R5CN30HWZFN, 2026-10-11): Last Training is "Push pull › Meso 1 ·
# Micro 6 Pull" (FINISHED), carousel 29 Pull up | 84 Iso lateral front lat pulldown hs |
# 47 Chest supported row | 78 | 79 | 14 | 36 | 39, every exercise with logged sets
# (84: 2 sets). Adductor (32) is not part of it.
#
# env: SUFFIX — appended to every screenshot name (e.g. _dark / _light).
# The half-pulled state cannot be held by Maestro (a swipe always releases); it is
# captured by the worker's adb motionevent script next to this flow.
- runFlow: gh483/open_last_training_edit.yaml

# Baseline: 84 sits between 29 and 47 and carries its 2 logged sets.
- tapOn:
    id: 'training-exercise-84'
- assertVisible:
    id: 'planned-set-target-value'
    text: 'All 2 planned sets logged'
- assertVisible:
    id: 'training-exercise-84'
    rightOf:
      id: 'training-exercise-29'
    leftOf:
      id: 'training-exercise-47'
- assertNotVisible:
    id: 'training-exercise-delete-.*'
- takeScreenshot: gh483_01_rest${SUFFIX}

# AC1/AC2: pulled far enough the tile stays open with the ✕.
- swipe:
    from:
      id: 'training-exercise-84'
    direction: DOWN
- assertVisible:
    id: 'training-exercise-delete-84'
- takeScreenshot: gh483_02_open${SUFFIX}

# AC5: tap outside closes ...
- tapOn: 'Training Times'
- assertNotVisible:
    id: 'training-exercise-delete-84'
- assertVisible:
    id: 'training-exercise-84'
    rightOf:
      id: 'training-exercise-29'

# ... pushing the open tile back up closes ...
- swipe:
    from:
      id: 'training-exercise-84'
    direction: DOWN
- assertVisible:
    id: 'training-exercise-delete-84'
- swipe:
    from:
      id: 'training-exercise-84'
    direction: UP
- assertNotVisible:
    id: 'training-exercise-delete-84'

# ... and opening another tile closes the open one: never more than one open.
- swipe:
    from:
      id: 'training-exercise-84'
    direction: DOWN
- assertVisible:
    id: 'training-exercise-delete-84'
- swipe:
    from:
      id: 'training-exercise-47'
    direction: DOWN
- assertVisible:
    id: 'training-exercise-delete-47'
- assertNotVisible:
    id: 'training-exercise-delete-84'
- takeScreenshot: gh483_03_other_tile_open${SUFFIX}
- tapOn: 'Training Times'
- assertNotVisible:
    id: 'training-exercise-delete-47'

# AC4: exercise with logged sets asks first; Cancel changes nothing.
- swipe:
    from:
      id: 'training-exercise-84'
    direction: DOWN
- tapOn:
    id: 'training-exercise-delete-84'
- assertVisible:
    id: 'training-exercise-remove-dialog'
- assertVisible: 'Remove Iso lateral front lat pulldown hs\?'
- assertVisible: 'It already has 2 logged sets\..*'
- takeScreenshot: gh483_04_confirm_with_sets${SUFFIX}
- tapOn:
    id: 'training-exercise-remove-cancel'
- assertNotVisible:
    id: 'training-exercise-remove-dialog'
- assertVisible:
    id: 'training-exercise-84'
    rightOf:
      id: 'training-exercise-29'
    leftOf:
      id: 'training-exercise-47'
- assertNotVisible: '.* removed'

# AC3: ✕ -> Remove takes it out and offers Undo ...
- swipe:
    from:
      id: 'training-exercise-84'
    direction: DOWN
- tapOn:
    id: 'training-exercise-delete-84'
- tapOn:
    id: 'training-exercise-remove-confirm'
- assertVisible: 'Iso lateral front lat pulldown hs removed'
- assertNotVisible:
    id: 'training-exercise-84'
- assertVisible:
    id: 'training-exercise-47'
    rightOf:
      id: 'training-exercise-29'
- takeScreenshot: gh483_05_removed_snackbar${SUFFIX}
# ... and Undo puts it back at the same position with its sets.
- tapOn:
    id: 'training-exercise-undo'
- assertVisible:
    id: 'training-exercise-84'
    rightOf:
      id: 'training-exercise-29'
    leftOf:
      id: 'training-exercise-47'
- tapOn:
    id: 'training-exercise-84'
- assertVisible:
    id: 'planned-set-target-value'
    text: 'All 2 planned sets logged'
- takeScreenshot: gh483_06_after_undo${SUFFIX}

# AC6/AC8: right after an undo, select + horizontal scroll still work, and a second
# remove/undo round on another exercise leaves the list consistent.
- tapOn:
    id: 'training-exercise-47'
- swipe:
    from:
      id: 'training-exercise-47'
    direction: DOWN
- tapOn:
    id: 'training-exercise-delete-47'
- tapOn:
    id: 'training-exercise-remove-confirm'
- assertVisible: 'Chest supported row removed'
- tapOn:
    id: 'training-exercise-undo'
- assertVisible:
    id: 'training-exercise-47'
    rightOf:
      id: 'training-exercise-84'
- tapOn:
    id: 'training-exercise-29'
- assertVisible:
    id: 'planned-set-target-value'
    text: 'All 1 planned sets logged'
- swipe:
    from:
      id: 'training-exercise-78'
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: 'training-add-exercise-box'
    timeout: 5000
- assertNotVisible:
    id: 'training-exercise-delete-.*'

# AC7: the "+" tile does not react to a pull: no ✕, no picker.
- swipe:
    from:
      id: 'training-add-exercise-box'
    direction: DOWN
- assertNotVisible:
    id: 'training-exercise-delete-.*'
- assertNotVisible:
    id: 'search-bar'
- takeScreenshot: gh483_07_plus_tile_after_pull${SUFFIX}

# No logged sets -> no question: add Adductor, remove it directly, undo, remove again.
- tapOn:
    id: 'training-add-exercise-box'
- extendedWaitUntil:
    visible:
      id: 'search-bar'
    timeout: 5000
- tapOn:
    text: 'Adductor'
    below:
      id: 'search-bar'
# The open list hides the carousel from the hierarchy; hardware back closes it (GH-403).
- back
- runFlow:
    when:
      visible:
        id: 'search-bar'
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: 'search-bar'
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'training-exercise-32'
    timeout: 5000
- swipe:
    from:
      id: 'training-exercise-32'
    direction: DOWN
- tapOn:
    id: 'training-exercise-delete-32'
- assertNotVisible:
    id: 'training-exercise-remove-dialog'
- assertVisible: 'Adductor removed'
- assertNotVisible:
    id: 'training-exercise-32'
- takeScreenshot: gh483_08_no_sets_removed_directly${SUFFIX}
- tapOn:
    id: 'training-exercise-undo'
- assertVisible:
    id: 'training-exercise-32'
    rightOf:
      id: 'training-exercise-39'
- swipe:
    from:
      id: 'training-exercise-32'
    direction: DOWN
- tapOn:
    id: 'training-exercise-delete-32'
- assertVisible: 'Adductor removed'
- assertNotVisible:
    id: 'training-exercise-32'

# Same carousel on the Plan tab, where the page below is long enough to scroll: the pull
# must win against the page's vertical scroll.
- tapOn:
    id: 'subtab-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-read-exercise-header-84'
    timeout: 10000
- swipe:
    from:
      id: 'training-exercise-84'
    direction: DOWN
- assertVisible:
    id: 'training-exercise-delete-84'
- takeScreenshot: gh483_10_plan_tab_open${SUFFIX}
- tapOn:
    id: 'plan-read-exercise-header-47'
- assertNotVisible:
    id: 'training-exercise-delete-84'
- assertVisible:
    id: 'training-exercise-84'
    rightOf:
      id: 'training-exercise-29'
    leftOf:
      id: 'training-exercise-47'
