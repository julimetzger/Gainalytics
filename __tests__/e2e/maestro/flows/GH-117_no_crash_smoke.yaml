appId: com.powerliftingworkoutplanner
---
- launchApp
- extendedWaitUntil:
    visible: "Training"
    timeout: 60000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- tapOn: "tab-training"
- extendedWaitUntil:
    visible: "Training"
    timeout: 30000
- assertVisible:
    text: ".*Push pull.*"
- tapOn:
    text: ".*Push pull.*"
- extendedWaitUntil:
    visible: "Planning"
    timeout: 30000
- assertVisible: "Micro 1"
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
