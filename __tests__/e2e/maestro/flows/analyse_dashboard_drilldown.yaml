appId: com.powerliftingworkoutplanner
---
# Feature F7 Analyse tab - T7.1 Dashboard: stale week, muscle radar, drill-down.
#
# Purpose:
#   * GH-458 H5: the current week is empty on the baseline (last training
#     28/02/2026, the app runs months later). The Dashboard names the real last
#     training date instead of looking like a brand-new account.
#   * GH-532: an empty week still draws the radar (every axis 0, last week 0) and
#     the stat tiles show a dash instead of crashing. Sets/Volume toggle relabels
#     the radar.
#   * GH-458 H4 (+ round 3): a radar muscle -> Details opens Metrics Overview with
#     that muscle preselected (filter card reads `Quads`, never `All exercises`), without the
#     removed "Showing: ..." line; the selection survives a period swipe.
#   * "Show that period" opens Metrics Overview unfiltered.
#
# Data basis: READ-ONLY on the baseline import (fixtures/baseline.gains, current
#   plan "Push pull", last training Sat 28/02/26). Run 00_import_baseline.yaml
#   once before. The stale banner needs "today" to lie after the week of
#   28/02/2026, which is always true from now on.
#   Owner decision: no generated fixtures - the radar values of a NON-empty week
#   (old gh532_muscle_radar / gh532_this_week.gains) are deliberately dropped.
#
# Not assertable here: the Metrics Overview tables (MetricsNode lives in the
#   RangeSwiper gesture subtree, which is not in the accessibility tree) - their
#   units / whole counts are covered by __tests__/utils/metric-format.spec.ts and
#   MetricsOverviewForWorkouts.spec.tsx.
#
# Merged from: gh458_muscle_drilldown_and_units, gh458_round2_review_fixes,
#   gh458_round3_metrics_units, gh532_empty_week, gh532_open_dashboard
# Standalone / full suite: a COLD start. A resumed app keeps the Dashboard's
# scroll position and radar selection from an earlier visit (banner scrolled
# away, Quads already selected - tapping it again deselects it), seen when this
# flow ran twice in a row (GH-588).
# smoke.yaml passes ANALYSE_RESUME: 'true': there the Analyse tab was never
# opened since the import, so resuming is safe and skips the cold start.
# No header `env:` default here: it would override the caller's value.
- runFlow:
    when:
      true: ${typeof ANALYSE_RESUME === 'undefined' || ANALYSE_RESUME !== 'true'}
    commands:
      - launchApp:
          clearState: false
- runFlow:
    when:
      true: ${typeof ANALYSE_RESUME !== 'undefined' && ANALYSE_RESUME === 'true'}
    commands:
      - launchApp:
          clearState: false
          stopApp: false
- extendedWaitUntil:
    visible: 'tab-training'
    timeout: 120000

# ---------------------------------------------------------------- PRECONDITION
# The baseline store is loaded: its current plan is on the Training home.
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
# The resumed app keeps the previous flow's scroll position (home_dashboard ends
# at the plan list), so scroll back up to the hero first.
- scrollUntilVisible:
    element:
      id: 'micro-hero-plan-name'
    direction: UP
    timeout: 30000
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'

# ------------------------------------------------------------ open Dashboard
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
# The Analyse tab can resume on another drawer screen; go to the Dashboard then.
- runFlow:
    when:
      notVisible:
        id: 'dashboard-scroll'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'analyse-drawer-toggle'
          timeout: 30000
      - tapOn:
          id: 'analyse-drawer-toggle'
      - runFlow:
          when:
            notVisible: 'Close drawer'
          commands:
            - tapOn:
                id: 'analyse-drawer-toggle'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 15000
      - tapOn:
          text: '^Dashboard$'
          below:
            id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible:
      id: 'dashboard-scroll'
    timeout: 30000

# -------------------------------------------------- H5: the stale week banner
- extendedWaitUntil:
    visible:
      id: 'analyse-stale-range-banner-text'
    timeout: 15000
- assertVisible:
    id: 'analyse-stale-range-banner-text'
    text: 'No trainings in this period\. Your last training was on Sat, 28/02/26\.'
- assertVisible:
    id: 'analyse-stale-range-banner-action'
    text: 'Show that period'

# ------------------------------------------- GH-532: radar of an empty week
- scrollUntilVisible:
    element:
      id: 'muscle-chip-Back'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
# All 9 built-in muscles (baseline has no muscle settings), axis order of
# BUILT_IN_MUSCLES; this week AND last week are empty -> every value 0.
- assertVisible:
    id: 'muscle-radar-svg'
    text: 'Radar chart of sets per muscle group, this week vs last week\. Back 0 \(last week 0\), Biceps 0 \(last week 0\), Chest 0 \(last week 0\), Core 0 \(last week 0\), Glutes 0 \(last week 0\), Hamstrings 0 \(last week 0\), Quads 0 \(last week 0\), Shoulders 0 \(last week 0\), Triceps 0 \(last week 0\)'
- assertVisible: 'Back, 0 sets'
- assertVisible: 'Quads, 0 sets'
# Sets -> Volume relabels the radar (transition, not just visibility).
- tapOn:
    id: 'muscle-radar-metric-volume'
- assertVisible:
    id: 'muscle-radar-svg'
    text: 'Radar chart of volume per muscle group, this week vs last week\. Back 0\.0t \(last week 0\.0t\), .*Triceps 0\.0t \(last week 0\.0t\)'
- assertVisible: 'Back, 0\.0t'
- tapOn:
    id: 'muscle-radar-metric-sets'
- assertVisible: 'Back, 0 sets'

# The stat tiles show a dash for an empty week instead of crashing.
- scrollUntilVisible:
    element:
      id: 'muscle-radar-tile-push-pull-value'
    direction: DOWN
    centerElement: true
- assertVisible:
    id: 'muscle-radar-tile-most-trained-value'
    text: '–'
- assertVisible:
    id: 'muscle-radar-tile-lagging-value'
    text: '–'
- assertVisible:
    id: 'muscle-radar-tile-push-pull-value'
    text: '–'
- assertVisible: 'Tap a muscle group for details'

# ------------------------------------------- H4: Quads -> Details drill-down
- scrollUntilVisible:
    element:
      id: 'muscle-chip-Quads'
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-chip-Quads'
# GH-532: the radar label only selects; the selection strip names the muscle.
- scrollUntilVisible:
    element:
      id: 'muscle-radar-details-button'
    direction: DOWN
- assertVisible:
    id: 'muscle-radar-selection-name'
    text: 'Quads'
- assertVisible:
    id: 'muscle-radar-selection-detail'
    text: '0 sets · 0\.0t · 0 sets vs last week'
- assertNotVisible: 'Tap a muscle group for details'
- tapOn:
    id: 'muscle-radar-details-button'
- waitForAnimationToEnd
# Metrics Overview with the muscle preselected - the audit's failure was "0 selected"
# (GH-642: the filter card names the selection, "All exercises" when empty).
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'Quads'
    timeout: 60000
- assertVisible: 'Metrics Overview'
- assertNotVisible:
    id: 'filter-selection-summary'
    text: 'All exercises'
- assertNotVisible: 'Showing.*'
- assertNotVisible:
    id: 'analyse-error-boundary'

# Round 2/3: one period forward (leftward drag on the RangeSwiper - a gesture,
# so it needs coordinates). Only the range changes, the muscle stays selected.
- swipe:
    start: 90%, 45%
    end: 15%, 45%
- waitForAnimationToEnd
# Wait instead of asserting right after the gesture: the pane re-renders after
# the snap animation (SWIPE_SETTLE_MS) on a slow runner.
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'Quads'
    timeout: 15000
- assertNotVisible: 'Showing.*'

# ------------------------------ "Show that period": unfiltered Metrics Overview
- tapOn:
    id: 'analyse-drawer-toggle'
- runFlow:
    when:
      notVisible: 'Close drawer'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible: 'Close drawer'
    timeout: 15000
- tapOn:
    text: '^Dashboard$'
    below:
      id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible:
      id: 'analyse-stale-range-banner-action'
    timeout: 30000
- tapOn:
    id: 'analyse-stale-range-banner-action'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'filter-selection-summary'
      text: 'All exercises'
    timeout: 60000
- assertVisible: 'Metrics Overview'
- assertNotVisible:
    id: 'filter-selection-summary'
    text: 'Quads'
- assertNotVisible:
    id: 'analyse-error-boundary'
