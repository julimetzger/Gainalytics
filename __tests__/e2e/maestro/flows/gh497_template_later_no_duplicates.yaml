appId: com.powerliftingworkoutplanner
---
# GH-497: with existing data (baseline.gains imported: Squat id 2 with a 225 kg 1RM,
# highest exercise id 84, plans 1–5), "New Training" → "From template" creates a normal
# plan. Same-named exercises are reused (Squat = 2), missing ones are created once
# (Bench Press 85, Leg Curls 86, Row 87) — the second plan from the same template
# references exactly the same ids, so nothing is duplicated. Squat weights are
# suggested from the 1RM: 4 × 6 @ RIR 3 → 225 / (1 + 9/30) = 173 → 172.5 kg.
- launchApp:
    stopApp: false
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 120000
- assertNotVisible:
    id: 'onboarding-screen'

# First plan from the template
- tapOn:
    id: 'add-trainings-plan'
- tapOn:
    id: 'plan-source-template'
- tapOn:
    id: 'program-template-strength-block'
- assertVisible:
    id: 'plan-name-input'
    text: 'Strength Block'
- takeScreenshot: gh497_later_01_dialog_from_template
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    notVisible: 'Add New Training Plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'meso-card-6-1'
    direction: DOWN
- assertVisible:
    id: 'plan-name-6'
    text: 'Strength Block'
- assertVisible:
    id: 'plan-meta-6'
    text: 'Draft · planned, not started'
- takeScreenshot: gh497_later_02_plan_in_list
- tapOn:
    id: 'meso-card-6-1'
- extendedWaitUntil:
    visible:
      id: 'training-exercise-2'
    timeout: 20000
- assertVisible:
    id: 'training-exercise-85'
- assertVisible:
    id: 'training-exercise-86'
- assertVisible:
    id: 'training-exercise-87'
- runFlow:
    when:
      notVisible: '4 sets'
    commands:
      - tapOn:
          id: 'subtab-plan'
- extendedWaitUntil:
    visible: '4 sets'
    timeout: 10000
- assertVisible: '172.5'
- takeScreenshot: gh497_later_03_reused_exercises_and_1rm_weights

# Second plan from the same template, renamed
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 15000
- tapOn:
    id: 'add-trainings-plan'
- tapOn:
    id: 'plan-name-input'
- inputText: 'Strength Block 2'
- tapOn:
    id: 'plan-source-template'
- tapOn:
    id: 'program-template-strength-block'
# A typed name is kept when a template is picked.
- assertVisible:
    id: 'plan-name-input'
    text: 'Strength Block 2'
- tapOn:
    id: 'confirm-trainings-plan'
- extendedWaitUntil:
    notVisible: 'Add New Training Plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'meso-card-7-1'
    direction: DOWN
- assertVisible:
    id: 'plan-name-7'
    text: 'Strength Block 2'
- tapOn:
    id: 'meso-card-7-1'
- extendedWaitUntil:
    visible:
      id: 'training-exercise-2'
    timeout: 20000
- assertVisible:
    id: 'training-exercise-85'
- assertVisible:
    id: 'training-exercise-86'
- assertVisible:
    id: 'training-exercise-87'
- assertVisible: 'Strength Block 2.*'
- takeScreenshot: gh497_later_04_second_plan_same_exercise_ids
