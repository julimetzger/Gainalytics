appId: com.powerliftingworkoutplanner
---
- launchApp:
    clearState: true
# Dismiss Android App Compatibility dialog if it appears
- runFlow:
    when:
      visible: "Android App Compatibility"
    commands:
      - tapOn:
          text: "Don't Show Again"
# Reload if Metro connection error dialog appears
- runFlow:
    when:
      visible: "Unable to load script"
    commands:
      - tapOn:
          text: "RELOAD"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "Unable to load script"
    commands:
      - tapOn:
          point: "50%,90%"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
- tapOn: "Import Emulator Squat Video"
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
- extendedWaitUntil:
    visible: "Analysis #[0-9]+"
    timeout: 30000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: (done|awaiting_seed_selection)"
    timeout: 180000
- runFlow:
    when:
      visible: "Status: awaiting_seed_selection"
    commands:
      - scrollUntilVisible:
          element:
            id: "video-analysis-seed-candidate-1"
          direction: DOWN
      - tapOn:
          id: "video-analysis-seed-candidate-1"
      - tapOn:
          id: "video-analysis-manual-seed-run"
      - scrollUntilVisible:
          element:
            id: "video-analysis-detail-status"
          direction: UP
      - extendedWaitUntil:
          visible: "Status: done"
          timeout: 180000
- scrollUntilVisible:
    element:
      id: "video-analysis-step-minus200"
    direction: DOWN
# Assert all four step buttons are visible
- assertVisible:
    id: "video-analysis-step-minus200"
- assertVisible:
    id: "video-analysis-step-minus50"
- assertVisible:
    id: "video-analysis-step-plus50"
- assertVisible:
    id: "video-analysis-step-plus200"
- assertVisible:
    text: "-0.2s"
- assertVisible:
    text: "-0.05s"
- assertVisible:
    text: "+0.05s"
- assertVisible:
    text: "+0.2s"
# Advance playback by pressing play briefly, then pause to get a non-zero time
- scrollUntilVisible:
    element:
      id: "video-analysis-playback-toggle"
    direction: UP
- tapOn:
    id: "video-analysis-playback-toggle"
- extendedWaitUntil:
    visible:
      id: "video-analysis-playback-scrubber"
    timeout: 30000
- tapOn:
    id: "video-analysis-playback-toggle"
# Capture time before stepping
- copyTextFrom:
    id: "video-analysis-playback-time"
- evalScript: |
    output.timeBefore = output.value;
# Press +0.2s step button and verify time updates
- scrollUntilVisible:
    element:
      id: "video-analysis-step-plus200"
    direction: DOWN
- tapOn:
    id: "video-analysis-step-plus200"
# Allow a brief render cycle
- waitForAnimationToEnd:
    timeout: 500
- copyTextFrom:
    id: "video-analysis-playback-time"
- evalScript: |
    var before = output.timeBefore;
    var after = output.value;
    // After pressing +0.2s the displayed time should be >= the time before
    output.valid = (after !== undefined && before !== undefined && typeof after === 'string');
- assertTrue: ${valid}
# Press -0.2s step button — result must be a valid time string
- tapOn:
    id: "video-analysis-step-minus200"
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: "video-analysis-playback-scrubber"
# Screenshot showing step buttons and current playback time
- takeScreenshot: "step_buttons_result"
