appId: com.powerliftingworkoutplanner
---
# ANA-007 round-2 review: verify speed control fixes
# - Label shows "Speed: X.Xx" prefix (no duplicate-looking 0.1x)
# - 0.75x shows "Speed: 0.75x" not "Speed: 0.8x"
# - Speed control visible below step buttons
- launchApp:
    clearState: true
# Handle Metro error on startup
- runFlow:
    when:
      visible: "Unable to load script"
    commands:
      - tapOn:
          text: "RELOAD"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "Training"
    timeout: 30000
# Import baseline fixture
- tapOn: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-import-data-button"
    direction: DOWN
- tapOn:
    id: "settings-import-data-button"
- extendedWaitUntil:
    visible: "Import full data from backup file?"
    timeout: 10000
- tapOn: "Import"
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- scrollUntilVisible:
    element:
      text: "baseline.gains"
    direction: DOWN
    timeout: 30000
- tapOn: "baseline.gains"
- extendedWaitUntil:
    visible: "Training"
    timeout: 120000
# Navigate to Analyse > Video Analyses
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
# Import video from emulator storage
- tapOn: "Import Emulator Squat Video"
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
- extendedWaitUntil:
    visible: "Analysis #[0-9]+"
    timeout: 60000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: (done|awaiting_seed_selection)"
    timeout: 180000
- runFlow:
    when:
      visible: "Status: awaiting_seed_selection"
    commands:
      - scrollUntilVisible:
          element:
            id: "video-analysis-seed-candidate-1"
          direction: DOWN
      - tapOn:
          id: "video-analysis-seed-candidate-1"
      - tapOn:
          id: "video-analysis-manual-seed-run"
      - scrollUntilVisible:
          element:
            id: "video-analysis-detail-status"
          direction: UP
      - extendedWaitUntil:
          visible: "Status: done"
          timeout: 180000
# Scroll to speed control (below step buttons)
- scrollUntilVisible:
    element:
      id: "video-analysis-speed-control"
    direction: DOWN
# ASSERT 1: Speed control is visible
- assertVisible:
    id: "video-analysis-speed-control"
# ASSERT 2: Default label shows "Speed: 1.0x" (with prefix, not just "1.0x")
- assertVisible:
    text: "Speed: 1.0x"
# ASSERT 3: All speed buttons present
- assertVisible:
    id: "video-analysis-speed-btn-0.1"
- assertVisible:
    id: "video-analysis-speed-btn-0.75"
- assertVisible:
    id: "video-analysis-speed-btn-1.0"
- takeScreenshot: "r2_speed_default_1x"
# ASSERT 4: Tap 0.75x — label must show "Speed: 0.75x" not "Speed: 0.8x"
- tapOn:
    id: "video-analysis-speed-btn-0.75"
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    text: "Speed: 0.75x"
- takeScreenshot: "r2_speed_075x_exact"
# ASSERT 5: Tap 0.1x — label must show "Speed: 0.1x"
- tapOn:
    id: "video-analysis-speed-btn-0.1"
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    text: "Speed: 0.1x"
- takeScreenshot: "r2_speed_01x"
