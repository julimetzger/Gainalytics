appId: com.powerliftingworkoutplanner
---
# Feature F8 Video analysis - T8.1 import, analysis (incl. resume), playback.
#
# Purpose:
#   * GH-396: a video is imported through the system picker, the analysis runs in
#     the background and survives the user pressing Home + resuming the app
#     (`stopApp: false` - a force-stop would mark it FAILED via
#     RECOVER_STALE_VIDEO_ANALYSES, which is exactly the regression).
#   * GH-312: the finished analysis of the 3-rep clip shows "Rep Summary (3 reps)".
#   * GH-321: a picker-imported video is gallery-backed ("Secure video in app");
#     securing it switches to "Video secured in app" and it still plays.
#   * GH-439 / GH-177: rep + velocity readout follow continuous playback (values
#     sampled and asserted to CHANGE, never pinned to a device value).
#   * GH-351: a tap on the speed chart seeks and re-binds the velocity readout.
#
# Data basis: MUTATES the store -> starts with 00_import_baseline.yaml.
#   The baseline ships exactly ONE analysis (id 1, no local video), so the clip
#   imported here deterministically becomes analysis id 2 (nextAnalysisId = max+1).
#   Push beforehand to /sdcard/Download (the runner's bootstrap does both):
#     fixtures/baseline.gains -> /sdcard/Download/baseline.gains
#     fixtures/squat-3reps.mp4 -> /sdcard/Download/squat-3reps.mp4
#   Timeout: the analysis itself may take up to ~10 min on an emulator.
#
# Merged from: gh396_api36_video_import (base), gh396_api36_video_resume,
#   gh312_v6_rep_summary_evidence, gh321_gallery_backed_playback,
#   gh439_open_playback_overlay, gh439_playback_velocity_live,
#   gh351_seek_readout_evidence, gh177_playback_evidence
- runFlow: 00_import_baseline.yaml

# ---------------------------------------------------------------- PRECONDITION
- assertVisible:
    id: 'micro-hero-plan-name'
    text: 'Push pull'

# ------------------------------------------------ open the Video Analysis list
- tapOn: 'tab-analyse'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'analyse-drawer-toggle'
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: 'video-analysis-import-button'
    commands:
      - tapOn:
          id: 'analyse-drawer-toggle'
      # The first toggle tap after a FULL_IMPORT is often swallowed; on some
      # emulators the id tap never opens the drawer at all -> tap the hamburger's
      # pixel (top-left header) as the documented fallback.
      - runFlow:
          when:
            notVisible: 'Close drawer'
          commands:
            - tapOn:
                point: '6%,9%'
      - extendedWaitUntil:
          visible: 'Close drawer'
          timeout: 15000
      - tapOn:
          text: '^Video Analysis$'
          below:
            id: 'analyse-drawer-toggle'
- extendedWaitUntil:
    visible:
      id: 'video-analysis-row-1'
    timeout: 60000
# Start state: only the baseline analysis, no analysis #2 yet.
- assertVisible:
    id: 'video-analysis-lift-count'
    text: '1 lift'
- assertNotVisible:
    id: 'video-analysis-row-2'

# ------------------------------------------- import squat-3reps.mp4 (picker)
- tapOn:
    id: 'video-analysis-import-button'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- waitForAnimationToEnd:
    timeout: 8000
# The SAF picker remembers its last folder -> steer it to Downloads via
# "Show roots" (an edge swipe is the system BACK gesture), only when the clip
# is not listed after the picker had time to load.
- extendedWaitUntil:
    visible: 'squat-3reps.mp4'
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: 'squat-3reps.mp4'
    commands:
      - tapOn: 'Show roots'
      - extendedWaitUntil:
          visible: 'Downloads'
          timeout: 15000
      - tapOn: 'Downloads'
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible: 'squat-3reps.mp4'
    timeout: 30000
- tapOn: 'squat-3reps.mp4'
# The new analysis row appears and the counter moves 1 -> 2.
- extendedWaitUntil:
    visible:
      id: 'video-analysis-row-2'
    timeout: 60000
- assertVisible:
    id: 'video-analysis-lift-count'
    text: '2 lifts'

# --------------------------------- GH-396: background (Home) + resume the task
- pressKey: HOME
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'video-analysis-row-2'
    timeout: 120000
- tapOn:
    id: 'video-analysis-row-2'
- extendedWaitUntil:
    visible:
      id: 'video-analysis-detail-screen'
    timeout: 30000
# The analysis must finish (not FAILED by a restart, not stuck in seed selection).
- extendedWaitUntil:
    visible:
      id: 'video-analysis-detail-status'
      text: 'Status: done'
    timeout: 600000
- assertVisible:
    id: 'video-analysis-detail-status'
    text: 'Status: done'
- assertNotVisible: 'Error: .*'
- assertNotVisible: '.*App was closed while import or analysis was running.*'
# The clip is not linked to a set -> the detail header falls back to this label.
- assertVisible: 'Unlinked analysis'

# ------------------------------- GH-321: gallery-backed -> secured in the app
- assertVisible:
    id: 'video-analysis-secure-video-button'
    text: 'Secure video in app'
- assertVisible:
    id: 'video-analysis-secure-video-hint'
    text: 'Saves the video into the app. It will then be kept, even if you delete it from the gallery.'
- tapOn:
    id: 'video-analysis-secure-video-button'
- extendedWaitUntil:
    visible:
      id: 'video-analysis-secure-video-button'
      text: 'Video secured in app'
    timeout: 60000
- assertVisible:
    id: 'video-analysis-secure-video-hint'
    text: 'This video is stored in the app and will be kept, even if you delete it from the gallery.'
- assertNotVisible:
    id: 'video-analysis-source-unavailable'

# ------------------------------------------- GH-312: Rep Summary (3 reps)
# Edge swipes: centred gestures are eaten by the player / speed chart.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'video-analysis-rep-summary'
    commands:
      - swipe:
          start: '97%, 80%'
          end: '97%, 35%'
          duration: 1500
- assertVisible: 'Rep Summary \(3 reps\)'
- assertVisible:
    id: 'video-analysis-rep-metric-2'
- assertNotVisible:
    id: 'video-analysis-rep-metric-3'
- assertVisible:
    id: 'video-analysis-rep-time-0'
    text: '[0-9]+\.[0-9]{2}s'

# --------------------------- playback at 0.5x (clip lasts ~20 s of wall time)
- repeat:
    times: 4
    while:
      notVisible:
        id: 'video-analysis-speed-label'
    commands:
      - swipe:
          start: '97%, 35%'
          end: '97%, 80%'
          duration: 1500
- assertVisible:
    id: 'video-analysis-speed-label'
    text: 'Speed: 1\.0x'
- tapOn:
    id: 'video-analysis-speed-btn-0.5'
- assertVisible:
    id: 'video-analysis-speed-label'
    text: 'Speed: 0\.5x'
# Bring the player controls + readout into view.
- repeat:
    times: 4
    while:
      notVisible:
        id: 'video-analysis-playback-toggle'
    commands:
      - swipe:
          start: '97%, 35%'
          end: '97%, 80%'
          duration: 1500
- waitForAnimationToEnd
- assertVisible:
    id: 'video-analysis-playback-player'

# GH-351: paused at t=0, a tap on the speed chart seeks (centre = mid timeline)
# and the velocity readout re-binds to a real, different value.
- copyTextFrom:
    id: 'video-analysis-playback-current-velocity'
- evalScript: "${output.v0 = maestro.copiedText}"
- tapOn:
    id: 'video-analysis-playback-speed-chart'
- waitForAnimationToEnd:
    timeout: 3000
- copyTextFrom:
    id: 'video-analysis-playback-current-velocity'
- evalScript: "${output.vSeek = maestro.copiedText}"
- assertTrue: "${/^-?[0-9]+([.][0-9]{3} m| px)[/]s$/.test(output.vSeek) && output.vSeek != output.v0}"

# GH-439 / GH-177: play; sample rep + velocity twice during one continuous run.
- tapOn:
    id: 'video-analysis-playback-toggle'
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- copyTextFrom:
    id: 'video-analysis-playback-current-rep'
- evalScript: "${output.r1 = maestro.copiedText}"
- copyTextFrom:
    id: 'video-analysis-playback-current-velocity'
- evalScript: "${output.v1 = maestro.copiedText}"
- assertTrue: "${/^(Rep [1-3]|-)$/.test(output.r1) && /^-?[0-9]+([.][0-9]{3} m| px)[/]s$/.test(output.v1) && output.v1 != output.vSeek}"
- waitForAnimationToEnd:
    timeout: 3000
- copyTextFrom:
    id: 'video-analysis-playback-current-rep'
- evalScript: "${output.r2 = maestro.copiedText}"
- copyTextFrom:
    id: 'video-analysis-playback-current-velocity'
- evalScript: "${output.v2 = maestro.copiedText}"
# A frozen velocity next to running playback fails here (the GH-439 bug).
- assertTrue: "${/^(Rep [1-3]|-)$/.test(output.r2) && /^-?[0-9]+([.][0-9]{3} m| px)[/]s$/.test(output.v2) && output.v2 != output.v1}"
# At least one sample landed inside a rep (3 reps over the 10 s clip).
- assertTrue: "${/^Rep [1-3]$/.test(output.r1) || /^Rep [1-3]$/.test(output.r2)}"
- tapOn:
    id: 'video-analysis-playback-toggle'
    waitToSettleTimeoutMs: 500
