appId: com.powerliftingworkoutplanner
name: GH-366 Settings app version
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "tab-settings"
    timeout: 60000
- tapOn:
    text: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-app-version"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "settings-app-version"
    text: "Version 0.168"
