appId: com.powerliftingworkoutplanner
---
# GH-444 — the analysis of ONE training can be compared against the plan of that
# very training. Subject stays the logged load, the reference becomes what this
# training was planned to be.
#
# Precondition: baseline fixture imported (run 00_import_baseline.yaml first —
# --fixture only pushes the file, it does not import it). Plan 5 "Push pull".
#
# Deterministic fixture values, all derived from baseline.gains:
#   micro 1 · training 1 "Push squat" — 14 logged sets; its only planned exercise
#     ("Adductor") carries no muscle taxonomy, so NOTHING is planned for the muscle
#     map -> the new option must be visible but not selectable.
#   micro 2 · training 1 "Push squat" — 17 logged sets, 14 planned sets:
#     sets    Core  2.9 / 0.6   Chest 4 / 3      (whole micro would say Core 2.9/4.2)
#     volume  Core  3.1t / 0.7t Glutes 3.8t/2.8t (whole micro would say Core 3.1t/3.6t)
#   The "Ist" value is identical under both references and only the "Soll" changes —
#   that is the proof the new reference is this training's plan and nothing wider.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Dismiss'
    commands:
      - tapOn: 'Dismiss'
- extendedWaitUntil:
    visible: 'Training'
    timeout: 120000
- tapOn: 'tab-training'
- extendedWaitUntil:
    visible:
      id: 'training-home-screen'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'meso-card-5-1'
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'drawer-menu-button'
    timeout: 30000
# the meso card lands on the plan screen while it is still transitioning — every
# drawer tap below needs the screen settled first, or it hits nothing at all
- extendedWaitUntil:
    visible:
      id: 'subtab-analysis'
    timeout: 30000
- waitForAnimationToEnd

# --- land deterministically on micro 1, training 1 ("Push squat") ---------------
- runFlow:
    when:
      notVisible: 'Micro 1'
    commands:
      - tapOn:
          id: 'drawer-menu-button'
      - extendedWaitUntil:
          visible: 'Mesos:'
          timeout: 20000
      - tapOn:
          id: 'drawer-meso-name-1'
      - extendedWaitUntil:
          visible:
            id: 'subtab-analysis'
          timeout: 30000
      - waitForAnimationToEnd
- assertVisible: 'Micro 1'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Trainings:'
    timeout: 20000
- tapOn: 'Push squat'
- extendedWaitUntil:
    visible:
      id: 'subtab-analysis'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'subtab-analysis'
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 14 \(done\)'
# the muscle map section is collapsible and its state is persisted — open it if needed
- runFlow:
    when:
      notVisible:
        id: 'muscle-involvement-card-analyse'
    commands:
      - scrollUntilVisible:
          element:
            id: 'analysis-section-muscleMap-header'
          direction: DOWN
          timeout: 30000
      - waitForAnimationToEnd
      - tapOn:
          id: 'analysis-section-muscleMap-header'
      - extendedWaitUntil:
          visible:
            id: 'muscle-involvement-card-analyse'
          timeout: 10000
- scrollUntilVisible:
    element:
      id: 'muscle-map-compare-chip-analyse'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd

# --- AC4: nothing was planned for this training -> the option is NOT selectable --
# Metric and compare choice are both persisted, so start from known ones instead
# of from whatever the previous run left behind.
- tapOn:
    id: 'muscle-map-metric-chip'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-metric-chip-option-sets'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-metric-chip-option-sets'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-metric-chip-option-sets'
    timeout: 10000
- tapOn:
    id: 'muscle-map-compare-chip-analyse'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-analyse-option-current_total_plan'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip-analyse-option-current_total_plan'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-analyse-option-current_total_plan'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'Current micro plan'
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '0.6/3.6'}"
# nothing is planned for this training, so the new option is rendered dead
- tapOn:
    id: 'muscle-map-compare-chip-analyse'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: "This training's plan"
- takeScreenshot: gh444_option_disabled_micro1
- tapOn:
    id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
- waitForAnimationToEnd
# The item is disabled, so the tap is not a selection — it falls through to the
# menu's backdrop and only dismisses it. Close the menu if it is somehow still up,
# then prove the comparison did not change at all.
- runFlow:
    when:
      visible:
        id: 'muscle-map-compare-chip-analyse-option-none'
    commands:
      - tapOn:
          id: 'muscle-map-compare-chip-analyse-option-current_total_plan'
      - extendedWaitUntil:
          notVisible:
            id: 'muscle-map-compare-chip-analyse-option-current_total_plan'
          timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'Current micro plan'
- assertNotVisible:
    id: 'muscle-map-compare-label'
    text: "This training's plan"
# still the micro's plan as the target (Core 0.6 done of 3.6 planned in micro 1),
# not a reference layer of zeros
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '0.6/3.6'}"

# --- micro 2, training 1: the same training has a real plan ---------------------
- waitForAnimationToEnd
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible: 'Mesos:'
    timeout: 20000
- tapOn: 'Micro 2'
- tapOn:
    id: 'drawer-menu-button'
- extendedWaitUntil:
    visible:
      id: 'analysis-data-toggle'
    timeout: 30000
- assertVisible: 'Micro 2'
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- assertVisible:
    id: 'analysis-total-sets'
    text: 'Total Sets: 17 \(done\)'
- runFlow:
    when:
      notVisible:
        id: 'muscle-involvement-card-analyse'
    commands:
      - scrollUntilVisible:
          element:
            id: 'analysis-section-muscleMap-header'
          direction: DOWN
          timeout: 30000
      - waitForAnimationToEnd
      - tapOn:
          id: 'analysis-section-muscleMap-header'
      - extendedWaitUntil:
          visible:
            id: 'muscle-involvement-card-analyse'
          timeout: 10000
- scrollUntilVisible:
    element:
      id: 'muscle-map-compare-chip-analyse'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd

# reference = the whole micro's plan: read the numbers we are about to change
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'Current micro plan'
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '2.9/4.2'}"

# --- AC1 + AC3 (sets): switch to the plan of THIS training -----------------------
- tapOn:
    id: 'muscle-map-compare-chip-analyse'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: "This training's plan"
# the logged value is unchanged, the target is now this training's own plan
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '2.9/0.6'}"
- assertTrue: "${maestro.copiedText !== '2.9/4.2'}"
- copyTextFrom:
    id: 'muscle-row-Chest-readout'
- assertTrue: "${maestro.copiedText === '4/3'}"
- takeScreenshot: gh444_this_training_plan_sets

# --- AC3 (volume): the same reference under the volume metric --------------------
- tapOn:
    id: 'muscle-map-metric-chip'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-metric-chip-option-volume'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-metric-chip-option-volume'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-metric-chip-option-volume'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: "This training's plan"
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '3.1t/0.7t'}"
- assertTrue: "${maestro.copiedText !== '3.1t/3.6t'}"
- copyTextFrom:
    id: 'muscle-row-Glutes-readout'
- assertTrue: "${maestro.copiedText === '3.8t/2.8t'}"
- takeScreenshot: gh444_this_training_plan_volume

# --- AC5: the selection survives leaving and re-opening the screen ---------------
- tapOn: 'tab-exercises'
# the bottom bar exposes its tabs as content-descriptions, not resource-ids, so wait
# on the screen that opened instead of on the tab element
- extendedWaitUntil:
    visible: 'Search exercises'
    timeout: 30000
- waitForAnimationToEnd
- tapOn: 'tab-training'
- runFlow:
    when:
      visible:
        id: 'training-home-screen'
    commands:
      - scrollUntilVisible:
          element:
            id: 'meso-card-5-1'
          direction: DOWN
      - waitForAnimationToEnd
      - tapOn:
          id: 'meso-card-5-1'
- extendedWaitUntil:
    visible:
      id: 'subtab-analysis'
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'analysis-data-toggle'
    commands:
      - tapOn:
          id: 'subtab-analysis'
      - extendedWaitUntil:
          visible:
            id: 'analysis-data-toggle'
          timeout: 30000
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'muscle-map-compare-label'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'muscle-map-compare-label'
    text: "This training's plan"
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '3.1t/0.7t'}"
- takeScreenshot: gh444_selection_survives_reopen

# --- AC2: every previous reference still works -----------------------------------
- tapOn:
    id: 'muscle-map-metric-chip'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-metric-chip-option-sets'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-metric-chip-option-sets'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-metric-chip-option-sets'
    timeout: 10000
- tapOn:
    id: 'muscle-map-compare-chip-analyse'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-analyse-option-last_plan'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: 'None'
- assertVisible: 'Micro 1 plan'
- takeScreenshot: gh444_compare_menu_micro2
- tapOn:
    id: 'muscle-map-compare-chip-analyse-option-last_plan'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-analyse-option-last_plan'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: 'Micro 1 plan'
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '2.9/3.6'}"
# and the plan position is untouched by GH-444: no new option there
- tapOn:
    id: 'analysis-data-plan'
- extendedWaitUntil:
    visible:
      id: 'training-plan-overview'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'muscle-map-compare-chip'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-option-current_total_plan'
    timeout: 10000
- waitForAnimationToEnd
- assertNotVisible: "This training's plan"
- tapOn:
    id: 'muscle-map-compare-chip-option-current_total_plan'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-option-current_total_plan'
    timeout: 10000

# --- leave the analysis on the new comparison for the manual check ---------------
- tapOn:
    id: 'analysis-data-train'
- extendedWaitUntil:
    visible:
      id: 'trainings-overview'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'muscle-map-compare-chip-analyse'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip-analyse'
- extendedWaitUntil:
    visible:
      id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
- extendedWaitUntil:
    notVisible:
      id: 'muscle-map-compare-chip-analyse-option-this_training_plan'
    timeout: 10000
- assertVisible:
    id: 'muscle-map-compare-label'
    text: "This training's plan"
- copyTextFrom:
    id: 'muscle-row-Core-readout'
- assertTrue: "${maestro.copiedText === '2.9/0.6'}"
- takeScreenshot: gh444_final_state
