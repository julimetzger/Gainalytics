appId: com.powerliftingworkoutplanner
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
- tapOn: "Import Emulator Squat Video"
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
- extendedWaitUntil:
    visible: "Analysis #1"
    timeout: 30000
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 180000
- tapOn: "Open"
- assertVisible: "Bar Tracking Result"
- assertVisible:
    text: "Rep Metrics: [1-9][0-9]*"
- assertVisible:
    text: "Average Speed: [0-9]+(\\.[0-9]+)? px/s"
- assertVisible:
    text: "Lowest Speed: [0-9]+(\\.[0-9]+)? px/s"
- assertVisible:
    text: "Rep Time: [0-9]+ ms"
