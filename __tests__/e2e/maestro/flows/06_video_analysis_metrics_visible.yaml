appId: com.powerliftingworkoutplanner
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "tab-analyse"
    timeout: 30000
- tapOn: "tab-analyse"
- extendedWaitUntil:
    visible: "Analyse"
    timeout: 30000
- tapOn:
    id: "analyse-drawer-toggle"
- scrollUntilVisible:
    element:
      text: "Video Analyses"
    direction: DOWN
- tapOn: "Video Analyses"
- assertVisible: "Import Video"
- tapOn: "Import Emulator Squat Video"
- runFlow:
    when:
      visible:
        text: "(?i)^allow$"
    commands:
      - tapOn:
          text: "(?i)^allow$"
- runFlow:
    when:
      visible: "Allow only while using the app"
    commands:
      - tapOn: "Allow only while using the app"
- extendedWaitUntil:
    visible: "Analysis #[0-9]+"
    timeout: 30000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Status: (done|awaiting_seed_selection)"
    timeout: 180000
- runFlow:
    when:
      visible: "Status: awaiting_seed_selection"
    commands:
      - scrollUntilVisible:
          element:
            id: "video-analysis-seed-candidate-1"
          direction: DOWN
      - tapOn:
          id: "video-analysis-seed-candidate-1"
      - tapOn:
          id: "video-analysis-manual-seed-run"
      - scrollUntilVisible:
          element:
            id: "video-analysis-detail-status"
          direction: UP
      - extendedWaitUntil:
          visible: "Status: done"
          timeout: 180000
- assertVisible: "Bar Tracking Result"
- assertVisible:
    text: "Analyzed FPS: [0-9]+(\\.[0-9]+)?"
- assertVisible:
    text: "Manual Seed Used: (Yes|No)"
- assertVisible:
    text: "Detected Boxes @ t=0: [1-9][0-9]*"
- assertVisible:
    text: "Detected Reps: [1-9][0-9]*"
- assertVisible:
    text: "Rep 1: [0-9]+\\.[0-9]{2} s \\| Avg concentric [0-9]+\\.[0-9] px/s"
- assertVisible:
    text: "Start [0-9]{2}:[0-9]{2}\\.[0-9]{2} \\| Bottom [0-9]{2}:[0-9]{2}\\.[0-9]{2} \\| End [0-9]{2}:[0-9]{2}\\.[0-9]{2}"
