appId: com.powerliftingworkoutplanner
---
# GH-71: VideoAnalysis filters – layout + exact RIR/VL chips
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: 'tab-analyse'
    timeout: 60000

- tapOn: 'tab-analyse'

- extendedWaitUntil:
    visible: 'Analysis'
    timeout: 10000

# Open the Analyse drawer
- tapOn:
    id: 'analyse-drawer-toggle'

- extendedWaitUntil:
    visible:
      text: 'Video Analyses'
    timeout: 5000

- scrollUntilVisible:
    element:
      text: 'Video Analyses'
    direction: DOWN

- tapOn: 'Video Analyses'

- extendedWaitUntil:
    visible: 'Import Video'
    timeout: 10000

# AC: TrainingElementPicker visible and DateRangePicker rendered in the scroll content.
# We assert the stable picker label and the filter rows; the date text itself is locale-dependent.
- assertVisible:
    text: '0 selected'

# AC: VL% chips visible
- assertVisible:
    text: 'VL%'

- assertVisible:
    text: '<10%'

- assertVisible:
    text: '>30%'

# AC: RIR chips visible
- assertVisible:
    text: 'RIR'

- assertVisible:
    text: '0'

- assertVisible:
    text: '4'

- assertVisible:
    text: '4+'

# AC: Tapping a chip keeps the screen stable.
- tapOn: '<10%'

- assertVisible:
    text: 'Import Video'

- tapOn: '<10%'
