appId: com.powerliftingworkoutplanner
---
# GH-94 History Calendar – Navigation fixes (Round 4)
# Verifies:
#   - "Zurück zum Plan" button visible as explicit exit path (P1 exit-path fix)
#   - Drawer "Overview" action while History is open exits History (P1 drawer-action fix)
#   - "Zurück zum Plan" button closes History
#   - Header back-button (arrow-left) closes History
#
# Uses an existing plan in app state so the test is reliable regardless of
# plan-list position.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      text: "Training"
    timeout: 60000

# ── Step 1: Navigate into an existing plan ────────────────────────────────────
# Tap the first plan card in the list (top of the Training tab)
- scrollUntilVisible:
    element:
      text: "Push pull"
    direction: UP
    timeout: 10000

- tapOn:
    text: "Push pull"

# Wait for plan screen to be fully interactive (header renders Micro N text)
- extendedWaitUntil:
    visible:
      text: "Micro 1"
    timeout: 20000

# ── Step 2: Open History from the drawer ─────────────────────────────────────
- tapOn:
    point: "4%,7%"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "History"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: "History"

- waitForAnimationToEnd

# Verify History is open: "Zurück zum Plan" button must be visible (P1 exit-path fix)
- assertVisible:
    text: "Zurück zum Plan"

# ── Step 3: Drawer action exits History — open drawer, tap "Overview" ─────────
# P1 fix: any drawer action must clear showHistory
- tapOn:
    point: "4%,7%"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Overview"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: "Overview"

- waitForAnimationToEnd

# History must now be closed
- assertNotVisible:
    text: "Zurück zum Plan"

# ── Step 4: Re-open History ───────────────────────────────────────────────────
- tapOn:
    point: "4%,7%"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "History"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: "History"

- waitForAnimationToEnd

- assertVisible:
    text: "Zurück zum Plan"

# ── Step 5: Close via "Zurück zum Plan" button ────────────────────────────────
- tapOn:
    text: "Zurück zum Plan"

- waitForAnimationToEnd

- assertNotVisible:
    text: "Zurück zum Plan"

# ── Step 6: Re-open History for header back-button test ───────────────────────
- tapOn:
    point: "4%,7%"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "History"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: "History"

- waitForAnimationToEnd

- assertVisible:
    text: "Zurück zum Plan"

# ── Step 7: Close via header back button (the ← arrow that appears in header) ─
# In History mode the header shows an arrow-left icon at the same position as the
# menu hamburger. Tapping it must close History.
- tapOn:
    point: "4%,7%"

- waitForAnimationToEnd

- assertNotVisible:
    text: "Zurück zum Plan"
