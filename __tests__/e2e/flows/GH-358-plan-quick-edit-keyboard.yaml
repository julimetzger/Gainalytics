appId: com.powerliftingworkoutplanner
name: GH-358 Plan quick edit opens the soft keyboard and Done commits the typed value
---
# GH-358: tapping a plan set value focused the field but never opened the soft
# keyboard on R5CN30HWZFN (Samsung SM-G986B, Android 13).
#
# NOTE on selectors (see agent-memory #206): the Plan pane lives inside a
# NestableScrollContainer and is INVISIBLE to the accessibility tree — set rows,
# exercise chips and sub-tabs cannot be selected by text/testID. Only the header
# and the quick-edit accessory bar (rendered through a Portal, outside that
# container) are reachable. Everything inside the pane is therefore driven by
# coordinate taps, and the real assertions run against the accessory-bar label,
# which is a computed string of the field, set index and exercise name.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Training"
    timeout: 60000

# ---- navigate to Push pull upper lower > Meso 1 -------------------------------
- swipe:
    start: "97%, 75%"
    end: "97%, 31%"
    duration: 400

- extendedWaitUntil:
    visible: "Push pull upper lower"
    timeout: 20000

- tapOn:
    text: "Meso 1"
    below:
      text: "Push pull upper lower"

- extendedWaitUntil:
    visible: "Push pull upper lower › Meso 1"
    timeout: 20000

# Plan sub-tab (coordinate tap — the tab strip is not in the a11y tree)
- tapOn:
    point: "17%, 11%"

- waitForAnimationToEnd:
    timeout: 5000

# ---- BEFORE: read mode, no quick edit chrome ---------------------------------
- assertNotVisible: "Editing reps · Set 1 · Deadlift"

- takeScreenshot: gh358-01-before-read-mode

# ---- tap the reps value of Deadlift set 1 ------------------------------------
- tapOn:
    point: "18%, 29%"

- waitForAnimationToEnd:
    timeout: 5000

# The accessory bar proves WHICH field/set/exercise is being edited. This is the
# computed label, not a bare visibility check.
- assertVisible: "Editing reps · Set 1 · Deadlift"

# AFTER-FOCUS: this screenshot must show the numeric soft keyboard. Before the fix
# the field was focused (border + caret + this very bar) with no keyboard at all.
- takeScreenshot: gh358-02-focused-with-keyboard

# ---- type 13 on the on-screen keyboard --------------------------------------
# backspace clears the existing "8", then digits 1 and 3 are tapped on the IME.
- tapOn:
    point: "87%, 68%"
- tapOn:
    point: "13%, 68%"
- tapOn:
    point: "62%, 68%"

- assertVisible: "Editing reps · Set 1 · Deadlift"

- takeScreenshot: gh358-03-typed-13

# ---- Done commits the typed value -------------------------------------------
- tapOn:
    id: "plan-quick-edit-done"

- waitForAnimationToEnd:
    timeout: 5000

# quick edit closed -> back to read mode
- assertNotVisible: "Editing reps · Set 1 · Deadlift"

# The set row now reads "13 reps". The row itself is not in the a11y tree, so the
# committed value is asserted out-of-band against the persisted MMKV store by
# __tests__/e2e/scripts/assert-gh358-committed-reps.py (see summary.md).
- takeScreenshot: gh358-04-after-done-13-reps

# ---- restore the user's original value (8 reps) ------------------------------
- tapOn:
    point: "18%, 29%"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Editing reps · Set 1 · Deadlift"

- tapOn:
    point: "87%, 68%"
- tapOn:
    point: "87%, 68%"
- tapOn:
    point: "38%, 83%"

- tapOn:
    id: "plan-quick-edit-done"

- waitForAnimationToEnd:
    timeout: 5000

- assertNotVisible: "Editing reps · Set 1 · Deadlift"

- takeScreenshot: gh358-05-restored-8-reps
