appId: com.powerliftingworkoutplanner
---
# GH-170: VL-Übersicht moved from TrainingHome to TrainingsOverview
# Verifies:
# 1. TrainingHome shows no VL insight card (VL removed from plan summary)
# 2. Navigation to a finished training's detail view works (the correct location)
#
# Note: VelocityLossInsightCard uses testID="vl-insight-card" which maps to
# resource-id in Android. The absence of this ID in TrainingHome proves removal.
#
# Note: Content inside the TrainingsOverview ScrollView (accessible={true}) is
# not visible to UIAutomator. Header elements are used as navigation evidence.

- launchApp:
    clearState: false

# Wait for Training tab to load with plan data
- extendedWaitUntil:
    visible: "Training"
    timeout: 20000

# Assert we are on Training tab
- assertVisible: "Training"

# Assert no VL insight cards visible in TrainingHome
# (vl-insight-card is the testID/resource-id of VelocityLossInsightCard)
- assertNotVisible:
    id: "vl-insight-card"

# Take screenshot: TrainingHome with no VL cards (criterion 1 evidence)
- takeScreenshot: "training-home-no-vl"

# Navigate to Push pull → last finished training (Micro 6 Pull)
- tapOn:
    text: "Last Training"
    index: 0

# Wait for training detail header to confirm navigation
- extendedWaitUntil:
    visible: "Done"
    timeout: 20000

# Verify header shows FINISHED training info (Mode: Done)
- assertVisible: "Done"

# Verify plan name in header (confirms we're in the right plan)
- assertVisible:
    id: "header-plan-meso-name"

# Take screenshot: TrainingsOverview screen where VL now belongs (criterion 2 evidence)
- takeScreenshot: "trainings-overview-vl-location"
